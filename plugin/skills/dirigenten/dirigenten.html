.ov-head{display:flex;justify-content:space-between;padding:14px 18px 6px;border-top:1px solid var(--bg-subtle);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ov-head-count{color:var(--ink-2)}
.ov-item{flex-direction:column;align-items:stretch}
.ov-line{display:flex;align-items:center;gap:8px}
.ov-line>.ov-row{flex:1;min-width:0}
.ov-head-btn{display:flex;align-items:center;gap:6px;border:0;background:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.ov-head-btn .ov-chev{margin-left:-6px}
.ov-chev{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;background:0;border-radius:8px;cursor:pointer;margin-left:6px}
.ov-chev svg{fill:none;stroke:var(--ink);stroke-width:1.8;transition:transform var(--dur-base)}
.ov-chev[aria-expanded=true] svg{transform:rotate(90deg)}
.ov-chev:hover{background:var(--bg-subtle)}
.ov-shapes{display:flex;gap:3px;align-items:center;border:0;background:0;padding:6px;border-radius:8px;cursor:pointer}
.ov-sh{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--edge);background:var(--bg-page)}
.ov-sh[data-state^=doable]{background:var(--act-do);border-color:var(--act-do)}
.ov-sh[data-state=needs_yes]{width:12px;border-radius:0;border:0;background:var(--customer-state);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.ov-sh[data-state=waiting]{border-color:var(--wait);background:var(--bg-subtle)}
.ov-sh[data-state=blocked]{border-color:var(--wait);background:var(--wait-tint)}
.ov-sh[data-state^=done]{border-color:var(--done);background:var(--done-tint)}
.ov-sh[data-state=skipped],.ov-sh[data-state=ended_without_yes]{border-style:dashed;border-color:var(--line)}
.ov-bar>.btn.primary{margin-left:auto}
.ov-text{overflow:hidden}
.ov-shapes{flex-wrap:wrap;max-width:40%}
@media (max-width:900px){.ov-row{grid-template-columns:44px minmax(0,1fr)!important;padding-top:6px;padding-bottom:6px}.ov-meta{grid-column:2;flex-wrap:wrap;gap:4px 12px}.ov-text{flex-wrap:wrap}.ov-cust{margin-left:0;width:100%}}
.ov-bars-wait{min-height:92px}
.ov-av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--radius-pill);background:var(--bg-subtle);color:var(--ink);font-size:11px;font-weight:800;margin-right:12px}
.ov-av[data-avatar=none]{background:0;border:1.5px dashed var(--ink-3);color:var(--ink-3)}
.ov-item[data-running]{box-shadow:inset 3px 0 0 var(--act-do)}
:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.menu-note{font-size:12.5px;color:var(--ink-2);padding:8px 14px}

.map-more-head{font-size:11.5px;color:var(--ink-2);padding:6px 10px 2px}
.map-post{margin:0 0 10px;padding:8px 10px;border-radius:var(--radius-m);background:var(--bg-subtle)}
.map-post[data-ours]{background:var(--bg-subtle)}
.map-post-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin:0 0 4px}
.map-post-text{white-space:pre-wrap;font-size:13px}
.map-store{list-style:none;margin:0;padding:0}
.map-store li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.map-how{margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.map-how-h{margin:0 0 4px;font-size:13px}
.map-how-line{margin:4px 0;font-size:12.5px;white-space:pre-wrap}
/* K09: the counts in words, the phases and the search in one quiet row above the map. */
.map-summary-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:6px 0 10px}
.map-summary{margin:0;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.map-phases{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.map-phase-chip{display:inline-flex;align-items:center;min-height:26px;padding:2px 10px;border:1px solid var(--line);border-radius:13px;background:var(--bg);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:default}
.map-canvas[data-lanes] .map-phase{position:absolute;box-sizing:border-box;background:var(--bg-subtle);border:1px solid var(--hair);border-radius:var(--radius-m)}
/* K10: the map above the step, its own height; the step under it. */
.map[data-above]{padding:12px 16px 4px}
.map[data-above] .map-body{max-height:min(46vh,440px);overflow:auto}
.map-search{margin-left:auto;position:relative;flex:0 1 240px;min-width:140px}
.map-search input{width:100%;box-sizing:border-box;padding:6px 36px 6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
.map-search kbd{position:absolute;right:10px;top:7px;color:var(--ink-2);font-size:12.5px}
/* L05: \xABBygger p\xE5: \u2026\xBB in the head, as on the delivery's sheet (delivery-method.ts draws it). */
.map-builds-on .sh-mv{display:grid;gap:6px;margin-top:6px}
.map-builds-on .sh-line{font-size:13.5px;font-weight:600;margin:0}
.map-builds-on .sh-upd{display:grid;gap:6px;padding:10px 12px;border:1.5px dashed var(--customer-state);border-radius:var(--radius-m)}
.map-builds-on .sh-acts{display:flex;gap:8px;flex-wrap:wrap}
.map-builds-on .sh-acts .btn{white-space:nowrap}
.map-builds-on .btn[data-default]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.map-builds-on .sh-default{font-weight:600;color:var(--ink-2)}
.map-builds-on .sh-meta{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.map-now-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.map-now-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.map-now-item{display:inline-flex;align-items:center;min-height:28px;padding:2px 11px;border:1.5px solid var(--act-do);border-radius:14px;background:var(--bg);color:var(--act-do);font:inherit;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.map-waits{position:absolute;left:0;width:192px}
.map-wait{height:18px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-wait[data-waited]{font-weight:700;color:var(--ink)}
.map-recent{background:var(--bg);border-radius:var(--radius-l);padding:10px 14px}
.map-recent-title{font-size:13.5px;font-weight:800;margin:0 0 4px}
.map-recent ul{margin:0;padding-left:18px}
.map-recent-link{border:0;background:transparent;padding:2px 0;color:var(--act-do);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}

.mat{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px}
.mat-fold > summary{cursor:pointer;list-style:none}
.mat-h{font-size:14.5px;font-weight:800}
.mat-meta{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mat-empty{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.mat-group,.mat-sort{margin-top:14px}
.mat-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.mat-things{display:flex;flex-wrap:wrap;gap:8px}
.mat-thing{max-width:100%;min-width:0;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:var(--radius-m);background:var(--bg-subtle);font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.mat-thing:focus-visible,.mat-title:focus-visible,.mat-ph:focus-visible,.ads-img:focus-visible,.ads-body:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.mat-i{flex:none;color:var(--ink-2)}
.mat-ok{color:var(--done-ink);font-weight:800}
.mat-sheet{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mat-sheet-h{font-size:24px;font-weight:800;margin:0}
.mat-task{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px}
.mat-task-h{font-size:19px;font-weight:800;margin:0}
.mat-cards{display:flex;flex-direction:column;gap:6px}
.mat-card{background:var(--bg-subtle);border-radius:var(--radius-m);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mat-title{display:inline-flex;gap:8px;align-items:center;border:0;background:none;padding:0;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.mat-ex{margin:4px 0 0;font-size:12.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-older summary{cursor:pointer}
.mat-old{display:block;border:0;background:none;padding:2px 0;font:inherit;font-size:12.5px;color:var(--act-do);cursor:pointer}
.mat-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.map-panel:has(.map-mat){width:min(640px,48vw)}
.mat-img{min-width:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mat-img .mat-n{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-thing .mat-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-thing[data-has-body]{height:auto;min-height:34px;flex-wrap:wrap;padding:7px 12px}
.mat-body{flex-basis:100%;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:normal;text-align:left}
.mat-body:empty{display:none}
.mat-ph,.ads-img{aspect-ratio:1 / 1;width:100%;border:0;border-radius:var(--radius-m);background:var(--bg-subtle) center / cover no-repeat;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px}
.ads-ch{margin-top:12px}
.ads-grid{display:grid;gap:10px;align-items:start}
.ads-hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ads-text{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.ads-body{border:0;background:var(--bg-subtle);border-radius:var(--radius-m);padding:8px 10px;text-align:left;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.ads-img[data-approved]{box-shadow:inset 0 0 0 2px var(--done)}
.ads-none{align-self:center}
.rd-box{position:fixed;top:0;right:0;bottom:0;width:min(920px,100vw);overflow:auto;background:var(--bg-page);box-shadow:var(--shadow-overlay);z-index:40}
.rd-box:empty{display:none}
.rd{padding:18px;display:flex;flex-direction:column;gap:12px}
.rd-bar a.btn,.rd-tools a.btn{text-decoration:none}
.rd-bar,.rd-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rd-title{font-size:19px;font-weight:800;flex:1}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;margin-bottom:8px;background:var(--bg-page);font-size:13.5px}
.rbar button{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--radius-m);padding:4px 11px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.rbar button[aria-pressed="true"]{background:var(--ink);color:var(--act-do-on);border-color:var(--ink)}
.rbar button:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.rbar .zv{font-size:12.5px;min-width:46px;text-align:center}
.rbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rd-pages{display:flex;flex-direction:column;align-items:safe center;gap:24px;padding:8px 0 30px;background:var(--bg-subtle);border-radius:var(--radius-m)}
.rd-spread{display:flex;gap:24px;padding:0 12px}
.page{position:relative;box-sizing:border-box;background:var(--bg);padding:48px 34px;box-shadow:var(--shadow-card);overflow:hidden;overflow-wrap:anywhere;font-size:12.5px;font-weight:400;line-height:1.62;color:var(--ink)}
.page .run,.page .pno{position:absolute;left:34px;right:34px;font-size:11px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .run{top:20px}
.page .pno{bottom:18px;text-align:right}
.page h1,.page h2,.page h3,.page h4{font-weight:800;color:var(--ink);letter-spacing:-.005em}
.page h1{font-size:24px;line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
.page h2{font-size:19px;line-height:1.3;margin:18px 0 4px}
.page h3{font-size:14.5px;line-height:1.35;margin:12px 0 2px;font-weight:600}
.page h4{font-size:12.5px;line-height:1.6;margin:8px 0 0;font-weight:600;font-style:italic}
.page h1 + h2,.page h2 + h3,.page h3 + h4{margin-top:4px}
.page p{margin:0 0 10px}
.page a{color:var(--act-do)}
.page code{font-size:11px;background:var(--bg-subtle);border-radius:4px;padding:0 3px}
.page .pli{padding-left:14px;position:relative;margin-bottom:3px}
.page .pli::before{content:"\u2013";position:absolute;left:0;color:var(--ink-3)}
.page .pli.num{padding-left:20px}
.page .pli.num::before{content:attr(data-n)}
.page hr{border:0;border-top:1px solid var(--hair);margin:10px 0}
.page pre{font:inherit;font-size:11px;line-height:1.5;background:var(--bg-subtle);padding:6px 8px;border-radius:4px;white-space:pre-wrap;margin:0 0 10px}
.page blockquote{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);font-style:italic}
.ptable{margin:2px 0 12px}
.ptable table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.4;table-layout:fixed}
.ptable th,.ptable td{text-align:left;vertical-align:top;padding:3px 6px 4px 0;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.ptable th{font-weight:600;color:var(--ink);border-bottom-color:var(--line)}
.rd-img{display:block;max-width:100%;border-radius:var(--radius-m);border:1px solid var(--hair);cursor:zoom-in}
.rd-img:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.rd-pdf{width:100%;height:80vh;border:1px solid var(--hair);border-radius:var(--radius-m)}
.rd-html{width:100%;height:80vh;border:1px solid var(--hair);border-radius:var(--radius-m);background:var(--bg)}
.rd-note{background:var(--bg);border-radius:var(--radius-m);padding:10px 14px;box-shadow:inset 4px 0 0 var(--customer-state);font-size:13.5px;margin-bottom:8px}
.rd-file{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--hair);border-radius:var(--radius-m);max-width:640px}
.rd-ext{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:80px;padding:0 8px;box-sizing:border-box;border-radius:var(--radius-m);background:var(--bg-subtle);font-size:13.5px;font-weight:800}
.lbx{position:fixed;inset:0;z-index:60;background:var(--scrim);overflow:hidden;touch-action:none}
.lbx img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab}
.lbx.drag img{cursor:grabbing}
.lbx .lbar{position:absolute;top:12px;right:12px;z-index:1;display:flex;gap:6px;align-items:center;background:var(--ink);border-radius:var(--radius-m);padding:4px 6px;color:var(--bg);font-size:13.5px}
.lbx .lbar button{background:none;border:0;color:var(--act-do-on);font:inherit;font-weight:700;padding:4px 8px;border-radius:var(--radius-m);cursor:pointer;white-space:nowrap}
.lbx .lbar button:hover{background:var(--act-neutral-tint)}
.lbx .lbar .zv{min-width:44px;text-align:center}
.lbx .lcap{position:absolute;left:12px;bottom:12px;color:var(--bg);font-size:13.5px;background:var(--ink);border-radius:var(--radius-m);padding:4px 8px}
.rd-edit{width:100%;border:0;background:var(--bg-subtle);border-radius:var(--radius-m);padding:12px 14px;font:inherit;font-size:13.5px;color:var(--ink);resize:vertical}
.rd-failed{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:var(--radius-m);padding:12px 14px;box-shadow:inset 4px 0 0 var(--late)}
.rd-failed .mat-empty{margin:0;flex:1;color:var(--ink)}
.rd-archive-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rd-archive-list li{display:flex;align-items:center;gap:8px;min-width:0}
.rd-archive-list .btn{max-width:100%;overflow-wrap:anywhere;text-align:left}
.rd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.rd-slides{display:flex;flex-direction:column;gap:16px}
.rd-slide{min-width:0;background:var(--bg-subtle);padding:12px;border-radius:var(--radius-m)}
.rd-video-preview{max-width:100%;height:auto;border-radius:var(--radius-m)}
.rd-sheet{min-width:0}
.rd-sheet-scroll{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-m)}
.rd-sheet table{border-collapse:collapse;min-width:100%;font-size:12.5px}
.rd-sheet th,.rd-sheet td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:pre-wrap}
.mat-sorts{display:flex;gap:6px;flex-wrap:wrap}

textarea.unsaved.changed-elsewhere{border-color:var(--late)}
.ss-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.step-strip{display:none}
@media (min-width:900px){.step-strip{display:block;position:fixed;left:0;top:0;bottom:0;width:44px;border:0;border-right:1.5px solid var(--line);background:var(--bg-subtle);padding:0;cursor:pointer;z-index:5}
.step-strip:hover{background:var(--bg-subtle)}
.step-strip .stl{position:absolute;top:64px;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;max-height:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.step-strip:hover .stl{color:var(--ink)}}
.step{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.step-head{display:flex;flex-direction:column;gap:10px}
.step-title-row{display:flex;align-items:flex-start;gap:14px}
.step-mark{flex:none;margin-top:7px;width:13px;height:13px;border-radius:0;background:var(--act-do)}
.step-mark[data-shape=hex]{width:16px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.step-mark[data-state=needs_yes]{background:var(--customer-state)}
.step-mark[data-state=done],.step-mark[data-state=done_outside]{background:var(--done)}
.step-mark[data-state=skipped]{background:var(--line)}
.step-mark[data-state=blocked],.step-mark[data-state=not_yet],.step-mark[data-state=waiting]{background:var(--bg-sunk)}
.step-title{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin:0}
.step-sub{font-size:13.5px;color:var(--ink-2)}
.step-crumb{align-self:flex-start;border:0;background:transparent;padding:2px 0;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.step-crumb:hover,.step-crumb:focus-visible{color:var(--ink);text-decoration:underline}
.step-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--radius-pill);background:var(--bg);font-size:12.5px;font-weight:700;white-space:nowrap}
.step-card{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.purpose{margin:0;font-size:14.5px;font-weight:700}
.purpose.missing{font-size:12.5px;color:var(--ink-2);font-weight:600}
.lead{display:flex;flex-direction:column;gap:4px}
.lead-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lead-t{margin:0;font-size:14.5px;font-weight:700}
.lead[data-lead=happens] .lead-t{font-size:13.5px;font-weight:600}
.lead.missing .lead-t{font-size:12.5px;color:var(--ink-2);font-weight:600}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.links-label{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-right:4px}
.mlink-more{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.mlink-more::-webkit-details-marker{display:none}
.links-all{left:0;right:auto;flex-direction:row;flex-wrap:wrap;gap:6px;max-width:420px}
.mlink{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-pill);background:transparent;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--act-do)}
.mlink.hard{border:1.5px solid var(--act-do)}
.mlink.soft{border:1.5px dashed var(--ink-2)}
.tools{background:var(--bg);border-radius:var(--radius-l);padding:18px;display:flex;flex-direction:column;gap:14px}
.tools-h,.pres-h{font-size:14.5px;font-weight:800}
.tool{display:flex;flex-direction:column;gap:8px}
.tool-q{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src-tabs{display:flex;gap:4px;padding:3px;border-radius:var(--radius-pill);background:var(--bg-subtle);align-self:flex-start}
.src-tabs input:focus-visible+.src-tab,.mlink:focus-visible,.pill:focus-visible,.pres-fmt:focus-visible,.quick-it:focus-visible,.file-pick:focus-within{outline:2px solid var(--act-do);outline-offset:2px}
.src-tabs input{position:absolute;opacity:0;pointer-events:none}
.src-tab{height:28px;padding:0 11px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.src-pane{display:none}
.picker:has(input[data-src=upload]:checked) .src-pane[data-source=upload],.picker:has(input[data-src=files]:checked) .src-pane[data-source=files]{display:flex}
.src-tabs input:checked+.src-tab{background:var(--bg);color:var(--ink)}
.file-pick input{display:none}
.write{width:100%;box-sizing:border-box;border:1.5px solid var(--bg-subtle);border-radius:var(--radius-m);padding:12px 14px;background:var(--bg-subtle);font:inherit;font-size:13.5px;resize:vertical}
.pill{height:28px;padding:0 11px;border:0;border-radius:var(--radius-pill);background:var(--bg-subtle);font-size:12.5px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.av-empty{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--ink-3);display:grid;place-items:center;color:var(--ink-3)}
.pres{background:var(--bg);border-radius:var(--radius-l);padding:18px;display:flex;flex-direction:column;gap:12px}
.pres-fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pres-fmt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:2px solid var(--bg-subtle);border-radius:var(--radius-l);background:var(--bg);text-align:left}
.pres-fmt .d{font-size:12.5px;color:var(--ink-2)}
.pres-pages{display:flex;flex-direction:column;gap:6px}
.pres-page{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.pres-thumb{flex:none;width:44px;aspect-ratio:16/9;background:var(--ink)}
.quick{width:360px;background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-overlay);padding:8px}
.quick-g{display:flex;align-items:center;gap:7px;padding:10px 10px 4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.quick-it{display:flex;flex-direction:column;gap:1px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:var(--radius-m);text-align:left;white-space:nowrap}
.quick-it .d{font-size:12.5px;color:var(--ink-2)}
.step:has(.ss-grid){max-width:1020px}
.ss{display:flex;flex-direction:column;gap:14px}
.ss-tags{display:flex;gap:8px;flex-wrap:wrap}
.ss-tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 11px;border-radius:var(--radius-pill);background:var(--bg);font-size:12.5px;font-weight:700}
.ss-tag .k{color:var(--ink-2);font-weight:800}
.ss-tag.out{color:var(--late)}
.ss-card{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.ss-io{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:8px;align-items:baseline}
.hk{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.ss-chips{display:flex;gap:6px;flex-wrap:wrap}
.ss-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--radius-pill);background:var(--bg-subtle);font-size:12.5px;font-weight:700;white-space:nowrap}
.ss-var{background:var(--bg-subtle);border-bottom:1.5px solid var(--ink);font-weight:700}.ss-var.miss{border-bottom-style:dashed;color:var(--ink-2)}.ss-pblk{display:grid;gap:4px;margin-top:8px}
textarea.unsaved{border:1.5px dashed var(--customer-state)}.ss-unsaved{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}.ss-unsaved .btn{white-space:nowrap}
.ss-chip.miss{background:transparent;border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.ss-meta{font-size:12.5px;color:var(--ink-2);font-weight:600}
.ss-grid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px;align-items:start}
.ss-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ss-bh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ss-fold>summary{cursor:pointer;font-weight:800}
.ss-rules{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:8px;margin-top:10px}
.ss-ilist{margin:0;padding-left:18px}
.ss-moms{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ss-mom{display:flex;gap:8px;align-items:flex-start}
.ss-mom[data-done] span{color:var(--ink-2);text-decoration:line-through}
.ss-p{margin:0;white-space:pre-wrap}
.ss-do{display:flex;gap:12px}
.ss-chat-questions{display:flex;gap:var(--space-1);flex-wrap:wrap}
.ss-margin{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.ss-mh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:10px}
.link{border:0;background:transparent;padding:0;font:inherit;font-weight:800;color:var(--act-do);cursor:pointer;text-align:left;white-space:nowrap}
button.ss-chip{border:0;cursor:pointer;color:var(--act-do)}
.ss-field{display:flex;flex-direction:column;gap:6px}
.ss-layq,.ss-pending .ss-do{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ss-layq .btn,.ss-pending .btn{white-space:nowrap}
.ss-pending{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--radius-m);background:var(--bg-subtle)}
.ss-mom input{cursor:pointer}
.ss-ask{display:flex;gap:8px;align-items:center}
.ss-ask .write{flex:1;min-width:0}
.ss-ask .btn{white-space:nowrap}
.ss-spark{color:var(--act-claude);font-weight:800}
.step-out .pv-sub{font-size:12.5px;color:var(--ink-2)}
@media (max-width:720px){.ss-grid{grid-template-columns:1fr}}
@media (min-width:1200px){body:has(.step) .rd-box{width:calc(100vw - 812px);box-shadow:none;border-left:1px solid var(--ink-2)}body:has(.step):has(.rd-box) .step{margin:0 auto 0 16px}}
.ss-rv{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--ink-2)}.ss-verdict{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ss-verdict .btn{white-space:nowrap}.ss-verdict .btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}.ss-verdict input{flex:1;min-width:160px}
.quick-empty{padding:10px;font-size:12.5px;color:var(--ink-2)}

.tm .ov-filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tm .ov-pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:var(--radius-pill);padding:4px 6px 4px 14px;font-size:12.5px;font-weight:800}
.tm .ov-pill-x{border:0;background:0;color:inherit;font:inherit;padding:2px 8px;cursor:pointer}
.tm{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px;--tm-cols:44px minmax(160px,340px) 72px minmax(0,1fr)}
.tm-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.tm-bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tm-seg{display:flex;gap:4px;padding:3px;border-radius:var(--radius-pill);background:var(--bg-subtle)}
.tm-opt{height:28px;padding:0 11px;border:0;border-radius:var(--radius-pill);background:transparent;font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.tm-opt[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.tm-nav{display:flex;gap:4px}
.tm-sheet{background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);padding:6px 0;overflow:hidden}
.tm-axis-row{display:grid;grid-template-columns:var(--tm-cols);gap:6px;padding:0 18px 0 12px;height:34px;align-items:center;border-bottom:1px solid var(--bg-subtle)}
.tm-axis-label{grid-column:1 / 4;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tm-axis{position:relative;height:34px;overflow:hidden}
.tm-tick{position:absolute;top:0;bottom:0;padding:9px 0 0 6px;border-left:1px solid var(--bg-subtle);font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.tm-list{background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);padding:6px 0;margin:0;list-style:none}
.tm-sheet .tm-list{background:none;box-shadow:none;border-radius:0;padding:0}
.tm-item{border-top:1px solid var(--bg-subtle)}
.tm-item:first-child{border-top:0}
.tm-head{display:flex;gap:10px;align-items:baseline;padding:12px 18px 4px;font-size:13.5px;font-weight:800}
.tm-row{display:grid;grid-template-columns:var(--tm-cols);align-items:center;gap:6px;min-height:50px;padding:0 18px 0 12px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.tm-row:hover{background:var(--bg-subtle)}
.tm-text{display:flex;flex-direction:column;min-width:0}
.tm-name{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-meta{display:flex;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-text .tm-meta{flex-wrap:wrap;gap:0 8px;white-space:normal;overflow:visible}
.tm-text .tm-meta>*{white-space:nowrap}
.tm-due{font-weight:700}
.tm-late{font-weight:800;color:var(--late)}
.tm-none{color:var(--ink-3)}
.tm-line{position:relative;height:40px;overflow:hidden}
.tm-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--act-do)}
.tm-band{position:absolute;top:8px;height:24px;box-sizing:border-box;background:var(--bg-subtle);border:1px solid var(--line);border-radius:var(--radius-m)}
.tm-bar{position:absolute;top:15px;height:10px;background:var(--ink);opacity:.25;border-radius:var(--radius-m)}
.tm-bar[data-urgency="3"]{background:var(--late);opacity:1}
.tm-bar[data-progress]{background:var(--act-do);opacity:1}
.tm-extband{position:absolute;top:26px;height:5px;background:var(--wait);border-radius:var(--radius-m)}
.tm-rh{position:absolute;top:14px;width:12px;height:12px;margin-left:-6px;display:flex}
.tm-rh svg{fill:var(--ink)}
.tm-rh[data-urgency="3"] svg{fill:var(--late)}
.tm-edge{position:absolute;top:12px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.tm-edge[data-edge=before]{left:2px}
.tm-edge[data-edge=after]{right:2px}
.tm-who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tm-av{flex:none;width:16px;height:16px;border-radius:var(--radius-pill);background:var(--bg-subtle);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center}
.tm-av[data-avatar="none"]{background:transparent;border:1.5px dashed var(--ink-3);box-sizing:border-box;color:var(--ink-3)}
.tm-av path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.tm-item[data-folds]{position:relative}
.tm-fold{position:absolute;left:0;top:17px;width:16px;height:16px;padding:0;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.tm-fold path,.tm-state{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tm-mo .tm-row{min-height:40px;cursor:default;background:var(--bg-subtle)}
.tm-mo-open{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tm-mo .tm-name{font-weight:700}
.tm-state{justify-self:center;width:10px;height:10px;border-radius:3px;background:var(--line)}
.tm-state[data-state=doable],.tm-state[data-state=doable_with_gap]{background:var(--act-do)}
.tm-state[data-state=needs_yes]{background:var(--customer-state)}
.tm-state[data-state=done],.tm-state[data-state=done_outside]{background:var(--done)}
.tm-state[data-state=waiting]{background:var(--wait)}
.tm-mobar{opacity:.5;cursor:grab;touch-action:none}
.tm-nospan{position:absolute;top:12px;left:4px;border:1px dashed var(--line);border-radius:var(--radius-pill);background:transparent;padding:0 8px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.tm-edge-grip{position:absolute;top:-4px;bottom:-4px;width:8px;cursor:ew-resize}
.tm-edge-grip[data-edge=start]{left:-4px}
.tm-edge-grip[data-edge=end]{right:-4px}
.tm-mobar[data-staged]{opacity:1;background:transparent;border:1.5px dashed var(--act-do);box-sizing:border-box}
.tm-staged{font-weight:800;color:var(--ink)}
.tm-follow{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tm-mo{position:relative}
.tm-card{position:absolute;left:56px;right:18px;top:calc(100% - 4px);z-index:5;margin:0;padding:12px;background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.tm-card-head,.tm-card-btns,.tm-pick,.tm-pick-scopes{grid-column:1 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tm-card-head .tm-name{flex:1}
.tm-card>.tm-meta:first-of-type{grid-column:1 / -1}
.tm-lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tm-card .btn,.tm-foot .btn{white-space:nowrap}
.tm-foot{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card)}
.tm-chip{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:var(--bg-subtle)}
.tm-foot-btns{margin-left:auto;display:flex;gap:6px}
@media (max-width:640px){
  .tm{--tm-cols:auto minmax(0,1fr) auto minmax(0,1fr)}
  .tm-seg{box-sizing:border-box;max-width:100%;flex-wrap:wrap}
  .tm-row{padding:0 var(--space-2) 0 var(--space-1)}
  .tm-row .tm-text .tm-meta{display:none}
  .tm-axis-row{padding:0 var(--space-2) 0 var(--space-1)}
}

.cal{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.cal-week{font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cal-nav{display:inline-flex;gap:4px;margin-left:auto}
.cal-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.cal-grid{background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);padding:12px;display:grid;grid-template-columns:36px repeat(var(--cols),minmax(0,1fr));gap:6px}
.cal-hours{position:relative;height:396px;margin-top:46px}
.cal-hour{position:absolute;left:0;font-size:11px;font-weight:700;color:var(--ink-3);transform:translateY(-50%)}
.cal-day{display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-dhead{display:flex;flex-direction:column;gap:4px;height:40px}
.cal-dname{font-size:12.5px;font-weight:800;white-space:nowrap}
.cal-day[data-today] .cal-dname{color:var(--act-do)}
.cal-meter{height:4px;border-radius:var(--radius-pill);background:var(--bg-subtle);overflow:hidden}
.cal-meter>span{display:block;height:100%;background:var(--act-do)}
.cal-col{position:relative;height:396px;background:var(--bg-subtle);border-radius:10px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--bg-subtle) 43px,var(--bg-subtle) 44px)}
.cal-pass{position:absolute;left:3px;right:3px;border:0;border-radius:8px;background:var(--act-do);color:var(--bg);text-align:left;padding:4px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cal-pass[data-meeting]{background:repeating-linear-gradient(135deg,var(--bg-subtle) 0,var(--bg-subtle) 6px,var(--bg-subtle) 6px,var(--bg-subtle) 12px);color:var(--ink);outline:1.5px solid var(--line);outline-offset:-1.5px}
.cal-pass[data-tentative]{background:var(--bg);color:var(--ink);outline:1.5px dashed var(--act-do);outline-offset:-1.5px}
.cal-pass[data-blocked]{cursor:default}
.cal-pname{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-pmeta{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.cal-side{background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);padding:12px;display:flex;flex-direction:column;gap:6px}
.cal-side-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cal-seg{display:flex;gap:4px;padding:3px;border-radius:var(--radius-pill);background:var(--bg-subtle)}
.cal-opt{height:28px;padding:0 11px;border:0;border-radius:var(--radius-pill);background:transparent;font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.cal-opt[aria-pressed=true]{background:var(--bg);color:var(--ink)}

.cal-pass[draggable=true],.cal-item[draggable=true]{cursor:grab}
.cal-grip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.cal-group{display:flex;flex-direction:column;gap:4px}
.cal-ghead{display:flex;justify-content:space-between;gap:8px;padding:6px 2px 2px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cal-gmeta{color:var(--ink-2);white-space:nowrap}
.cal-layout{align-self:flex-start;white-space:nowrap}
.cal-preview{background:var(--bg-subtle);border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;gap:4px}
.cal-plist{margin:0;padding-left:16px;font-size:12.5px}
.cal-pbtns{display:flex;gap:6px}.cal-pbtns .btn{white-space:nowrap}
.cal-check{flex:none;margin:3px 0 0}
.cal-itext{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-month{background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);padding:12px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-mday{border:0;background:var(--bg-subtle);border-radius:10px;padding:8px;min-height:72px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.cal-mday[data-other]{opacity:.5}
.cal-mday[data-today] .cal-dname{color:var(--act-do)}
.cal-item{border:0;background:var(--bg-subtle);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:row;align-items:flex-start;gap:8px;cursor:pointer;width:100%;box-sizing:border-box}
.cal-item:hover{background:var(--bg-subtle)}
.cal-iname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta[data-late]{color:var(--late)}
.cal-note{font-size:12.5px;color:var(--ink-2)}
@media (max-width:760px){.cal-body{grid-template-columns:minmax(0,1fr)}}
