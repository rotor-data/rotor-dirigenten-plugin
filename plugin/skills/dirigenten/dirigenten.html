      S.confirm = { text: summaryText(pv) || `Förhandsvisning av ändringen i ${layer === "customer" ? "kundens sätt" : "metoden"}.`,
        verb: who, next: c, step: { id, call: c, layer } };
    } catch (e) { say(`Kunde inte ändra steget: ${e.message || e}. Inget sparades.`, null, true); }
    render();
  }
  async function confirmStep() {
    const c = S.confirm?.step; if (!c) return;
    S.confirm = null; render();
    try {
      const r = await call(c.call.tool, { ...c.call.args, confirmed: true });
      say(summaryText(r) || "Sparat.", r?.undo || r?.receipt?.undo || null);
      if (c.layer === "take") { const k = `delivery:${c.key}`; S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } }; const t = top1(); if (t) fetchSheet(t, true); }
      else if (c.layer === "rename") afterRename();
      else if (c.layer === "variant") { const t = top1(); if (t?.kind === "method") { const { [c.key]: _v, ...rest } = t.vedit || {}; t.vedit = rest; fetchSheet(t, true); } }
      else { setEdit(c.id, { label: undefined, prompt: undefined, addition: undefined, checklist: undefined, level: undefined }); staleStep(c.id, splitStep(c.id)[0]); }
    } catch (e) { say(`Kunde inte spara: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /** Avbockning (●): ett moment, direkt, räknas inte som ändring. */
  async function tick(id, i) {
    const sh = sheetOf(id); if (!sh) return;
    const t = sh.checklist[i]?.text; if (!t) return;
    const on = sh.checklist.filter((c) => c.done).map((c) => c.text);
    const next = on.includes(t) ? on.filter((x) => x !== t) : [...on, t];
    const [task, step] = splitStep(id);
    const k = `step:${id}`, before = S.sheetData[k];
    S.sheetData = { ...S.sheetData, [k]: { ...before, sheet: { ...sh, checklist: sh.checklist.map((c) => c.text === t ? { ...c, done: !c.done } : c) } } };
    render();
    try { await call("write", { op: "step_edit", task, step, layer: "here", ticked: next }); }
    catch (e) { S.sheetData = { ...S.sheetData, [k]: before }; say(`Kunde inte bocka av: ${e.message || e}.`, null, true); render(); }
  }

  /* ── Resultat och läsformer (README «Resultat och rapportläsaren», BESLUT 6) ── */
  function allResults() { const out = []; for (const k of Object.keys(S.sheetData)) for (const r of S.sheetData[k].results || []) out.push(r); return out; }
  function openResult(id) {
    const r = allResults().find((x) => x.id === id);
    openSheet("result", id, r?.name || "Resultatet");
  }
  const FMT_TEXT = { text: "Text", report: "Rapport", image: "Bild", pdf: "PDF", table: "Tabell", mail: "Mejl", web: "Webb", decision: "Beslut" };
  /** Markdown till block: rubriker, stycken, punkter. Det som behövs för boksidan och texten. */
  function mdBlocks(md) {
    const out = [];
    let para = [];
    const flush = () => { if (para.length) { out.push({ t: "p", s: para.join(" ") }); para = []; } };
    for (const line of String(md || "").split(/\r?\n/)) {
      const h = /^(#{1,3})\s+(.*)$/.exec(line), li = /^\s*(?:[-*]|\d+\.)\s+(.*)$/.exec(line);
      if (h) { flush(); out.push({ t: `h${h[1].length}`, s: h[2] }); }
      else if (li) { flush(); out.push({ t: "li", s: li[1] }); }
      else if (/^\s*>\s?/.test(line)) { flush(); out.push({ t: "q", s: line.replace(/^\s*>\s?/, "") }); }
      else if (!line.trim()) flush();
      else para.push(line.trim());
    }
    flush();
    return out;
  }
  const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  /** Boksidor: 640 × 905, marginal 34/48, brödtext 12.5/1.62 (≈ 20 px per rad, ≈ 86 tecken per rad). */
  const PAGE_W = 640, PAGE_H = 905;
  function paginate(blocks) {
    const cap = 905 - 2 * 48 - 40, perLine = 20.25, chars = 98;
    const height = (b) => b.t === "h1" ? 62 * Math.ceil(b.s.length / 26) + 14 : b.t === "h2" ? 30 * Math.ceil(b.s.length / 44) + 18
      : b.t === "h3" ? 24 + 10 : (Math.ceil(b.s.length / (b.t === "li" ? chars - 4 : chars)) * perLine) + (b.t === "li" ? 3 : 10);
    const pages = [[]]; let used = 0;
    for (const b of blocks) {
      const h = height(b);
      if (used + h > cap && pages.at(-1).length) { pages.push([]); used = 0; }
      pages.at(-1).push(b); used += h;
    }
    return pages;
  }
  function pageHtml(blocks, n, title) {
    return `<div class="page" style="width:${PAGE_W}px;height:${PAGE_H}px"><div class="run">${esc(title)}</div><div class="pbody">`
      + blocks.map((b) => b.t === "li" ? `<div class="pli">${inline(b.s)}</div>` : b.t === "q" ? `<blockquote>${inline(b.s)}</blockquote>` : `<${b.t}>${inline(b.s)}</${b.t}>`).join("")
      + `</div><div class="pno">${n}</div></div>`;
  }
  /** Zoom: anpassad till höjd och bredd, aldrig över 100 %. */
  function readerFit(spread) {
    const vw = typeof innerWidth === "number" ? innerWidth : 1400, vh = typeof innerHeight === "number" ? innerHeight : 900;
    return Math.min(1, Math.max(.3, Math.min((vh - 190) / PAGE_H, (vw - 240) / (spread ? PAGE_W * 2 + 24 : PAGE_W))));
  }
  const readerZoom = () => Math.min(1, S.reader?.zoom ?? readerFit(S.reader?.spread));
  function zoomBy(d) { const z = readerZoom(); S.reader = { ...(S.reader || {}), zoom: d === 0 ? null : Math.max(.3, Math.min(1, Math.round((z + d) * 10) / 10)) }; render(); }
  function readerHtml(md, title) {
    const pages = paginate(mdBlocks(md)), z = readerZoom(), spread = !!S.reader?.spread;
    const groups = spread ? pages.reduce((a, p, i) => { if (i % 2 === 0) a.push([[p, i + 1]]); else a.at(-1).push([p, i + 1]); return a; }, []) : pages.map((p, i) => [[p, i + 1]]);
    return `<div class="rbar"><button data-act="zoom" data-d="-0.1" title="Mindre · ⌘−">−</button><span class="zv">${Math.round(z * 100)} %</span><button data-act="zoom" data-d="0.1" title="Större · ⌘+">+</button>`
      + `<button data-act="zoom" data-d="0" title="Anpassa · ⌘0">Anpassa</button><span class="sep"></span>`
      + `<button class="${spread ? "" : "on"}" data-act="reader-mode" data-spread="">Sida</button><button class="${spread ? "on" : ""}" data-act="reader-mode" data-spread="1">Uppslag</button>`
      + `<span class="mmeta">${pages.length} ${pages.length === 1 ? "sida" : "sidor"}</span></div>`
      + `<div class="reader" style="zoom:${z}">${groups.map((g) => `<div class="spread">${g.map(([p, n]) => pageHtml(p, n, title)).join("")}</div>`).join("")}</div>`;
  }
  function resultSheetHtml(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, r = allResults().find((y) => y.id === x.id) || sd.item || null, doc = sd.doc;
    const fmt = r?.format || (doc ? "text" : null);
    const label = `${FMT_TEXT[fmt] || "Resultat"}${r?.status_text ? ` · ${r.status_text}` : ""}${r?.version ? ` · v${r.version}` : ""}${r?.step?.label ? ` · från «${r.step.label}»` : ""}`;
    const title = r?.name || doc?.name || x.label;
    let body;
    if (sd.loading && !doc) body = `<div class="mmeta">Hämtar …</div>`;
    else if (sd.error && !doc) body = `<div class="banner"><span style="flex:1">Kunde inte läsas: ${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>`;
    else if (doc?.markdown && (fmt === "report" ? !x.edit : x.book)) body = readerHtml(doc.markdown, title);
    else if (doc?.markdown !== undefined && (fmt === "text" || fmt === "mail" || fmt === "report")) {
      const text = S.resultEdit?.[x.id] ?? doc.markdown ?? "";
      body = `<div class="bh"><b>Texten</b><span class="mmeta">markdown · en ändring sparas som en ny version</span>${mdTabs(`result:${x.id}`)}</div>`
        + (S.mdPrev?.[`result:${x.id}`] ? mdHtml(text) : `<textarea id="result-text" class="rtext${fmt === "mail" ? " mail" : ""}" data-result="${esc(x.id)}" rows="22">${esc(text)}</textarea>`)
        + (text !== doc.markdown ? `<div class="doacts"><button class="primary" data-act="result-save"><span class="lvl d">●</span> Spara som version ${(r?.version || 1) + 1}</button><button class="quiet" data-act="result-reset">Ångra ändringen</button><span class="mmeta">Den gamla versionen finns kvar.</span></div>` : "");
    } else if (doc?.markdown) body = `<div class="rtext ro">${mdBlocks(doc.markdown).map((b) => `<p>${inline(b.s)}</p>`).join("")}</div>`;
    else body = `<div class="mmeta">${r?.source === "file" ? "Filen visas i programmet den hör till." : r?.source === "decision" ? "Beslutet står i lägesbilden." : "Inget att visa här."}</div>`;
    const acts = `<div class="sacts">${fmt === "report" && doc?.markdown ? `<button class="link" data-act="result-edit">${x.edit ? "Visa som boksida" : "Redigera texten"}</button>` : ""}`
      + (fmt === "text" && doc?.markdown ? `<button class="link" data-act="result-book">${x.book ? "Redigera texten" : "Läs som boksida"}</button>` : "")
      + (doc?.markdown ? `<button class="link" data-act="result-copy">Kopiera texten</button>` : "")
      + (r?.status === "draft" ? `<button class="link" data-act="draft-approve" data-id="${esc(x.id)}" data-name="${esc(title)}">● Godkänn</button>` : "")
      + (r?.status === "draft" && r.source === "content" ? declineBtn(resultSubject(r, title)) : "") + `</div>`
      + (r?.status === "draft" && r.source === "content" ? declineFormHtml(resultSubject(r, title)) : "")
      + (S.diffs?.[x.id] ? `<div class="mh">Ändringen mot förra versionen</div>${diffHtml(S.diffs[x.id].before, S.diffs[x.id].after)}` : "");
    const vers = (r?.versions || []).length ? `<h3 class="sh">Versioner</h3>${r.versions.map((v) => `<div class="crow"><b>v${v.n}</b><span>${esc(v.by)}</span><span class="mmeta">${esc(fmtDay(v.at))}</span></div>`).join("")}`
      + (r.version > r.versions.length ? `<div class="mmeta">${r.version - r.versions.length} äldre finns kvar.</div>` : "") : "";
    return `<div class="slabel">${esc(label)}</div><h1 class="stitle">${doc?.markdown !== undefined ? rn("result", x.id, title) : esc(title)}</h1>${acts}${body}${vers}${r?.history?.length ? `<h3 class="sh">Godkännande</h3>${historyHtml(r.history)}` : ""}`;
  }
  async function resultSave(id) {
    const r = allResults().find((y) => y.id === id), text = S.resultEdit?.[id];
    if (text === undefined) return;
    const args = r?.edit?.args ? { ...r.edit.args } : { op: "content_save", id };
    try {
      await call(r?.edit?.tool || "write", { ...args, markdown: text, confirmed: true });
      const { [id]: _x, ...rest } = S.resultEdit; S.resultEdit = rest;
      say(`Sparat som en ny version. Den gamla finns kvar.`);
      for (const k of Object.keys(S.sheetData)) if (k === `result:${id}` || S.sheetData[k].results?.some((y) => y.id === id)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const t = top1(); if (t) fetchSheet(t, true);
    } catch (e) { say(`Kunde inte spara: ${e.message || e}. Texten står kvar.`, null, true); }
    render();
  }
  async function approveDraft(id, name) {
    try { await call("write", { op: "content_approve", id }); say(`«${name}» är godkänt.`);
      for (const k of Object.keys(S.sheetData)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const t = top1(); if (t) fetchSheet(t, true); }
    catch (e) { say(`Kunde inte godkänna: ${e.message || e}.`, null, true); }
    render();
  }

  const resultCard = (m) => `<div class="mcard${m.status === "draft" ? " draft" : ""}" title="${esc(m.name)}" data-act="open-result" data-id="${esc(m.id)}" role="button">`
    + `<span class="fmt">${esc((m.format_text || m.format || "").toUpperCase())}</span><b>${esc(m.name)}</b>`
    + `<span class="mmeta">${esc(m.status_text || "")}${m.version ? ` · v${m.version}` : ""}${m.step?.label ? ` · från «${esc(m.step.label)}»` : ""}</span></div>`;
  /** Lagerraden med vad siffrorna betyder vid hovring: skillnaderna och de egna ändringarna, en per rad. */
  function layersHtml(l) {
    const tip = [l.customer?.list?.length ? `${l.customer.label}s sätt:\n${l.customer.list.map((d) => `· ${d}`).join("\n")}` : "",
      l.own_list?.length ? `Egna ändringar:\n${l.own_list.map((d) => `· ${d}`).join("\n")}` : ""].filter(Boolean).join("\n\n");
    return `<div class="layers"${tip ? ` title="${esc(tip)}"` : ""}>${esc(l.text)}.</div>`;
  }
  /** Så många resultat per ärende i strömmens ark; «Visa alla» visar resten. */
  const RESULTS_PER_CASE = 2;
  /** Strömmens resultat, grupperade per ärende med ärendets rubrik, nyast först. */
  function resultsByCase(x, sd, results) {
    const all = !!S.allCases[`res:${x.id}`], title = new Map((sd.cases || []).map((c) => [c.task, c.title]));
    const groups = new Map();
    for (const r of results) groups.set(r.task, [...(groups.get(r.task) || []), r]);
    const hidden = [...groups.values()].reduce((n, g) => n + Math.max(0, g.length - RESULTS_PER_CASE), 0);
    return [...groups].map(([task, g]) => `<div class="part"><button class="link" data-act="open-case" data-task="${esc(task)}" data-label="${esc(title.get(task) || task)}">${esc(title.get(task) || task)}</button><span class="mmeta"> · ${g.length} resultat</span></div>`
      + `<div class="made">${(all ? g : g.slice(0, RESULTS_PER_CASE)).map(resultCard).join("")}</div>`).join("")
      + (hidden || all ? `<div class="doacts"><button class="link" data-act="cases-all" data-key="res:${esc(x.id)}">${all ? "Visa bara de senaste" : `Visa alla ${results.length}`}</button></div>` : "");
  }

  /*
   * «Godkänn inte ▾» (Daniel P 2026-10-05): «Gör om» går tillbaka till den som
   * gjorde det (● med Ångra), «Skicka för second opinion» lägger en granskning
   * hos en kollega (◐). Godkännandet är fortfarande den ursprunglige godkännarens.
   *
   * Saken (subj): { key, of?, task, step, name, redo: { kind: "claude"|"human", party?, label }, reopen?, prevStep? }.
   * of = utkastets id; utan of är det ett godkännandesteg (decline.task/step).
   */
  const declineBtn = (subj) => `<button class="link" data-act="decline-open" data-key="${esc(subj.key)}" aria-expanded="${S.decline?.key === subj.key}">Godkänn inte ▾</button>`;
  /** Formuläret under knappen, när det är öppet för just den här saken. */
  function declineFormHtml(subj) {
    const d = S.decline;
    if (!d || d.key !== subj.key) return "";
    S.declineSubj = subj;
    if (!d.mode) return `<div class="declmenu" role="menu"><button class="mi" role="menuitem" data-act="decline-mode" data-mode="redo"><span class="ml"><span class="lvl d">●</span> Gör om</span><span class="mmeta">tillbaka till ${esc(subj.redo.label)}</span></button>`
      + `<button class="mi" role="menuitem" data-act="decline-mode" data-mode="review"><span class="ml">◐ Skicka för second opinion</span><span class="mmeta">en kollega tittar, du godkänner</span></button></div>`;
    if (d.mode === "redo") {
      const ok = sentence(d.feedback || "");
      return `<div class="declform"><div class="mmeta">Vad ska ändras? Minst en mening. ${esc(subj.redo.kind === "claude" ? "Claude kör om med det här i prompten; förra versionen finns kvar." : `${subj.redo.label} får steget tillbaka med det här som meddelande.`)}</div>`
        + `<textarea id="decline-text" rows="3" placeholder="Till exempel: Kortare inledning, och nämn priset i första stycket.">${esc(d.feedback || "")}</textarea>`
        + `<div class="doacts"><button class="primary" data-act="decline-redo"${ok ? "" : " disabled"}><span class="lvl d">●</span> Gör om${subj.redo.kind === "claude" ? " med Claude" : `, tillbaka till ${esc(subj.redo.label)}`}</button>`
        + `<button class="quiet" data-act="decline-close">Avbryt · Esc</button></div></div>`;
    }
    const me = S.data?.party?.id, ppl = (S.data?.colleagues || []).filter((p) => p.id && p.id !== me);
    return `<div class="declform"><div class="mmeta">Vem ska titta? Hen svarar «Ser bra ut», «Ändra så här …» eller «Jag vet inte», och svaret kommer tillbaka hit.</div>`
      + `<div class="parts4">${ppl.map((p) => `<button class="rd${d.to === p.id ? " on" : ""}" data-act="decline-to" data-id="${esc(p.id)}" aria-pressed="${d.to === p.id}">${esc(p.label)}</button>`).join("") || `<span class="mmeta">Inga kolleger att välja.</span>`}</div>`
      + `<textarea id="decline-q" rows="2" placeholder="Fråga (valfri): vad vill du ha en åsikt om?">${esc(d.question || "")}</textarea>`
      + `<div class="doacts"><button class="primary" data-act="decline-review"${d.to ? "" : " disabled"}>◐ Skicka till ${esc(ppl.find((p) => p.id === d.to)?.label || "kollegan")}</button>`
      + `<button class="quiet" data-act="decline-close">Avbryt · Esc</button></div></div>`;
  }
  const sentence = (t) => t.trim().split(/\s+/).filter((w) => /\p{L}/u.test(w)).length >= 3;
  /** Historiken på saken: godkänt, inte godkänt med feedback, second opinion med svar. */
  const historyHtml = (h) => (h || []).length ? `<div class="ahist"><div class="mh">Historik</div>${h.map((l) => `<div class="crow"><span>${l.kind === "approved" ? "●" : l.kind === "declined" ? "✕" : l.kind === "withdrawn" ? "↺" : "◐"}</span>`
    + `<span>${esc(l.text)}${l.feedback ? ` <span class="mmeta">«${esc(l.feedback)}»</span>` : ""}</span><span class="mmeta">${esc(l.by)} · ${esc(fmtDay(l.at))}</span></div>`).join("")}</div>` : "";
  /** Saken för ett utkast på ett steg (stegets ark) eller ett resultat. */
  function draftSubject(d, task, step, stepLabelText) {
    const human = d.made_by?.kind === "human" && d.made_by.party;
    return { key: `d:${d.id}`, of: d.id, task, step, name: d.name, reopen: human ? { task, step } : null, stepLabel: stepLabelText,
      redo: human ? { kind: "human", party: d.made_by.party.id, label: d.made_by.party.label } : { kind: "claude", label: "Claude" } };
  }
  /** Saken för ett resultat: vem som gjorde det står på stegets utkast när arket är läst; annars Claude. */
  function resultSubject(r, title) {
    const sh = r.task && r.step?.id ? S.sheetData[`step:${stepId(r.task, r.step.id)}`]?.sheet : null;
    const d = sh?.drafts?.find((y) => y.id === r.id);
    return draftSubject(d || { id: r.id, name: title, made_by: { kind: "claude" } }, r.task, r.step?.id || null, r.step?.label);
  }
  /** Saken för ett godkännandesteg: det som godkänns är steget före. */
  function approvalSubject(sh) {
    const of = sh.approval?.of;
    const claude = of && (of.who === "claude" || of.who === "mixed");
    return { key: `s:${sh.task}|${sh.step}`, task: sh.task, step: sh.step, name: sh.label,
      reopen: of ? { task: sh.task, step: of.step } : null, prevStep: of ? { step: of.step, label: of.label } : null,
      redo: claude ? { kind: "claude", label: "Claude" } : { kind: "human", party: of?.responsible?.id || null, label: of?.responsible?.label || "den som gjorde det" } };
  }
  async function declineRedo() {
    const subj = S.declineSubj, d = S.decline;
    if (!subj || !d || !sentence(d.feedback || "")) return;
    const feedback = d.feedback.trim();
    const redo = subj.redo.kind === "claude" ? { redo: "claude" } : subj.redo.party ? { redo: subj.redo.party } : {};
    try {
      const r = await call("write", { op: "content_approve", ...(subj.of ? { id: subj.of } : { task: subj.task, step: subj.step }), decline: feedback, ...redo });
      S.decline = null;
      const event = r?.event;
      if (subj.redo.kind === "human") {
        // Steget öppnas igen för den som gjorde det (step_reopened), om det var klart, och hen får feedbacken som meddelande.
        let reopened = null;
        if (subj.reopen) { try { await call("execute_step", { task: subj.reopen.task, step: subj.reopen.step, mark: "undone", reason: `Inte godkänt: ${feedback}` }); reopened = subj.reopen; } catch { /* inte klart: inget att öppna */ } }
        const me = S.data?.party?.id;
        if (subj.redo.party && subj.redo.party !== me && subj.reopen)
          try { await call("write", { op: "message", to: subj.redo.party, text: `Inte godkänt: «${subj.name}». Ändra så här: ${feedback}`, about: { task: subj.reopen.task, step: subj.reopen.step }, confirmed: true }); } catch { /* meddelandet är en bonus */ }
        say(`Inte godkänt. ${subj.redo.label} gör om${reopened ? "; steget är öppet igen" : ""}.`, { fn: async () => {
          await call("write", { op: "content_approve", withdraw: event });
          if (reopened) await call("execute_step", { task: reopened.task, step: reopened.step, mark: "done" });
        } });
      } else {
        const toast = { text: "Inte godkänt. Claude kör om med det du skrev.", undo: { tool: "write", args: { op: "content_approve", withdraw: event } } };
        say(toast.text, toast.undo);
        await redoWithClaude(subj, feedback, toast);
      }
      for (const k of Object.keys(S.sheetData)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const t = top1(); if (t) fetchSheet(t, true);
    } catch (e) { say(`Inget ändrades: ${e.message || e}`, null, true); }
    render();
  }
  /** Ny körning med feedbacken inbakad: förra texten och vad som ska ändras står i prompten, och svaret sparas som en ny version. */
  async function redoWithClaude(subj, feedback, toast = null) {
    const task = subj.task, step = subj.of ? subj.step : subj.prevStep?.step;
    if (!task || !step) return;
    const id = stepId(task, step);
    let before = "", of = subj.of || S.sheetData[`step:${id}`]?.sheet?.drafts?.[0]?.id || null;
    if (of) { try { const d = await call("read", { op: "content_get", id: of }); before = d?.markdown || ""; } catch { /* förra texten saknas: feedbacken räcker */ } }
    S.redo = { ...(S.redo || {}), [id]: { of, feedback, before } };
    if (top1()?.id !== id) openStep(task, step, subj.stepLabel || subj.prevStep?.label);
    let tries = 0;
    const go = () => { const sd = S.sheetData[`step:${id}`]; if (sd?.sheet?.prompt && !sd.stale) runStart(id, toast); else if (tries++ < 50) setTimeout(go, 200); };
    go();
  }
  /** Prompten vid «Gör om»: förra utkastet och vad som ska ändras. */
  const redoPrompt = (id) => { const r = S.redo?.[id]; return r ? `\n\n—\nFörra utkastet godkändes inte. Ändra så här: ${r.feedback}`
    + (r.before ? `\n\nFörra utkastet:\n${r.before.slice(0, 6000)}` : "") + `\nSkriv om hela utkastet med ändringen.` : ""; };
  /** Rad-för-rad-skillnaden mellan förra och nya versionen. */
  function diffHtml(a, b) {
    const x = (a || "").split("\n"), y = (b || "").split("\n"), n = x.length, m = y.length;
    if (n * m > 400000) return `<div class="mmeta">Texterna är för långa för att jämföra här.</div>`;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && x[i] === y[j]) { out.push(`<div class="dl">${esc(x[i]) || "&nbsp;"}</div>`); i++; j++; }
      else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { out.push(`<div class="dl add">+ ${esc(y[j])}</div>`); j++; }
      else { out.push(`<div class="dl del">− ${esc(x[i])}</div>`); i++; }
    }
    return `<div class="diff">${out.join("")}</div>`;
  }
  async function declineReview() {
    const subj = S.declineSubj, d = S.decline;
    if (!subj || !d?.to) return;
    const review = subj.of || "step";
    const q = (d.question || "").trim();
    const args = { op: "message", to: d.to, review, about: { task: subj.task, ...(subj.step ? { step: subj.step } : {}) },
      text: q ? `Second opinion på «${subj.name}»: ${q}` : `Kan du ge en second opinion på «${subj.name}»? Godkännandet är fortfarande mitt.` };
    try {
      const r = await call("write", args);
      const label = (S.data?.colleagues || []).find((p) => p.id === d.to)?.label || "kollegan";
      S.confirm = { verb: `Skicka till ${label}`, text: `${label} får «${subj.name}» att granska i Där jag behövs.${q ? ` Frågan: «${q}».` : ""} Du godkänner fortfarande själv.`,
        next: r?.next_call || { tool: "write", args: { ...args, confirmed: true } }, onDone: () => { S.decline = null; } };
    } catch (e) { say(`Kunde inte förhandsvisa: ${e.message || e}`, null, true); }
    render();
  }

  /* Granskningar i «Där jag behövs»: second opinion som du blivit ombedd om, och svaren på dem du bett om. */
  const REVIEW_TEXT = { ok: "Ser bra ut", change: "Ändra så här", unsure: "Jag vet inte" };
  function reviewsHtml(o) {
    const rs = o?.reviews || [];
    if (!rs.length || S.person || !(S.lens === "mine" || S.lens === "all")) return "";
    const row = (m) => {
      const open = m.about?.task && m.about?.step ? `<button class="link" data-act="open-step" data-task="${esc(m.about.task)}" data-step="${esc(m.about.step)}" data-label="${esc(m.about_label || "")}">Öppna saken →</button>` : "";
      const when = `<span class="mmeta">${esc(fmtDay(m.at))}${m.about_label ? ` · om «${esc(m.about_label)}»` : ""}</span>`;
      if (m.review_answer) return `<div class="msg unread"><div class="mh3"><b>${esc(m.from.label)} svarade: ${esc(REVIEW_TEXT[m.review_answer] || m.review_answer)}</b>${when}</div>`
        + `<div class="mt">${esc(m.text ?? "")}</div><div class="doacts">${open}<button class="link" data-act="msg-read" data-id="${esc(m.id)}"><span class="lvl d">●</span> Läst</button></div></div>`;
      const ch = S.reviewChange === m.id;
      return `<div class="msg unread"><div class="mh3"><b>Second opinion från ${esc(m.from.label)}</b>${when}</div>`
        + `<div class="mt">${esc(m.text ?? "(texten kunde inte hämtas)")}</div><div class="doacts">${open}`
        + `<button class="link" data-act="review-answer" data-id="${esc(m.id)}" data-answer="ok"><span class="lvl d">●</span> Ser bra ut</button>`
        + `<button class="link" data-act="review-change" data-id="${esc(m.id)}">Ändra så här …</button>`
        + `<button class="link" data-act="review-answer" data-id="${esc(m.id)}" data-answer="unsure"><span class="lvl d">●</span> Jag vet inte</button></div>`
        + (ch ? `<div class="reply"><textarea id="review-text" rows="3" placeholder="Vad ska ändras? Svaret går till ${esc(m.from.label)}, som godkänner.">${esc(S.reviewText || "")}</textarea><div class="doacts"><button class="primary" data-act="review-answer" data-id="${esc(m.id)}" data-answer="change"${sentence(S.reviewText || "") ? "" : " disabled"}><span class="lvl d">●</span> Skicka till ${esc(m.from.label)}</button></div></div>` : "")
        + `</div>`;
    };
    return `<div class="reviews"><h3 class="sh">Granskningar</h3>${rs.map(row).join("")}</div>`;
  }
  async function reviewAnswer(id, answer) {
    const text = answer === "change" ? (S.reviewText || "").trim() : "";
    if (answer === "change" && !sentence(text)) return;
    try {
      await call("write", { op: "message", reply_to: id, answer, ...(text ? { text: `Ändra så här: ${text}` } : {}), confirmed: true });
      await call("write", { op: "message", read: id });
      S.reviewChange = null; S.reviewText = "";
      S.data = { ...S.data, reviews: (S.data?.reviews || []).filter((m) => m.id !== id) };
      say(`Svaret är skickat: ${REVIEW_TEXT[answer]}.`);
      refreshSoon();
    } catch (e) { say(`Svaret skickades inte: ${e.message || e}`, null, true); }
    render();
  }

  /** Leveransens lagerrad (BESLUT 4): en metodändring tas in per leverans, Ta in eller Låt vara. */
  function methodUpdatesHtml(x, sd) {
    const ups = (sd.layers?.method_updates || []).filter((u) => !(S.leave || {})[`${u.task}`]);
    if (!ups.length) return "";
    return ups.map((u) => `<div class="upd"><span class="lvl">◐</span><span style="flex:1">Metoden har ändrats: ${esc(u.changes.join("; "))}. Påbörjade och klara steg ändras inte; egna ändringar står kvar.</span>`
      + `<button class="${u.preselected === "take" ? "go" : "quiet"}" data-act="upd-take" data-task="${esc(u.task)}">Ta in</button>`
      + `<button class="${u.preselected === "leave" ? "go" : "quiet"}" data-act="upd-leave" data-task="${esc(u.task)}">Låt vara</button></div>`).join("");
  }
  async function switchMethod(task, sw) {
    try { const pv = await call(sw.call.tool, sw.call.args);
      S.confirm = { text: summaryText(pv) || `Ärendet byter till ${sw.method.label}. Klara steg ändras inte.`, verb: sw.label, next: sw.call, step: { id: null, call: sw.call, layer: "take", key: task } }; }
    catch (e) { say(`Kunde inte förhandsvisa: ${e.message || e}.`, null, true); }
    render();
  }
  async function takeUpdate(key, task) {
    const sd = S.sheetData[`delivery:${key}`] || S.sheetData[`case:${key}`] || S.sheetData[`method:${key}`];
    const u = sd?.layers?.method_updates?.find((y) => y.task === task) || (sd?.line?.update?.task === task ? sd.line.update : null)
      || sd?.m?.followers?.find((f) => f.task === task)?.update;
    if (!u) return;
    try { const pv = await call(u.take.tool, u.take.args);
      S.confirm = { text: summaryText(pv) || "Metodändringen tas in i leveransen.", verb: "Ta in", next: u.take, step: { id: null, call: u.take, layer: "take", key } }; }
    catch (e) { say(`Kunde inte förhandsvisa: ${e.message || e}.`, null, true); }
    render();
  }

  /* ── Kalendern (fas 3, README «Kalender», BESLUT 3) ──
     Läses med read { op: "view_file", sheet: "calendar" } och skrivs med läget
     write { op: "step_edit", calendar: { action } }. Pass som dras, ändras i längd,
     delas (⫽) eller slås ihop (⊕) är streckade utkast i vyn tills ◐ «Lägg in i
     kalendern»; ↶ Ångra och ⌘Z tar tillbaka de 30 senaste. */
  const CAL_MODES = [["day", "Dag"], ["week", "Vecka"], ["2w", "2 veckor"], ["month", "Månad"]];
  const CUST_HUES = ["#2f62c4", "#a86a12", "#b2412e", "#3f7d55", "#5b48c9", "#1f7672", "#7a4c0b", "#55544e"];
  const calState = () => (S.cal ||= { mode: "week", anchor: null, data: null, loading: false, error: null, draft: {}, hist: [], sel: {} });
  async function loadCalendar() {
    const C = calState();
    C.loading = true; C.error = null; render();
    try {
      const d = await call("read", { op: "view_file", sheet: "calendar", mode: C.mode, ...(C.anchor ? { anchor: C.anchor } : {}) });
      C.data = d; C.loading = false;
    } catch (e) { C.loading = false; C.error = e; }
    render();
  }
  const hm = (s) => { const [h, m] = String(s).split(":").map(Number); return h * 60 + (m || 0); };
  const hmText = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
  const custColor = (d, k) => { const c = d.customers?.[k]; if (!c) return "var(--t3)"; return typeof c[2] === "number" ? CUST_HUES[c[2] % 8] : c[2] || CUST_HUES[0]; };
  /** Passen ur serverns tuplar, med utkastet lagt ovanpå. */
  function calPasses() {
    const C = calState(), d = C.data;
    if (!d) return [];
    const out = [];
    for (const day of d.days) for (const [i, start, minutes, t] of day.p) {
      const [task, step, label, cust, session] = d.steps[i];
      out.push({ key: `${task}|${step}|${session}`, task, step, label, cust, session, day: day.d, start: hm(start), minutes, tentative: t === 1 });
    }
    const byKey = new Map(out.map((p) => [p.key, p]));
    for (const [k, ch] of Object.entries(C.draft)) {
      const p = byKey.get(k);
      if (ch.removed) { if (p) byKey.delete(k); continue; }
      if (p) byKey.set(k, { ...p, ...ch, draft: true, tentative: true });
      else if (ch.added) byKey.set(k, { ...ch.added, ...ch, draft: true, tentative: true });
    }
    return [...byKey.values()];
  }
  function calUndo() {
    const C = calState();
    if (C.hist.length) { C.draft = C.hist.at(-1); C.hist = C.hist.slice(0, -1); render(); return true; }
    if (C.data?.undo) { calPreview({ action: "undo" }, "Ångra"); return true; }
    say("Det finns inget att ångra i kalendern."); render(); return true;
  }
  /** ◐: serverns förhandsvisning, och sedan samma anrop med confirmed. */
  async function calPreview(cal, verb, local = "") {
    S.confirm = { loading: true, verb, text: "Räknar …", cal: true };
    render();
    try {
      const r = await call("write", { op: "step_edit", calendar: cal });
      S.confirm = { verb, cal: true, text: [local, summaryText(r)].filter(Boolean).join(" "),
        next: { tool: "write", args: { op: "step_edit", calendar: cal, confirmed: true } } };
    } catch (e) { S.confirm = null; say(`Kunde inte förhandsvisa: ${e.message || e}`, null, true); }
    render();
  }
  /** Lägg in: utkastets pass skrivs (streckade), sedan blir alla streckade fasta. */
  async function calCommit() {
    const c = S.confirm, C = calState();
    if (!c?.next) return;
    S.confirm = { ...c, loading: true }; render();
    try {
      if (c.next.args.calendar.action === "confirm") {
        const all = calPasses();
        for (const [k, ch] of Object.entries(C.draft)) {
          const [task, step, session] = k.split("|");
          if (ch.removed) { if (!ch.added) await call("execute_step", { task, step, unschedule: { session }, confirmed: true }); continue; }
          const p = all.find((x) => x.key === k);
          if (p) await call("execute_step", { task, step, schedule: { session, start: `${p.day}T${hmText(p.start)}`, minutes: p.minutes, tentative: true }, confirmed: true });
        }
        C.draft = {}; C.hist = [];
      }
      const r = await call(c.next.tool, c.next.args);
      S.confirm = null;
      const a = c.next.args.calendar.action;
      say(summaryText(r) || "Klart.", a === "undo" ? null : { tool: "write", args: { op: "step_edit", calendar: { action: "undo" }, confirmed: true } });

  /**
   * Sök i personens egen Gmail (view_file sheet:"order", mail): en sökning,
   * en Gmail-länk eller trådens id ger högst tio trådar med bara ämne och
   * avsändare. Ett id ger en träff, som väljs direkt.
   */
  async function orderThread(x) {
    const q = (x.threadQ || "").trim();
    x.threadErr = null; x.mail = null; x.hits = null; x.hitsMore = false;
    if (!q) { x.threadErr = "Skriv avsändaren, ett ord i ämnet eller klistra in en Gmail-länk."; render(); return; }
    x.hitsLoading = true; render();
    try {
      const d = await call("read", { op: "view_file", sheet: "order", mail: q.slice(0, 500) });
      x.hitsLoading = false;
      if (d?.mail_error) x.threadErr = d.mail_error;
      x.hits = Array.isArray(d?.mail_hits) ? d.mail_hits : d?.mail_error ? null : [];
      x.hitsMore = !!d?.mail_truncated;
      // Ett id som inte gick att läsa här kopplas ändå: mejlet kan klistras in nedan.
      if (!x.hits && threadIdOf(q)) { x.thread = threadIdOf(q); x.threadErr += " Klistra in mejlet nedan; tråden kopplas ändå."; }
      if (x.hits?.length === 1 && !d?.mail_query) return orderHit(x, x.hits[0].id);
    } catch (e) {
      x.hitsLoading = false;
      const id = threadIdOf(q);
      if (id) x.thread = id;
      x.threadErr = `Gmail kunde inte läsas här: ${e.message || e}. Klistra in mejlet nedan${id ? "; tråden kopplas ändå" : ""}.`;
    }
    render();
  }
  /** Den valda tråden läses hel (först nu: kvoten), och texten blir förslagets underlag. */
  async function orderHit(x, id) {
    x.thread = id; x.threadErr = null; render();
    try {
      const d = await call("read", { op: "view_file", sheet: "order", thread: id });
      if (d?.mail_error) { x.threadErr = `${d.mail_error} Klistra in mejlet nedan; tråden kopplas ändå.`; render(); return; }
      const m = d?.mail || {};
      x.mail = { subject: m.subject || "", from: m.from || "", posts: m.posts || 0 };
      x.text = String(m.text || "").slice(0, 4000); x.pick = {};
      S.sheetData = { ...S.sheetData, [sheetKey(x)]: { ...(S.sheetData[sheetKey(x)] || {}), loading: false, draft: d, error: null } };
      orderAsk(x, true);
    } catch (e) { x.threadErr = `Tråden kunde inte hämtas här: ${e.message || e}. Klistra in mejlet nedan; tråden kopplas ändå.`; }
    render();
  }
  /** Det Claude får: dagens datum, kunderna, leveranstyperna och metoderna (id=namn), och texten. */
  function orderPrompt(d, text) {
    const today = new Date().toISOString().slice(0, 10);
    return ["Du läser en beställning (ett mejl, ett möte eller en anteckning) och föreslår hur den läggs in. Du skriver ingenting själv.",
      "Välj bara id ur listorna. Passar inget: null, och säg varför i uncertain. Ett datum som inte står i texten är null.",
      `Idag: ${today}.`,
      `Kunder: ${(d.customers || []).map((c) => `${c.id}=${c.label}`).join("; ")}`,
      `Leveranstyper (kunder med avtal): ${(d.types || []).slice(0, 80).map((t) => `${t.id}=${t.label}${t.customers?.length ? ` (${t.customers.join(",")})` : ""}`).join("; ")}`,
      `Metoder (leveranstyp): ${(d.methods || []).slice(0, 120).map((m) => `${m.id}=${m.label} (${m.delivers})`).join("; ") || "inga"}`,
      `Texten: «${text.slice(0, 3000)}»`,
      'Svara med ENBART JSON: {"customer":"<id|null>","what":"<vad som beställts, kort>","deliverable_type":"<id|null>","method":"<id|null>","due":"<ÅÅÅÅ-MM-DD|null>","ordered_by":"customer|us","uncertain":["<det du inte kunde avgöra>"]}'].join("\n");
  }
  /** Svaret prövas mot listorna: ett id som inte finns blir osäkert, aldrig ett val. */
  function orderVet(r, d) {
    const has = (xs, id) => (xs || []).some((y) => y.id === id);
    const out = { what: String(r?.what || "").slice(0, 200), uncertain: Array.isArray(r?.uncertain) ? r.uncertain.map(String).filter(Boolean).slice(0, 5) : [] };
    if (has(d.customers, r?.customer)) out.customer = r.customer; else if (r?.customer) out.uncertain.push("kunden finns inte i listan");
    if (has(d.types, r?.deliverable_type)) out.deliverable_type = r.deliverable_type; else if (r?.deliverable_type) out.uncertain.push("leveranstypen finns inte i listan");
    const m = (d.methods || []).find((y) => y.id === r?.method);
    if (m && (!out.deliverable_type || m.delivers === out.deliverable_type)) out.method = m.id;
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(r?.due || ""))) out.due = r.due;
    if (r?.ordered_by === "us" || r?.ordered_by === "customer") out.ordered_by = r.ordered_by;
    return out;
  }
  /**
   * Claude föreslår (förmågan sample, snabbaste nivån): streckat, med texten
   * som strömmar in medan det tänker. Esc avbryter; då gäller det som lästes
   * ur texten. Samma text frågas inte två gånger.
   */
  async function orderAsk(x, again = false) {
    const d = S.sheetData[sheetKey(x)]?.draft, text = orderText(x);
    if (!sample || !d || text.length < 12 || (!again && x.claude?.asked === text)) return;
    x.claude?.ctl?.abort();
    const ctl = new AbortController(), c = { busy: true, ctl, stream: "", asked: text };
    x.claude = c; render();
    try {
      const r = await sample.json(orderPrompt(d, text), { modelTier: "quick", signal: ctl.signal,
        onText: ({ text: t }) => { if (x.claude === c) { c.stream = t || ""; renderKeep(); } } });
      if (x.claude !== c) return;
      x.claude = { asked: text, result: orderVet(r, d) };
    } catch (e) {
      if (x.claude !== c) return;
      if (e?.code === "not_granted") sample = null;
      x.claude = { asked: text, note: e?.code === "cancelled" ? "Avbrutet: förslaget nedan är läst ur texten." : e?.code === "not_granted" ? "" : `Claude svarade inte (${e?.message || e}); förslaget är läst ur texten.` };
    }
    render();
  }
  /** Hämta mötet ur Rotor Notes (read_call): analysens åtgärder och beslut blir förslag, ett per slutsats. */
  async function orderMeeting(x) {
    const q = (x.meetingQ || "").trim();
    x.meetingErr = null; x.meeting = null; x.item = null;
    if (!q) { x.meetingErr = "Skriv kunden, ett ord i rubriken eller dagen."; render(); return; }
    render();
    const args = /^\d{4}-\d{2}-\d{2}$/.test(q) ? { date: q } : /^[0-9a-f-]{36}$/i.test(q) ? { meeting_id: q } : { customer: q };
    try {
      const d = await call("read", { op: "read_call", call: "notes.call.read_meeting_analysis", args });
      const r = d?.result || d?.output || d, m = r?.meeting || {};
      const items = [];
      for (const a of r?.analyses || []) { const an = a.analysis || {};
        // Analysens nycklar varierar per profil: åtgärder och beslut, på engelska eller svenska.
        for (const [key, list] of Object.entries(an)) { const kind = /decision|beslut/i.test(key) ? "Beslut" : /action|åtgärd|next|todo|uppgift/i.test(key) ? "Åtgärd" : null;
          if (kind) for (const it of Array.isArray(list) ? list : []) { const text = typeof it === "string" ? it : it?.text || it?.title || it?.description || "";
            if (text && !items.some((y) => y.text === text)) items.push({ kind, text: String(text).slice(0, 400) }); } } }
      x.meeting = { title: m.title || "Mötet", at: m.started_at || "", customer: m.customer || "", items: items.slice(0, 20) };
    } catch (e) { x.meetingErr = `Mötet kunde inte hämtas: ${e.message || e}`; }
    render();
  }
  /** Förslaget läses om när texten ändrats, med en kort fördröjning. */

  async function orderPreview(x) {

    const args = { op: "intake_order", customer: p.customer, deliverable_type: p.deliverable_type, ordered_by: p.ordered_by,
      ...(p.method ? { method: p.method } : {}), ...(p.due ? { due: p.due } : {}), ...(text ? { note: text.slice(0, 2000) } : {}), ...(x.thread ? { thread: x.thread } : {}) };

  /* ── Metodbyggaren (README «Metod/metodbyggaren», BESLUT 4 och 9; prototypens steg 28) ──

  const MB_WHO = [["human", "○", "människa"], ["claude", "✦", "Claude"], ["code", "</>", "kod"], ["customer", "◷", "kunden"]];

  const mbNew = (id) => String(id || "").startsWith("new:");

  const mbComparable = (r) => JSON.stringify([r.id, r.use, r.label.trim(), r.who, r.responsible, Number(r.lead_days), r.hours, r.approver, r.checklist, r.prompt, r.needed_by, r.after, r.outcomes, r.branch]);
  /** Utkastet ur arkets data, en gång per läsning; ‹ och omritning behåller det. */
  function mbInit(x, d) {

      const s = x.seed || {};

        order: x.draft.steps.map((r) => r.key).join() };

    const rows = new Set(x.draft.steps.filter((r) => x.base.rows[r.key] !== mbComparable(r)).map((r) => r.key));

  function mbStepsHtml(x, d, ch) {

    const followers = mbNew(x.id) ? "" : `<h3 class="sh">Leveranser som följer metoden · ${d.followers.length}</h3>`
      + (d.followers.length ? `<p class="mmeta" style="margin:0 0 8px">En ny version tas in per leverans: Ta in eller Låt vara. Påbörjade och klara steg ändras aldrig, och egna ändringar och kundens sätt står kvar.</p>`
        + d.followers.map((f) => `<div class="crow"><span>${esc(f.label)}<span class="mmeta"> · ${f.started ? `${f.started} steg påbörjade eller klara` : "inget påbörjat"}</span></span>`
          + (f.update && !(S.leave || {})[f.task] ? `<span class="mbupd"><span class="mmeta">${esc(f.update.changes.slice(0, 2).join("; "))}</span><button class="${f.update.preselected === "take" ? "go" : "quiet"}" data-act="upd-take" data-task="${esc(f.task)}">Ta in</button><button class="${f.update.preselected === "leave" ? "go" : "quiet"}" data-act="upd-leave" data-task="${esc(f.task)}">Låt vara</button></span>`
            : `<span class="mmeta">${(S.leave || {})[f.task] ? "låter vara" : "följer gällande version"}</span>`) + `</div>`).join("")
        : `<p class="mmeta">Ingen leverans i planen använder metoden just nu.</p>`);
    return warn + `<div class="mbrows">${hdr}${body}</div>${add}` + mbBarHtml(x, d, ch, hits) + followers;
  }

  /** Lägg till steg: sök i biblioteket först (#308), annars ett nytt steg. */
  function mbAddHtml(x) {
    const a = x.add, q = a.q.trim();
    const res = (a.res || []).map((r, i) => `<button class="mvi" data-act="mb-pick" data-i="${i}"><span>${esc(r.label)}</span><span class="mmeta">${esc(r.meta)}</span></button>`).join("");
    return `<div class="mbaddbox"><input id="mb-q" placeholder="Vad ska göras? Sök bland stegen och delarna som finns" value="${esc(a.q)}" autocomplete="off" aria-label="Sök steg">`
      + (a.busy ? `<div class="mmeta">Söker …</div>` : "") + (a.error ? `<div class="mmeta">${esc(a.error)}</div>` : "") + res
      + (q ? `<button class="mvi" data-act="mb-pick" data-i="new"><span>Nytt steg «${esc(q)}»</span><span class="mmeta">byggaren söker delarna; saknas en atom blir det ett atomförslag, aldrig en molekyl utan kod</span></button>` : "")
      + `<div class="mmeta" style="margin-top:6px;display:flex;gap:12px"><span style="flex:1">Återanvänd det som finns först; samma steg i flera metoder är meningen.</span><button class="link" data-act="mb-add-close">Stäng</button></div></div>`;
  }
  let mbTimer = null;
  function mbSearch(x) {
    const q = x.add?.q.trim();
    clearTimeout(mbTimer);
    if (!q) { x.add.res = []; renderKeep(); return; }
    mbTimer = setTimeout(async () => {
      if (!x.add || x.add.q.trim() !== q) return;
      x.add.busy = true; renderKeep();
      try {
        const [m, mol] = await Promise.all([call("read", { op: "view_file", sheet: "library", tab: "methods", q, all: true }), call("read", { op: "view_file", sheet: "library", tab: "molecules", q, all: true })]);
        const seen = new Set(), out = [];
        for (const r of m?.rows || []) for (const st of r.steps || []) if (!seen.has(st.id) && fold(st.label).includes(fold(q).split(/\s+/)[0] || "")) { seen.add(st.id); out.push({ use: st.id, label: st.label, meta: `steg i ${r.label}` }); }
        for (const r of m?.rows || []) for (const st of r.steps || []) if (!seen.has(st.id) && out.length < 6) { seen.add(st.id); out.push({ use: st.id, label: st.label, meta: `steg i ${r.label}` }); }
        for (const r of (mol?.rows || []).slice(0, 4)) out.push({ use: r.id, label: r.label, meta: `del: ${r.summary || r.name}` });
        if (x.add) x.add = { ...x.add, busy: false, error: null, res: out.slice(0, 8) };
      } catch (e) { if (x.add) x.add = { ...x.add, busy: false, res: [], error: e.code === "FORBIDDEN" ? "Biblioteket syns bara med rätten «Ändra metoder». Lägg till ett nytt steg; byggaren söker ändå befintliga delar." : `Kunde inte söka: ${e.message || e}` }; }
      renderKeep();
    }, 250);
  }

  /** Raden i underkant: ändringarna, ◐ Förhandsvisa, och förhandsvisningen med Spara. */
  function mbBarHtml(x, d, ch, hits) {
    const pv = x.pv, isNew = mbNew(x.id);
    const who = d.holders?.map((h) => h.label).join(" eller ") || "den ansvarige";
    if (pv) {
      if (pv.loading) return `<div class="mbpv"><div class="mmeta">Förhandsvisar: servern och grinden prövar utkastet …</div></div>`;
      const verb = !d.decides ? `Föreslå för ${who}` : isNew ? "Spara metoden" : `Spara som version ${d.method.version + 1}`;
      return `<div class="mbpv" role="region" aria-label="Förhandsvisning av metoden"><div class="mbpvh"><span class="lvl">◐</span> ${isNew ? "Den nya metoden" : `Skillnaden mot version ${d.method.version}`}</div>`
        + `<ul>${(pv.diff || []).map((l) => `<li>${esc(l)}</li>`).join("") || "<li>Inget ändrat.</li>"}</ul>`
        + (pv.customer_specific?.length ? `<div class="mbwarn">Metoden gäller alla kunder: ${esc(pv.customer_specific.slice(0, 4).map((h) => `«${h.text}» (${h.why})`).join(", "))}. Det hör hemma i kundens sätt.</div>` : "")
        + (pv.results || []).map((r) => `<div class="mbres${r.ok ? "" : " bad"}"><b>${esc(r.what)}</b>: ${esc(r.summary)}${r.lines.length ? `<div class="mblines">${r.lines.map((l) => `<div>${esc(l)}</div>`).join("")}</div>` : ""}</div>`).join("")
        + (pv.error ? `<div class="mbwarn">${esc(pv.error)}</div>` : "")
        + (!isNew && d.followers.length && pv.ok ? `<div class="mmeta">${d.followers.length} ${d.followers.length === 1 ? "leverans följer" : "leveranser följer"} metoden; var och en väljer sedan Ta in eller Låt vara.</div>` : "")
        + (!d.decides ? `<div class="mmeta">Du har inte rätten «Ändra metoder», så det blir ett förslag till ${esc(who)}. Inget försvinner tyst.</div>` : "")
        + `<div class="mbpvb"><button class="quiet" data-act="mb-pv-close">Ändra vidare</button><button class="go" data-act="mb-save"${pv.ok && !pv.busy ? "" : " disabled"}>◐ ${esc(verb)}</button></div></div>`;
    }
    if (!ch.n) return "";
    return `<div class="mbbar"><span class="lvl">◐</span><span style="flex:1">${isNew ? "En ny metod, inte sparad" : `${ch.n} ${ch.n === 1 ? "ändring" : "ändringar"} i metoden, inte sparade`}</span>`
      + `<button class="quiet" data-act="mb-reset">${isNew ? "Töm" : "Ångra allt"}</button><button class="go" data-act="mb-preview"${hits.length || (isNew && !x.draft.label.trim()) ? " disabled" : ""}>◐ Förhandsvisa</button></div>`;
  }

  /** Läsningen av svaret: summeringen, och raderna där grindens råd och varningar står. */
  const mbLines = (r) => String(r?._text || "").split("\n").slice(1).map((l) => l.trim())
    .filter((l) => l && !/^(▶|Fyll i|Skicka inga|\{)/.test(l) && !/^\d+\. /.test(l)).slice(0, 14);
  async function mbPreview(x) {
    if (offline()) { say("Förhandsvisningen kräver dirigenten. Utkastet står kvar här.", null, true); render(); return; }
    x.pv = { loading: true }; render();
    try {
      const d = await call("read", { op: "view_file", sheet: "method", ...(mbNew(x.id) ? {} : { method: x.id }), draft: JSON.stringify(mbOut(x)) });
      const save = d?.save || { calls: [], diff: [], customer_specific: [] };
      if (save.customer_specific.length) { x.pv = { ...save, ok: false, results: [] }; render(); return; }
      const results = [];
      for (const c of save.calls) {
        try { const r = await call(c.tool, c.args);
          results.push({ what: c.what, ok: r?.ok !== false, summary: summaryText(r), lines: mbLines(r), next: hlNext(r, { tool: c.tool, args: { ...c.args, confirmed: true } }, "Spara metoden") }); }
        catch (e) { results.push({ what: c.what, ok: false, summary: e.message || String(e), lines: [], next: null }); }
      }
      x.pv = { ...save, results, ok: results.length > 0 && results.every((r) => r.ok) };
    } catch (e) { x.pv = { diff: [], results: [], ok: false, error: `Kunde inte förhandsvisa: ${e.message || e}. Inget sparades.` }; }
    render();
  }
  async function mbSave(x) {
    const pv = x.pv, d = S.sheetData[sheetKey(x)]?.m; if (!pv?.ok || !d) return;
    x.pv = { ...pv, busy: true }; render();
    let made = null;
    try {
      for (const r of pv.results) { const w = await call(r.next.tool, r.next.args); const m = (w?.written || []).find((n) => /\.method\./.test(n.name || "")); if (m) made = m; }
    } catch (e) { x.pv = { ...pv, busy: false }; say(`Inget mer sparades: ${e.message || e}. Det som hann sparas står kvar.`, null, true); render(); return; }
    const label = x.draft.label.trim() || d.method?.label || "Metoden", who = d.holders?.map((h) => h.label).join(" eller ") || "den ansvarige";
    say(!d.decides ? `◐ Förslaget ligger hos ${who}, som får ändra metoder.` : mbNew(x.id) ? `Metoden «${label}» är sparad.` : `«${label}» är sparad som version ${d.method.version + 1}. Leveranserna som följer den väljer Ta in eller Låt vara.`);
    if (x.seed?.task) hlInvalidate(x.seed.task);
    x.draft = null; x.base = null; x.pv = null; x.add = null; x.open = null;
    if (mbNew(x.id) && made?.id) { x.id = made.id; x.label = `Metoden ${label}`; x.seed = null; }
    fetchSheet(x, true); refreshSoon(); render();
  }

  /** Kundernas sätt: en rad per kund; öppnad visar den bara skillnaderna, som kan ändras här. */
  function mbVariantsHtml(x, d) {
    const v = d.variant;
    if (!d.variants.length) return `<p class="mmeta">Ingen kund har ett eget sätt för metoden. Ett kundsätt blir till när en ändring i ett steg sparas i «kundens sätt».</p>`;
    const list = d.variants.map((w) => `<button class="mbvar${v?.id === w.id ? " on" : ""}" data-act="mb-var" data-id="${esc(w.id)}"><b>${esc(w.customer.label)}s sätt</b> <span class="mmeta">${w.differences} ${w.differences === 1 ? "skillnad" : "skillnader"}${w.base_version < d.method.version ? ` · bygger på version ${w.base_version}` : ""}</span>`
      + (w.list.length ? `<div class="mmeta">${esc(w.list.slice(0, 4).join(" · "))}${w.list.length > 4 ? " …" : ""}</div>` : "") + `</button>`).join("");
    if (!x.variant) return `<div class="mbvars">${list}</div>`;
    if (!v) return `<div class="mbvars">${list}</div><div class="mmeta">Hämtar kundens sätt …</div>`;
    const ed = x.vedit || {}, people = (cur) => mbPeopleOpts(d, cur, "som i metoden");
    const rows = v.steps.map((s) => {
      const e = ed[s.step] || {}, diff = s.responsible || s.performer || s.approver || Object.keys(s.values).length || s.prompt_addition || s.removed;
      const dirty = e.responsible !== undefined || e.prompt_addition !== undefined;
      if (!diff && !x.vall && !dirty) return "";
      return `<div class="mbvrow${diff ? " ch" : ""}"><div class="mbvh"><b>${esc(s.label)}</b>${s.removed ? ` <span class="mmeta">hoppas över för kunden</span>` : ""}</div>`
        + `<label>Ansvarig <select id="vp-r-${esc(s.step)}">${people(e.responsible ?? s.responsible?.id ?? "")}</select></label>`
        + (s.approver ? `<span class="mmeta">godkänns av ${esc(s.approver)}</span>` : "")
        + (Object.keys(s.values).length ? `<div class="mmeta">värden: ${esc(Object.entries(s.values).map(([k, val]) => `${k} = ${val}`).join(", "))}</div>` : "")
        + `<label class="full">Tillägg till prompten <span class="mmeta">bara kundens tillägg; Claude får metodens prompt och det här under «Tillägg för ${esc(v.customer.label)}:»</span><textarea id="vp-p-${esc(s.step)}" rows="3">${esc(e.prompt_addition ?? s.prompt_addition ?? "")}</textarea></label>`
        + (dirty ? `<div class="mbpvb"><button class="quiet" data-act="vp-undo" data-step="${esc(s.step)}">Ångra</button><button class="go" data-act="vp-save" data-step="${esc(s.step)}">◐ Spara i ${esc(v.customer.label)}s sätt</button></div>` : "") + `</div>`;
    }).join("");
    return `<div class="mbvars">${list}</div><h3 class="sh">${esc(v.customer.label)}s sätt · bara skillnaderna</h3>`
      + (v.added.length ? `<div class="mmeta">Tillagda steg: ${esc(v.added.map((a) => `«${a.label}»${a.after ? ` efter «${a.after}»` : " först"}`).join(", "))}</div>` : "")
      + (v.rules.length ? `<div class="mmeta">Kundens regler: ${esc(v.rules.join(" · "))}</div>` : "")
      + (rows || `<p class="mmeta">Inga skillnader per steg.</p>`)
      + `<button class="link" data-act="vp-all">${x.vall ? "Visa bara skillnaderna" : "Lägg till en skillnad i ett annat steg"}</button>`;
  }
  /** ◐ En skillnad i kundens sätt: method_variant_build { patch } för ett steg, resten orört (#288). */
  async function vpSave(x, step) {
    const d = S.sheetData[sheetKey(x)]?.m, v = d?.variant, e = (x.vedit || {})[step]; if (!v || !e) return;
    const s = v.steps.find((y) => y.step === step), set = {};
    if (e.responsible !== undefined) set.responsible = e.responsible || null;
    if (e.prompt_addition !== undefined) set.prompt_addition = e.prompt_addition.trim() || null;
    const c = { tool: "write", args: { op: "method_variant_build", patch: { variant: v.id, step, set } } };
    try { const pv = await call(c.tool, c.args);
      const next = hlNext(pv, { tool: c.tool, args: { ...c.args, confirmed: true } }, `Spara i ${v.customer.label}s sätt`);
      S.confirm = { text: summaryText(pv) || `«${s?.label || step}» ändras i ${v.customer.label}s sätt.`, verb: d.decides ? `Spara i ${v.customer.label}s sätt` : `Föreslå för ${d.holders?.[0]?.label || "den ansvarige"}`,
        next, step: { id: null, call: next, layer: "variant", key: step } }; }
    catch (err) { say(`Kunde inte förhandsvisa: ${err.message || err}. Inget sparades.`, null, true); }
    render();
  }

  /** Fälten i metodbyggaren. */
  function mbInput(el) {
    const x = top1(); if (!x || x.kind !== "method" || !x.draft) return;
    const id = el.id, v = el.value, rows = x.draft.steps;
    let m;
    if (id === "mb-label") x.draft.label = v;
    else if (id === "mb-completion") x.draft.completion = v;
    else if (id === "mb-delivers") { x.draft.delivers = v; render(); return; }
    else if (id === "mb-q") { x.add = { ...(x.add || {}), q: v }; mbSearch(x); return; }
    else if ((m = /^mb-([a-z]+)-(\d+)(?:-(\d+))?$/.exec(id))) {
      const r = rows[Number(m[2])]; if (!r) return;
      const f = m[1], j = Number(m[3]);
      if (f === "l") { const old = r.label.trim();
        for (const o of rows) { if (o.needed_by === old && old) o.needed_by = v.trim(); o.after = o.after.map((a) => a === old && old ? v.trim() : a);
          for (const oc of o.outcomes) if (oc.leads_to === old && old) oc.leads_to = v.trim(); if (o.branch?.decided_by === old && old) o.branch = { ...o.branch, decided_by: v.trim() }; }
        r.label = v; }
      else if (f === "r") r.responsible = v;
      else if (f === "d") r.lead_days = v.replace(/[^\d]/g, "");
      else if (f === "h") { const n = Number(String(v).replace(",", ".")); r.hours = v.trim() === "" ? null : Number.isFinite(n) ? n : r.hours; }
      else if (f === "a") r.approver = v;
      else if (f === "c") r.checklist = v.split("\n");
      else if (f === "p") r.prompt = v;
      else if (f === "n") r.needed_by = v;
      else if (f === "b") { if (!v) r.branch = null; else { const k = v.lastIndexOf("|"); r.branch = { decided_by: v.slice(0, k), outcome: v.slice(k + 1) }; } }
      else if (f === "o") { const o = r.outcomes[j]; if (o) { o.label = v; if (!o.fixed) o.id = slugId(v); } }
      else if (f === "oe") { const o = r.outcomes[j]; if (o) o.ending = v; }
      else if (f === "ot") { const o = r.outcomes[j]; if (o) o.leads_to = v; }
    } else if ((m = /^vp-([rp])-(.+)$/.exec(id))) {
      x.vedit = { ...(x.vedit || {}), [m[2]]: { ...((x.vedit || {})[m[2]] || {}), [m[1] === "r" ? "responsible" : "prompt_addition"]: v } };
    }
    x.pv = null;
    renderKeep();
  }
  function mbAct(act, el) {
    const x = top1(); if (!x || x.kind !== "method") return;
    const i = Number(el.getAttribute("data-i")), rows = x.draft?.steps || [];
    const d = S.sheetData[sheetKey(x)]?.m;
    if (act === "mb-tab") { x.tab = el.getAttribute("data-tab"); x.scroll = 0; }
    else if (act === "mb-var") { x.variant = el.getAttribute("data-id"); x.vedit = {}; x.vall = false; fetchSheet(x, true); return; }
    else if (act === "vp-all") x.vall = !x.vall;
    else if (act === "vp-undo") { const { [el.getAttribute("data-step")]: _y, ...rest } = x.vedit || {}; x.vedit = rest; }
    else if (act === "vp-save") { vpSave(x, el.getAttribute("data-step")); return; }
    else if (!x.draft) return;
    else if (act === "mb-who") { const r = rows[i]; if (r) { r.who = el.getAttribute("data-who"); if (r.who === "claude" && r.prompt === null) r.prompt = ""; } }
    else if (act === "mb-open") { const r = rows[i]; x.open = r && x.open !== r.key ? r.key : null; }
    else if (act === "mb-del") { const r = rows[i]; if (r) { const l = r.label.trim(); x.draft.steps = rows.filter((_, j) => j !== i);
      for (const o of x.draft.steps) { if (o.needed_by === l) o.needed_by = ""; o.after = o.after.filter((a) => a !== l); if (o.branch?.decided_by === l) o.branch = null; for (const oc of o.outcomes) if (oc.leads_to === l) oc.leads_to = ""; } } }
    else if (act === "mb-move") { const j = i + Number(el.getAttribute("data-d")); if (rows[i] && rows[j]) { [rows[i], rows[j]] = [rows[j], rows[i]]; } }
    else if (act === "mb-after") { const r = rows[i], l = el.getAttribute("data-label"); if (r) r.after = r.after.includes(l) ? r.after.filter((a) => a !== l) : [...r.after, l]; }
    else if (act === "mb-oadd") { const r = rows[i]; if (r && r.outcomes.length < 4) { r.outcomes.push({ id: "", label: "", ending: "continue", leads_to: "" }); if (r.outcomes.length < 2) r.outcomes.push({ id: "", label: "", ending: "continue", leads_to: "" }); } }
    else if (act === "mb-odel") { const r = rows[i]; if (r) r.outcomes = r.outcomes.filter((_, j) => j !== Number(el.getAttribute("data-j"))); }
    else if (act === "mb-add") { x.add = { q: "", res: [] }; render(); root.querySelector?.("#mb-q")?.focus?.(); return; }
    else if (act === "mb-add-close") x.add = null;
    else if (act === "mb-pick") { const k = el.getAttribute("data-i"), q = x.add?.q.trim() || "";
      const p = k === "new" ? { label: q } : x.add?.res?.[Number(k)];
      if (p) { x.draft.steps = [...rows.filter((r) => r.label.trim() || r.id), mbRowOf({ label: p.label, use: p.use || null, who: "human", responsible: d?.people?.find((y) => y.id === S.data?.party?.id)?.id || "" })]; x.add = null; } }
    else if (act === "mb-reset") { x.draft = null; x.base = null; x.open = null; x.add = null; }
    else if (act === "mb-preview") { mbPreview(x); return; }
    else if (act === "mb-pv-close") x.pv = null;
    else if (act === "mb-save") { mbSave(x); return; }
    if (/^mb-(who|del|move|after|oadd|odel|pick|reset)$/.test(act)) x.pv = null;
    render();
  }
  /** ⋮⋮: dra en rad till en ny plats. */
  function mbDragStart(e) {
    const r = e.target.closest?.("[data-mbdrag]"); if (!r) return;
    S.mbDrag = Number(r.getAttribute("data-mbdrag"));
    try { e.dataTransfer?.setData("text/plain", String(S.mbDrag)); if (e.dataTransfer) e.dataTransfer.effectAllowed = "move"; } catch { /* ingen överföring */ }
  }
  function mbDragOver(e) { if (S.mbDrag === undefined || S.mbDrag === null) return; if (e.target.closest?.("[data-mbdrag]")) e.preventDefault?.(); }
  function mbDrop(e) {
    const from = S.mbDrag; S.mbDrag = null;
    const r = e.target.closest?.("[data-mbdrag]"), x = top1();
    if (from === null || from === undefined || !r || x?.kind !== "method" || !x.draft) return;
    e.preventDefault?.();
    const to = Number(r.getAttribute("data-mbdrag")); if (to === from) return;
    const rows = [...x.draft.steps], [m] = rows.splice(from, 1); rows.splice(to, 0, m); x.draft.steps = rows; x.pv = null; render();
  }
  /** ⌘K: metoderna ur biblioteket, hämtade en gång när paletten öppnas. */
  function mbIndex() {
    if (S.methodIndex || !can("change_methods") || offline()) return;
    S.methodIndex = [];
    call("read", { op: "view_file", sheet: "library", tab: "methods", all: true })
      .then((d) => { S.methodIndex = (d?.rows || []).map((r) => ({ id: r.id, label: r.label })); if (S.pal) render(); }).catch(() => { S.methodIndex = null; });
  }
  function mbPalette() {
    const out = [{ id: "method-new", l: "＋ Ny metod …", where: "metodbyggaren", hay: fold("ny metod metodbyggaren bygg metod skapa"), run: () => newMethod() }];
    for (const m of S.methodIndex || []) out.push({ id: "method", l: `Metoden ${m.label}`, where: "metodbyggaren", hay: fold(`metoden ${m.label} metodbyggaren öppna ändra`), run: () => openMethod(m.id, m.label) });
    return out;
  }

  /* Inställningar → Roller och behörigheter (BESLUT 9). */
  /** Vem som får ta över mina steg: det sparade, med det jag ändrat här ovanpå. */
  function takeDraft(x) {
    const st = S.sheetData[sheetKey(x)]?.settings, saved = st?.take_over || { allow: "all", people: [] };
    return { allow: x.take?.allow ?? saved.allow, people: x.take?.people ?? [...(saved.people || [])] };
  }

  /* ◎ Fokus: en sak i taget, sedan «Mellan dig och andra». */
  function focusSheetHtml() {
    const o = S.data, me = o?.party?.label;

    for (const r of o?.rows || []) for (const x of r.steps) { const st = stepOf(o, r, x); if (st.who === me && st.state !== "done" && st.state !== "customer" && st.state !== "handover") mine.push({ st, r }); }

  /* Chatten: vad den fick med sig, och «spara tillbaka» som version, anteckning eller beslut. */
  function chatContext() {
    const under = S.sheets.filter((s) => s.kind !== "chat").at(-1);
    if (!under) return { label: "Översikten", prompt: "Arbeta med dirigenten: läs läget med plan_state { agenda: true } och säg vad som kräver något först.", task: null, step: null };
    if (under.kind === "step") { const [task, step] = splitStep(under.id), sd = S.sheetData[sheetKey(under)];
      return { label: `steget «${under.label}»`, task, step, prompt: sd?.sheet?.prompt ? runPrompt(sd.sheet, sd.brief) : stepPrompt({ task, step, label: under.label, row: rowOfTask(task) }) }; }
    if (under.kind === "case") return { label: `ärendet «${under.label}»`, task: under.id, step: null,
      prompt: `Arbeta med dirigenten: supportärendet «${under.label}» (uppgift ${under.id}). Läs det med read { op: "view_file", sheet: "case", task: "${under.id}" } och hjälp mig utreda och svara. Skicka inget utan mitt ja.` };
    if (under.kind === "delivery") { const row = rowOf(under.id); return { label: `leveransen «${under.label}»`, task: row?.tasks?.[0] || null, step: null, prompt: chatPrompt(under.id) }; }
    return { label: under.label, task: null, step: null, prompt: `Arbeta med dirigenten: ${under.label}.` };

      + `<h3 class="sh">Det chatten får med sig</h3><div class="pnow">${esc(c.prompt)}</div><div class="doacts"><button class="primary" data-act="chat-copy">Kopiera och öppna chatten ↗</button></div>`
