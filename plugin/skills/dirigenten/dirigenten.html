  function sheetsHtml() {
    if (!S.sheets.length) return "";
    const n = S.sheets.length, x = top1();
    const left = (i) => 56 + 44 * i;
    const strips = S.sheets.slice(0, -1).map((s, i) => `<button class="strip" style="left:${left(i)}px" data-act="crumb" data-i="${i}" title="Tillbaka till ${esc(s.label)}" aria-label="Tillbaka till ${esc(s.label)}"><span class="stl">${esc(s.label)}</span></button>`).join("");
    const crumbs = [`<button data-act="crumb" data-i="-1">Översikt</button>`, ...S.sheets.slice(0, -1).map((s, i) => `<button data-act="crumb" data-i="${i}">${esc(s.label)}</button>`), `<b>${esc(x.label)}</b>`].join(`<span class="cs">/</span>`);
    const prev = n > 1 ? S.sheets[n - 2].label : "Översikt";
    const body = linkStateHtml(x, n > 1 ? S.sheets[n - 2].label : null) ?? { delivery: deliverySheet, part: partSheet, step: stepSheetHtml, result: resultSheetHtml, case: caseSheetHtml, library: librarySheetHtml, method: methodSheetHtml, how: howSheetHtml, settings: settingsSheetHtml,
      focus: focusSheetHtml, messages: messagesSheetHtml, thread: threadSheetHtml, inbox: inboxSheetHtml, chat: chatSheetHtml, person: personSheetHtml, order: orderSheetHtml }[x.kind]?.(x) ?? customerSheet(x);
    return `<div class="sheets"><div class="scrim" data-act="sheet-back"></div>${strips}`
      + `<section class="sheet" style="left:${left(n - 1)}px" data-i="${n - 1}" role="dialog" aria-label="${esc(x.label)}" data-sheet="${esc(sheetKey(x))}">`
      + `<header class="shead"><button class="back" data-act="sheet-back" title="Tillbaka · ⌫">‹ ${esc(prev)}</button><nav class="crumbs">${crumbs}</nav>`
      + `${linkable(x) && S.sheets.every((y, i) => i === n - 1 || linkable(y)) ? `<button class="hint" data-act="copy-link" title="Kopiera länk · ⇧⌘C">Kopiera länk</button>` : ""}<span class="hint">⌫ tillbaka · Esc stänger alla</span><button class="close" data-act="sheet-close" aria-label="Stäng alla ark" title="Stäng">✕</button></header>`
      + `<div class="sbody">${body}</div></section></div>`;
  }

  /**
   * «Be Claude om förslag»: med förmågan sample svarar Claude i vyn, i chattens ark
   * (Spara tillbaka), och läser själv med plan_state — bara läsande, ingenting
   * ändras. Utan sample: frågan kopieras till vanliga chatten som förut.
   */
  async function suggestInView(t) {
    if (!sample) return copyToChat(suggestPrompt(t), "frågan till Claude");
    openSheet("chat", `c${S.sheets.length}`, "Claude föreslår");
    const x = top1(); if (!x || x.kind !== "chat") return;
    const ctl = new AbortController();
    x.claude = { busy: true, ctl }; x.text = ""; render();
    const read = { name: "plan_state", description: "Läser planen ur dirigenten med användarens behörighet. Argumenten som till dirigentens plan_state. Kan inte ändra något.",
      inputSchema: { type: "object", properties: {} },
      execute: async (i) => {
        try { const d = await call("plan_state", i && typeof i === "object" ? i : {}); const txt = JSON.stringify(d ?? null);
          return txt.length > 12000 ? `${txt.slice(0, 12000)}\n… (resten utelämnat — fråga smalare)` : txt; }
        catch (e) { return `FEL från plan_state: ${e?.message || e}. Ändra argumenten i stället för att göra om samma anrop.`; } } };
    try {
      const r = await sample([{ role: "user", content: `${suggestPrompt(t)}\nSvara på svenska, kort och konkret. Du läser med verktyget plan_state; du kan inte ändra något, så skriv förslagen så att användaren kan genomföra dem i vyn.` }],
        { modelTier: "default", signal: ctl.signal, tools: [read], onText: ({ text }) => { if (x.claude?.busy) { x.text = String(text || ""); renderKeep(); } } });
      x.text = String(r?.text || x.text || ""); x.claude = { done: true };
    } catch (e) {
      if (e?.code === "not_granted") sample = null;
      x.claude = { note: e?.code === "cancelled" ? "Avbrutet." : `Claude svarade inte (${e?.message || e}).` };
    }
    render();
  }
  /** «Arbeta i chatten»: en färdig prompt till vanliga Claude-chatten, som har samma verktyg mot dirigenten. */
  function copyToChat(text, what, toast = null) {
    const nav = typeof navigator !== "undefined" ? navigator : null;
    return (nav?.clipboard?.writeText(text) ?? Promise.reject(new Error("urklippet går inte att nå här")))
      .then(() => { say(`${toast ? `${toast.text} ` : ""}Kopierat: ${what}. Klistra in i vanliga Claude-chatten.`, toast?.undo || null); render(); },
        (e) => { say(`Kunde inte kopiera: ${e.message || e}. Prompten: ${text}`, null, true); render(); });
  }
  /**
   * «Starta projekt» (etapp 19): ett mejl utan utkast får först sitt utkast
   * (samma flytt som i Inkommet, ●), sedan kopieras prompten till chatten.
   */
  async function startProject(key) {
    const row = rowOf(key), st = row?.start;
    if (!st) return;
    let project = st.project;
    if (!project && st.thread) {
      if (offline()) { say("Att göra ett projektutkast kräver att dirigenten svarar.", null, true); render(); return; }
      try {
        const r = await call("write", { op: "classify_accept", thread: st.thread, classification: { route: { to: "order" } } });
        project = r?.project;
      } catch (e) { say(`Kunde inte göra projektutkastet: ${e.message || e}. Inget ändrades.`, null, true); render(); return; }
    }
    if (!project) { say("Projektutkastet gick inte att hitta.", null, true); render(); return; }
    copyToChat(`Arbeta med dirigenten: starta projektet «${row.label.replace(/^Starta projekt: /, "")}» (${project}). Läs var det står med read { op: "project_brief", project: "${project}" }, fortsätt där det slutade och gå igenom det med mig innan något läggs in. Skriv inget utan mitt ja.`, "prompten för projektet");
  }
  function chatPrompt(key) {
    const row = rowOf(key);
    return /^d_/.test(key)
      ? `Arbeta med dirigenten: leveransen «${row?.label || key}» (${key}). Läs läget med plan_state { delivery: "${key}" } och säg vad som är nästa steg.`
      : `Arbeta med dirigenten: uppgiften «${row?.label || key}» (${key}). Läs läget med plan_state { task: "${key}" } och säg vad som är nästa steg.`;
  }

  /* ── Högerklick, tangenter och ⌘K (FAS1 1.4, BESLUT 12) ──
     En meny för steg, rad och Igång. Varje handling i den nås också med en tangent
     på det man pekar på, eller med ⌘K, som söker bland samma handlingar. */
  function isoPlus(iso, n) { return new Date(Date.parse(`${iso}T12:00:00Z`) + n * 864e5).toISOString().slice(0, 10); }
  const weekday = (iso) => new Date(`${iso}T12:00:00Z`).getUTCDay();
  /** Nästa (eller förra) arbetsdag. */
  const workdayFrom = (iso, dir) => { let d = isoPlus(iso, dir); while (weekday(d) === 0 || weekday(d) === 6) d = isoPlus(d, dir); return d; };

  /** Allt vyn vet om ett steg: ur översiktens rad, annars ur ett öppet leveransark. */
  function findStep(task, step) {
    const o = S.data;
    if (!o) return null;
    const row = rowOfTask(task);
    if (row) { const i = row.tasks.indexOf(task), x = row.steps.find((y) => y[0] === i && y[1] === step);
      if (x) { const st = stepOf(o, row, x); return { task, step, label: st.label, state: st.state, who: st.who,
        start: isoPlus(o.today, st.s), end: isoPlus(o.today, st.e), row }; } }
    for (const k of Object.keys(S.sheetData)) for (const t of S.sheetData[k].plans || []) {
      if (t.task !== task) continue;
      const s = t.steps.find((y) => y.step === step);
      if (s) return { task, step, label: s.label, state: s.done ? "done" : s.side === "customer" ? "customer" : "todo", who: s.who,
        start: s.window?.[0] || null, end: s.window?.[1] || null, row };
    }
    const tt = S.time?.tl && taskOf(S.time.tl, task), ts = tt?.steps.find((x) => x.id === step);
    if (ts) return { task, step, label: ts.n, state: ts.dn ? "done" : ts.x ? "customer" : "todo", who: nameOf(ts.w), start: ts.s, end: ts.e, row };
    const it = (o.running || []).find((x) => x.task === task && x.step === step);
    return it ? { task, step, label: it.label, state: "todo", who: o.party?.label, start: null, end: null, row } : null;
  }
  /** Radens nästa steg: ditt först, annars det första som inte är klart. */
  function nextOfRow(row) {
    const o = S.data, me = o?.party?.label;
    const open = row.steps.map((x) => stepOf(o, row, x)).filter((s) => s.state !== "done" && s.state !== "customer");
    const st = open.find((s) => s.who === me) || open[0];
    return st ? findStep(st.task, st.id) : null;
  }
  /** Det man pekar på, ur `data-ctx`: "step|<uppgift>|<steg>" eller "row|<nyckel>". */
  function targetOf(ctx) {
    if (!ctx) return null;
    const [kind, a, b] = ctx.split("|");
    if (kind === "step") { const s = findStep(a, b); return s ? { kind, ctx, ...s } : null; }
    if (kind === "row") { const row = rowOf(a); if (!row || row.kind === "inbox") return null;
      return { kind, ctx, row, label: row.label, step: nextOfRow(row) }; }
    if (kind === "case") { const c = findCase(a); if (!c) return null;
      return { kind, ctx, task: a, row: c.row, label: c.title, step: c.step ? caseStep(a, c) : null }; }
    return null;
  }
  /**
   * Ett ärende (en uppgift i en ström eller ett projekt): rubriken och det aktuella
   * steget, ur översiktens rad, ett öppet leveransark eller ett öppet ärendeark.
   */
  function findCase(task) {
    const o = S.data;
    // Bara ett supportärende (en uppgift i en löpande ström) är ett ärende; en uppgift i en vanlig leverans öppnas som sin del.
    for (const r of o?.rows || []) { if (r.kind !== "stream") continue; const c = (r.cases || []).find((y) => y.task === task);
      if (c) return { title: c.title, step: c.step || null, stepLabel: c.now >= 0 ? o.names[c.now] : null, who: c.who >= 0 ? o.names[c.who] : null, row: r }; }
    for (const k of Object.keys(S.sheetData)) {
      const t = S.sheetData[k].stream ? (S.sheetData[k].delivery?.tasks || []).find((y) => y.id === task) : null;
      if (t) return { title: caseTitle(t.label), step: t.current?.step || null, stepLabel: t.current?.label || null, who: t.current?.responsible || null, row: rowOfTask(task) };
      const sd = S.sheetData[k];
      if (k === `case:${task}` && sd.case) { const st = (sd.plan?.steps || []).find((y) => !y.done);
        return { title: sd.case?.subject || S.sheets.find((y) => y.kind === "case" && y.id === task)?.label || task, step: st?.step || null, stepLabel: st?.label || null, who: st?.who || null, row: rowOfTask(task) }; }
    }
    return null;
  }
  const caseTitle = (l) => String(l || "").replace(/^Supportärende \(|\)$/g, "");
  /** Ärendets aktuella steg som ett steg för menyn; namnet i kvittot är ärendets rubrik. */
  function caseStep(task, c) {
    const s = findStep(task, c.step);
    const label = s?.label || c.stepLabel || c.step;
    return { ...(s || { task, step: c.step, state: "todo", who: c.who, start: null, end: null, row: c.row }), label, stepLabel: label, caseTitle: c.title };
  }
  const people = () => [...(S.data?.party ? [{ id: S.data.party.id, label: S.data.party.label }] : []), ...(S.data?.colleagues || [])];

  /**
   * Menyn för det man pekar på. `key` är tangenten som gör samma sak på det man
   * pekar på; `lvl` är skrivnivån (● direkt, ◐ förhandsvisa).
   */
  function menuItems(t) {
    if (!t) return [];
    const s = t.kind === "step" ? t : t.step;
    const rowKey = t.row?.key;
    const out = [];
    if (t.kind === "case") out.push({ id: "open", l: "Öppna ärendet", key: "↵", run: () => openCaseOver(t.row?.kind === "stream" ? rowKey : null, t.task, t.label) });
    if (t.kind === "step" && rowKey && !S.sheets.length) out.push({ id: "open-step", l: "Öppna steget", key: "↵", run: () => openStepOver(rowKey, t.task, t.step, t.label) });
    // Byte av metod är ett eget, uttryckligt val i ärendets meny, aldrig ett förslag.
    const sw = t.kind === "case" ? S.sheetData[`case:${t.task}`]?.line?.switch : null;
    if (sw) out.push({ id: "switch", l: sw.label, lvl: "◐", run: () => switchMethod(t.task, sw) });
    else if (rowKey) out.push({ id: "open", l: "Öppna leveransen", ...(t.kind === "step" && !S.sheets.length ? {} : { key: "↵" }), run: () => openSheet("delivery", rowKey, t.row.label) });
    out.push({ id: "peek", l: "Titta", key: "␣", run: () => { S.peek = t; render(); } });
    if (s && s.state !== "done" && s.state !== "customer") {
      const on = isRunning(s.task, s.step);
      out.push({ id: "igang", l: on ? "Ta bort från Igång" : "Lägg i Igång", key: "I", lvl: "●", run: () => setRunning(s.task, s.step, s.label, !on) });
      for (const p of people()) if (p.label !== s.who)
        out.push({ id: `handover:${p.id}`, l: `Lämna över till ${p.label}`, lvl: "◐", run: () => inTime(s, { to: p.id }) || previewTime([{ task: s.task, step: s.step, to: p.id }], `Föreslå ${p.label}`) });
      if (s.start && s.end) {
        out.push({ id: "later", l: "En dag senare", key: "→", lvl: "◐", run: () => inTime(s, { shift: 1 }) || previewTime([{ task: s.task, step: s.step, start: workdayFrom(s.start, 1), end: workdayFrom(s.end, 1) }], "Flytta 1 steg") });
        out.push({ id: "earlier", l: "En dag tidigare", key: "←", lvl: "◐", run: () => inTime(s, { shift: -1 }) || previewTime([{ task: s.task, step: s.step, start: workdayFrom(s.start, -1), end: workdayFrom(s.end, -1) }], "Flytta 1 steg") });
      }
      out.push({ id: "done", l: "Markera klart", key: "E", lvl: "●", run: () => markDone(s) });
    }
    // Ta över (v6): direkt, utan mottagarens ja; den som hade det får ett meddelande.
    const me = S.data?.party?.label;
    if (t.kind === "case") out.push({ id: "take", l: "Ta över ärendet", key: "T", lvl: "●", run: () => takeOver(t.task, null, t.label) });
    else if (s && s.state !== "done" && s.state !== "customer" && s.who && s.who !== me)
      out.push({ id: "take", l: "Ta över steget", key: "T", lvl: "●", run: () => takeOver(s.task, s.step, s.label) });
    if (t.kind === "row" && t.row.tasks?.length === 1 && t.row.kind !== "stream" && (t.row.people || []).some((p) => p !== S.data?.party?.id))
      out.push({ id: "take-task", l: "Ta över uppgiften", lvl: "●", run: () => takeOver(t.row.tasks[0], null, t.row.label) });
    out.push(...hlMenu(t));
    if (targetSheets(t).length) out.push({ id: "link", l: "Kopiera länk", key: "⇧⌘C", run: () => copyLink(targetSheets(t)) });
    out.push({ id: "chat", l: "Arbeta i chatten ↗", run: () => copyToChat(t.kind === "case" ? casePrompt(t.task, t.label) : s ? stepPrompt(s) : chatPrompt(rowKey), "prompten") });
    out.push({ id: "claude", l: sample ? "Be Claude om förslag" : "Be Claude om förslag ↗", run: () => suggestInView(t) });
    return out;
  }
  /** I Tid blir flytta och lämna över ett streckat utkast, som Genomför sedan skickar. */
  function inTime(s, how) {
    const T = S.time;
    if (S.body !== "time" || !T?.tl) return false;
    const t = taskOf(T.tl, s.task), st = t?.steps.find((x) => x.id === s.step);
    if (!st || st.dn || st.lk) return false;
    if (how.to) tzOp({ kind: "person", keys: [`${s.task}|${s.step}`], to: how.to });
    if (how.shift) tzOp({ kind: "move", keys: [`${s.task}|${s.step}`], delta: how.shift });
    S.menu = null; render();
    return true;
  }
  const casePrompt = (task, label) => `Arbeta med dirigenten: ärendet «${label}» (uppgift ${task}). Läs det med read { op: "view_file", sheet: "case", task: "${task}" } och hjälp mig utreda och svara. Skicka inget utan mitt ja.`;
  const stepPrompt = (s) => `Arbeta med dirigenten: steget «${s.label}» (${s.step}) i uppgiften ${s.task}${s.row ? ` («${s.row.label}»)` : ""}. Läs steget med read { op: "step_sheet", task: "${s.task}", step: "${s.step}" } och hjälp mig göra det.`;
  const suggestPrompt = (t) => `Arbeta med dirigenten: föreslå hur «${t.row?.label || t.label}» kan planeras om så att den håller och ingen blir överbelastad. Läs plan_state { timeline: { ${t.row && /^d_/.test(t.row.key) ? `delivery: "${t.row.key}"` : `party: "${S.data?.party?.id || ""}"`} } }. Visa förslagen som ändringar för execute_step { time } och genomför inget utan mitt ja.`;

  /** Markera klart (●): direkt, med Ångra som öppnar steget igen. */
  /**
   * Ta över (●): steget, eller hela uppgiften eller ärendet utan step. Servern
   * säger vad som togs och vad som blev en förfrågan; kvittot har Ångra.
   */
  async function takeOver(task, step, label) {
    S.menu = null; S.peek = null; render();
    if (offline()) { say("Ta över kan inte göras förrän dirigenten svarar. Inget ändrades.", null, true); render(); return; }
    try {
      const r = await call("execute_step", step ? { task, step, take_over: true } : { task, take_over: true });
      say(summaryText(r) || `Du tog över «${label}».`, r?.undo || null);
      for (const k of Object.keys(S.sheetData)) if (k === `case:${task}` || k.startsWith(`step:${task}`) || k.startsWith("delivery:")) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const tp = top1(); if (tp) fetchSheet(tp, true);
      refreshSoon();
    } catch (e) { say(`Kunde inte ta över «${label}»: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /*
   * Klart syns direkt (Daniel P 2026-10-06: «när man markerar ett steg som klart händer ingenting»).
   * Förut skrev vyn och väntade på att översikten lästes om; arken (leveransen, delen, steget) låg kvar
   * ur förhämtningen och minnet (#395) och lästes inte om, och kollen räknade egna ändringar som redan
   * synliga. Nu: ändringen läggs in lokalt på en gång (steget, stegremsan, raden i översikten och
   * leveransens delar), skickas, och arken läses om efteråt. Går det fel rullas allt tillbaka.
   */
  function patchStepDone(task, step, done) {
    const flip = (on) => on !== done;
    let changed = false;
    if (S.data?.rows) S.data = { ...S.data, running: done ? (S.data.running || []).filter((x) => !(x.task === task && x.step === step)) : S.data.running,
      rows: S.data.rows.map((r) => {
        const i = r.tasks.indexOf(task); if (i < 0) return r;
        let hit = false;
        const steps = r.steps.map((x) => { if (x[0] !== i || x[1] !== step || !flip(x[3] === "done")) return x; hit = true; const y = [...x]; y[3] = done ? "done" : "todo"; return y; });
        if (!hit) return r;
        changed = true;
        const state_text = String(r.state_text || "").replace(/(\d+) av (\d+) steg/, (m, a, b) => `${Math.max(0, Math.min(+b, +a + (done ? 1 : -1)))} av ${b} steg`);
        return { ...r, steps, state_text };
      }) };

    const before = { data: S.data, sheets: S.sheetData };
    patchStepDone(s.task, s.step, done);
    render();
    try {
      const undo = { fn: async () => {
        const back = { data: S.data, sheets: S.sheetData };
        patchStepDone(s.task, s.step, false); render();
        try { await call("execute_step", { task: s.task, step: s.step, mark: "undone", reason: "Ångrat i vyn direkt efter att det markerades klart." }); }
        catch (e) { S.data = back.data; S.sheetData = back.sheets; throw e; }
      } };
      const r = await call("execute_step", done ? { task: s.task, step: s.step, mark: "done" } : { task: s.task, step: s.step, mark: "undone", reason: "Ångrat i vyn direkt efter att det markerades klart." });
      // Underlaget är inte godkänt: inget skrevs, så det direkta tas tillbaka tills frågan besvarats.
      if (done && r?.written === false && r?.basis) {
        S.data = before.data; S.sheetData = before.sheets; render();
        askBasis(r.basis, async (args) => {
          const back = { data: S.data, sheets: S.sheetData };
          patchStepDone(s.task, s.step, true); render();
          try { await call("execute_step", args); } catch (e) { S.data = back.data; S.sheetData = back.sheets; throw e; }
          say(`«${s.label}» är klart.${args.user_approval ? " Underlaget är godkänt." : ""}`, undo);
          rereadAfterWrite(s.task);
        });
        return;
      }
      say(done ? `«${s.label}» är klart.` : `«${s.label}» är öppet igen.`, done ? undo : null);
      rereadAfterWrite(s.task);
    } catch (e) {
      S.data = before.data; S.sheetData = before.sheets;
      if (unreachable(e) && done) { S.error = e; queue({ kind: "done", task: s.task, step: s.step, label: s.label }); return; }
      say(`Kunde inte ${done ? "markera" : "öppna"} «${s.label}» ${done ? "klart" : "igen"}: ${e.message || e}. Inget ändrades.`, null, true);
    }
    render();
  }
  /**
   * Flytta och lämna över (◐): servern räknar planen med ändringen och säger vad den gör;
   * först knappen genomför. En överlämning väntar sedan på mottagarens ja.
   */
  async function previewTime(changes, verb, onDone = null) {
    S.menu = null; S.peek = null;
    // ◐ och ■ köas inte (BESLUT 11): de kräver förhandsvisning, och den kan bara servern räkna.
    if (offline()) { say("Flytta och lämna över kräver förhandsvisning och kan inte göras förrän dirigenten svarar. Ändringen står kvar här.", null, true); render(); return; }
    S.confirm = { loading: true, verb, text: "Räknar om planen …" };
    render();
    try {
      const r = await call("execute_step", { time: { changes } });
      // Spräcker ändringen en leverans är Genomför ett nytt löfte (accept_late), och knappen säger det.
      const late = (r?.tasks || []).some((t) => t.late_by > 0);
      S.confirm = { verb, text: summaryText(r), late, onDone,
        next: r?.next || { tool: "execute_step", args: { time: { changes, confirmed: true, ...(late ? { accept_late: true } : {}) } } } };
    } catch (e) { S.confirm = null; say(`Kunde inte räkna på ändringen: ${e.message || e}`, null, true); }
    render();
  }
  /** Serverns sammanfattning, utan det tekniska prefixet. */
  const summaryText = (r) => String(r?.summary || r?.text || "").replace(/^Förhandsvisning:\s*/, "").replace(/\s*Inget är (?:sparat|skrivet)\.\s*$/, "");
  async function confirmTime() {
    const c = S.confirm;
    if (!c?.next) return;
    S.confirm = { ...c, loading: true };
    render();
    try {
      const r = c.runAll ? await c.runAll() : await call(c.next.tool, c.next.args);
      S.confirm = null;
      say(`Genomfört. ${summaryText(r).replace(/^Genomfört \(nr [^)]*\)\.\s*/, "")}`, r?.receipt?.undo || null);
      c.onDone?.();
      refreshSoon();
    } catch (e) { S.confirm = null; say(`Inget genomfördes: ${e.message || e}`, null, true); }
    render();
  }
  const confirmHtml = () => !S.confirm ? "" : `<div class="confirm${S.confirm.house ? " house" : ""}" role="dialog" aria-label="Förhandsvisning"><span class="ci">${S.confirm.house ? "■" : "◐"}</span><span class="ctext">${esc(S.confirm.text)}</span>`
    + `<button class="quiet" data-act="confirm-cancel">Avbryt</button>`
    + (S.confirm.alt ? `<button class="quiet" data-act="confirm-alt">${esc(S.confirm.alt)}</button>` : "")
    + `<button class="go" data-act="confirm-go"${S.confirm.loading || !(S.confirm.next || S.confirm.basis) ? " disabled" : ""}>${S.confirm.dot ? "" : `${S.confirm.house ? "■" : "◐"} `}${esc(S.confirm.verb)}${S.confirm.dot ? " ●" : ""}${S.confirm.late ? ", nytt löfte" : ""}</button></div>`;

  function menuHtml() {
    const m = S.menu;
    if (!m) return "";
    const items = menuItems(m.target);
    return `<div class="menu" role="menu" style="left:${Math.round(m.x)}px;top:${Math.round(m.y)}px">`
      + items.map((it, i) => `${(it.id.startsWith("handover:") && !items[i - 1]?.id.startsWith("handover:")) || it.id === "done" || it.id === "chat" ? `<div class="msep"></div>` : ""}`
        + `<button role="menuitem" class="mi${i === m.i ? " on" : ""}" data-act="menu-run" data-i="${i}"><span class="ml">${esc(it.l)}</span>`
        + `<span class="mk">${it.lvl ? `<span class="lvl${it.lvl === "●" ? " d" : ""}">${it.lvl}</span>` : ""}${it.key ? `<kbd>${esc(it.key)}</kbd>` : ""}</span></button>`).join("") + `</div>`;
  }
  function peekHtml() {
    const t = S.peek;
    if (!t) return "";
    const s = t.kind === "step" ? t : t.step;
    const lines = t.kind === "case" ? [s ? `Nu: ${s.stepLabel}${s.who ? ` · ${s.who}` : ""}` : "Inget steg kvar", t.row ? `i ${t.row.label}` : "", isRunning(t.task, s?.step) ? "i Igång" : ""]
      : t.kind === "row"
      ? [t.row.state_text, s ? `Nästa: ${s.label}${s.who ? ` · ${s.who}` : ""}` : ""]
      : [`${STATE[s.state] || s.state}${s.who ? ` · ${s.who}` : ""}`, s.start ? `får ligga mellan ${shortIso(s.start)} och ${shortIso(s.end)}` : "", s.row ? `i ${s.row.label}` : ""];
    return `<div class="peek" role="dialog" aria-label="Titta"><div class="pl">${t.kind === "row" ? "LEVERANS" : t.kind === "case" ? "ÄRENDE" : "STEG"}</div><div class="pt">${esc(t.label)}</div>`
      + lines.filter(Boolean).map((x) => `<div class="pm">${esc(x)}</div>`).join("") + `<div class="ph">␣ eller Esc stänger · ↵ öppnar</div></div>`;
  }

  /* ── Utan metod, och flytta till leverans (Daniel P 2026-10-05: «saker som saknar metoder blir lite
     hemlösa också. Vad gör man av dem? Och att man kanske vill flytta in saker i en leverans?») ──
     En uppgift utan metod och steg får tre vägar: ge den en metod (registrets förslag, återanvändning
     först, ◐), gör den med några steg (Claudes förslag streckat, ◐) eller bara gör det (ett steg, ●).
     Med egna steg och klar: spara stegen som metod (◐). Flytta till leverans: högerklick, ⌘K eller dra
     raden till leveransen; förhandsvisas (◐) med vad som händer med datum och plan. */
  const hlState = (task) => ((S.hl ||= {})[task] ||= { way: null, text: "", claude: null });
  /** Uppgiftens plan (plan_state { task, format: "plan" }): ur ett öppet ark, annars hämtad en gång. */
  function hlPlan(task) {
    for (const k of [`delivery:${task}`, `part:${task}`]) { const p = S.sheetData[k]?.plans?.[0]; if (p) return p; }
    const c = (S.hlPlans ||= {})[task];
    if (c) return c.plan || null;
    S.hlPlans[task] = { loading: true };
    call("plan_state", { task, format: "plan" }).then((d) => { S.hlPlans[task] = { plan: d?.tasks?.[0] || null }; render(); },
      () => { S.hlPlans[task] = { plan: null }; render(); });
    return null;
  }
  /** Uppgiften som översikten känner den: namn, kund och leveransen den ligger i. */
  function hlTask(task) {
    const row = rowOfTask(task), c = row?.cases?.find((y) => y.task === task);
    const inDelivery = row && (row.kind === "delivery" || row.kind === "stream");
    return { task, row, label: c?.title || (row && !inDelivery ? row.label : null) || hlPlan(task)?.label || task,
      customer: row?.customer || null, cur: inDelivery ? { key: row.key, label: row.label } : null,
      homeless: !!(c ? c.no_method : row?.no_method) };
  }
  const hlInvalidate = (task) => { if (S.hlPlans) delete S.hlPlans[task];
    for (const k of Object.keys(S.sheetData)) if (k === `delivery:${task}` || k === `part:${task}` || k === `case:${task}` || k.startsWith("delivery:d_")) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
    const t = top1(); if (t && S.sheetData[sheetKey(t)]?.stale) fetchSheet(t, true); refreshSoon(); };
  /** Förhandsvisningens nästa anrop, med jaet som knappen ger när servern väntar ett. */
  function hlNext(r, fallback, verb) {
    const nx = r?.next || r?.next_call || fallback, a = { ...(nx.args || {}) };
    if (/^</.test(String(a.user_approval || ""))) a.user_approval = `Ja (◐ ${verb} i vyn)`;
    return { tool: nx.tool, args: a };
  }

  /** Rutan för en uppgift utan metod: frågan, de tre vägarna och vägen som är vald. */
  function homelessHtml(task, label, plan) {
    const st = hlState(task), nm = plan?.no_method;
    const opt = (way, l, lvl) => `<button class="hlopt${st.way === way ? " on" : ""}" data-act="hl-way" data-task="${esc(task)}" data-way="${way}">${esc(l)} <span class="lvl${lvl === "●" ? " d" : ""}">${lvl}</span></button>`;
    let body = "";
    if (st.way === "method") {
      const sug = nm?.suggestions || [];
      body = !plan ? `<div class="mmeta">Söker i registret efter metoder som liknar …</div>`
        : sug.length ? sug.map((s) => `<div class="sug"><div class="sl"><b>${esc(s.label)}</b><div class="mmeta">${esc(s.why)} · ${s.steps} steg${s.same_type ? "" : " · lånas: levererar något annat"}</div></div>`
            + `<button class="go" data-act="hl-lock" data-task="${esc(task)}" data-method="${esc(s.id)}" data-label="${esc(s.label)}">◐ Ge den «${esc(s.label)}»</button></div>`).join("")
          + `<div class="mmeta">Förslagen kommer ur registret: först metoder som levererar samma sak, sedan de som liknar mest. Inget passar? Gör den med några steg och spara dem som metod när den är klar.</div>`
        : `<div class="mmeta">Registret har ingen metod som liknar «${esc(label)}». Gör den med några steg, och spara stegen som metod när den är klar.</div>`;
      body += `<div><button class="link" data-act="hl-chat" data-task="${esc(task)}">Be Claude föreslå i chatten ↗</button></div>`;
    } else if (st.way === "steps") {
      const c = st.claude, n = st.text.split("\n").map((x) => x.trim()).filter(Boolean).length;
      body = (c?.busy ? `<div class="mmeta">Claude föreslår steg … ${esc(c.stream || "")}</div>` : c?.note ? `<div class="mmeta">${esc(c.note)}</div>` : "")
        + `<textarea id="hl-steps" data-task="${esc(task)}" aria-label="Stegen, ett per rad" placeholder="Ett steg per rad, verbet först">${esc(st.text)}</textarea>`
        + `<div class="mmeta">${c?.done ? "Claudes förslag, streckat tills det läggs in. " : ""}Ett steg per rad, verbet först. Stegen finns bara i den här uppgiften; metoderna rörs inte.</div>`
        + `<div style="display:flex;gap:14px;align-items:center"><button class="hlgo" data-act="hl-steps-go" data-task="${esc(task)}"${n ? "" : " disabled"}>◐ Lägg in ${n || ""} steg</button>`
        + (sample ? `<button class="link" data-act="hl-ask" data-task="${esc(task)}">Fråga Claude ${c?.done ? "igen" : ""}</button>` : `<button class="link" data-act="hl-chat-steps" data-task="${esc(task)}">Be Claude föreslå i chatten ↗</button>`) + `</div>`;
    }
    return `<div class="hl" data-hl="${esc(task)}"><div class="hlq">Utan metod — vad gör vi med den?</div>`
      + `<div class="hlw">${esc(nm?.text || "Uppgiften har ingen metod och inga steg, så den syns inte i planen och ingen har den.")}</div>`
      + `<div class="hlopts">${opt("method", "Ge den en metod", "◐")}${opt("steps", "Gör den med några steg", "◐")}${opt("do", "Bara gör det", "●")}`
      + `<button class="hlopt" data-act="hl-move" data-task="${esc(task)}">Flytta till leverans … <span class="lvl">◐</span></button></div>`
      + (body ? `<div class="hlbody">${body}</div>` : "") + `</div>`;
  }
  /** I arket: rutan för `none`, och för `own` en rad med «Spara som metod» när stegen är klara. */
  function hlSheetHtml(plan) {
    if (!plan?.method_status) return "";
    if (plan.method_status === "none") return homelessHtml(plan.task, plan.label, plan);
    const done = plan.steps.length > 0 && plan.steps.every((s) => s.done);
    return `<div class="hl"><div class="hlq">Utan metod: stegen finns bara i den här uppgiften</div>`
      + (done ? `<div class="hlw">Allt är klart. Spara stegen som metod, så kan nästa ${esc(plan.deliverable_type?.label || "uppgift")} göras likadant.</div>`
          + `<div class="hlopts"><button class="hlopt" data-act="hl-save" data-task="${esc(plan.task)}">Spara som metod <span class="lvl">◐</span></button>`
          + (plan.save_as_method ? `<button class="hlopt" data-act="hl-build" data-task="${esc(plan.task)}">Ändra först i metodbyggaren</button>` : "") + `</div>`
        : `<div class="hlw">När den är klar kan stegen sparas som metod.</div>`) + `</div>`;
  }

  async function hlWay(task, way) {
    const st = hlState(task);
    if (way === "do") return hlJustDo(task);
    st.way = st.way === way ? null : way;
    if (st.way === "steps" && !st.text && sample) hlAsk(task);
    render();
  }
  /** Ge den en metod (◐): servern förhandsvisar låsningen; knappen genomför. */
  async function hlLock(task, method, label) {
    if (offline()) { say("Att ge uppgiften en metod kräver förhandsvisning och kan inte göras förrän dirigenten svarar.", null, true); render(); return; }
    const verb = `Ge den «${label}»`;
    S.confirm = { loading: true, verb, text: "Räknar på metoden …" }; render();
    const args = { op: "task_lock", task, method, reason: "Uppgiften saknade metod; metoden valdes i vyn (Ge den en metod)." };
    try {
      const r = await call("write", args);
      S.confirm = { verb, text: summaryText(r) || `«${label}» blir uppgiftens metod.`, next: hlNext(r, { tool: "write", args: { ...args, confirmed: true } }, verb),
        onDone: () => { hlState(task).way = null; hlInvalidate(task); } };
    } catch (e) { S.confirm = null; say(`Kunde inte förhandsvisa metoden: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /** Bara gör det (●): ett steg «Gör: …» hos den som trycker, direkt, med Ångra. */
  async function hlJustDo(task) {
    const h = hlTask(task), me = S.data?.party;
    if (offline()) { say("«Bara gör det» kan inte göras förrän dirigenten svarar. Inget ändrades.", null, true); render(); return; }
    const label = `Gör: ${h.label}`.slice(0, 120);
    try {
      const r = await call("write", { op: "task_lock", task, add_step: { after: null, label, ...(me?.id ? { who: me.id } : {}), new_reason: "Bara gör det, i vyn" }, confirmed: true });
      say(`«${label}» ligger nu i uppgiften, hos dig.`, r?.step ? { tool: "write", args: { op: "task_lock", task, add_step: { remove: r.step }, confirmed: true } } : null);
      hlState(task).way = null; hlInvalidate(task);
    } catch (e) { say(`Kunde inte lägga in steget: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /** Claude föreslår 2–5 steg (förmågan sample, snabbaste nivån), streckat i rutan. */
  async function hlAsk(task) {
    const st = hlState(task), h = hlTask(task), plan = hlPlan(task);
    if (!sample) return;
    st.claude?.ctl?.abort();
    const ctl = new AbortController(), c = { busy: true, ctl, stream: "" };
    st.claude = c; render();
    const prompt = ["Du föreslår hur en uppgift görs, när ingen metod finns för den. Du skriver ingenting själv.",
      `Uppgiften: «${h.label}».`, h.customer?.label ? `Kunden: ${h.customer.label}.` : "",
      plan?.deliverable_type?.label ? `Det som ska levereras: ${plan.deliverable_type.label}.` : "", plan?.due ? `Klar senast: ${plan.due}.` : "",
      "Föreslå 2–5 steg i ordning. Varje steg är det en person gör vid ett tillfälle och som ger ett resultat. Verbet först, högst 60 tecken, inga personnamn.",
      'Svara med ENBART JSON: {"steps":["<steg>", "..."]}'].filter(Boolean).join("\n");
    try {
      const r = await sample.json(prompt, { modelTier: "quick", signal: ctl.signal, onText: ({ text: t }) => { if (st.claude === c) { c.stream = String(t || "").slice(-80); renderKeep(); } } });
      if (st.claude !== c) return;
      const steps = (Array.isArray(r?.steps) ? r.steps : []).map((x) => String(x || "").replace(/\s+/g, " ").trim().slice(0, 120)).filter(Boolean).slice(0, 5);
      st.claude = steps.length ? { done: true } : { note: "Claude gav inga steg. Skriv dem själv, ett per rad." };
      if (steps.length) st.text = steps.join("\n");
    } catch (e) {
      if (st.claude !== c) return;
      if (e?.code === "not_granted") sample = null;
      st.claude = { note: e?.code === "cancelled" ? "Avbrutet." : `Claude svarade inte (${e?.message || e}). Skriv stegen själv, ett per rad.` };
    }
    render();
  }
  /** Gör den med några steg (◐): förhandsvisa det första på servern, lägg sedan in alla i ordning. */
  async function hlStepsGo(task) {
    const st = hlState(task), h = hlTask(task), me = S.data?.party;
    const lines = st.text.split("\n").map((x) => x.trim().slice(0, 120)).filter(Boolean).slice(0, 8);
    if (!lines.length) return;
    if (offline()) { say("Stegen kräver förhandsvisning och kan inte läggas in förrän dirigenten svarar. Texten står kvar.", null, true); render(); return; }
    const verb = `Lägg in ${lines.length} steg`;
    S.confirm = { loading: true, verb, text: "Prövar stegen …" }; render();
    const add = (label, after, confirmed) => call("write", { op: "task_lock", task, add_step: { after, label, ...(me?.id ? { who: me.id } : {}) }, ...(confirmed ? { confirmed: true } : {}) });
    try {
      const r = await add(lines[0], null, false);
      const end = /Klart (\d{4}-\d{2}-\d{2})[^.]*\./.exec(summaryText(r))?.[0] || "";
      S.confirm = { verb, text: `${lines.map((l) => `«${l}»`).join(", ")} läggs in i «${h.label}», i den ordningen och hos dig — bara i den här uppgiften, metoderna rörs inte.${end ? ` ${end.replace(/^Klart/, "Första steget klart")}` : ""}`,
        next: { tool: "write", args: {} }, run: async () => {
          let after = null; const added = [];
          for (const l of lines) { const w = await add(l, after, true); after = w?.step || after; added.push(w?.step); }
          say(`${lines.length} steg ligger nu i «${h.label}».`, added[0] ? { tool: "write", args: { op: "task_lock", task, add_step: { remove: added[0] }, confirmed: true } } : null);
          st.way = null; st.text = ""; st.claude = null; hlInvalidate(task);
        } };
    } catch (e) { S.confirm = null; say(`Kunde inte pröva stegen: ${e.message || e}. Inget lades in.`, null, true); }
    render();
  }
  /** Spara som metod (◐): stegen blir en metod för det uppgiften levererar; servern återanvänder först. */
  async function hlSave(task) {
    const plan = hlPlan(task), save = plan?.save_as_method;
    if (!save) return;
    const verb = "Spara som metod";
    S.confirm = { loading: true, verb, text: "Bygger metoden ur stegen …" }; render();
    const args = save.args;
    try {
      const r = await call(save.tool, args);
      if (r?.ok === false) { S.confirm = null; say(`${summaryText(r) || "Metoden går inte att spara än."} Be Claude i chatten göra klart den.`, null, true); render(); return; }
      S.confirm = { verb, text: summaryText(r) || "Stegen blir en metod.", next: hlNext(r, { tool: "write", args: { ...args, confirmed: true } }, verb), onDone: () => hlInvalidate(task) };
    } catch (e) { S.confirm = null; say(`Kunde inte bygga metoden: ${e.message || e}. Inget sparades.`, null, true); }
    render();
  }
  async function hlRunConfirm() {
    const c = S.confirm; if (!c?.run) return;
    S.confirm = { ...c, loading: true }; render();
    try { await c.run(); S.confirm = null; } catch (e) { S.confirm = null; say(`Allt kunde inte läggas in: ${e.message || e}. Det som hann läggas in står kvar.`, null, true); refreshSoon(); }
    render();
  }

  /* Flytta till leverans: en väljare bland kundens leveranser, eller en ny; ta ur går också. */
  function openMove(task) {
    const h = hlTask(task);
    S.menu = null; S.peek = null; S.pal = null;
    S.mv = { task, label: h.label, customer: h.customer, cur: h.cur, q: "", i: 0 };
    render();
    setTimeout(() => root.querySelector?.("#mv-q")?.focus?.(), 0);
  }
  /* ── Presentera: en presentation för kund ur leveransen (src/present/, atomen presentation.write) ──
     Urvalet att bocka i, mallen, sidotexter som Claude föreslår och du godkänner, mottagarna,
     förhandsvisningen och ◐ Publicera. Leveranstexterna visas ordagrant och går inte att ändra här. */
  const PRES_STEP = "s_presentation_write";
  async function openPres(delivery, label) {
    S.menu = null; S.peek = null; S.pal = null; S.mv = null;
    S.pres = { delivery, label, loading: true, phase: "pick", off: {}, texts: {}, to: "", title: label };
    render();
    try {
      const d = await call("read", { op: "presentation_draft", delivery });
      S.pres = { ...S.pres, loading: false, d, template: d.template, title: d.blocks.find((b) => b.type === "cover")?.title || label };
    } catch (e) { S.pres = { ...S.pres, loading: false, error: e?.message || String(e) }; }
    render();

  /* ── slut på applyOp ── */

  /* ── Tid (FAS1 1.5): samma rader på en tidsaxel, per leverans eller per person ──
     Tidsaxeln hämtas en gång (plan_state { timeline }); medan man drar räknas följderna
     här, med whatIf, utan anrop. Servern räknar om först vid Genomför (◐). */
  const WEEKS = [2, 4, 8, 12];
  const dayIdx = (tl, iso) => Math.round((Date.parse(iso) - Date.parse(tl.from)) / DAY_MS);
  const isoAdd = (iso, n) => new Date(Date.parse(iso) + n * DAY_MS).toISOString().slice(0, 10);

  function timeState() {
    if (!S.time) S.time = { group: "delivery", weeks: 4, from: null, tl: null, loading: false, error: null, changes: {}, zopen: {} };
    return S.time;
  }
  const loadTimeline = () => loadTid();
  const changeList = () => Object.values(timeState().changes);

    const res = whatIf(T.tl, list.map(({ withdraw: _w, ...c }) => c));

  }

  /* ── Tid omgjord (docs/design/v6/tid) ──
     Ett steg per rad: namnet står i etikettkolumnen, aldrig i stapeln. Ramen är spannet,
     fyllnaden timmarna mot dagens tid (8 h minus upptaget i kalendern), siffran till höger.
     Hopfällt som förval: en leverans är en remsa med ◆ för löftet, en person belastningen
     per dag med mötena randiga och taket streckat. ▸ fäller ut. Datan: plan_state
     { agenda: true, format: "tid" } (src/plan/timeline.ts), följderna räknas med whatIf.
     Ersätter FAS1 1.5 (körfälten, 3 px-linjen och värderutan är borta). */
  const TZ_ROW = 30;
  const tzOpen = (T, key) => !!(T.zopen || {})[key];
  async function loadTid() {
    const T = timeState();
    const from = T.from || mondayOf(S.data?.today || new Date().toISOString().slice(0, 10));
    T.from = from; T.loading = true; T.error = null;
    render();
    try {
      const d = await call("plan_state", { agenda: true, format: "tid", weeks: T.weeks, since: from });
      if (!d?.timeline) throw Object.assign(new Error("Svaret saknade tidsaxeln."), { code: "SHAPE" });
      T.tl = d.timeline; T.loadedFor = JSON.stringify(["tid", T.weeks, from]);
      T.zseq = typeof d.seq === "number" ? d.seq : null; T.zconflict = null;
      // Utkastet från förra gången, för de steg som finns i tiden.
      if (!Object.keys(T.changes || {}).length) { const saved = tzSavedDraft().filter((c) => taskOf(T.tl, c.task)?.steps.some((x) => x.id === c.step));
        if (saved.length) T.changes = Object.fromEntries(saved.map((c) => [`${c.task}|${c.step}`, c])); }
    } catch (e) { T.error = e; }

  }
  /** Spannet i dagindex i fönstret: [a, z), en dag när start och slut är samma. */
  const tzSpan = (tl, s, e) => { const a = dayIdx(tl, s); return { a, z: Math.max(a + 1, dayIdx(tl, e) + (s === e ? 1 : 0)) }; };
  const tzWorkday = (tl) => { const off = new Set(tl.off || []); return (iso) => { const w = new Date(`${iso}T00:00:00Z`).getUTCDay(); return w !== 0 && w !== 6 && !off.has(iso); }; };
  /** Belastningen per person och dag i fönstret: möten, arbete (timmar ÷ spannets arbetsdagar) och tiden. */
  function tzLoads(tl, res) {
    const T = timeState(), isWd = tzWorkday(tl), out = {};
    for (const [id, p] of Object.entries(tl.people || {}))
      out[id] = Array.from({ length: tl.days }, (_, i) => ({ busy: p.busy?.[i] || 0, work: 0, cap: p.cap?.[i] ?? 8 }));
    for (const t of tl.tasks) for (const st of t.steps) {
      if (st.dn || st.x) continue;
      const p = placed(res, t, st), who = T.changes[`${t.id}|${st.id}`]?.to || p.w, a = out[who];
      if (!a || !p.h) continue;
      const { a: i0, z: i1 } = tzSpan(tl, p.s, p.e), days = [];
      for (let i = i0; i < i1; i++) if (isWd(isoAdd(tl.from, i))) days.push(i);

  /** Stegen som syns: inte klara, och i fönstret (eller sena före det). */
  function tzSteps(tl, res) {
    const T = timeState(), out = [];

      const late = !st.x && p.e <= tl.today && p.s < tl.today;

      // Ordningen är planens, inte utkastets: ett steg byter aldrig rad av sig självt.
      out.push({ t, st, ...p, a, z, late, key: `${t.id}|${st.id}`, owner: T.changes[`${t.id}|${st.id}`]?.to || p.w, o: tzSpan(tl, st.s, st.e) });

  /** Leveranserna (och uppgifter utan leverans) med löfte, slutdag och dagar sen. */
  function tzDeliveries(tl, res, base) {
    const by = new Map();
    for (const t of tl.tasks) {
      const k = t.d || t.id;

        by.set(k, { id: k, name: d?.n || rowOf(k)?.label || t.n, due: d?.due || t.due, tasks: [] }); }

      return { ...g, finish, before, late: Math.max(0, ...now.map((x) => x.late_by)) };

  const tzDay = (iso) => { const d = new Date(`${iso}T12:00:00Z`); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()}`; };

  const tzLast = (s, e) => s === e ? s : isoAdd(e, -1);
  function timeBody() {

      + `<button class="${T.group === "person" ? "on" : ""}" data-act="time-group" data-g="person">Per person</button></div>`
      + `<div class="nav"><button data-act="time-shift" data-d="-7" aria-label="En vecka tidigare">‹</button><button data-act="time-today">I dag</button><button data-act="time-shift" data-d="7" aria-label="En vecka senare">›</button></div>`
      + `<div class="wks">${WEEKS.map((w) => `<button class="${T.weeks === w ? "on" : ""}" data-act="time-weeks" data-w="${w}">${w} v</button>`).join("")}</div>`
      + `<span class="zleg"><span><i class="zl-span"></i>spann</span><span><i class="zl-fill"></i>timmar</span><span><i class="zl-busy"></i>möten</span><span>◆ lovat</span><span class="zl-now">│ i dag</span></span>`

    if (T.error && !tl) return bar + `<div class="banner"><span style="flex:1">Tiden kunde inte läsas: ${esc(T.error.message || T.error)}</span><button data-act="time-reload">Försök igen</button></div>`;
    if (!tl) return bar + `<div>${[0, 1, 2, 3].map(() => `<div class="skel" style="grid-template-columns:230px 1fr"><span></span><span></span></div>`).join("")}</div><div class="mmeta" style="padding:10px 12px">Hämtar tiden.</div>`;
    const res = consequences(), base = T.memo.base;
    const days = tl.days, pct = (n) => `${(n / days * 100).toFixed(3)}%`, me = S.data?.party?.id;
    const loads = tzLoads(tl, res), steps = tzSteps(tl, res);
    const isWd = tzWorkday(tl);
    const bg = Array.from({ length: days }, (_, i) => isWd(isoAdd(tl.from, i)) ? "" : `<span class="wkend" style="left:${pct(i)};width:${pct(1)}"></span>`).join("");
    const ti = dayIdx(tl, tl.today);

    const past = ti > 0 ? `<span class="zpast" style="width:${pct(Math.min(ti, days))}"></span>` : "";

        + (T.weeks === 2 ? [1, 2, 3, 4].map((j) => `<span class="zdl${isoAdd(iso, j) === tl.today ? " now" : ""}" style="left:${pct(k * 7 + j)}">${esc(tzDay(isoAdd(iso, j)))}</span>`).join("") : ""); }).join("");
    const head = `<div class="zrow zhead"><div class="zl">${T.group === "person" ? "PERSON" : "LEVERANS"}</div><div class="ztrack" style="height:30px">${weeks}</div></div>`;
    const overIn = (who, a, z) => { const l = loads[who]; if (!l) return false; for (let i = Math.max(0, a); i < Math.min(days, z); i++) if (l[i].over) return true; return false; };
    const capIn = (who, a, z) => { const l = loads[who]; let n = 0; for (let i = a; i < z; i++) if (isWd(isoAdd(tl.from, i))) n += i >= 0 && i < days && l ? l[i].cap : 8; return n; };
    const dname = (b) => { const d = (tl.deliveries || []).find((x) => x.id === b.t.d); return d?.n || b.t.n; };
    const cardKey = tzCardKey();
    let top = 31, card = null;
    T.zvis = [];
    const stepRow = (b, personMode) => {
      const st = b.st, ctx = `step|${b.t.id}|${st.id}`, sel = !!S.sel?.[ctx], draft = !!T.changes[b.key] || !!b.how;
      if (cardKey === b.key) card = { b, top: top + TZ_ROW, f: Math.min(0.62, Math.max(0, b.a / days)) };

      if (b.z <= 0) barHtml = `<span class="ztx late" style="left:1.6%">‹ slut ${esc(tzDay(tzLast(b.s, b.e)))} · ${dayIdx(tl, tl.today) - dayIdx(tl, tzLast(b.s, b.e))} d sen${b.h ? ` · ${hh(b.h)} h` : ""}</span>`;

      return `<div class="step${inSheet ? "" : " go"}" data-ctx="step|${esc(st.task)}|${esc(st.id)}"${inSheet ? "" : ` data-act="open-row-step" data-key="${esc(r.key)}" data-task="${esc(st.task)}" data-step="${esc(st.id)}" data-label="${esc(st.label)}" role="button" title="Öppna steget · ↵"`}><span class="sdot ${dot}"></span><div style="min-width:0">${inSheet ? rn("step", stepId(st.task, st.id), st.label, st.state === "done" ? "done" : "") : `<span class="${st.state === "done" ? "done" : ""}">${esc(st.label)}</span>`}<span class="meta"> · ${esc(meta)}</span></div><span class="who">${esc(st.who === me ? "du" : st.who || "")}</span><span class="pin-slot">${pinButton(st)}</span></div>`;
    }).join("");
    const more = r.step_count > r.steps.length ? `<div class="step"><span></span><span class="meta" style="grid-column:span 3">${r.step_count - r.steps.length} steg till, längre bort</span></div>` : "";
    const opens = `<div class="opens"><button class="link" data-act="open-delivery" data-key="${esc(r.key)}">Öppna ${r.kind === "delivery" ? "leveransen" : "uppgiften"}</button><button class="link" data-act="chat" data-key="${esc(r.key)}">Arbeta i chatten ↗</button></div>`;
    return `<div class="steps">${rows || `<div class="step"><span></span><span class="meta" style="grid-column:span 3">Inga steg i planen.</span></div>`}${more}${opens}</div>`;
  }

  /** Avsändaren (Daniel P 2026-10-05: «borde det också stå vem det kom ifrån»): namnet, adressen vid hovring. */
  function senderHtml(name, email, tail = " · ") { return name ? `<span class="from"${email ? ` title="${esc(email)}"` : ""}>från ${esc(name)}</span>${tail}` : ""; }
  /** «Namn <adress>» ur ett mejlhuvud. */
  function mailSender(h) { const raw = String(h || ""), m = /<([^>]+)>/.exec(raw), name = raw.replace(/<[^>]*>/g, "").replace(/["']/g, "").trim();
    return { name: name || (m ? m[1] : raw.trim()) || null, email: m ? m[1] : /@/.test(raw) ? raw.trim() : null }; }
  /** Flera uppgifter i raden: ett ärende per rad med ärendets egen rubrik, och stegets namn bara som «nu:». */
  const CASE_STATE = { new: "ny", doing: "pågår", customer: "väntar på kunden" };
  /** Så många ärenden visas först, i raden och i supportleveransens kö (OVERVIEW_CASES i src/views/overview.ts). */
  const CASES_SHOWN = 8;
  const daysAgo = (n) => n >= 0 ? "kom in i dag" : n === -1 ? "kom in i går" : `kom in för ${-n} d sedan`;
  function casesList(o, r, me) {
    const stream = r.kind === "stream";
    const all = !!S.allCases[r.key], list = all ? r.cases : r.cases.slice(0, CASES_SHOWN);
    const rows = list.map((c) => {
      if (stream) return caseRowHtml(caseNorm(c, o, marksNow()[c.task]), me, r.key);
      const who = c.who >= 0 ? o.names[c.who] : "";
      const due = c.due === undefined ? "" : c.late ? (stream ? `svaret blir ${c.late} d sent` : `spricker ${c.late} d`) : c.due < 0 ? `${stream ? "svaret" : "klart"} ${-c.due} d sent` : c.due === 0 ? `${stream ? "svar" : "klart"} i dag` : `${stream ? "svar" : "klart"} inom ${c.due} d`;
      const meta = [CASE_STATE[c.state] || c.state, c.received === undefined ? "" : daysAgo(c.received), due, c.tight && !c.late ? "utan marginal" : ""].filter(Boolean).join(" · ");
      const dot = c.state === "customer" ? "customer" : c.late || (c.due ?? 1) < 0 ? "late" : who === me ? "mine" : "";
      const open = stream ? `data-act="open-case" data-key="${esc(r.key)}" data-task="${esc(c.task)}" data-label="${esc(c.title)}" data-ctx="case|${esc(c.task)}"`
        : `data-act="open-part" data-task="${esc(c.task)}" data-parent="${esc(r.key)}" data-label="${esc(c.title)}"`;
      const ti = r.tasks.indexOf(c.task);
      const strip = stream ? "" : stripHtml(r.steps.filter((y) => y[0] === ti).map((y) => y[3] === "done" ? "d" : y[3] === "customer" ? "c" : "t").join(""));
      return `<div class="step case" ${open} draggable="true" data-drag="${esc(c.task)}" role="button"><span class="sdot ${dot}"></span><div style="min-width:0"><span>${esc(c.title)}</span>${c.no_method ? `<span class="nm" title="Ingen metod och inga steg">utan metod</span>` : ""}${c.outcome ? ` <span class="otag">${esc(c.outcome)}</span>` : ""}<span class="meta"> · ${senderHtml(c.from, c.from_email)}${esc(meta)}</span>`
        + `${c.now >= 0 ? `<div class="meta">nu: ${esc(o.names[c.now])}</div>` : ""}${strip}</div><span class="who">${esc(who === me ? "du" : who)}</span><span class="pin-slot">${c.step && isRunning(c.task, c.step) ? `<span class="meta">igång</span>` : ""}</span></div>`;
    }).join("");
    const n = r.case_count || r.cases.length, rest = n - r.cases.length;
    const word = stream ? (rest === 1 ? "ärende" : "ärenden") : (rest === 1 ? "uppgift" : "uppgifter");
    // Åtta först; «Visa alla N» fäller ut resten i raden, «Visa färre» fäller ihop.
    const fold8 = r.cases.length > CASES_SHOWN ? `<div class="step"><span></span><button class="link meta" style="grid-column:span 3;text-align:left" data-act="cases-all" data-key="${esc(r.key)}">${all ? "Visa färre" : `Visa alla ${n}`}</button></div>` : "";
    const more = (all || r.cases.length <= CASES_SHOWN) && rest > 0 ? `<div class="step"><span></span><button class="link meta" style="grid-column:span 3;text-align:left" data-act="open-delivery" data-key="${esc(r.key)}">${rest} ${word} till i ${stream ? "kön" : "leveransen"} →</button></div>` : "";
    const opens = `<div class="opens"><button class="link" data-act="open-delivery" data-key="${esc(r.key)}">${stream ? "Öppna kön" : "Öppna leveransen"}</button><button class="link" data-act="chat" data-key="${esc(r.key)}">Arbeta i chatten ↗</button></div>`;
    return `<div class="steps">${rows || `<div class="step"><span></span><span class="meta" style="grid-column:span 3">Inga öppna ${stream ? "ärenden" : "uppgifter"}.</span></div>`}${fold8}${more}${opens}</div>`;
  }

  function list(o) {
    const ch = ovChoice(), all = o.rows.filter(match);
    const many = all.filter((r) => r.kind !== "inbox").length > MANY;
    const shown = many ? all.slice(0, S.limit) : all;
    const more = many && all.length > shown.length ? `<div class="more"><button data-act="more">Visa ${Math.min(PAGE, all.length - shown.length)} till</button> <span class="mmeta">${shown.length} av ${all.length} visas</span></div>` : "";
    const head = `<div class="head"><span></span><span>LEVERANS</span><span>LÄGET</span><span style="text-align:right">KRÄVER</span></div>`;
    const rowHtml = (r) => {
      const open = !!S.open[r.key];
      const sub = r.kind === "inbox" ? "posten till huset · alla kunder"
        : `${r.customer?.label ? `${r.customer.label} · ` : ""}${TNAME[r.type] || ""}${r.owner ? ` · ansvarig ${r.owner.label}` : ""}`;
      // En uppgift utan leverans går att dra till en leverans hos samma kund.
      const drag = r.kind === "task" && r.tasks.length === 1 ? ` draggable="true" data-drag="${esc(r.tasks[0])}"` : "";
      return `<div class="wrap" data-row="${esc(r.key)}"><div class="row" data-act="toggle" data-key="${esc(r.key)}"${r.kind === "inbox" ? "" : ` data-ctx="row|${esc(r.key)}"`}${drag} role="button" aria-expanded="${open}">`
        + `<span class="icon" title="${esc(TNAME[r.type] || "")}">${ICON[r.type] || "○"}</span>`
        + `<div style="min-width:0"><div class="name">${esc(r.label)}</div><div class="sub">${esc(sub)}</div></div>`
        + `<div style="min-width:0">${segs(o, r, open && !r.cases)}<div class="state${r.late_days ? " late" : ""}">${esc(r.no_method ? `utan metod och utan steg${r.due ? ` · datum ${shortIso(r.due)}` : ""} — öppna för att ge den en` : r.state_text)}</div></div>`
        + `<div class="needs">${needs(r)}</div></div>${open ? stepsList(o, r) : ""}</div>`;
    };
    const grpHead = (label, n, note = "") => `<div class="grp">${esc(label)} · ${n}${note ? `<span>${esc(note)}</span>` : ""}</div>`;
    // Utan metod (svar 9): alltid en egen grupp sist, vilken gruppering som än gäller.
    const bare = shown.filter((r) => r.no_method), rest = shown.filter((r) => !r.no_method);
    let body = "";
    if (ch.group === "none" || !ch.group) body = rest.map(rowHtml).join("");
    else {
      const me = o.party?.id, today = o.today;
      const keyOf = (r) => {
        if (r.kind === "inbox") return ["0", "Inkommet", ""];
        if (ch.group === "cust") return r.customer ? [`1${r.customer.label}`, r.customer.label, ""] : ["9", "Utan kund", ""];
        if (ch.group === "owner") return r.owner ? [r.owner.id === me ? "1" : `2${r.owner.label}`, r.owner.label, "ansvarig"] : ["9", "Ingen ansvarig", "sätts i leveransens ark"];
        if (ch.group === "type") return [`1${r.type}`, TYPE_LABEL[r.type] || r.type, ""];
        if (!r.due) return ["9", "Utan datum", "löpande och annat utan slutdatum"];
        if (r.due < today) return ["1", "Försenat", "skulle varit klart"];
        const w = isoWeekOf(r.due);
        return [`2${r.due.slice(0, 4)}${String(w).padStart(2, "0")}`, `v${w}`, w === isoWeekOf(today) ? "den här veckan" : "klart senast"];
      };
      const groups = new Map();
      for (const r of rest) { const [k, l, n] = keyOf(r); if (!groups.has(k)) groups.set(k, { l, n, rows: [] }); groups.get(k).rows.push(r); }
      body = [...groups.entries()].sort(([a], [b]) => a.localeCompare(b, "sv")).map(([, g]) => grpHead(g.l, g.rows.length, g.n) + g.rows.map(rowHtml).join("")).join("");
    }
    body += bare.length ? `<div class="grp">UTAN METOD · ${bare.length}<span>uppgifter utan metod och utan steg: ge dem en metod, några steg, eller gör dem bara</span></div>${bare.map(rowHtml).join("")}` : "";
    const none = !all.length ? `<div class="hidden">Inget med de här valen. <button data-act="ov-clear">Rensa filtren</button></div>` : "";
    return head + body + none + more;
  }
  /** ISO-veckan för ett datum ÅÅÅÅ-MM-DD. */
  function isoWeekOf(iso) {
    const d = new Date(`${iso.slice(0, 10)}T12:00:00Z`), day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - first) / 864e5 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
  }

  /** Vyerna, + Filter, Gruppera och «Visar …» (ordning, del 3). Allt räknas på raderna som finns, utan nya anrop. */
  function viewBar(o) {
    const ch = ovChoice(), f = ch.filter || {}, rows = o?.rows || [];
    const presets = [...PRESETS.map(([l, pf]) => ({ l, f: pf })), ...(ch.saved || []).map((v, i) => ({ l: v.name, f: v.filter, g: v.group || "none", saved: i }))];
    const vbtn = presets.map((p, i) => {
      const n = rows.filter((r) => matchF(r, p.f)).length + (p.f.mine && Object.keys(fClean(p.f)).length === 1 ? (o?.reviews?.length || 0) : 0);
      return `<button class="lens${fEq(f, p.f) && (p.g === undefined || p.g === (ch.group || "none")) ? " on" : ""}" data-act="ov-view" data-i="${i}"${p.saved !== undefined ? ` title="Sparad vy · ⇧-klick tar bort den"` : ""}>${esc(p.l)}${p.saved !== undefined ? " ☆" : ""}<span class="n">${n}</span></button>`;
    }).join("");
    const bodies = `<div class="bodies">${[["list", "Lista"], ["time", "Tid"], ["cal", "Kalender"]].map(([id, l]) => `<button class="${S.body === id ? "on" : ""}" data-act="body" data-body="${id}" aria-pressed="${S.body === id}">${l}</button>`).join("")}</div>`;
    // Kollegornas initialer (Daniel P 2026-10-07): genvägar till filtret Ansvarig. ⇧-klick lägger till fler.
    const people = (o?.colleagues || []).map((p) => {
      const load = p.capacity ? Math.min(100, Math.round(p.hours_week / p.capacity * 100)) : 0, on = (f.owner || []).includes(p.id);
      return `<button class="person${on ? " on" : ""}" data-act="ov-person" data-id="${esc(p.id)}" aria-pressed="${on}" title="${esc(`Ansvarig: ${p.label} · ${hh(p.hours_week)} h av ${hh(p.capacity)} den här veckan${p.over ? " · över 8 h någon dag" : ""} · ⇧-klick lägger till`)}">`
        + `<span class="ring" style="background:conic-gradient(${p.over ? "var(--red)" : "var(--teal)"} ${load * 3.6}deg, var(--l3) 0)"><span>${esc(p.ini)}</span></span>${esc(p.label)}</button>`;
    }).join("");
    // «Spara vyn» står alltid här, så att man ser att det går; när det inte går säger knappen varför (också vid tryck).
    const block = saveBlock(ch);
    const saveBtn = S.saving !== null
      ? `<input id="ov-name" maxlength="40" placeholder="Namn på vyn" value="${esc(S.saving)}" autocomplete="off"><button class="primary" data-act="ov-save"><span class="lvl d">●</span> Spara vyn</button><button class="link" data-act="ov-save-cancel">Avbryt</button>`
      : `<button class="addf save" data-act="ov-save-start"${block ? ` aria-disabled="true" title="${esc(block)}"` : ` title="Filtret och grupperingen sparas som en egen vy, för dig, på alla datorer"`}>☆ Spara vyn</button>`;
    const views = `<div class="vrow">${vbtn}<span class="sep"></span><button class="addf" data-act="ov-filter" aria-expanded="${!!S.filterOpen}">+ Filter</button>${saveBtn}${people ? `<span class="sep"></span>${people}` : ""}${bodies}</div>`;
    const groups = S.body === "list" ? `<div class="vrow"><span class="glbl">Gruppera</span>${GROUPS.map(([k, l]) => `<button class="gopt${(ch.group || "none") === k ? " on" : ""}" data-act="ov-group" data-g="${k}">${l}</button>`).join("")}</div>` : "";
    const opt = (k, v, l, on) => `<button class="fopt${on ? " on" : ""}" data-act="ov-opt" data-k="${k}" data-v="${esc(v)}">${esc(l)}</button>`;
    const has = (k, v) => (f[k] || []).includes(v);
    const by = f.when ? (f.by || "due") : (S.timeBy || "due");
    const custs = [...new Map(rows.filter((r) => r.customer?.id).map((r) => [r.customer.id, r.customer.label])).entries()];
    const owners = [...new Map(rows.filter((r) => r.owner).map((r) => [r.owner.id, r.owner.label])).entries()];
    const panel = S.filterOpen ? `<div class="fpanel">`
      + `<div><div class="ft">KUND</div><div class="fo">${custs.map(([id, l]) => opt("cust", id, l, has("cust", id))).join("") || `<span class="mmeta">Ingen kund i raderna.</span>`}</div></div>`
      + `<div><div class="ft">ANSVARIG FÖR LEVERANSEN</div><div class="fo">${owners.map(([id, l]) => opt("owner", id, l, has("owner", id))).join("")}${opt("mine", "1", "Där jag behövs", !!f.mine)}</div></div>`
      + `<div><div class="ft">LÄGE</div><div class="fo">${Object.entries(STATUS_LABEL).map(([k, l]) => opt("status", k, l, has("status", k))).join("")}${opt("late", "1", "Sent", !!f.late)}</div></div>`
      + `<div><div class="ft">TYP</div><div class="fo">${Object.entries(TYPE_LABEL).map(([k, l]) => opt("type", k, l, has("type", k))).join("")}</div></div>`
      + `<div><div class="ft">TID</div><div class="fo">${Object.entries(WHEN_LABEL).map(([k, l]) => opt("when", k, l, f.when === k)).join("")}</div>`
      + (f.when === "range" ? `<div class="fo frange"><label>från <input id="ov-from" type="date" value="${esc(f.from || "")}"></label><label>till <input id="ov-to" type="date" value="${esc(f.to || "")}"></label></div>` : "")
      + `<div class="fo fby"><span class="mmeta">efter</span>${Object.entries(BY_LABEL).map(([k, l]) => `<button class="gopt${by === k ? " on" : ""}" data-act="ov-by" data-by="${k}" aria-pressed="${by === k}">${l}</button>`).join("")}</div>`
      + (by === "next" ? `<div class="mmeta">nästa steg: dagen då radens nästa öppna steg ska vara klart</div>` : "") + `</div></div>` : "";
    const label = { cust: (v) => custs.find(([id]) => id === v)?.[1] || v, owner: (v) => `Ansvarig: ${owners.find(([id]) => id === v)?.[1] || v}`,
      status: (v) => STATUS_LABEL[v] || v, type: (v) => TYPE_LABEL[v] || v };
    const whenText = !f.when ? "" : (f.when === "range" ? (f.from || f.to ? `${f.from ? shortIso(f.from) : "…"}–${f.to ? shortIso(f.to) : "…"}` : WHEN_LABEL.range) : WHEN_LABEL[f.when] || f.when)
      + (f.by === "next" ? " · efter nästa steg" : "");
    const chips = [...["cust", "owner", "status", "type"].flatMap((k) => (f[k] || []).map((v) => [k, v, label[k](v)])),
      ...(f.when ? [["when", f.when, whenText]] : []), ...(f.late ? [["late", "1", "Sent"]] : []), ...(f.mine ? [["mine", "1", "Där jag behövs"]] : [])];
    const showing = chips.length ? `<div class="showing"><span class="mmeta">Visar</span>`
      + chips.map(([k, v, l]) => `<button class="fchip" data-act="ov-opt" data-k="${k}" data-v="${esc(v)}" title="Ta bort">${esc(l)}<span>×</span></button>`).join("")
      + `<button class="link" data-act="ov-clear">Rensa</button>`
      + `<span class="where">sparas för dig, på alla datorer</span></div>` : "";
    // En ansvarig vald som är en kollega: hennes dagar en tryckning bort.
    const one = (f.owner || []).length === 1 ? (o?.colleagues || []).find((c) => c.id === f.owner[0]) : null;
    const days = one ? `<div class="note"><span>${esc(`${one.label} · ${hh(one.hours_week)} h av ${hh(one.capacity)} den här veckan${one.calendar_via ? ` · ${one.calendar_via}` : ""}`)}</span><button class="link" data-act="open-person" data-id="${esc(one.id)}">${esc(one.label)}s dagar →</button></div>` : "";
    return views + groups + panel + showing + days;
  }
  /** ● Valen sparas på personen (Mina inställningar), en halv sekund efter senaste ändringen. */
  let ovTimer = null;
  function setOv(patch) {
    S.ov = { ...ovChoice(), ...patch };
    S.limit = PAGE;
    clearTimeout(ovTimer);
    const party = S.data?.party?.id;
    if (!party) return;
    ovTimer = setTimeout(() => {
      const v = S.ov;
      call("write", { op: "registry_define", change: true, node: { id: party, overview_view: { filter: fClean(v.filter), group: v.group || "none", saved: v.saved || [] } } })
        .then(() => { if (S.data) S.data = { ...S.data, overview_view: v }; })
        .catch((e) => { say(`Valen kunde inte sparas på servern: ${e.message || e}. De gäller här tills vidare.`, null, true); render(); });
    }, 500);
  }
  function ovAct(act, el, shift = false) {
    const ch = ovChoice(), f = { ...(ch.filter || {}) };
    if (act === "ov-view") {
      const i = Number(el.getAttribute("data-i")), saved = ch.saved || [];
      const v = i < PRESETS.length ? null : saved[i - PRESETS.length], p = v ? v.filter : PRESETS[i]?.[1];
      if (!p) return;
      // En sparad vy bär sin gruppering; de förinställda rör den inte.
      setOv({ filter: JSON.parse(JSON.stringify(p)), ...(v ? { group: v.group || "none" } : {}) });
    } else if (act === "ov-filter") S.filterOpen = !S.filterOpen;
    else if (act === "ov-group") setOv({ group: el.getAttribute("data-g") });
    else if (act === "ov-person") {
      const id = el.getAttribute("data-id"), cur = f.owner || [], on = cur.includes(id);
      f.owner = shift ? (on ? cur.filter((y) => y !== id) : [...cur, id]) : (on && cur.length === 1 ? [] : [id]);
      setOv({ filter: fClean(f) });
    }
    else if (act === "ov-opt") {
      const k = el.getAttribute("data-k"), v = el.getAttribute("data-v");
      if (k === "late" || k === "mine") f[k] = !f[k];
      else if (k === "when") { if (f.when === v) { S.timeBy = f.by || "due"; delete f.when; } else { if (!f.when && S.timeBy === "next") f.by = "next"; f.when = v; } }
      else { const a = [...(f[k] || [])]; const j = a.indexOf(v); if (j < 0) a.push(v); else a.splice(j, 1); f[k] = a; }
      setOv({ filter: fClean(f) });
    } else if (act === "ov-by") {
      const v = el.getAttribute("data-by");
      S.timeBy = v;
      if (f.when) { f.by = v; setOv({ filter: fClean(f) }); }
    } else if (act === "ov-clear") { setOv({ filter: {} }); S.saving = null; }
    else if (act === "ov-save-start") { const why = saveBlock(ch); if (why) say(`Vyn kan inte sparas: ${why}.`); else S.saving = ""; }
    else if (act === "ov-save-cancel") S.saving = null;
    else if (act === "ov-save") {
      const name = (S.saving || "").trim();
      if (!name) { say("Ge vyn ett namn.", null, true); render(); return; }
      const why = saveBlock(ch);
      if (why) { S.saving = null; say(`Vyn kan inte sparas: ${why}.`, null, true); render(); return; }
      const g = ch.group || "none";
      const saved = [...(ch.saved || []), { name, filter: fClean(f), ...(g !== "none" ? { group: g } : {}) }].slice(0, SAVED_MAX);
      S.saving = null;
      setOv({ saved });
      say(`Vyn «${name}» är sparad.`);
    } else if (act === "ov-unsave") {
      const i = Number(el.getAttribute("data-i")) - PRESETS.length, v = (ch.saved || [])[i];
      if (!v) return;
      setOv({ saved: (ch.saved || []).filter((_, j) => j !== i) });
      say(`Vyn «${v.name}» är borttagen.`);
    }

    if (S.pal) {

      if (k === "Escape") { stop(); S.pal = null; render(); return; }
      if (k === "ArrowDown" || k === "ArrowUp") { stop(); S.pal.i = n ? (S.pal.i + (k === "ArrowDown" ? 1 : n - 1)) % n : 0; render(); return; }
      if (k === "Enter") { stop(); runEntry(S.pal.res?.[S.pal.i]); return; }

    }
    if (S.mv && mvKey(e, k, stop)) return;
    if (S.pres && k === "Escape") { stop(); S.pres = null; render(); return; }
    if (S.menu) {
      const items = menuItems(S.menu.target), n = items.length;
      if (k === "Escape") { stop(); S.menu = null; render(); return; }
      if (k === "ArrowDown" || k === "ArrowUp") { stop(); S.menu.i = (S.menu.i + (k === "ArrowDown" ? 1 : n - 1)) % n; render(); return; }
      if (k === "Enter") { stop(); const it = items[S.menu.i]; S.menu = null; if (it) it.run(); render(); return; }
      const hit = items.find((x) => x.key && x.key.toLowerCase() === (k === " " ? "␣" : k === "ArrowRight" ? "→" : k === "ArrowLeft" ? "←" : k).toLowerCase());
