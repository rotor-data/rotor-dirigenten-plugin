.ov-head{display:flex;justify-content:space-between;padding:14px 18px 6px;border-top:1px solid var(--bg-quiet);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ov-head-count{color:var(--meta)}
.ov-item{flex-direction:column;align-items:stretch}
.ov-line{display:flex;align-items:center;gap:8px}
.ov-line>.ov-row{flex:1;min-width:0}
.ov-head-btn{display:flex;align-items:center;gap:6px;border:0;background:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.ov-head-btn .ov-chev{margin-left:-6px}
.ov-chev{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;background:0;border-radius:8px;cursor:pointer;margin-left:6px}
.ov-chev svg{fill:none;stroke:var(--ink);stroke-width:1.8;transition:transform var(--motion)}
.ov-chev[aria-expanded=true] svg{transform:rotate(90deg)}
.ov-chev:hover{background:var(--bg-quiet)}
.ov-shapes{display:flex;gap:3px;align-items:center;border:0;background:0;padding:6px;border-radius:8px;cursor:pointer}
.ov-sh{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--unknown-line);background:var(--bg-page)}
.ov-sh[data-state^=doable]{background:var(--do);border-color:var(--do)}
.ov-sh[data-state=needs_yes]{width:12px;border-radius:0;border:0;background:var(--yes);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.ov-sh[data-state=waiting]{border-color:var(--wait);background:var(--bg-quiet)}
.ov-sh[data-state=blocked]{border-color:var(--locked);background:var(--locked-bg)}
.ov-sh[data-state^=done]{border-color:var(--done-line);background:var(--done-bg)}
.ov-sh[data-state=skipped],.ov-sh[data-state=ended_without_yes]{border-style:dashed;border-color:var(--skip)}
.ov-bar>.btn.primary{margin-left:auto}
.ov-text{overflow:hidden}
.ov-shapes{flex-wrap:wrap;max-width:40%}
@media (max-width:900px){.ov-row{grid-template-columns:44px minmax(0,1fr)!important;padding-top:6px;padding-bottom:6px}.ov-meta{grid-column:2;flex-wrap:wrap;gap:4px 12px}.ov-text{flex-wrap:wrap}.ov-cust{margin-left:0;width:100%}}
.ov-bars-wait{min-height:92px}
.ov-av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-pill);background:var(--bg-quiet);color:var(--ink);font-size:11px;font-weight:800;margin-right:12px}
.ov-av[data-avatar=none]{background:0;border:1.5px dashed var(--muted);color:var(--muted)}
.ov-item[data-running]{box-shadow:inset 3px 0 0 var(--do)}
:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.menu-note{font-size:12.5px;color:var(--meta);padding:8px 14px}
.menu-row{display:flex;align-items:center;gap:6px}.menu-row .menu-item{flex:1}.menu-field{font:inherit;font-size:12.5px;margin-right:10px}

.ov-bars{display:flex;flex-direction:column;gap:12px;min-height:92px}

.ov-seg-btn[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.ov-fwrap{position:relative}
.ov-box{left:0;right:auto;max-height:360px;overflow:auto}
.ov-pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:4px 6px 4px 14px;font-size:12.5px;font-weight:800}

.ov-mo-more{padding:4px 6px}

.ov-run-name{font-size:13.5px;font-weight:800;white-space:nowrap}
.ov-run-meta{font-size:11px;opacity:.75;white-space:nowrap}
.ov-run-x{border:0;background:0;color:inherit;font-size:13.5px;font-weight:800;padding:6px 10px;cursor:pointer}
.ov-bar2{justify-content:space-between}

.ov-tab[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.ov-box-list{display:flex;flex-direction:column;max-height:300px;overflow:auto}
.ov-check{width:14px;font-weight:800}
.ov-pill{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ov-pill .ov-av{margin-right:0;width:18px;height:18px}
.ov-box{width:340px}

.ov-view{display:flex;align-items:center}

.ov-people{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.ov-week{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--meta)}
.ov-fresh{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--meta);white-space:nowrap;margin-left:auto}

.map-ms-label{position:absolute;left:0;top:0;height:20px;font-size:12.5px;font-weight:800;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-ms-reads{position:absolute;display:none;overflow:visible;pointer-events:none;z-index:5}
.map-ms:hover > .map-ms-reads{display:block}
.map-ms-reads path{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.6}
.map-node{position:absolute;width:192px;height:56px;cursor:pointer;color:var(--ink)}
.map-node > svg{position:absolute;left:0;top:0;overflow:visible}
.map-node .shape{fill:var(--bg);stroke:var(--line);stroke-width:1.2;transition:fill 350ms,stroke 350ms}
.map-ms[data-pass]{outline:1.5px dashed var(--line);outline-offset:6px}
.map-pass-btn{position:absolute;left:0;top:-30px;max-width:100%;z-index:2;border:0;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.map-lbl{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;font-size:12.5px;font-weight:700;overflow:hidden}
.map-lbl span:not([class]){overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.25}
.map-node[data-shape-kind="rhombus"] .map-lbl{justify-content:center;padding:0 34px;text-align:center}
.map-node[aria-pressed="true"] .shape{stroke:var(--ink);stroke-width:2.5}
.map-node .halo{fill:none;stroke-width:9;opacity:0}
.map-node[data-breathe] .halo{animation:map-breath 2.6s ease-in-out infinite}
@keyframes map-breath{0%,100%{opacity:.10}50%{opacity:.38}}
@media (prefers-reduced-motion:reduce){.map-node[data-breathe] .halo{animation:none;opacity:.25}}
.map-node[data-state="doable"],.map-node[data-state="doable_with_gap"]{color:var(--on-dark)}
.map-node[data-state="doable"] .shape,.map-node[data-state="doable_with_gap"] .shape,.map-node[data-state="doable"] .halo,.map-node[data-state="doable_with_gap"] .halo{fill:var(--do);stroke:var(--do)}
.map-node[data-state="doable"] .halo,.map-node[data-state="doable_with_gap"] .halo,.map-node[data-state="needs_yes"] .halo{fill:none}
.map-node[data-state="needs_yes"]{color:var(--on-dark)}
.map-node[data-state="needs_yes"] .shape{fill:var(--yes);stroke:var(--yes)}
.map-node[data-state="needs_yes"] .halo{stroke:var(--yes)}
.map-node[data-state="doable"] .halo,.map-node[data-state="doable_with_gap"] .halo{stroke:var(--do)}
.map-node[data-state="waiting"]{color:var(--wait-ink)}
.map-node[data-state="waiting"] .shape{fill:var(--bg-quiet);stroke:var(--wait)}
.map-node[data-state="blocked"]{color:var(--locked-ink)}
.map-node[data-state="blocked"] .shape{fill:var(--locked-bg);stroke:var(--locked);stroke-width:1.5}
.map-node[data-state="done"]{color:var(--done-ink)}
.map-node[data-state="done"] .shape{fill:var(--done-bg);stroke:var(--done-line)}
.map-node[data-state="done_outside"]{color:var(--done-ink)}
.map-node[data-state="done_outside"] .shape{fill:var(--bg);stroke:var(--done-line)}
.map-node[data-state="unknown"],.map-node[data-state="not_yet"]{color:var(--unknown-ink);font-style:italic}
.map-node[data-state="unknown"] .shape,.map-node[data-state="not_yet"] .shape{fill:var(--bg-page);stroke:var(--unknown-line);stroke-dasharray:4 4}
.map-node[data-state="skipped"],.map-node[data-state="ended_without_yes"]{color:var(--skip-ink)}
.map-node[data-state="skipped"] .shape,.map-node[data-state="ended_without_yes"] .shape{fill:var(--bg-page);stroke:var(--skip);stroke-dasharray:4 4}
.map-node[data-state="skipped"] .map-lbl,.map-node[data-state="ended_without_yes"] .map-lbl{text-decoration:line-through}
.map-node[data-item]{cursor:default}
.map-glyph{flex:none;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.map-lbl{gap:8px}
.map-edges path[data-tone="done"]{stroke:var(--done-line)}
.map-edges path[data-tone="waiting"]{stroke:var(--wait)}
.map-node [data-layer="grow"]{fill:var(--bg);stroke:var(--line)}
.map-ms[data-shape="growth"][data-ms-state="done"] [data-layer="grow"]{stroke:var(--done-line)}
.map-ms[data-shape="growth"][data-ms-state="waiting"] [data-layer="grow"]{stroke:var(--wait)}
.map-preview{flex:none;fill:currentColor}
.map-preview[data-ready="false"]{fill:none;stroke:currentColor;stroke-width:1.5}
.map-away{position:absolute;cursor:pointer}
.map-edge-add{position:absolute;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-size:13px;line-height:1;padding:0;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.map-canvas:hover .map-edge-add{opacity:.35}
.map-edge-add:hover,.map-edge-add:focus-visible{opacity:1}
@media (hover:none){.map-edge-add{opacity:.6}}
.map-away path{fill:none;stroke:var(--ink);stroke-width:1.8}
.map-more{margin-top:12px}
.map-empty{font-size:13.5px;color:var(--meta)}
.map-ms-label{cursor:pointer}
.map[data-dim] .map-node[data-act="open-moment"]:not([data-lit]),.map[data-dim] .map-ms:not([data-lit]) > .map-ms-label{opacity:.35;transition:opacity 150ms}
.map[data-dim] .map-ms[data-lit] > .map-ms-label{color:var(--ink)}
.map-node[data-lit] .shape{stroke-width:2.5}
.map-node:focus-visible{outline:2px solid var(--do);outline-offset:3px}
.map-now{margin-left:auto}
.map-mark,.map-who{flex:none;font-weight:800}
.map-who{margin-left:auto;opacity:.8}
.map-node[data-kind="effect"] .map-lbl{padding:0 18px}
.map-node[data-kind="gate"] .map-lbl{padding:0 20px}
.map-node[data-kind="decide"] .map-lbl{padding:0 34px;justify-content:center;text-align:center}
.map-phases{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.map-phase{background:var(--bg-field);border:1px solid var(--band-line);border-radius:var(--r-field);cursor:default}
.map-phase-head{display:flex;align-items:baseline;gap:8px;padding:4px 10px}
.map-canvas[data-lanes] .map-band{background:none;border:0}
.map-phase-name{font-weight:800;font-size:13.5px}
.map-phase-count{font-size:12.5px;color:var(--meta)}
.map-main{display:flex;gap:16px;align-items:flex-start}
.map-body{flex:1;min-width:0;overflow:auto}
.map-panel{flex:none;width:420px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:12px;background:var(--bg);border-radius:var(--r-card);padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.map-panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}

.map-more{position:relative}

.map-more-list{position:absolute;right:0;z-index:20;display:flex;flex-direction:column;gap:2px;min-width:220px;background:var(--bg);border-radius:var(--r-menu);padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.12)}

.map-store{list-style:none;margin:0;padding:0}

.map-how{margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.map-how-h{margin:0 0 4px;font-size:13px}
.map-how-line{margin:4px 0;font-size:12.5px;white-space:pre-wrap}

.map-tally{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.map-tally-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;max-width:9.5em;padding:2px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:12.5px;line-height:1.15}
.map-tally-n{font-weight:800}
.map-tally-form{flex:none;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line)}

.map-tally-form[data-form="waiting"]{background:var(--bg-quiet);border-color:var(--wait)}
.map-tally-form[data-form="blocked"]{background:var(--locked-bg);border-color:var(--locked)}
.map-tally-form[data-form="done"]{background:var(--done-bg);border-color:var(--done-line)}
.map-tally-form[data-form="unknown"]{border:1.5px dashed var(--unknown-line)}
.map-tally-form[data-form="skipped"]{border:1.5px dashed var(--skip)}
.map-search{margin-left:auto;position:relative;flex:0 1 240px;min-width:140px}
.map-search input{width:100%;box-sizing:border-box;padding:6px 36px 6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
.map-search kbd{position:absolute;right:10px;top:7px;color:var(--meta);font-size:12.5px}

.map-builds-on .sh-acts{display:flex;gap:8px;flex-wrap:wrap}

.map-builds-on .btn[data-default]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.map-builds-on .sh-default{font-weight:600;color:var(--meta)}
.map-builds-on .sh-meta{font-size:12.5px;font-weight:600;color:var(--meta)}

.mat{background:var(--bg);border-radius:var(--r-card);padding:16px 18px}
.mat-fold > summary{cursor:pointer;list-style:none}
.mat-h{font-size:14.5px;font-weight:800}
.mat-meta{font-size:12.5px;font-weight:600;color:var(--meta)}
.mat-empty{margin:8px 0 0;font-size:12.5px;color:var(--meta)}
.mat-group,.mat-sort{margin-top:14px}
.mat-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-bottom:8px}
.mat-things{display:flex;flex-wrap:wrap;gap:8px}
.mat-thing{max-width:100%;min-width:0;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:var(--r-field);background:var(--bg-field);font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.mat-thing:focus-visible,.mat-title:focus-visible,.mat-ph:focus-visible,.ads-img:focus-visible,.ads-body:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.mat-i{flex:none;color:var(--meta)}
.mat-ok{color:var(--done-ink);font-weight:800}
.mat-sheet{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mat-sheet-h{font-size:24px;font-weight:800;margin:0}
.mat-task{background:var(--bg);border-radius:var(--r-card);padding:16px 18px}
.mat-task-h{font-size:19px;font-weight:800;margin:0}
.mat-cards{display:flex;flex-direction:column;gap:6px}
.mat-card{background:var(--bg-field);border-radius:var(--r-field);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mat-title{display:inline-flex;gap:8px;align-items:center;border:0;background:none;padding:0;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.mat-ex{margin:4px 0 0;font-size:12.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-older summary{cursor:pointer}
.mat-old{display:block;border:0;background:none;padding:2px 0;font:inherit;font-size:12.5px;color:var(--do);cursor:pointer}
.mat-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.map-panel:has(.map-mat){width:min(640px,48vw)}
.mat-img{min-width:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mat-img .mat-n{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-thing .mat-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-ph,.ads-img{aspect-ratio:1 / 1;width:100%;border:0;border-radius:var(--r-field);background:var(--bg-quiet) center / cover no-repeat;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px}
.ads-ch{margin-top:12px}
.ads-grid{display:grid;gap:10px;align-items:start}
.ads-hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.ads-text{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.ads-body{border:0;background:var(--bg-field);border-radius:var(--r-field);padding:8px 10px;text-align:left;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.ads-img[data-approved]{box-shadow:inset 0 0 0 2px var(--done)}
.ads-none{align-self:center}
.rd-box{position:fixed;top:0;right:0;bottom:0;width:min(920px,100vw);overflow:auto;background:var(--bg-page);box-shadow:var(--shadow-pop);z-index:40}
.rd-box:empty{display:none}
.rd{padding:18px;display:flex;flex-direction:column;gap:12px}
.rd-bar a.btn,.rd-tools a.btn{text-decoration:none}
.rd-bar,.rd-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rd-title{font-size:19px;font-weight:800;flex:1}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;margin-bottom:8px;background:var(--bg-page);font-size:13.5px}
.rbar button{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r-field);padding:4px 11px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.rbar button[aria-pressed="true"]{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.rbar button:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.rbar .zv{font-size:12.5px;min-width:46px;text-align:center}
.rbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rd-pages{display:flex;flex-direction:column;align-items:safe center;gap:24px;padding:8px 0 30px;background:var(--bg-quiet);border-radius:var(--r-field)}
.rd-spread{display:flex;gap:24px;padding:0 12px}
.page{position:relative;box-sizing:border-box;background:var(--bg);padding:48px 34px;box-shadow:0 1px 1px rgba(29,31,36,.06),0 14px 34px -16px rgba(29,31,36,.28);overflow:hidden;overflow-wrap:anywhere;font-size:12.5px;font-weight:600;line-height:1.62;color:var(--ink)}
.page .run,.page .pno{position:absolute;left:34px;right:34px;font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .run{top:20px}
.page .pno{bottom:18px;text-align:right}
.page h1,.page h2,.page h3,.page h4{font-weight:800;color:var(--ink);letter-spacing:-.005em}
.page h1{font-size:24px;line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
.page h2{font-size:19px;line-height:1.3;margin:18px 0 4px}
.page h3{font-size:14.5px;line-height:1.35;margin:12px 0 2px;font-weight:600}
.page h4{font-size:12.5px;line-height:1.6;margin:8px 0 0;font-weight:600;font-style:italic}
.page h1 + h2,.page h2 + h3,.page h3 + h4{margin-top:4px}
.page p{margin:0 0 10px}
.page a{color:var(--do)}
.page code{font-size:11px;background:var(--bg-quiet);border-radius:4px;padding:0 3px}
.page .pli{padding-left:14px;position:relative;margin-bottom:3px}
.page .pli::before{content:"\u2013";position:absolute;left:0;color:var(--muted)}
.page .pli.num{padding-left:20px}
.page .pli.num::before{content:attr(data-n)}
.page hr{border:0;border-top:1px solid var(--band-line);margin:10px 0}
.page pre{font:inherit;font-size:11px;line-height:1.5;background:var(--bg-quiet);padding:6px 8px;border-radius:4px;white-space:pre-wrap;margin:0 0 10px}
.page blockquote{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);font-style:italic}
.ptable{margin:2px 0 12px}
.ptable table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.4;table-layout:fixed}
.ptable th,.ptable td{text-align:left;vertical-align:top;padding:3px 6px 4px 0;border-bottom:1px solid var(--band-line);overflow-wrap:anywhere}
.ptable th{font-weight:600;color:var(--ink);border-bottom-color:var(--line)}
.rd-img{display:block;max-width:100%;border-radius:var(--r-field);border:1px solid var(--band-line);cursor:zoom-in}
.rd-img:focus-visible{outline:2px solid var(--do);outline-offset:2px}
.rd-pdf{width:100%;height:80vh;border:1px solid var(--band-line);border-radius:var(--r-field)}
.rd-note{background:var(--bg);border-radius:var(--r-field);padding:10px 14px;box-shadow:inset 4px 0 0 var(--yes);font-size:13.5px;margin-bottom:8px}
.rd-file{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--band-line);border-radius:var(--r-field);max-width:640px}
.rd-ext{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:80px;padding:0 8px;box-sizing:border-box;border-radius:var(--r-field);background:var(--bg-quiet);font-size:13.5px;font-weight:800}
.lbx{position:fixed;inset:0;z-index:60;background:rgba(12,12,12,.92);overflow:hidden;touch-action:none}
.lbx img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab}
.lbx.drag img{cursor:grabbing}
.lbx .lbar{position:absolute;top:12px;right:12px;z-index:1;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.55);border-radius:var(--r-field);padding:4px 6px;color:var(--on-dark);font-size:13.5px}
.lbx .lbar button{background:none;border:0;color:var(--on-dark);font:inherit;font-weight:700;padding:4px 8px;border-radius:var(--r-field);cursor:pointer;white-space:nowrap}
.lbx .lbar button:hover{background:rgba(255,255,255,.15)}
.lbx .lbar .zv{min-width:44px;text-align:center}
.lbx .lcap{position:absolute;left:12px;bottom:12px;color:rgba(255,255,255,.8);font-size:13.5px;background:rgba(0,0,0,.45);border-radius:var(--r-field);padding:4px 8px}
.rd-edit{width:100%;border:0;background:var(--bg-field);border-radius:var(--r-field);padding:12px 14px;font:inherit;font-size:13.5px;color:var(--ink);resize:vertical}
.rd-failed{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:var(--r-field);padding:12px 14px;box-shadow:inset 4px 0 0 var(--late)}
.rd-failed .mat-empty{margin:0;flex:1;color:var(--ink)}
.mat-sorts{display:flex;gap:6px;flex-wrap:wrap}
.mat-sorts .btn[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}
.mat-sorts .btn[aria-pressed="true"] .mat-meta{color:var(--tip-line)}

.step-card{background:var(--bg);border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.purpose{margin:0;font-size:14.5px;font-weight:700}
.purpose.missing{font-size:12.5px;color:var(--meta);font-weight:600}
.lead{display:flex;flex-direction:column;gap:4px}
.lead-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.lead-t{margin:0;font-size:14.5px;font-weight:700}
.lead[data-lead=happens] .lead-t{font-size:13.5px;font-weight:600}
.lead.missing .lead-t{font-size:12.5px;color:var(--meta);font-weight:600}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.links-label{font-size:12.5px;font-weight:800;color:var(--meta);margin-right:4px}
.mlink-more{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--meta);white-space:nowrap}
.mlink-more::-webkit-details-marker{display:none}
.links-all{left:0;right:auto;flex-direction:row;flex-wrap:wrap;gap:6px;max-width:420px}
.mlink{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:transparent;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--do)}

.mlink.soft{border:1.5px dashed var(--tip-line)}
.tools{background:var(--bg);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:14px}
.tools-h,.pres-h{font-size:14.5px;font-weight:800}
.tool{display:flex;flex-direction:column;gap:8px}
.tool-q{font-size:12.5px;font-weight:800;color:var(--meta)}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src-tabs{display:flex;gap:4px;padding:3px;border-radius:var(--r-pill);background:var(--bg-quiet);align-self:flex-start}

.file-pick input{display:none}
.write{width:100%;box-sizing:border-box;border:1.5px solid var(--bg-quiet);border-radius:var(--r-field);padding:12px 14px;background:var(--bg-field);font:inherit;font-size:13.5px;resize:vertical}
.pill{height:28px;padding:0 11px;border:0;border-radius:var(--r-pill);background:var(--bg-quiet);font-size:12.5px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.av-empty{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;color:var(--muted)}
.pres{background:var(--bg);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px}
.pres-fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pres-fmt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:2px solid var(--bg-quiet);border-radius:var(--r-tip);background:var(--bg);text-align:left}
.pres-fmt .d{font-size:12.5px;color:var(--meta)}
.pres-pages{display:flex;flex-direction:column;gap:6px}
.pres-page{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.pres-thumb{flex:none;width:44px;aspect-ratio:16/9;background:var(--ink)}
.quick{width:360px;background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:8px}

.step:has(.ss-grid){max-width:1020px}
.ss{display:flex;flex-direction:column;gap:14px}
.ss-tags{display:flex;gap:8px;flex-wrap:wrap}
.ss-tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 11px;border-radius:var(--r-pill);background:var(--bg);font-size:12.5px;font-weight:700}
.ss-tag .k{color:var(--meta);font-weight:800}
.ss-tag.out{color:var(--late)}
.ss-card{background:var(--bg);border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.ss-io{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:8px;align-items:baseline}
.hk{font-size:12.5px;font-weight:800;color:var(--meta)}
.ss-chips{display:flex;gap:6px;flex-wrap:wrap}

.ss-bh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.ss-rules{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:8px;margin-top:10px}
.ss-ilist{margin:0;padding-left:18px}
.ss-moms{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ss-mom{display:flex;gap:8px;align-items:flex-start}

.ss-p{margin:0;white-space:pre-wrap}
.ss-do{display:flex;gap:12px}
.ss-margin{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.ss-mh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-top:10px}
.link{border:0;background:transparent;padding:0;font:inherit;font-weight:800;color:var(--do);cursor:pointer;text-align:left;white-space:nowrap}

.tm-seg{display:flex;gap:4px;padding:3px;border-radius:var(--r-pill);background:var(--bg-quiet)}
.tm-opt{height:28px;padding:0 11px;border:0;border-radius:var(--r-pill);background:transparent;font-size:12.5px;font-weight:800;color:var(--meta);white-space:nowrap;cursor:pointer}
.tm-opt[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.tm-nav{display:flex;gap:4px}
.tm-sheet{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:6px 0;overflow:hidden}
.tm-axis-row{display:grid;grid-template-columns:var(--tm-cols);gap:6px;padding:0 18px 0 12px;height:34px;align-items:center;border-bottom:1px solid var(--bg-quiet)}
.tm-axis-label{grid-column:1 / 4;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.tm-axis{position:relative;height:34px;overflow:hidden}
.tm-tick{position:absolute;top:0;bottom:0;padding:9px 0 0 6px;border-left:1px solid var(--bg-quiet);font-size:11px;font-weight:800;color:var(--meta);white-space:nowrap}
.tm-list{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:6px 0;margin:0;list-style:none}
.tm-sheet .tm-list{background:none;box-shadow:none;border-radius:0;padding:0}
.tm-item{border-top:1px solid var(--bg-quiet)}
.tm-item:first-child{border-top:0}
.tm-head{display:flex;gap:10px;align-items:baseline;padding:12px 18px 4px;font-size:13.5px;font-weight:800}
.tm-row{display:grid;grid-template-columns:var(--tm-cols);align-items:center;gap:6px;min-height:50px;padding:0 18px 0 12px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.tm-row:hover{background:var(--bg-field)}
.tm-text{display:flex;flex-direction:column;min-width:0}
.tm-name{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-meta{display:flex;gap:8px;font-size:12.5px;font-weight:600;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-text .tm-meta{flex-wrap:wrap;gap:0 8px;white-space:normal;overflow:visible}
.tm-text .tm-meta>*{white-space:nowrap}
.tm-due{font-weight:700}
.tm-late{font-weight:800;color:var(--late)}
.tm-none{color:var(--muted)}
.tm-line{position:relative;height:40px;overflow:hidden}
.tm-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--do)}
.tm-band{position:absolute;top:8px;height:24px;box-sizing:border-box;background:var(--bg-field);border:1px solid var(--skip);border-radius:var(--r-field)}
.tm-bar{position:absolute;top:15px;height:10px;background:var(--ink);opacity:.25;border-radius:var(--r-field)}
.tm-bar[data-urgency="3"]{background:var(--late);opacity:1}
.tm-bar[data-progress]{background:var(--do);opacity:1}
.tm-extband{position:absolute;top:26px;height:5px;background:var(--wait);border-radius:var(--r-field)}
.tm-rh{position:absolute;top:14px;width:12px;height:12px;margin-left:-6px;display:flex}
.tm-rh svg{fill:var(--ink)}
.tm-rh[data-urgency="3"] svg{fill:var(--late)}
.tm-edge{position:absolute;top:12px;font-size:12.5px;font-weight:800;color:var(--meta)}
.tm-edge[data-edge=before]{left:2px}
.tm-edge[data-edge=after]{right:2px}
.tm-who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tm-av{flex:none;width:16px;height:16px;border-radius:var(--r-pill);background:var(--bg-quiet);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center}
.tm-av[data-avatar="none"]{background:transparent;border:1.5px dashed var(--muted);box-sizing:border-box;color:var(--muted)}
.tm-av path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.tm-item[data-folds]{position:relative}
.tm-fold{position:absolute;left:0;top:17px;width:16px;height:16px;padding:0;border:0;background:transparent;color:var(--meta);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.tm-fold path,.tm-state{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tm-mo .tm-row{min-height:40px;cursor:default;background:var(--bg-field)}
.tm-mo-open{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tm-mo .tm-name{font-weight:700}
.tm-state{justify-self:center;width:10px;height:10px;border-radius:3px;background:var(--skip)}
.tm-state[data-state=doable],.tm-state[data-state=doable_with_gap]{background:var(--do)}
.tm-state[data-state=needs_yes]{background:var(--yes)}
.tm-state[data-state=done],.tm-state[data-state=done_outside]{background:var(--done)}
.tm-state[data-state=waiting]{background:var(--wait)}
.tm-mobar{opacity:.5;cursor:grab;touch-action:none}
.tm-nospan{position:absolute;top:12px;left:4px;border:1px dashed var(--skip);border-radius:var(--r-pill);background:transparent;padding:0 8px;font-size:12.5px;font-weight:700;color:var(--meta);white-space:nowrap;cursor:pointer}
.tm-edge-grip{position:absolute;top:-4px;bottom:-4px;width:8px;cursor:ew-resize}
.tm-edge-grip[data-edge=start]{left:-4px}
.tm-edge-grip[data-edge=end]{right:-4px}
.tm-mobar[data-staged]{opacity:1;background:transparent;border:1.5px dashed var(--do);box-sizing:border-box}
.tm-staged{font-weight:800;color:var(--ink)}
.tm-follow{font-size:12.5px;font-weight:700;color:var(--meta);white-space:nowrap}
.tm-mo{position:relative}
.tm-card{position:absolute;left:56px;right:18px;top:calc(100% - 4px);z-index:5;margin:0;padding:12px;background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.tm-card-head,.tm-card-btns,.tm-pick{grid-column:1 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tm-card-head .tm-name{flex:1}
.tm-card>.tm-meta:first-of-type{grid-column:1 / -1}
.tm-lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.tm-card .btn,.tm-foot .btn{white-space:nowrap}
.tm-foot{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card)}
.tm-chip{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--bg-quiet)}
.tm-foot-btns{margin-left:auto;display:flex;gap:6px}

.cal{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em}
.cal-week{font-size:13.5px;font-weight:700;color:var(--meta);white-space:nowrap}
.cal-nav{display:inline-flex;gap:4px;margin-left:auto}
.cal-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.cal-grid{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px;display:grid;grid-template-columns:36px repeat(var(--cols),minmax(0,1fr));gap:6px}
.cal-hours{position:relative;height:396px;margin-top:46px}
.cal-hour{position:absolute;left:0;font-size:11px;font-weight:700;color:var(--muted);transform:translateY(-50%)}
.cal-day{display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-dhead{display:flex;flex-direction:column;gap:4px;height:40px}
.cal-dname{font-size:12.5px;font-weight:800;white-space:nowrap}
.cal-day[data-today] .cal-dname{color:var(--do)}
.cal-meter{height:4px;border-radius:var(--r-pill);background:var(--bg-quiet);overflow:hidden}
.cal-meter>span{display:block;height:100%;background:var(--do)}
.cal-col{position:relative;height:396px;background:var(--bg-field);border-radius:10px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--bg-quiet) 43px,var(--bg-quiet) 44px)}
.cal-pass{position:absolute;left:3px;right:3px;border:0;border-radius:8px;background:var(--do);color:var(--bg);text-align:left;padding:4px 7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cal-pass[data-meeting]{background:repeating-linear-gradient(135deg,var(--bg-quiet) 0,var(--bg-quiet) 6px,var(--bg-field) 6px,var(--bg-field) 12px);color:var(--ink);outline:1.5px solid var(--skip);outline-offset:-1.5px}
.cal-pass[data-tentative]{background:var(--bg);color:var(--ink);outline:1.5px dashed var(--do);outline-offset:-1.5px}
.cal-pass[data-blocked]{cursor:default}
.cal-pname{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-pmeta{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.cal-side{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px;display:flex;flex-direction:column;gap:6px}
.cal-side-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cal-seg{display:flex;gap:4px;padding:3px;border-radius:var(--r-pill);background:var(--bg-quiet)}
.cal-opt{height:28px;padding:0 11px;border:0;border-radius:var(--r-pill);background:transparent;font-size:12.5px;font-weight:800;color:var(--meta);white-space:nowrap;cursor:pointer}
.cal-opt[aria-pressed=true]{background:var(--bg);color:var(--ink)}

.cal-pass[draggable=true],.cal-item[draggable=true]{cursor:grab}
.cal-grip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.cal-group{display:flex;flex-direction:column;gap:4px}
.cal-ghead{display:flex;justify-content:space-between;gap:8px;padding:6px 2px 2px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cal-gmeta{color:var(--meta);white-space:nowrap}
.cal-layout{align-self:flex-start;white-space:nowrap}
.cal-preview{background:var(--bg-field);border-radius:var(--r-field);padding:10px;display:flex;flex-direction:column;gap:4px}
.cal-plist{margin:0;padding-left:16px;font-size:12.5px}
.cal-pbtns{display:flex;gap:6px}.cal-pbtns .btn{white-space:nowrap}
.cal-check{flex:none;margin:3px 0 0}
.cal-itext{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-month{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-mday{border:0;background:var(--bg-field);border-radius:10px;padding:8px;min-height:72px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.cal-mday[data-other]{opacity:.5}
.cal-mday[data-today] .cal-dname{color:var(--do)}
.cal-item{border:0;background:var(--bg-field);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:row;align-items:flex-start;gap:8px;cursor:pointer;width:100%;box-sizing:border-box}
.cal-item:hover{background:var(--bg-quiet)}
.cal-iname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta{font-size:12.5px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta[data-late]{color:var(--late)}
.cal-note{font-size:12.5px;color:var(--meta)}
@media (max-width:760px){.cal-body{grid-template-columns:minmax(0,1fr)}}

.pr{max-width:860px;margin:0;display:flex;flex-direction:column;gap:12px}
.pr-head{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr-f{display:flex;flex-direction:column;gap:4px}
.pr-in,.pr select{font:inherit;font-size:13.5px;border:0;border-radius:var(--r-field);background:var(--bg-field);padding:8px 10px;color:var(--ink);flex:1;min-width:0}

.ap-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

.walk-back{position:fixed;inset:0;background:rgba(31,35,48,.32);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px 16px 88px}
.receipt{z-index:70}
.walk{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--shadow-pop);width:min(640px,100%);max-height:calc(100vh - 104px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}

.walk-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.walk-sub{font-size:12.5px;color:var(--meta)}
.walk-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.walk-p{margin:0;font-size:13.5px}
.walk-bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.sht{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(640px,100%);background:var(--bg-page);box-shadow:var(--shadow-pop);display:flex;flex-direction:column}
.sht-head{display:flex;align-items:center;gap:8px;padding:16px 20px 8px}
.sht-label{flex:1;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.sht-body{flex:1;overflow:auto;padding:0 20px 24px;display:flex;flex-direction:column;gap:10px}
.sht-title{font-size:19px;font-weight:800;margin:0}
.sht-line{font-size:12.5px;color:var(--meta);margin:0}
.sht-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin:8px 0 0}
.sht-card{background:var(--bg);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sht-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sht-name{font-size:13.5px;font-weight:800}
.sht-meta{font-size:12.5px;color:var(--meta)}
.sht-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sht-tabs{display:flex;gap:4px;flex-wrap:wrap}
.sht-tab{border:0;background:var(--bg-quiet);border-radius:var(--r-pill);padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.sht-tab[aria-selected=true]{background:var(--ink);color:var(--on-dark)}
.sht-in{border:0;background:var(--bg-field);border-radius:var(--r-field);padding:8px 12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);width:100%;box-sizing:border-box}
.sht-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sht-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--meta)}
.sht-pill{font-size:12.5px;font-weight:700;background:var(--bg-quiet);border-radius:var(--r-pill);padding:2px 8px}
.sht-link{border:0;background:0;padding:0;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:underline;cursor:pointer}

.fl{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl-tools .btn,.fl-chips .btn,.fl-folders .btn{white-space:nowrap}
.fl-tools .btn[aria-pressed="true"],.fl-chips .btn[aria-pressed="true"],.fl-folders .btn[aria-pressed="true"]{background:var(--ink);color:var(--on-dark)}
.fl-q{flex:1 1 240px;min-width:0;border:0;background:var(--bg-field);border-radius:var(--r-field);padding:8px 12px;font:inherit;font-size:13.5px;color:var(--ink)}
.fl-chips{display:flex;gap:6px;flex-wrap:wrap}
.fl-body{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:14px;align-items:start}
.fl-folders{background:var(--bg);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:4px}
.fl-folders .btn{justify-content:space-between;display:flex;gap:8px;text-align:left;overflow:hidden;text-overflow:ellipsis}
.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fl-card{min-width:0;display:flex;flex-direction:column;gap:4px;border:0;background:var(--bg);border-radius:var(--r-card);padding:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}

:root{--bg-page:#f6f3ee;--bg:#ffffff;--bg-field:#fbf9f5;--bg-quiet:#f1eee7;--ink:#1f2330;--meta:#6b6e76;--muted:#8a8c93;
--do:#2a3f66;--yes:#de9a33;--late:#c4312a;--done:#7fa86b;--wait:#b4a88d;--skip:#d8d2c6;--claude:#6647b0;--off:#dcd8cf;--tip-line:#b9bcc6;
--r-card:18px;--r-menu:16px;--r-tip:14px;--r-field:12px;--r-pill:999px;

@media (prefers-reduced-motion:reduce){:root{--motion:0ms}}
body{margin:0;background:var(--bg-page);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.btn,.menu-item{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;font-size:13.5px;font-weight:700;border-radius:12px;padding:8px 14px;transition:background var(--motion)}
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{background:var(--bg-quiet);color:var(--ink)}
.btn.icon-only{padding:8px 10px;list-style:none}
.btn.icon-only::-webkit-details-marker{display:none}
.actions{display:flex;align-items:center;gap:8px}
.actions.empty .why{margin:0;font-size:12.5px;color:var(--meta)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;z-index:20;background:var(--bg);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;display:flex;flex-direction:column}
.menu-item{background:transparent;justify-content:flex-start;width:100%;font-weight:600}
.menu-item:hover{background:var(--bg-quiet)}
.menu-item .lbl{flex:1;text-align:left}
.quiet-row{padding:8px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sev{flex:none;color:currentColor}
.menu-item .sev{color:var(--meta)}
.ic{flex:none}
.disc{border-radius:12px;background:var(--bg-field)}
.disc-sum{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:700;list-style:none}
.disc-sum::-webkit-details-marker{display:none}
.disc-body{padding:0 14px 12px;font-size:13.5px}
.tip{width:264px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-pop)}
.tip-title{font-size:13.5px;font-weight:800}
.tip-line{font-size:12.5px;color:var(--tip-line);margin-top:2px}
.tip-list{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.tip-list li{display:flex;justify-content:space-between;gap:12px}
