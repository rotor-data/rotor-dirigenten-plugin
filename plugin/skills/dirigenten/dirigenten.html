          return `<div class="tbarr clus${b.w === me ? " mine" : ""}" data-act="time-cluster" data-k="${esc(b.key)}" style="left:${pct(b.a)};width:${pct(b.z - b.a)};top:${b.lane * 30 + 4}px" title="${esc(title)}">`
            + `<span class="cn">${b.bars.length}</span><span class="bn">${fits(b) ? esc(b.bars.map((x) => x.st.n).join(", ")) : ""}</span></div>`;
        }
        const k = b.key, draft = !!T.changes[k] || b.how, sel = !!T.sel[k];
        const fill = b.h ? Math.min(1, b.h / (workdaysIn(tl, b.s, b.e) * 8)) : 0;
        const cls = ["tbarr", b.st.dn ? "done" : "", b.st.x ? "cust" : "", b.w === me ? "mine" : "", draft ? "draft" : "", sel ? "sel" : "", b.st.lk ? "locked" : "", b.unf ? "unf" : ""].filter(Boolean).join(" ");
        const can = !b.st.dn && !b.st.lk && !b.st.x;
        const title = `${b.st.n} · ${b.t.n} · ${b.s === b.e ? shortIso(b.s) : `${shortIso(b.s)}–${shortIso(b.e)}`}${b.h ? ` · ${hh(b.h)} h` : ""}${b.to ? ` · föreslås för ${nameOf(b.to)}` : ""}${b.st.lk && !b.st.dn ? " · bokat, flyttas inte här" : ""}`;
        return `<div class="${cls}" data-ctx="step|${esc(b.t.id)}|${esc(b.st.id)}"${can ? ` data-bar="${esc(k)}" data-part="body"` : ""} style="left:${pct(b.a)};width:${pct(b.z - b.a)};top:${b.lane * 30 + 4}px" title="${esc(title)}">`
          // En smal stapel har inte plats för namnet; timbrickan står när den får plats, annars i rutan som hovras.
          + `<span class="bn">${b.unf ? `${esc(b.st.n)} <span class="mmeta">· ${esc(b.t.n)}</span>` : fits(b) ? esc(b.st.n) : ""}</span>${b.h && b.z - b.a >= 3 ? `<span class="hb"${can ? ` data-bar="${esc(k)}" data-part="hours"` : ""}>${hh(b.h)} h</span>` : ""}`
          + (can ? `<span class="edge" data-bar="${esc(k)}" data-part="edge"></span>` : "") + `<span class="fill" style="width:${(fill * 100).toFixed(1)}%"></span></div>`;
      };
      const lane = g.person ? ` data-lane-person="${esc(g.person)}"` : "";
      const head1 = `<div class="tln">${esc(g.label)}${g.person === me ? " (du)" : ""}</div><div class="mmeta">${esc(sub)}</div>`;
      // Per leverans utan underrader: en rad som förut.
      if (!g.person) return `<div class="tgrid trow"><div class="tl">${head1}</div>`
        + `<div class="tt tracks" style="height:${g.lanes * 30 + 10}px">${cols}${todayLine}${strip}${(g.subs[0]?.items || []).map(barHtml).join("")}</div></div>`;
      const opened = (x) => Object.keys(T.open || {}).filter((k) => T.open[k] && k.startsWith(`c:${x.id}|`));
      const subs = g.subs.map((x) => `<div class="tgrid trow tsub"${lane}><div class="tl"><div class="tsn" title="${esc(x.label)}">${esc(x.label)}</div>`
        + (opened(x).length ? `<button class="link" data-act="time-fold" data-ks="${esc(opened(x).join(" "))}">fäll ihop</button>` : "") + `</div>`
        + `<div class="tt tracks" style="height:${x.lanes * 30 + 6}px">${cols}${todayLine}${x.items.map(barHtml).join("")}</div></div>`).join("");
      return `<div class="tgrid trow tper"${lane}><div class="tl">${head1}</div><div class="tt tracks" style="height:${subs ? 14 : 40}px">${cols}${todayLine}${strip}</div></div>${subs}`;
    }).join("");
    const hint = T.drag?.hint ? `<div class="dhint">${esc(T.drag.hint)}</div>` : "";
    return bar + help + `<div class="tbox">${head}${rows || `<div class="mmeta" style="padding:16px 12px">Inget planerat i fönstret.</div>`}</div>${hint}`;
  }

  /** ◐-raden i underkant: vad utkastet gör med leveransen och belastningen. */
  function timeFooter() {
    const T = S.time;
    if (S.body !== "time" || !T?.tl) return "";
    const list = changeList();
    if (!list.length) return "";
    const res = consequences(), tl = T.tl, base = T.memo.base;
    // Bara det ändringen gör: det som redan var sent eller överbelastat står i raderna, inte här.
    const was = new Map(base.tasks.map((t) => [t.id, t]));
    const lines = [];
    for (const d of res.deliveries) if (d.finish !== d.was) lines.push(`${rowOf(d.id)?.label || "Leveransen"} blir klar ${dayLabel(d.finish)} (var ${dayLabel(d.was)}).`);
    for (const t of res.tasks) if (!taskOf(tl, t.id)?.d && t.finish !== t.was) lines.push(`${taskOf(tl, t.id)?.n || t.id} blir klar ${dayLabel(t.finish)} (var ${dayLabel(t.was)}).`);
    const late = res.tasks.filter((t) => t.late_by > (was.get(t.id)?.late_by ?? 0));
    for (const t of late) lines.push(`${taskOf(tl, t.id)?.n || t.id} spricker med ${t.late_by} ${t.late_by === 1 ? "dag" : "dagar"} — ett nytt löfte.`);
    for (const t of res.tasks) { const b = was.get(t.id)?.late_by ?? 0;
      if (t.late_by < b) lines.push(`${taskOf(tl, t.id)?.n || t.id} ${t.late_by ? `spricker med ${t.late_by} i stället för ${b} dagar` : "håller nu"}.`); }
    if (!late.length) lines.unshift("Leveranserna håller.");
    const byWho = new Map();
    for (const o of res.overloaded.filter((x) => x.new)) { if (!byWho.has(o.who)) byWho.set(o.who, []); byWho.get(o.who).push(o); }
    for (const [who, os] of byWho) lines.push(`${nameOf(who)} blir över dagens tid ${os.map((o) => dayLabel(o.day)).join(", ")}.`);
    const gone = (T.memo?.base?.overloaded || []).filter((o) => !res.overloaded.some((x) => x.who === o.who && x.day === o.day));
    const goneBy = new Map(); for (const o of gone) { if (!goneBy.has(o.who)) goneBy.set(o.who, []); goneBy.get(o.who).push(o); }
    for (const [who, os] of goneBy) lines.push(`${nameOf(who)} är inte längre över dagens tid ${os.map((o) => dayLabel(o.day)).join(", ")}.`);
    const known = new Set(base.conflicts.map((c) => `${c.task}|${c.step}|${c.waits_on}`));
    for (const c of res.conflicts.filter((x) => !known.has(`${x.task}|${x.step}|${x.waits_on}`))) { const t = taskOf(tl, c.task); const n = (id) => t?.steps.find((x) => x.id === id)?.n || id;
      lines.push(`«${n(c.step)}» börjar innan «${n(c.waits_on)}» är klart.`); }
    for (const c of list.filter((x) => x.to)) { const st = taskOf(tl, c.task)?.steps.find((x) => x.id === c.step);
      lines.push(`«${st?.n || c.step}» flyttas till ${nameOf(c.to)} först när ${nameOf(c.to)} tagit emot. Tills dess står det hos ${nameOf(st?.w)}.`); }
    const n = list.length;
    return `<div class="tfoot" role="region" aria-label="Ändringar som inte är genomförda"><div class="tf1"><span class="ci">◐</span><b>${n} ${n === 1 ? "ändring" : "ändringar"}, inte ${n === 1 ? "genomförd" : "genomförda"}</b>`
      + `<button class="quiet" data-act="time-clear">Ångra ändringarna</button><button class="go" data-act="time-commit">◐ ${esc(timeVerb(list))}</button></div>`
      + `<div class="tf2">${lines.slice(0, 6).map((l) => `<div>${esc(l)}</div>`).join("")}${lines.length > 6 ? `<div class="mmeta">och ${lines.length - 6} till.</div>` : ""}</div></div>`;
  }
  /** Knappen heter det den gör (BESLUT 2). */
  function timeVerb(list) {
    const to = list.filter((c) => c.to), moved = list.filter((c) => c.start || c.end), hrs = list.filter((c) => c.hours !== undefined);
    if (to.length === list.length && new Set(to.map((c) => c.to)).size === 1) return `Föreslå ${nameOf(to[0].to)}`;
    if (moved.length === list.length) return `Flytta ${list.length} steg`;
    if (hrs.length === list.length) return `Ändra timmarna på ${list.length} steg`;
    return `Genomför ${list.length} ändringar`;
  }
  function commitTime() {
    const list = changeList();
    if (!list.length) return;
    previewTime(list, timeVerb(list), () => { const T = timeState(); T.changes = {}; T.sel = {}; loadTimeline(); });
  }

  /* Dra i stapeln: räknas lokalt, en omritning per bildruta. */
  function trackWidth() { const el = root.querySelector?.(".tracks"); const w = el?.getBoundingClientRect?.().width; return w > 0 ? w : 900; }
  function dragStart(e) {
    const el = e.target?.closest?.("[data-bar]");
    if (!el || S.body !== "time" || e.button === 2) return false;
    const T = timeState(), key = el.getAttribute("data-bar"), part = el.getAttribute("data-part") || "body";
    const [task, step] = key.split("|");
    const st = taskOf(T.tl, task)?.steps.find((x) => x.id === step);
    if (!st) return false;
    const res = consequences();
    const keys = T.sel[key] && part === "body" ? Object.keys(T.sel) : [key];
    const orig = Object.fromEntries(keys.map((k) => { const [a, b] = k.split("|"); const t = taskOf(T.tl, a), s = t?.steps.find((x) => x.id === b);
      return [k, s ? placed(res, t, s) : null]; }).filter(([, v]) => v));
    T.drag = { key, part, x: e.clientX, y: e.clientY, shift: !!e.shiftKey, moved: false, dw: trackWidth() / T.tl.days, orig, keys: Object.keys(orig), hint: "" };
    e.preventDefault?.();
    return true;
  }
  function dragMove(e) {
    const T = S.time, d = T?.drag;
    if (!d) return;
    const dx = Math.round((e.clientX - d.x) / d.dw), dy = e.clientY - d.y;
    if (!d.moved && Math.abs(e.clientX - d.x) < 3 && Math.abs(dy) < 3) return;
    d.moved = true;
    const [task, step] = d.key.split("|");
    if (d.part === "hours") {
      const o = d.orig[d.key];
      const h = Math.max(0.25, Math.round(((o.h || 0) - dy / 6) * 4) / 4);
      draftSet(task, step, { hours: h });
      d.hint = `${hh(h)} h`;
    } else if (d.part === "edge") {
      const o = d.orig[d.key];
      const end = isoAdd(o.e, dx) < o.s ? o.s : isoAdd(o.e, dx);
      draftSet(task, step, { start: o.s, end });
      d.hint = `Spannet ${shortIso(o.s)}–${shortIso(end)}`;
    } else {
      for (const k of d.keys) { const o = d.orig[k], [a, b] = k.split("|");
        draftSet(a, b, dx ? { start: isoAdd(o.s, dx), end: isoAdd(o.e, dx) } : { start: o.s, end: o.e }); }
      const lane = T.group === "person" ? e.target?.closest?.("[data-lane-person]")?.getAttribute("data-lane-person") : null;
      const owner = d.orig[d.key].w;
      const to = lane && lane !== owner ? lane : null;
      for (const k of d.keys) { const [a, b] = k.split("|"); draftSet(a, b, { to }); }
      d.hint = to ? `Lämna över till ${nameOf(to)}` : dx ? `${dx > 0 ? "+" : "−"}${Math.abs(dx)} ${Math.abs(dx) === 1 ? "dag" : "dagar"}` : "";
    }
    schedule();
  }
  function dragEnd() {
    const T = S.time, d = T?.drag;
    if (!d) return;
    T.drag = null;
    if (!d.moved) { // ett klick: ⇧ väljer flera, annars väljs bara den
      if (d.shift) { const sel = { ...T.sel }; if (sel[d.key]) delete sel[d.key]; else sel[d.key] = true; T.sel = sel; }
      else T.sel = {};
    }
    render();
  }
  let frame = 0;
  const schedule = () => { if (frame) return; const raf = globalThis.requestAnimationFrame || ((f) => setTimeout(f, 16));
    frame = raf(() => { frame = 0; render(); }); };

  /* ── Aktuellt utan att hämta allt (FAS1 1.6, BESLUT 13) ──
     Vyn håller en kopia och en markör: senaste löpnumret den sett. Kollen
     (plan_state { format: "seq", since_seq }) är några byte; först när den säger
     att något hänt hämtas skillnaden (plan_state { since_seq }), och bara det som
     syns och har ändrats läses om. Kopian ligger i webbläsaren, så att ett
     återbesök visar läget direkt. */
  const MEMORY = "v6.overview";
  /* Kopian gäller bara sidan som sparade den: en ny utläggning kan ha ändrat
     radernas form, så en kopia från en annan sida läses om (Daniel P såg
     stegnamnen kvar efter #355). Sidans längd räcker som avtryck. */
  const BUILD = String(globalThis.document?.documentElement?.outerHTML?.length ?? 0);
  function remember() {
    try { globalThis.localStorage?.setItem(MEMORY, JSON.stringify({ build: BUILD, at: S.fetchedAt, seq: S.seq, data: S.data })); } catch { /* full eller stängd */ }
  }
  function recall() {
    try { const m = JSON.parse(globalThis.localStorage?.getItem(MEMORY) || "null"); return m?.data?.rows && m.build === BUILD ? m : null; } catch { return null; }
  }
  function forget() { try { globalThis.localStorage?.removeItem(MEMORY); } catch { /* stängd */ } }

  /* ── Kön (BESLUT 11): ● som görs när dirigenten inte svarar sparas här och
     skickas i ordning när den svarar igen. Varje ändring bär markören den
     gjordes mot; har någon annan ändrat samma steg sedan dess är det en krock,
     och vyn visar båda och frågar. ◐ och ■ köas inte: de kräver förhandsvisning. */
  const OUTBOX = "v6.outbox";
  let outbox = [];
  try { const q = JSON.parse(globalThis.localStorage?.getItem(OUTBOX) || "[]"); if (Array.isArray(q)) outbox = q; } catch { /* stängd */ }
  const saveOutbox = () => { try { if (outbox.length) globalThis.localStorage?.setItem(OUTBOX, JSON.stringify(outbox)); else globalThis.localStorage?.removeItem(OUTBOX); } catch { /* full eller stängd */ } };
  /** Anropet nådde inte fram (nät, server nere), till skillnad från att servern sa nej. */
  const unreachable = (e) => !!e && (e.code === "NETWORK" || /^HTTP_5/.test(e.code || "") || (!e.code && /svarar inte|fetch|network|timeout/i.test(e.message || "")));
  const offline = () => !!S.error && S.error.code !== "NO_SESSION" && S.error.code !== "NOT_CONNECTED" && !!S.data;
  const outboxText = (x) => x.kind === "done" ? `«${x.label}» klart` : x.on ? `«${x.label}» i Igång` : `«${x.label}» ur Igång`;
  /** Köade ●-ändringar i Igång syns som om de gjorts, märkta «väntar på att skickas». */
  function overlayOutbox() {
    if (!S.data) return;
    let running = (S.data.running || []).filter((x) => !x.queued);
    for (const x of outbox) { if (x.party !== S.data.party?.id || x.kind !== "focus") continue;
      const k = runKey(x.task, x.step);
      running = running.filter((y) => runKey(y.task, y.step) !== k);
      if (x.on) { const row = S.data.rows.find((r) => r.tasks.includes(x.task));
        running.push({ task: x.task, step: x.step, label: x.label, delivery_label: row?.kind === "delivery" ? row.label : null, pending: true, queued: true }); } }
    S.data = { ...S.data, running };
  }
  function queue(x) {
    const item = { ...x, party: S.data?.party?.id || null, seq: S.seq, at: Date.now() };
    // Samma steg och samma sorts ändring igen: den senaste gäller, och ⊕ följt av × tar ut varandra.
    const same = outbox.findIndex((y) => y.kind === x.kind && y.task === x.task && y.step === x.step);
    if (same >= 0 && x.kind === "focus" && outbox[same].on !== x.on) outbox.splice(same, 1);
    else { if (same >= 0) outbox.splice(same, 1); outbox.push(item); }
    saveOutbox(); overlayOutbox();
    say(`${outboxText(x)} väntar på att skickas. Det skickas när dirigenten svarar.`);
    render();
  }
  let flushing = false;
  /** Skicka kön i ordning. En krock stoppar kön tills personen valt. */
  async function flushOutbox() {
    if (flushing || S.clash || !S.data || S.error) return;
    const mine = S.data.party?.id;
    const other = outbox.filter((x) => x.party && x.party !== mine);
    if (other.length) { outbox = outbox.filter((x) => !other.includes(x)); saveOutbox(); } // en annan persons kö skickas aldrig härifrån
    if (!outbox.length) return;
    flushing = true;
    let sent = 0;
    try {
      while (outbox.length) {
        const x = outbox[0];
        if (!x.force && typeof x.seq === "number") {
          const d = await call("plan_state", { since_seq: x.seq });
          const theirs = d && (d.events || 0) > (d.own || 0);
          if (d?.reload || (theirs && (d.steps || []).includes(runKey(x.task, x.step)))) { S.clash = { item: x, now: stepNow(x) }; break; }
        }
        try {
          await call("execute_step", x.kind === "done" ? { task: x.task, step: x.step, mark: "done" } : { task: x.task, step: x.step, focus: x.on });
          sent++;
        } catch (e) {
          if (unreachable(e)) { S.error = e; break; }
          say(`${outboxText(x)} gick inte att skicka: ${e.message || e}. Det är borttaget ur kön.`, null, true);
        }
        outbox.shift(); saveOutbox();
      }
    } catch (e) { if (unreachable(e)) S.error = e; }
    flushing = false;
    if (sent) { say(`${sent} ${sent === 1 ? "ändring" : "ändringar"} som väntade är ${sent === 1 ? "skickad" : "skickade"}.`); refreshSoon(); }
    overlayOutbox(); render();
  }
  /** Läget i dirigenten nu för ett köat steg, ur översikten som just lästes. */
  function stepNow(x) {
    const run = (S.data?.running || []).some((y) => !y.queued && y.task === x.task && y.step === x.step);
    for (const r of S.data?.rows || []) { const i = r.tasks.indexOf(x.task); if (i < 0) continue;
      const st = r.steps.find((y) => y[0] === i && y[1] === x.step);
      if (st) return `${STATE[st[3]] || st[3]}${run ? ", i Igång" : ""}`; }
    return run ? "i Igång" : "ändrat av någon annan";
  }
  function clashHtml() {
    const c = S.clash;
    if (!c) return "";
    return `<div class="banner clash" role="alertdialog" aria-label="Krock"><span style="flex:1;min-width:260px"><b>Någon annan har ändrat samma steg medan dirigenten inte svarade.</b>`
      + ` Din ändring: ${esc(outboxText(c.item))}. I dirigenten nu: «${esc(c.item.label)}» ${esc(c.now)}. Vad ska gälla?</span>`
      + `<button data-act="clash-mine">Skicka min ändring</button><button data-act="clash-theirs">Behåll deras, släng min</button></div>`;
  }
  function outboxHtml() {
    const q = outbox.filter((x) => x.party === S.data?.party?.id);
    if (!q.length) return "";
    return `<div class="updating outbox"><span class="bdot" style="background:var(--t3)"></span>Väntar på att skickas: ${q.map((x) => esc(outboxText(x))).join(" · ")}</div>`;
  }

  /** Hela översikten, med markören tagen före, så att inget som händer under tiden tappas. */
  async function fetchOverview(seqBefore) {
    const seq = seqBefore ?? (await call("plan_state", { format: "seq" }))?.seq;
    const d = await call("plan_state", { agenda: true, format: "oversikt" });
    if (!d?.overview) throw Object.assign(new Error("Svaret saknade översikten."), { code: "SHAPE" });
    const mine = d.overview.party?.id;
    if (S.data && S.data.party?.id && mine && S.data.party.id !== mine) { S.sheets = []; S.time = null; } // en annan person i samma webbläsare
    S.data = d.overview;
    if (d.views?.version) AUTO_S.server = d.views.version;
    S.viewsUrl = d.views?.url || null;
    overlayOutbox();
    if (typeof seq === "number") S.seq = seq;
    S.fetchedAt = Date.now();
    remember();
  }

  async function load() {
    if (S.data) S.refreshing = true; else S.loading = true;
    S.error = null;
    render();
    try { await fetchOverview(); }
    catch (e) { S.error = e; if (e.code === "NO_SESSION") forget(); }
    S.loading = false; S.refreshing = false;
    render();
    await flushOutbox();
    schedulePoll();
  }

  /** Återbesök: läget ur minnet direkt, sedan bara kollen. */
  async function revisit(m) {
    S.data = m.data; S.seq = m.seq; S.fetchedAt = m.at; S.loading = false; S.refreshing = true;
    render();
    const today = new Date().toISOString().slice(0, 10);
    if (typeof m.seq !== "number" || m.data.today !== today) return load(); // en ny dag räknar om raderna
    await poll();
    S.refreshing = false;
    render();
    schedulePoll();
  }

  /** Ett ark som rörs av ändringen: leveransen själv eller en av dess uppgifter. */
  function sheetTouched(x, diff) {
    if (x.kind === "delivery") { const row = rowOf(x.id);
      return diff.deliveries.includes(x.id) || diff.rows.includes(x.id) || (row?.tasks || []).some((t) => diff.tasks.includes(t)); }
    if (x.kind === "part") return diff.tasks.includes(x.id);
    if (x.kind === "customer") return (S.data?.rows || []).some((r) => r.customer?.id === x.id && diff.rows.includes(r.key));
    return false;
  }

  /** Kollen, och skillnaden när den säger att något hänt. */
  async function poll() {
    if (!S.data || typeof S.seq !== "number") return;
    S.polling = true;
    try {
      const c = await call("plan_state", { format: "seq", since_seq: S.seq });
      if (c?.unchanged || c?.seq === S.seq) { S.error = null; S.checkedAt = Date.now(); return; }
      const diff = await call("plan_state", { since_seq: S.seq });
      if (diff?.reload || diff?.registry) { S.refreshing = true; render(); await fetchOverview(diff.seq); }
      else if (diff && diff.events > diff.own && diff.rows?.length) {
        // Någon annan har ändrat något som syns: översikten räknas om på servern, i ett anrop.
        S.refreshing = true; render(); await fetchOverview(diff.seq);
      } else if (diff) { S.seq = diff.seq; remember(); } // bara egna ändringar, som redan syns
      if (diff && !diff.reload) {
        // Ett öppet ark följer sin sak; ett ark under läses om först när man går tillbaka till det.
        S.sheets.forEach((x, i) => { if (!sheetTouched(x, diff)) return;
          if (i === S.sheets.length - 1) fetchSheet(x, true); else S.sheetData = { ...S.sheetData, [sheetKey(x)]: { ...S.sheetData[sheetKey(x)], stale: true } }; });
        if (S.body === "time" && S.time?.tl && S.time.tl.tasks.some((t) => diff.tasks.includes(t.id))) loadTimeline();
      }
      S.error = null; S.checkedAt = Date.now();
    } catch (e) { S.error = e; if (e.code === "NO_SESSION") forget(); }
    finally { S.polling = false; S.refreshing = false; render(); }
    await flushOutbox();
  }

  /** Takten (BESLUT 13.4): 20 s i fokus, 60 s efter fem minuter utan att något gjorts, 5 min i bakgrunden. */
  let lastActive = Date.now(), pollTimer = null;
  const hidden = () => document.visibilityState === "hidden";
  function cadence() { return hidden() ? 300_000 : Date.now() - lastActive > 300_000 ? 60_000 : 20_000; }
  function schedulePoll() {
    clearTimeout(pollTimer);
    if (!S.data) return;
    pollTimer = setTimeout(async () => { await poll(); schedulePoll(); }, cadence());
  }
  const touch = () => { const wasIdle = Date.now() - lastActive > 300_000; lastActive = Date.now(); if (wasIdle) schedulePoll(); };
  /** Fliken tillbaka i fokus: en koll direkt. */
  document.addEventListener?.("visibilitychange", () => { if (hidden()) schedulePoll(); else { lastActive = Date.now(); poll().then(schedulePoll); } });

  const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 5 ? "nyss" : s < 60 ? `för ${s} sekunder sedan` : s < 3600 ? `för ${Math.round(s / 60)} ${Math.round(s / 60) === 1 ? "minut" : "minuter"} sedan` : `kl. ${new Date(ms).toTimeString().slice(0, 5)}`; };
  function stateLine() {
    if (S.error && S.data) {
      const login = S.error.code === "NO_SESSION";
      return `<div class="banner"><span class="bdot"></span><span style="flex:1;min-width:260px"><b>${login ? "Du är inte inloggad längre." : "Dirigenten svarar inte."}</b> Visar det som lästes ${esc(ago(S.fetchedAt || Date.now()))}.`
        + ` ${login ? "Logga in igen för att se det som hänt sedan dess." : `Det du markerar direkt (●) sparas här och skickas när dirigenten svarar; flytta och lämna över kräver förhandsvisning och får vänta. (${esc(S.error.message || "")})`}</span>`
        + (login ? `<a href="${esc(loginHref())}">Logga in</a>` : `<button data-act="retry">Försök igen</button>`) + `</div>`;
    }
    if (S.refreshing && S.data)
      return `<div class="updating"><span class="spin"></span>Uppdaterar … du ser det som lästes ${esc(ago(S.fetchedAt || Date.now()))} och kan arbeta under tiden.</div>`;
    return "";
  }

  /* 50+ leveranser (BESLUT 11): filter, ordnat efter vad som kräver något, 20 i taget. */
  const MANY = 50, PAGE = 20;
  function rowHay(o, r) {
    const who = r.steps.map((x) => x[6] >= 0 ? o.names[x[6]] : "").join(" ");
    return fold(`${r.label} ${r.customer?.label || ""} ${who} ${(o.colleagues || []).filter((c) => r.people.includes(c.id)).map((c) => c.label).join(" ")}`);
  }

  /** Efter en egen skrivning: läs om översikten i bakgrunden. */
  const refreshSoon = () => setTimeout(() => load(), 300);

  /** Inget ⌫ eller E medan man skriver i ett fält. */
  const typing = (t) => !!t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || "") || t.isContentEditable === true);

  function stepsList(o, r, inSheet = false) {
    if (r.kind === "inbox") return `<div class="steps"><div class="step"><span></span><span class="meta" style="grid-column:span 3">${r.inbox?.new
      ? `${r.inbox.new} nya, den äldsta ${r.inbox.oldest_days ? `${r.inbox.oldest_days} d gammal` : "från i dag"}. Bedöms i In i nuvarande vyn.` : "Inget nytt i posten."}</span></div></div>`;
    const me = S.data.party?.label;
    if (r.cases) return casesList(o, r, me);
    if (r.no_method && r.tasks.length === 1) return `<div class="steps">${homelessHtml(r.tasks[0], r.label, hlPlan(r.tasks[0]))}`
      + `<div class="opens"><button class="link" data-act="open-delivery" data-key="${esc(r.key)}">Öppna uppgiften</button><button class="link" data-act="chat" data-key="${esc(r.key)}">Arbeta i chatten ↗</button></div></div>`;
    const rows = r.steps.map((x) => stepOf(o, r, x)).map((st) => {
      const dot = st.state === "done" ? "done" : st.state === "handover" ? "handover" : st.state === "customer" ? "customer" : st.who === me ? "mine" : "";
      const meta = [STATE[st.state] || st.state, span(st.s, st.e), st.to ? `väntar på att ${st.to} tar emot` : "", st.critical && st.state !== "done" ? "utan marginal" : ""].filter(Boolean).join(" · ");
      return `<div class="step" data-ctx="step|${esc(st.task)}|${esc(st.id)}"><span class="sdot ${dot}"></span><div style="min-width:0">${inSheet ? rn("step", stepId(st.task, st.id), st.label, st.state === "done" ? "done" : "") : `<span class="${st.state === "done" ? "done" : ""}">${esc(st.label)}</span>`}<span class="meta"> · ${esc(meta)}</span></div><span class="who">${esc(st.who === me ? "du" : st.who || "")}</span><span class="pin-slot">${pinButton(st)}</span></div>`;
    }).join("");
    const more = r.step_count > r.steps.length ? `<div class="step"><span></span><span class="meta" style="grid-column:span 3">${r.step_count - r.steps.length} steg till, längre bort</span></div>` : "";
    const opens = `<div class="opens"><button class="link" data-act="open-delivery" data-key="${esc(r.key)}">Öppna ${r.kind === "delivery" ? "leveransen" : "uppgiften"}</button><button class="link" data-act="chat" data-key="${esc(r.key)}">Arbeta i chatten ↗</button></div>`;
    return `<div class="steps">${rows || `<div class="step"><span></span><span class="meta" style="grid-column:span 3">Inga steg i planen.</span></div>`}${more}${opens}</div>`;
  }

  /** Avsändaren (Daniel P 2026-10-05: «borde det också stå vem det kom ifrån»): namnet, adressen vid hovring. */
  function senderHtml(name, email, tail = " · ") { return name ? `<span class="from"${email ? ` title="${esc(email)}"` : ""}>från ${esc(name)}</span>${tail}` : ""; }
  /** «Namn <adress>» ur ett mejlhuvud. */
  function mailSender(h) { const raw = String(h || ""), m = /<([^>]+)>/.exec(raw), name = raw.replace(/<[^>]*>/g, "").replace(/["']/g, "").trim();
    return { name: name || (m ? m[1] : raw.trim()) || null, email: m ? m[1] : /@/.test(raw) ? raw.trim() : null }; }
  /** Flera uppgifter i raden: ett ärende per rad med ärendets egen rubrik, och stegets namn bara som «nu:». */
  const CASE_STATE = { new: "ny", doing: "pågår", customer: "väntar på kunden" };
  /** Så många ärenden visas först, i raden och i supportleveransens kö (OVERVIEW_CASES i src/views/overview.ts). */
  const CASES_SHOWN = 8;
  const daysAgo = (n) => n >= 0 ? "kom in i dag" : n === -1 ? "kom in i går" : `kom in för ${-n} d sedan`;
  function casesList(o, r, me) {
    const stream = r.kind === "stream";
    const all = !!S.allCases[r.key], list = all ? r.cases : r.cases.slice(0, CASES_SHOWN);
    const rows = list.map((c) => {
      const who = c.who >= 0 ? o.names[c.who] : "";
      const due = c.due === undefined ? "" : c.late ? (stream ? `svaret blir ${c.late} d sent` : `spricker ${c.late} d`) : c.due < 0 ? `${stream ? "svaret" : "klart"} ${-c.due} d sent` : c.due === 0 ? `${stream ? "svar" : "klart"} i dag` : `${stream ? "svar" : "klart"} inom ${c.due} d`;
      const meta = [CASE_STATE[c.state] || c.state, c.received === undefined ? "" : daysAgo(c.received), due, c.tight && !c.late ? "utan marginal" : ""].filter(Boolean).join(" · ");
      const dot = c.state === "customer" ? "customer" : c.late || (c.due ?? 1) < 0 ? "late" : who === me ? "mine" : "";
      const open = stream ? `data-act="open-case" data-task="${esc(c.task)}" data-label="${esc(c.title)}" data-ctx="case|${esc(c.task)}"`
        : `data-act="open-part" data-task="${esc(c.task)}" data-parent="${esc(r.key)}" data-label="${esc(c.title)}"`;
      const ti = r.tasks.indexOf(c.task);
      const strip = stream ? "" : stripHtml(r.steps.filter((y) => y[0] === ti).map((y) => y[3] === "done" ? "d" : y[3] === "customer" ? "c" : "t").join(""));
      return `<div class="step case" ${open} draggable="true" data-drag="${esc(c.task)}" role="button"><span class="sdot ${dot}"></span><div style="min-width:0"><span>${esc(c.title)}</span>${c.no_method ? `<span class="nm" title="Ingen metod och inga steg">utan metod</span>` : ""}${c.outcome ? ` <span class="otag">${esc(c.outcome)}</span>` : ""}<span class="meta"> · ${senderHtml(c.from, c.from_email)}${esc(meta)}</span>`
        + `${c.now >= 0 ? `<div class="meta">nu: ${esc(o.names[c.now])}</div>` : ""}${strip}</div><span class="who">${esc(who === me ? "du" : who)}</span><span class="pin-slot">${c.step && isRunning(c.task, c.step) ? `<span class="meta">igång</span>` : ""}</span></div>`;
    }).join("");
    const n = r.case_count || r.cases.length, rest = n - r.cases.length;
    const word = stream ? (rest === 1 ? "ärende" : "ärenden") : (rest === 1 ? "uppgift" : "uppgifter");
    // Åtta först; «Visa alla N» fäller ut resten i raden, «Visa färre» fäller ihop.
    const fold8 = r.cases.length > CASES_SHOWN ? `<div class="step"><span></span><button class="link meta" style="grid-column:span 3;text-align:left" data-act="cases-all" data-key="${esc(r.key)}">${all ? "Visa färre" : `Visa alla ${n}`}</button></div>` : "";
    const more = (all || r.cases.length <= CASES_SHOWN) && rest > 0 ? `<div class="step"><span></span><button class="link meta" style="grid-column:span 3;text-align:left" data-act="open-delivery" data-key="${esc(r.key)}">${rest} ${word} till i ${stream ? "kön" : "leveransen"} →</button></div>` : "";
    const opens = `<div class="opens"><button class="link" data-act="open-delivery" data-key="${esc(r.key)}">${stream ? "Öppna kön" : "Öppna leveransen"}</button><button class="link" data-act="chat" data-key="${esc(r.key)}">Arbeta i chatten ↗</button></div>`;
    return `<div class="steps">${rows || `<div class="step"><span></span><span class="meta" style="grid-column:span 3">Inga öppna ${stream ? "ärenden" : "uppgifter"}.</span></div>`}${fold8}${more}${opens}</div>`;
  }

  function list(o) {
    const many = o.rows.filter((r) => r.kind !== "inbox").length > MANY;
    const q = many ? fold(S.filterQ).split(/\s+/).filter(Boolean) : [];
    const rows = q.length ? o.rows.filter((r) => { const h = rowHay(o, r); return q.every((w) => h.includes(w)); }) : o.rows;
    const all = rows.filter((r) => match(r) || S.showHidden), hidden = rows.length - rows.filter(match).length;
    const shown = many ? all.slice(0, S.limit) : all;
    const c = counts(o.rows);
    const filter = many ? `<div class="many"><input id="list-q" placeholder="Filtrera på kund, leverans eller person" value="${esc(S.filterQ)}" autocomplete="off" aria-label="Filtrera leveranserna">`
      + `<span>${c.all} leveranser · ${c.mine} där du behövs · ${c.late} sent · ordnat efter vad som kräver något först</span></div>` : "";
    const more = many && all.length > shown.length ? `<div class="more"><button data-act="more">Visa ${Math.min(PAGE, all.length - shown.length)} till</button> <span class="mmeta">${shown.length} av ${all.length} visas</span></div>` : "";
    const head = `<div class="head"><span></span><span>LEVERANS</span><span>LÄGET</span><span style="text-align:right">KRÄVER</span></div>`;
    const rowHtml = (r) => {
      const open = !!S.open[r.key], dim = !match(r);
      const sub = r.kind === "inbox" ? "posten till huset · alla kunder" : `${r.customer?.label ? `${r.customer.label} · ` : ""}${TNAME[r.type] || ""}`;
      // En uppgift utan leverans går att dra till en leverans hos samma kund.
      const drag = r.kind === "task" && r.tasks.length === 1 ? ` draggable="true" data-drag="${esc(r.tasks[0])}"` : "";
      return `<div class="wrap${dim ? " dim" : ""}" data-row="${esc(r.key)}"><div class="row" data-act="toggle" data-key="${esc(r.key)}"${r.kind === "inbox" ? "" : ` data-ctx="row|${esc(r.key)}"`}${drag} role="button" aria-expanded="${open}">`
        + `<span class="icon" title="${esc(TNAME[r.type] || "")}">${ICON[r.type] || "○"}</span>`
        + `<div style="min-width:0"><div class="name">${esc(r.label)}</div><div class="sub">${esc(sub)}</div></div>`
        + `<div style="min-width:0">${segs(o, r)}<div class="state${r.late_days ? " late" : ""}">${esc(r.no_method ? `utan metod och utan steg${r.due ? ` · datum ${shortIso(r.due)}` : ""} — öppna för att ge den en` : r.state_text)}</div></div>`
        + `<div class="needs">${needs(r)}</div></div>${open ? stepsList(o, r) : ""}</div>`;
    };
    // Utan metod (Daniel P 2026-10-05: «hemlösa»): samlade sist, under en egen rubrik.
    const bare = shown.filter((r) => r.no_method);
    const body = shown.filter((r) => !r.no_method).map(rowHtml).join("")
      + (bare.length ? `<div class="grp">UTAN METOD · ${bare.length}<span>uppgifter utan metod och utan steg: ge dem en metod, några steg, eller gör dem bara</span></div>${bare.map(rowHtml).join("")}` : "");
    const note = hidden > 0 && !S.showHidden
      ? `<div class="hidden" data-hidden>${hidden} ${hidden === 1 ? "rad" : "rader"} utan något för den här linsen är ${hidden === 1 ? "dold" : "dolda"}. <button data-act="show-all">Visa alla</button></div>` : "";
    return filter + head + body + more + note;
  }

  function lensNote(o) {
    if (S.person) { const c = o.colleagues.find((x) => x.id === S.person);
      return c ? `leveranser där ${c.label} är med · ${hh(c.hours_week)} h av ${hh(c.capacity)} den här veckan` : ""; }
    return { all: "ordnat efter vad som kräver något först", mine: "leveranser där du behövs, ditt markerat",
      late: "sent och det som gör någon överbelastad", wait: "det som väntar på kunden eller på att någon tar emot" }[S.lens];
  }

  /** Rullningen i arket som syns sparas i dess plats i stacken, så att en omritning eller ‹ inte tappar den. */
  function saveScroll() {
    const el = root.querySelector?.(".sheet"), sc = root.querySelector?.(".sheet .sbody");
    if (!el || !sc) return;
    const i = Number(el.getAttribute("data-i")), x = S.sheets[i];
    if (x && sheetKey(x) === el.getAttribute("data-sheet")) x.scroll = sc.scrollTop;
  }
  /** Omritning medan man skriver: fältet behåller fokus och markör. */
  function renderKeep() {
    const a = typeof document.activeElement === "object" ? document.activeElement : null, id = a?.id, s0 = a?.selectionStart, s1 = a?.selectionEnd;
    render();
    if (!id) return;
    const el = root.querySelector?.(`#${id}`);
    if (el) { el.focus?.(); try { el.setSelectionRange?.(s0, s1); } catch { /* inte ett textfält */ } }
  }
  function render() {
    saveScroll();
    syncHash();
    const focusId = typeof document.activeElement === "object" ? document.activeElement?.id : null;
    const o = S.data;
    const today = o?.today || new Date().toISOString().slice(0, 10);
    // Knapparna som inte gör något än (Fokus, Meddelanden, ⚙, Claude) står inte med: hellre ingen knapp än en död.
    const top = `<div class="top"><span class="brand">rotor</span><span class="title">Översikt</span><span class="date">${esc(dayLabel(today))}</span>`
      + `<button class="edge" data-act="order-new" title="Ny beställning · N">＋ Ny</button>`
      + `<div class="search"><input id="pal-q" data-act="pal-open" placeholder="Sök eller gör" autocomplete="off" value="${esc(S.pal?.q || "")}" aria-label="Sök eller gör (⌘K)"><kbd>⌘K</kbd>${paletteHtml()}</div>`
      + (can("change_methods") ? `<button class="plain" data-act="open-library">Biblioteket</button>` : "")
      + `<button class="edge" data-act="open-focus">◎ Fokus</button>`
      + `<button class="plain" data-act="open-messages">Meddelanden${o?.messages_unread ? `<span class="badge">${o.messages_unread}</span>` : ""}</button>`
      + `<button class="plain" data-act="open-settings" aria-label="Inställningar" title="Inställningar">⚙</button>`
      + `<button class="claude" data-act="open-chat">✦ Claude</button>${versionHtml()}</div>`;
    const igang = igangBar();
    const c0 = o ? counts(o.rows) : { all: 0, mine: 0, late: 0, wait: 0 }, c = { ...c0, mine: c0.mine + (o?.reviews?.length || 0) };
    const lenses = [["all", "Allt"], ["mine", "Där jag behövs"], ["late", "Sent"], ["wait", "Väntar"]].map(([id, l]) =>
      `<button class="lens${!S.person && S.lens === id ? " on" : ""}" data-act="lens" data-lens="${id}">${l}<span class="n">${c[id]}</span></button>`).join("");
    const people = (o?.colleagues || []).map((p) => {
      const load = p.capacity ? Math.min(100, Math.round(p.hours_week / p.capacity * 100)) : 0;
      return `<button class="person${S.person === p.id ? " on" : ""}" data-act="person" data-person="${esc(p.id)}" title="${esc(`${p.label} · ${hh(p.hours_week)} h av ${hh(p.capacity)} den här veckan${p.over ? " · över 8 h någon dag" : ""}`)}">`
        + `<span class="ring" style="background:conic-gradient(${p.over ? "var(--red)" : "var(--teal)"} ${load * 3.6}deg, var(--l3) 0)"><span>${esc(p.ini)}</span></span>${esc(p.label)}</button>`;
    }).join("");
    // Kroppsväxlaren: Lista, Tid och Kalender.
    const bodies = `<div class="bodies">${[["list", "Lista"], ["time", "Tid"], ["cal", "Kalender"]].map(([id, l]) => `<button class="${S.body === id ? "on" : ""}" data-act="body" data-body="${id}" aria-pressed="${S.body === id}">${l}</button>`).join("")}</div>`;
    const bar = `<div class="bar">${lenses}<span class="sep"></span>${people}${bodies}</div><div class="note"><span>${esc(o ? lensNote(o) : "")}</span>${S.person ? `<button class="link" data-act="open-person" data-id="${esc(S.person)}">${esc((o?.colleagues || []).find((c) => c.id === S.person)?.label || "")}s dagar →</button>` : ""}</div>`;
    let main;
    if (S.error && !o) {
      const login = S.error.code === "NO_SESSION";
      main = `<div class="banner"><span style="flex:1;min-width:260px"><b>${login ? "Du är inte inloggad." : "Dirigenten svarar inte."}</b> ${esc(login ? "Logga in med ditt jobbkonto för att se översikten." : S.error.message || "")}</span>`
        + (login ? `<a href="${esc(loginHref())}">Logga in</a>` : `<button data-act="retry">Försök igen</button>`) + `</div>`;
    } else if (S.loading && !o) {
      main = `<div>${[0, 1, 2, 3, 4, 5].map(() => `<div class="skel"><span style="width:16px;height:16px"></span><span></span><span></span><span style="justify-self:end;width:60px;height:16px"></span></div>`).join("")}</div>`
        + `<div style="font-size:12.5px;color:var(--muted);padding:10px 12px">Hämtar läget.</div>`;
    } else if (o && o.rows.length <= 1 && !o.rows[0]?.inbox?.new) {
      main = `<div class="empty"><h2>Inget i översikten än</h2><p>Leveranser hamnar här när en beställning läggs in eller ett mejl blir till något. Posten till huset syns överst så fort en inkorg är kopplad.</p>`
        + `<div class="ways"><button data-act="start" data-way="order">Lägg in en beställning ↗</button><button data-act="start" data-way="inbox">Koppla en inkorg ↗</button><button data-act="start" data-way="methods">Se metoderna ↗</button></div>`
        + `<p class="mmeta" style="margin-top:12px">Vägarna kopierar en prompt till vanliga Claude-chatten, som har samma verktyg mot dirigenten.</p></div>`;
    } else main = stateLine() + clashHtml() + outboxHtml() + (S.body === "time" ? timeBody() : S.body === "cal" ? calendarBody() : reviewsHtml(o) + list(o));
    root.innerHTML = top + igang + bar + main + timeFooter() + sheetsHtml() + menuHtml() + peekHtml() + mvHtml() + confirmHtml() + toastHtml();
    if (S.pal) focusPalette();
    else if (focusId === "list-q") { const inp = root.querySelector?.("#list-q"); if (inp) { inp.focus?.(); const n = inp.value?.length || 0; inp.setSelectionRange?.(n, n); } }
    const t = top1(), sc = t && root.querySelector?.(".sheet .sbody");
    if (sc) sc.scrollTop = t.scroll || 0;
  }

  root.addEventListener("click", (e) => {
    const cur = e.target.closest?.("[data-ctx]")?.getAttribute("data-ctx");
    if (cur) S.cur = cur;
    const el = e.target.closest?.("[data-act]");
    if (!el) { if (S.menu || S.peek || S.pal) { S.menu = null; S.peek = null; S.pal = null; render(); } return; }
    if (S.menu && el.getAttribute("data-act") !== "menu-run") S.menu = null;
    if (S.pal && !/^pal-/.test(el.getAttribute("data-act"))) S.pal = null;
    const act = el.getAttribute("data-act");
    if (/^(hl|mv)-/.test(act)) { hlAct(act, el); return; }
    if (/^(mb|vp)-/.test(act)) { mbAct(act, el); return; }
    if (act === "open-method") { openMethod(el.getAttribute("data-id"), el.getAttribute("data-label")); return; }
    if (act === "method-new") { newMethod(); return; }
    if (act === "lens") { S.lens = el.getAttribute("data-lens"); S.person = null; S.showHidden = false; }
    else if (act === "person") { const p = el.getAttribute("data-person"); S.person = S.person === p ? null : p; S.showHidden = false;
      if (S.body === "time" && !timeState().scope) { timeState().changes = {}; loadTimeline(); return; } }
    else if (act === "show-all") S.showHidden = true;
    else if (act === "toggle") { const k = el.getAttribute("data-key"); S.open = { ...S.open, [k]: !S.open[k] }; }
    else if (act === "retry") { load(); return; }
    else if (act === "clash-mine" || act === "clash-theirs") { const c = S.clash; S.clash = null;
