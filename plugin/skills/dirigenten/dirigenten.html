/* v6 (docs/design/v6/README.md, Tokens). */
:root {
  --ink: #1c1c1a; --t1: #3d3c38; --t2: #55544e; --muted: #66655f; --t3: #8a8880;
  --l1: #c9c7be; --l2: #d8d6ce; --l3: #e4e2da; --l4: #ebeae4; --l5: #f0efea;
  --s1: #f4f3ef; --s2: #f6f5f1; --s3: #f8f7f4; --s4: #fbfaf7; --white: #fff;
  --teal: #1f7672; --teal-d: #14524f; --teal-l: #e3efed; --teal-l2: #f1f7f6; --teal-cur: #8fc2bd;
  --amber: #a86a12; --amber-t: #7a4c0b; --amber-b: #e2c48f; --amber-s: #f6ecd9;
  --red: #b2412e; --red-b: #e2b0a5; --red-s: #f5e1dc; --red-s2: #fbf1ee;
  --claude: #5b48c9; --cust-seg: #d9cdb4;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --head: var(--sans);
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --grid: 28px minmax(180px, 1.1fr) minmax(220px, 1.3fr) 170px;
}
body { background: var(--white); color: var(--ink); font-family: var(--sans); }
#v6 { padding: 20px 30px 120px; font-size: 14px; color: var(--ink); }
#v6 button { font: inherit; color: inherit; cursor: pointer; }
#v6 button:disabled { cursor: default; opacity: .45; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: nowrap; white-space: nowrap; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
.title { font-family: var(--head); font-size: 22px; font-weight: 600; margin-left: 8px; letter-spacing: -.015em; }
.date { color: var(--muted); font-size: 13px; }
.search { margin-left: auto; position: relative; flex: 0 1 260px; min-width: 150px; }
.search input { width: 100%; box-sizing: border-box; padding: 7px 44px 7px 12px; border: 1px solid var(--l2); border-radius: 8px; background: #fff; font-size: 13px; }
.search kbd { position: absolute; right: 10px; top: 8px; font: 11px var(--mono); color: var(--t3); }
.plain { border: 0; background: none; padding: 6px 4px; font-size: 13px; white-space: nowrap; }
.edge { border: 1px solid var(--l2); background: #fff; padding: 6px 11px; border-radius: 7px; font-size: 13px; white-space: nowrap; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--teal); color: #fff; font: 600 11px/18px var(--mono); text-align: center; display: inline-block; box-sizing: border-box; margin-left: 7px; }
.claude { border: 1px solid var(--claude); color: var(--claude) !important; background: #fff; padding: 6px 11px; border-radius: 7px; font-size: 13px; }
.igang { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 14px; border-radius: 10px; background: var(--s1); margin-bottom: 20px; font-size: 13px; min-height: 20px; }
.lbl { font: 500 11px var(--mono); color: var(--muted); letter-spacing: .06em; margin-right: 4px; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
.lens { padding: 6px 12px; border-radius: 7px; background: #fff; border: 1px solid var(--l2); white-space: nowrap; font-size: 13px; }
.lens.on, .person.on, .fopt.on { background: var(--ink); color: #fff !important; border-color: var(--ink); }
.vrow { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; font-size: 13px; }
.vrow .lens, .vrow .addf, .vrow .person { flex: none; min-height: 34px; }
.addf { padding: 5px 11px; border-radius: 7px; background: #fff; border: 1px dashed var(--l2); white-space: nowrap; font-size: 13px; }
.vrow .glbl { color: var(--muted); flex: none; }
.gopt { flex: none; border: 0; background: none; border-radius: 6px; padding: 3px 9px; font-size: 13px; min-height: 30px; color: var(--muted); white-space: nowrap; }
.gopt.on { background: var(--s1); color: var(--ink); }
.fpanel { background: #fff; border: 1px solid var(--l2); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 22px; }
.fpanel .ft { font: 500 10.5px var(--mono); letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.fpanel .fo { display: flex; flex-wrap: wrap; gap: 6px; }
.fpanel .frange, .fpanel .fby { margin-top: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.fpanel .frange input { border: 1px solid var(--l2); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; margin-left: 4px; }
.fopt { white-space: nowrap; border: 1px solid var(--l2); background: #fff; border-radius: 14px; padding: 3px 10px; font-size: 12.5px; min-height: 30px; }
.showing { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; font-size: 12.5px; }
.showing .fchip { white-space: nowrap; border: 1px solid var(--l2); background: #fff; border-radius: 14px; padding: 2px 6px 2px 10px; font-size: 12.5px; min-height: 28px; }
.showing .fchip span { color: var(--t3); padding: 0 4px; }
.showing input { border: 1.5px solid var(--ink); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; width: 160px; }
.vrow .save[aria-disabled="true"] { color: var(--t3); border-style: dotted; }
.vrow #ov-name { flex: none; border: 1.5px solid var(--ink); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; width: 160px; }
.vrow .primary { flex: none; }
.showing .where { color: var(--t3); margin-left: auto; font-size: 11.5px; }
.owner-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 12px; font-size: 13px; }
.lens .n { font: 11px var(--mono); opacity: .65; margin-left: 7px; }
.sep { width: 1px; height: 22px; background: var(--l3); margin: 0 4px; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; white-space: nowrap; border-radius: 16px; background: transparent; border: 1px solid var(--l3); font-size: 13px; }
.ring { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.ring > span { width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 600 9px var(--mono); color: var(--ink); }
.bodies { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--l2); border-radius: 8px; }
.bodies button { border: 0; padding: 4px 12px; border-radius: 6px; background: none; font-size: 13px; }
.bodies button.on { background: var(--ink); color: #fff !important; }
.note { display: flex; gap: 14px; align-items: baseline; color: var(--muted); font-size: 13px; margin-bottom: 12px; min-height: 18px; }
.head, .row { display: grid; grid-template-columns: var(--grid); gap: 16px; }
.head { padding: 8px 12px; font: 11px var(--mono); color: var(--t3); border-bottom: 1px solid var(--l4); }
.wrap { border-bottom: 1px solid var(--l4); }
.wrap.dim { opacity: .45; }
.row { align-items: center; padding: 12px; cursor: pointer; border-radius: 8px; }
.row:hover { background: var(--s3); }
.icon { font-size: 15px; color: var(--t1); text-align: center; }
.name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); margin-top: 2px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segs { display: flex; gap: 2px; margin-bottom: 6px; }
.segs.inbox { gap: 3px; align-items: flex-end; height: 14px; }
.seg { height: 8px; border-radius: 2px; background: var(--l4); box-sizing: border-box; }
.state { color: var(--t1); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state.late { color: var(--red); }
.needs { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { padding: 2px 8px; border-radius: 12px; background: var(--l4); font-size: 12px; white-space: nowrap; }
.pill.on { background: var(--ink); color: #fff; }
.take { padding: 2px 8px; border-radius: 12px; border: 1px solid var(--amber); color: var(--amber-t); font-size: 12px; white-space: nowrap; }
.dot-late { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
.over { color: var(--amber); font-size: 11px; }
.wait { color: var(--muted); font-size: 14px; }
.out { color: var(--teal); font-size: 14px; }
.steps { margin: 0 12px 14px 56px; border-left: 1.5px solid var(--l3); padding-left: 18px; }
.step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 64px; gap: 12px; align-items: center; padding: 8px; margin: 0 -8px; border-radius: 6px; border-bottom: 1px solid var(--l5); font-size: 13.5px; }
.step:hover { background: var(--s2); }
.sdot { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--t3); }
.sdot.done { background: var(--ink); border: 0; }
.sdot.mine { background: var(--teal); border: 0; }
.sdot.customer { border: 1.5px dashed var(--t3); }
.sdot.late { background: var(--red); border: 0; }
.step.case, .step.mthread { cursor: pointer; }
.step.ifate { grid-template-columns: 16px minmax(0, 1fr) auto 0; }
.step.mthread { grid-template-columns: 16px minmax(0, 1fr) auto 0; }
.step.mthread .mtt { font-weight: 400; }
.step.mthread.unread .mtt { font-weight: 600; }
.step.mthread .mlast { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .mq { flex: 0 1 220px; min-width: 140px; margin-left: auto; border: 1px solid var(--l2); border-radius: 8px; padding: 5px 10px; font-size: 13px; min-height: 34px; }
.step.case { grid-template-columns: 16px minmax(0, 1fr) auto auto; }
.qpost { border: 1.5px dashed var(--l2); border-radius: 10px; padding: 8px 12px; margin: 6px 0 14px; }
.qpost .qp { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--l5); font-size: 13.5px; }
.qpost .qp:last-child { border-bottom: 0; }
.qpost .qp > span { flex: 1 1 220px; min-width: 0; }

  const hereRaw = () => { try { return location.hash || ""; } catch { return ""; } };

  function syncHash() {

  /**

  /**

  function loadThumbs(results) {

    if (!refs.length) return;

  /* Ett ark som hämtats för mindre än FRESH_MS sedan visas som det är, utan anrop.

  const FRESH_MS = 60_000, SWR_KINDS = new Set(["delivery", "part", "step"]);
  /** Leveransens och delens ark: allt i ett anrop (read { op: "view_file", sheet: "delivery" }). */

  /* ── Förhämtning ──

  const PRE_MAX = 2, PRE_TOP = 6, PRE_HOVER_MS = 150;

  const fmtDay = (iso) => iso ? dayLabel(String(iso).slice(0, 10)) : "";

  /** Ansvarig för leveransen (ordning, del 3): en person, satt ● med Ångra (execute_step på leveransen, values.owner). */

    return `<div class="mh">Ansvarig för leveransen</div><div>${row.owner ? esc(row.owner.label) : `<span class="mmeta">Ingen satt</span>`} <button class="link" data-act="owner-pick" title="Välj ansvarig ●">${row.owner ? "Byt" : "Välj"}</button></div>${pick}`;
  }
  /** ● Sätter ansvarig direkt; Ångra sätter tillbaka den förra. */
  async function setOwner(key, id) {
    const row = rowOf(key); if (!row) return;
    const before = row.owner || null, who = id ? [...(S.data?.party ? [S.data.party] : []), ...(S.data?.colleagues || [])].find((p) => p.id === id) : null;
    const t = top1(); if (t) t.ownerPick = false;
    const patch = (owner) => { S.data = { ...S.data, rows: S.data.rows.map((r) => r.key === key ? (owner ? { ...r, owner } : (({ owner: _o, ...rest }) => rest)(r)) : r) }; };
    patch(who ? { id: who.id, label: who.label } : null);
    render();
    try {
      await call("execute_step", { task: key, values: { owner: id || null }, confirmed: true });
      say(who ? `${who.label} är ansvarig för «${row.label}».` : `«${row.label}» har ingen ansvarig.`,
        { tool: "execute_step", args: { task: key, values: { owner: before?.id || null }, confirmed: true } });
      refreshSoon();
    } catch (e) { patch(before); say(`Kunde inte sätta ansvarig: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  function deliverySheet(x) {
    const row = rowOf(x.id), sd = S.sheetData[sheetKey(x)] || {}, d = sd.delivery;
    const me = S.data?.party?.label;
    const typ = row ? TNAME[row.type] || "" : "";
    const cust = row?.customer;
    const label = `Leverans${cust?.label ? ` · ${cust.label}` : ""}${typ ? ` · ${typ}` : ""}`;
    const sentence = deliverySentence(row, d);
    // Handlingsraden: nästa steg till Igång när det är ditt, och chatten.
    const nextMine = (d?.todo || []).find((t) => t.who === me) || null;
    const acts = [
      nextMine && !isRunning(nextMine.task, nextMine.step)
        ? `<button class="primary" data-act="pin" data-task="${esc(nextMine.task)}" data-step="${esc(nextMine.step)}" data-label="${esc(nextMine.label)}">⊕ Lägg «${esc(nextMine.label)}» i Igång <span class="lvl">●</span></button>` : "",
      row?.kind === "delivery" ? `<button class="link" data-act="show-time" data-key="${esc(x.id)}">Visa i tid</button>` : "",
      row?.kind === "delivery" && cust?.id ? `<button class="link" data-act="pres-open" data-key="${esc(x.id)}" data-label="${esc(row.label)}" title="Visa det som skapats för kunden, med kundens färger, bakom engångskod">Presentera …</button>` : "",
      `<button class="link" data-act="chat" data-key="${esc(x.id)}">Arbeta i chatten ↗</button>`,
      row?.tasks?.length ? `<button class="link" data-act="how-open" data-task="${esc(row.tasks[0])}" data-label="${esc(row.label)}" title="Så görs det: ansvariga, mallar, kanaler och rytm">⚙ Så görs det</button>` : "",
      row?.kind === "task" && row.tasks.length === 1 ? `<button class="link" data-act="hl-move" data-task="${esc(row.tasks[0])}">Flytta till leverans …</button>` : "",
    ].join("");
    // Det som skapats, överst: lagerraden och resultaten.
    const results = sd.results || [];
    // En ström: ingen gemensam lagerrad och inget Ta in här; det hör till varje ärende. Resultaten per ärende.
    const made = `<h3 class="sh">Det som skapats</h3>`
      + (!sd.stream && sd.layers?.text ? layersHtml(sd.layers) : "")
      + (sd.stream ? "" : methodUpdatesHtml(x, sd))
      + (!results.length ? `<div class="mmeta">${sd.loading ? "Hämtar det som skapats …" : "Inget ännu."}</div>`
        : sd.stream || sd.parts ? resultsByCase(x, sd, results) : materialHtml(results));
    // Stegen; en leverans i flera delar visar delarna, och stegen när delen öppnas.
    const plans = sd.plans;
    const steps = sd.parts ? partsHtml(x.id, sd.parts, me) : plans ? (plans.length === 1 ? hlSheetHtml(plans[0]) : "") + planStepsHtml(plans, me)
      : row ? stepsList(S.data, row, true) : `<div class="mmeta">Hämtar stegen …</div>`;
    // Marginalen: Hör till, Vem, Väntar, Hör ihop.
    const people = new Map();
    for (const t of plans || []) for (const s of t.steps) if (!s.done && s.who && s.side !== "customer") people.set(s.who, (people.get(s.who) || 0) + (s.hours || 0));
    for (const p of sd.parts || []) if (p.next && p.next.side !== "customer") people.set(p.next.who, 0);
    const coll = (n) => [...(S.data?.colleagues || []), ...(S.data?.party ? [{ label: S.data.party.label }] : [])].find((c) => c.label === n);
    const vem = [...people].map(([n, h]) => { const c = coll(n);
      return `<div class="${row?.needs?.over?.includes(n) ? "late" : ""}">${esc(n === me ? `${n} (du)` : n)}${sd.parts ? "" : ` · ${hh(h)} h kvar`}${c?.capacity ? `, ${hh(c.hours_week)} h av ${hh(c.capacity)} i veckan` : ""}${c?.calendar_via ? ` · ${esc(c.calendar_via)}` : ""}</div>`; }).join("");
    const waits = [];
    for (const t of plans || []) for (const s of t.steps) if (!s.done && s.side === "customer") waits.push(`${esc(cust?.label || "Kunden")} · ${esc(s.label)}${s.window ? ` ${esc(winText(s.window))}` : ""}`);
    if (row?.needs?.handover_out) waits.push(`${row.needs.handover_out} steg väntar på att någon tar emot`);
    const related = (S.data?.rows || []).filter((r) => r.key !== x.id && r.kind !== "inbox" && cust?.id && r.customer?.id === cust.id).slice(0, 5);
    const margin = `<aside class="margin">`
      + `<div class="mh">Hör till</div>${cust?.id ? `<button class="link" data-act="open-customer" data-id="${esc(cust.id)}" data-label="${esc(cust.label)}">${esc(cust.label)}</button>` : `<div class="mmeta">Ingen kund</div>`}`
      + (!sd.stream && sd.layers?.method?.label ? `<div>Metoden ${esc(sd.layers.method.label)}</div>` : "")
      + ownerHtml(x, row)
      + `<div class="mh">Vem</div>${vem || `<div class="mmeta">${plans || sd.parts ? "Inga ogjorda steg." : "…"}</div>`}`
      + `<div class="mh">Väntar</div>${waits.length ? waits.map((w) => `<div>${w}</div>`).join("") : `<div class="mmeta">Inget väntar på någon utanför.</div>`}`
      + `<div class="mh">Hör ihop</div>${related.length ? related.map((r) => `<button class="link" data-act="open-delivery" data-key="${esc(r.key)}">${esc(r.label)}</button>`).join("") : `<div class="mmeta">Inget annat hos ${esc(cust?.label || "kunden")}.</div>`}`
      + `</aside>`;
    const err = sd.error ? `<div class="banner"><span style="flex:1">Allt kunde inte läsas: ${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>` : "";
    return `<div class="slabel">${esc(label)}</div><h1 class="stitle">${((t) => row?.kind === "delivery" || row?.kind === "stream" ? rn("delivery", x.id, t) : row?.tasks?.length === 1 ? rn("task", row.tasks[0], t) : esc(t))(row?.label || d?.label || x.label)}</h1><p class="sline">${esc(sentence)}</p>`
      + `<div class="sacts">${acts}</div>${err}`
      + `<div class="sgrid"><div class="smain">${row?.kind === "stream" ? supportHtml(x, sd) : ""}${made}<h3 class="sh">${sd.parts ? `Delarna · ${sd.parts.length}` : "Stegen"}</h3><div class="ssteps">${steps}</div></div>${margin}</div>`;
  }

  /** Stegen i en eller flera uppgifter ur plan_state { task, format: "plan" }. */
  function planStepsHtml(plans, me) {
    return plans.map((t) => {
      const head = plans.length > 1 ? `<div class="part">${esc(t.label)}<span class="mmeta"> · ${t.due ? `klar ${esc(shortIso(t.due))}` : ""}</span></div>` : "";
      return head + t.steps.map((s) => {
        const state = s.done ? "done" : s.side === "customer" ? "customer" : "todo";
        const st = { task: t.task, id: s.step, label: s.label, state };
        const dot = s.done ? "done" : s.side === "customer" ? "customer" : s.who === me ? "mine" : "";
        const meta = [s.side === "customer" ? "hos kunden" : "", winText(s.window), s.hours ? `${hh(s.hours)} h` : ""].filter(Boolean).join(" · ");
        return `<div class="step" data-ctx="step|${esc(t.task)}|${esc(s.step)}"><span class="sdot ${dot}"></span><div style="min-width:0">${rn("step", stepId(t.task, s.step), s.label, s.done ? "done" : "")}${meta ? `<span class="meta"> · ${esc(meta)}</span>` : ""}`
          + ` <button class="link how-l" data-act="open-step" data-task="${esc(t.task)}" data-step="${esc(s.step)}" data-label="${esc(s.label)}">Så görs det →</button></div>`
          + `<span class="who">${esc(s.who === me ? "du" : s.who || "")}</span><span class="pin-slot">${pinButton(st)}</span></div>`;
      }).join("");
    }).join("");
  }

  /** Stegremsan för en del: ett streck per steg (d klar, c hos kunden, t kvar). */
  const stripHtml = (strip) => strip ? `<span class="segs pstrip">${[...strip].map((c) =>
    `<span class="seg" style="flex:1;background:${c === "d" ? "var(--ink)" : c === "c" ? "var(--cust-seg)" : "var(--l4)"}"></span>`).join("")}</span>` : "";
  /** Delarna i en leverans som rader: namn, läge, stegremsa, datum och vem. Klick öppnar delens ark. */
  function partsHtml(parent, parts, me) {
    if (!parts.length) return `<div class="mmeta">Inga delar.</div>`;
    return parts.map((p) => {
      const left = p.total_steps - p.done_steps, done = p.total_steps > 0 && left === 0;
      const state = done ? "klar" : p.next?.side === "customer" ? "väntar på kunden" : p.done_steps ? "pågår" : "inte påbörjad";
      const who = p.next && p.next.side !== "customer" ? p.next.who : "";
      const meta = [state, `${p.done_steps} av ${p.total_steps} steg`, p.next ? `nästa: ${p.next.label}` : "", p.due ? `klar ${shortIso(p.due)}` : ""].filter(Boolean).join(" · ");
      const dot = done ? "done" : p.next?.side === "customer" ? "customer" : who === me ? "mine" : "";
      return `<div class="step part-row" data-act="open-part" data-task="${esc(p.task)}" data-parent="${esc(parent)}" data-label="${esc(p.label)}" role="button" title="Öppna delen">`
        + `<span class="sdot ${dot}"></span><div style="min-width:0"><span>${esc(p.label)}</span><span class="meta"> · ${esc(meta)}</span>${stripHtml(p.strip)}</div>`
        + `<span class="who">${esc(who === me ? "du" : who)}</span><span class="pin-slot meta">›</span></div>`;
    }).join("");
  }
  function openPart(task, parent, label) {
    if (!task) return;
    const t = top1();
    if (t && t.kind === "part" && t.id === task) return;
    S.menu = null;
    S.sheets = [...S.sheets, { kind: "part", id: task, parent, label: label || task, scroll: 0, tab: null }];
    fetchSheet(top1());
    render();
  }

  /** Delens eget ark: ovanpå leveransen, med stegen och det som skapats i delen. */
  function partSheet(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, row = rowOf(x.parent), me = S.data?.party?.label;
    const t = sd.plans?.[0], left = t ? t.steps.filter((s) => !s.done) : [];
    const next = left[0];
    // Innan delen är läst: raden ur leveransens ark (namn, läge och stegremsa) direkt.
    const pre = !t ? (S.sheetData[`delivery:${x.parent}`]?.parts || []).find((p) => p.task === x.id) || null : null;
    const sentence = t ? [`${t.steps.length - left.length} av ${t.steps.length} steg klara.`,
      next ? `Nästa är «${next.label}» hos ${next.who === me ? "dig" : next.who}.` : "",
      t.due ? `Klar ${fmtDay(t.due)}.` : ""].filter(Boolean).join(" ")
      : pre ? [`${pre.done_steps} av ${pre.total_steps} steg klara.`, pre.next ? `Nästa är «${pre.next.label}».` : "", pre.due ? `Klar ${fmtDay(pre.due)}.` : ""].filter(Boolean).join(" ") : "";
    const results = sd.results || [];
    const made = `<h3 class="sh">Det som skapats</h3>` + (results.length ? materialHtml(results)
      : `<div class="mmeta">${sd.loading ? "Hämtar det som skapats …" : "Inget ännu."}</div>`);
    const err = sd.error ? `<div class="banner"><span style="flex:1">Allt kunde inte läsas: ${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>` : "";
    return `<div class="slabel">Del${row?.label ? ` · ${esc(row.label)}` : ""}</div><h1 class="stitle">${rn("task", x.id, t?.label || pre?.label || x.label)}</h1><p class="sline">${esc(sentence)}</p>${pre ? stripHtml(pre.strip) : ""}`
      + `<div class="sacts"><button class="link" data-act="chat" data-key="${esc(x.id)}">Arbeta i chatten ↗</button>`
      + `<button class="link" data-act="hl-move" data-task="${esc(x.id)}">Flytta till en annan leverans …</button></div>${err}`
      + `<div class="smain">${made}<h3 class="sh">Stegen</h3><div class="ssteps">${t ? hlSheetHtml(t) + planStepsHtml([t], me) : `<div class="mmeta">${sd.loading ? "Hämtar stegen …" : "Inga steg."}</div>`}</div></div>`;
  }

  /* Färg och logo i presentationerna (src/present/brand.ts): kundens färg är bara accent.
     Ändras med registry_define { change: true }: förhandsvisning och ◐ Spara. */
  function brandHtml(x, b) {
    if (!b) return "";
    const e = x.brandEdit || {};
    const accent = e.accent ?? b.brand?.accent ?? "";
    const logo = e.logo ?? b.brand?.logo ?? "";
    const opts = (b.logo_choices || []).map((c) => `<option value="${esc(c.ref)}"${c.ref === logo ? " selected" : ""}>${esc(c.name)}</option>`).join("");

      + `<div class="crow"><span>${b.brand ? `<span style="display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;background:${esc(b.brand.accent)}"></span> ${esc(b.brand.accent)}${b.adjusted ? ` · som text mörkare (${esc(b.accent_text)}) så att den går att läsa` : ""}` : "Ingen färg vald: husets färg används."}</span></div>`
      + `<div class="crow"><label>Färg <input id="brand-accent" value="${esc(accent)}" placeholder="#rrggbb" size="9"></label>`
      + `<label>Logo <select id="brand-logo"><option value="">Ingen</option>${opts}</select></label>`
      + `<button class="link" data-act="brand-save" data-id="${esc(x.id)}">Förhandsvisa <span class="lvl">◐</span></button></div>`
      + (opts ? "" : `<div class="mmeta">Ladda upp logon till kundens filer för att kunna välja den.</div>`);
  }
  async function brandSave(id) {
    const x = top1(); if (!x || x.kind !== "customer") return;
    const sd = S.sheetData[sheetKey(x)] || {}, b = sd.overview?.overview?.brand, e = x.brandEdit || {};
    const accent = String(e.accent ?? b?.brand?.accent ?? "").trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(accent)) { say("Färgen skrivs som #rrggbb, till exempel #1f6f5c.", null, true); return; }
    const logo = e.logo ?? b?.brand?.logo ?? "";
    const node = { id, brand: { accent, ...(logo ? { logo } : {}) } };
    const verb = "Spara färg och logo";
    S.confirm = { loading: true, verb, text: "Förhandsvisar …" }; render();
    try {
      const r = await call("write", { op: "registry_define", node, change: true });
      S.confirm = { verb, text: summaryText(r) || `Färgen ${accent} och logon används i nya presentationer.`,
        next: hlNext(r, { tool: "write", args: { op: "registry_define", node, change: true, confirmed: true } }, verb),
        onDone: () => { x.brandEdit = null; fetchSheet(x, true); } };
    } catch (err) { S.confirm = null; say(`Gick inte: ${err?.message || err}`, null, true); }
    render();
  }
  /** Dra tillbaka från kundkortet: förhandsvisning i steget där den publicerades, sedan ◐. */

          + `<div class="crow sub"><span>${p.views.length ? `Sedd: ${p.views.slice(0, 6).map((v) => `${esc(v.email)} ${esc(presWhen(v.at))} (v${v.version})`).join(", ")}` : "Inte öppnad än."}</span></div>`
          + (p.responses || []).map((r) => `<div class="crow sub"><span>${r.item ? "Inlägg: " : ""}${r.answer === "approve" ? "✓ Godkänd" : "Kommentar"} av ${esc(r.email)} ${esc(presWhen(r.at))} (v${r.version})${r.text ? `: «${esc(r.text)}»` : ""}</span></div>`).join("")
          + (p.approval_suggestion ? `<div class="crow sub"><span>Förslag: kundens godkännande är svaret som «${esc(p.approval_suggestion.label)}» väntar på (?)</span>`
            + `<button class="link" data-act="pres-approve-step" data-task="${esc(p.approval_suggestion.task)}" data-step="${esc(p.approval_suggestion.step)}" data-label="${esc(p.approval_suggestion.label)}">Markera som klart <span class="lvl">◐</span></button></div>`
            : (p.responses || []).some((r) => r.answer === "approve") && p.approval_suggestion === null ? `<div class="crow sub"><span class="mmeta">Inget steg i leveransen väntar på kunden.</span></div>` : "")
          + `<div class="crow sub"><span class="mmeta">Mottagare: ${esc(p.recipients.join(", "))}</span>`
          + (!p.withdrawn && p.withdraw_in ? `<button class="link" data-act="pres-withdraw-card" data-id="${esc(p.id)}" data-task="${esc(p.withdraw_in.task)}" data-step="${esc(p.withdraw_in.step)}" data-label="${esc(p.title)}">Dra tillbaka <span class="lvl">◐</span></button>` : "")
          + `</div>`).join("")
        : `<div class="mmeta">Inga presentationer än. De görs med Presentera … i en leverans.</div>`;
    } else if (tab === "contract") {
      const c = d.contract || {};
      body = c.locked && c.denied ? deniedHtml(c.denied, `${genitive(x.label)} avtal`, { act: "customer-tab", tab: "overview", label: `Öppna ${genitive(x.label)} översikt`, text: "Översikten och filbanken ser du som vanligt." })
        : c.locked ? `<div class="mmeta">Avtalet syns bara med rätten «Se avtal och priser»${c.holders?.length ? `, som ${esc(c.holders.join(", "))} har` : ""}.</div>`
        : (c.commitments || []).map((m) => `<div class="crow"><b>${esc(m.label)}</b><span class="mmeta">${esc(m.invoice_line || "")}</span></div>`
          + (m.lines || []).map((l) => `<div class="crow sub"><span>${esc(l.label)}${l.quantity ? ` · ${l.quantity}${l.period === "month" ? " i månaden" : ""}` : ""}</span><span class="mmeta">${esc(l.cap || "")}</span></div>`).join("")).join("") || `<div class="mmeta">Inget avtal inlagt.</div>`;
    }
    const o = sd.overview?.overview;
    const line = o ? [o.roles?.includes("prospect") ? "Prospekt" : "Kund", o.contact ? `kontakt ${o.contact}` : "", o.open_cases ? `${o.open_cases} öppna ärenden` : ""].filter(Boolean).join(" · ") + "." : "";
    return `<div class="slabel">Kund</div><h1 class="stitle">${esc(sd.label || x.label)}</h1><p class="sline">${esc(line)}</p>`
      + `<div class="tabs">${tabs}</div><div class="cbody">${body}</div>`;
  }

  /* ── Steget (fas 2, README «Steget», BESLUT 4–5, docs/design/v6/FAS2-server.md) ──
     Arket ur read { op: "step_sheet" }. Ändringar hålls lokalt tills man väljer var de
     ska gälla: ● bara här (write step_edit, med Ångra), ◐ kundens sätt eller metoden
     (förhandsvisas med serverns anrop och skickas sedan med confirmed). */
  const stepId = (task, step) => `${task}|${step}`;
  const splitStep = (id) => { const i = String(id).indexOf("|"); return [id.slice(0, i), id.slice(i + 1)]; };
  function openStep(task, step, label) { openSheet("step", stepId(task, step), label || stepLabel(task, step)); }
  const edits = (id) => S.edits?.[id] || {};
  function setEdit(id, patch) {
    const cur = { ...edits(id), ...patch };
    for (const k of Object.keys(cur)) if (cur[k] === undefined) delete cur[k];
    S.edits = { ...(S.edits || {}), [id]: cur };
  }
  const sheetOf = (id) => S.sheetData[`step:${id}`]?.sheet || null;
  /** Fälten som ändrats lokalt, i step_edit:s form. */
  function editFields(id) {
    const e = edits(id), sh = sheetOf(id), out = {};
    if (!sh) return out;
    if (e.label !== undefined && e.label !== sh.label) out.label = e.label;
    if (e.prompt !== undefined && e.prompt !== sh.prompt?.template) out.prompt = e.prompt;
    if (e.checklist !== undefined && JSON.stringify(e.checklist) !== JSON.stringify(sh.checklist.map((c) => c.text))) out.checklist = e.checklist;
    if (e.level !== undefined && e.level !== sh.level?.value) out.level = e.level;
    if (e.addition !== undefined && e.addition.trim() !== (sh.prompt?.addition?.template ?? "").trim()) out.prompt_addition = e.addition.trim() || null;
    return out;
  }

  /* ── Byta namn direkt (Daniel P 2026-10-05: «byta namn på saker … utan att be Claude varje gång») ──
     Klick på namnet blir ett fält: Enter sparar, Esc avbryter, kvittot har Ångra.
     Leverans, uppgift/ärende/del, resultat och steg i leveransens lista skrivs direkt (●);
     metoden och metodens steg förhandsvisas (◐) och blir ett förslag utan rätten. */
  const rnKey = (kind, id) => `${kind}:${id}`;
  function rn(kind, id, text, cls = "") {
    if (S.rename?.key === rnKey(kind, id)) return `<input id="rename-input" class="rn-in ${cls}" value="${esc(S.rename.value)}" aria-label="Nytt namn" autocomplete="off">`;
    return `<span class="rn ${cls}" role="button" tabindex="0" data-act="rename" data-rkind="${esc(kind)}" data-rid="${esc(id)}" data-rold="${esc(text)}" title="Byt namn · Enter sparar, Esc avbryter">${esc(text)}</span>`;
  }
  /** En uppgifts namn är leveranstypen och tillfället; det man byter är tillfället (inom parentesen). */
  const occasionOf = (label) => { const m = /^[^(]*\((.*)\)\s*$/.exec(label || ""); return m ? m[1] : label || ""; };
  function renameStart(kind, id, old) {
    const init = kind === "task" ? occasionOf(old) : old;
    S.rename = { key: rnKey(kind, id), kind, id, old, init, value: init };
    render();
    const el = root.querySelector?.("#rename-input");
    if (el) { el.focus?.(); el.select?.(); }
  }
  function afterRename() {
    for (const k of Object.keys(S.sheetData)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
    const t = top1(); if (t) fetchSheet(t, true);
    refreshSoon();
  }
  async function renameSave() {
    const r = S.rename; if (!r) return;
    const label = r.value.trim(); S.rename = null;
    if (!label || label === r.init) { render(); return; }
    try {
      if (r.kind === "delivery") {
        await call("execute_step", { task: r.id, values: { label }, confirmed: true });
        say(`Leveransen heter nu «${label}».`, { tool: "execute_step", args: { task: r.id, values: { label: r.old }, confirmed: true } });
      } else if (r.kind === "task") {
        await call("execute_step", { task: r.id, values: { note: label }, reason: "Nytt namn i vyn", confirmed: true });
        say(`Nytt namn: «${label}».`, r.init && r.init !== r.old ? { tool: "execute_step", args: { task: r.id, values: { note: r.init }, reason: "Ångrat i vyn", confirmed: true } } : null);
      } else if (r.kind === "result") {
        const md = S.sheetData[`result:${r.id}`]?.doc?.markdown;
        if (md === undefined) { say("Namnet kan bytas när texten är hämtad.", null, true); render(); return; }
        await call("write", { op: "content_save", id: r.id, name: label, markdown: md, confirmed: true });
        say(`Heter nu «${label}». Det blev en ny version; den gamla finns kvar.`, { tool: "write", args: { op: "content_save", id: r.id, name: r.old, markdown: md, confirmed: true } });
      } else if (r.kind === "step") {
        const [task, step] = splitStep(r.id);
        const res = await call("write", { op: "step_edit", task, step, layer: "here", label });
        say(`Steget heter «${label}» här. Ska det gälla fler: öppna steget.`, res?.undo || null);
      } else if (r.kind === "method" || r.kind === "method_step") {
        const c = { tool: "write", args: { op: "registry_define", change: true, node: { id: r.id, label } } };
        const pv = await call(c.tool, c.args);
        S.confirm = { text: summaryText(pv) || `«${r.old}» får namnet «${label}».`, verb: can("change_methods") ? `Byt namn till «${label}»` : "Föreslå namnet",
          next: c, step: { id: null, call: c, layer: "rename", key: null } };
        render(); return;
      }
      afterRename();
    } catch (e) { say(`Namnet kunde inte bytas: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }

  /* ── Redigera text själv: markdown med förhandsvisning ── */
  const mdHtml = (md) => `<div class="mdprev">${mdBlocks(md).map((b) => blockHtml(b.t === "li" && !b.n ? { ...b, s: `• ${b.s}` } : b)).join("") || `<span class="mmeta">Tomt.</span>`}</div>`;
  /** Skriv · Förhandsvisa för fältet `id` (S.mdPrev). */
  const mdTabs = (id) => `<span class="ptabs"><button class="${S.mdPrev?.[id] ? "" : "on"}" data-act="md-mode" data-md="${esc(id)}" data-prev="">Skriv</button>`
    + `<button class="${S.mdPrev?.[id] ? "on" : ""}" data-act="md-mode" data-md="${esc(id)}" data-prev="1">Förhandsvisa</button></span>`;

  /* ── Metoden är generell: det kundunika hör hemma i kundens sätt ──
     Samma prövning som servern (src/plan/customer-specific.ts, SPECIFIC_PATTERNS);
     bara det som är nytt i ändringen räknas. */
  const SPECIFIC = [[/\b\d[\d ]*(?:[.,]\d+)?\s?(?:kr|sek|kronor|:-)(?![\p{L}])/giu, "ett pris"], [/[\p{L}\d_.+-]+@[\p{L}\d-]+(?:\.[\p{L}\d-]+)+/gu, "en e-postadress"],
    [/\b\d{6,}\b/g, "ett id i ett system"], [/\p{L}+(?:gatan|vägen|gränd|torget|allén|backe)\s+\d+\p{L}?/giu, "en adress"]];
  function specificHits(sh, texts, before) {
    const hay = texts.filter(Boolean).join("\n"), old = before.filter(Boolean).join("\n"), out = new Map();
    const word = (t) => new RegExp(`(^|[^\\p{L}])${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}s?(?![\\p{L}])`, "iu");
    for (const c of sh.customer_terms || []) if (word(c.term).test(hay) && !word(c.term).test(old)) out.set(c.term, c.why);
    for (const [re, why] of SPECIFIC) for (const m of hay.matchAll(new RegExp(re.source, re.flags))) { const k = m[0].trim(); if (!old.includes(k) && !out.has(k)) out.set(k, why); }
    return [...out].map(([text, why]) => ({ text, why }));
  }
  /** Det som lagts till sist i metodens prompt, när ändringen bara är ett tillägg. */
  const appended = (before, after) => { const b = (before || "").trimEnd(), a = (after || "").trimEnd(); return a.startsWith(b) && a.length > b.length ? a.slice(b.length).trim() : null; };
  const LAYER_TEXT = { method: "metoden", customer: "kundens sätt", assignment: "här" };
  const LEVELS = [["quick", "Snabb"], ["complex", "Noggrann"]];

  /** «Så här får Claude den nu»: prompten med variablerna markerade (#e9e5fa). */
  function promptMarked(p) {
    if (!p) return "";
    let out = "", at = 0;
    for (const m of [...(p.marks || [])].sort((a, b) => a.from - b.from)) {
      if (m.from < at) continue;
      out += esc(p.text.slice(at, m.from)) + `<span class="var${m.missing ? " miss" : ""}" title="${esc(m.missing ? `saknas: ${m.name}` : m.name)}">${esc(p.text.slice(m.from, m.to))}</span>`;
      at = m.to;
    }
    return out + esc(p.text.slice(at));
  }

  /** Prompten i block: det som kommer från metoden (eller uppdraget) och det som kommer från kundens sätt. */
  function promptSeg(p, from, to) {
    let out = "", at = from;
    for (const m of [...(p.marks || [])].sort((a, b) => a.from - b.from)) {
      if (m.from < at || m.to > to) continue;
      out += esc(p.text.slice(at, m.from)) + `<span class="var${m.missing ? " miss" : ""}" title="${esc(m.missing ? `saknas: ${m.name}` : m.name)}">${esc(p.text.slice(m.from, m.to))}</span>`;
      at = m.to;
    }
    return out + esc(p.text.slice(at, to));
  }
  const tplHtml = (t) => esc(t).replace(/\{([a-z_]+(?::[^}]+)?)\}/g, `<span class="tvar">{{$1}}</span>`);
  function promptBlocks(x, sh, P, mode, cust, e) {
    const fromText = (l) => l === "customer" ? `Från ${cust}s sätt` : l === "assignment" ? "Bara här, i det här uppdraget" : "Från metoden · gäller alla kunder";
    const hasCust = !!sh.customer && P.layer !== "assignment";
    if (mode === "edit") {
      return `<div class="pblk ${esc(P.layer)}"><div class="pfrom">${esc(fromText(P.layer))}</div>`
        + `<textarea id="step-prompt" rows="8" data-step-id="${esc(x.id)}">${esc(e.prompt ?? P.template)}</textarea></div>`
        + (hasCust ? `<div class="pblk customer"><div class="pfrom">${esc((P.addition?.head || `Tillägg för ${cust}`).replace(/:$/, ""))} · bara det som är specifikt för ${esc(cust)}</div>`
          + `<textarea id="step-addition" rows="3" data-step-id="${esc(x.id)}" placeholder="Till exempel tonläget, listorna eller det ${esc(cust)} inte vill se. Lämna tomt om metoden räcker.">${esc(e.addition ?? P.addition?.template ?? "")}</textarea></div>` : "")
        + `<div class="mmeta">Det som syns under «Så får Claude den» ändras när ändringen sparats.</div>`;
    }
    if (mode === "tpl") return `<div class="pblk ${esc(P.layer)}"><div class="pfrom">${esc(fromText(P.layer))}</div><div class="ptxt">${tplHtml(P.template)}</div></div>`
      + (P.addition ? `<div class="pblk customer"><div class="pfrom">${esc(fromText("customer"))}</div><div class="ptxt">${tplHtml(`${P.addition.head}\n${P.addition.template}`)}</div></div>` : "");
    return (P.parts || [{ layer: P.layer, from: 0, to: P.text.length }]).map((p) => `<div class="pblk ${esc(p.layer)}"><div class="pfrom">${esc(fromText(p.layer))}</div><div class="ptxt">${promptSeg(P, p.from, p.to)}</div></div>`).join("");
  }
  /**
   * «Ändrat här. Ska det gälla fler?» ● Bara här, ◐ kundens sätt, ◐ metoden.
   * Metoden är generell: står det kundunika i ändringen är Metoden inaktiv, med skälet,
   * och kundens sätt föreslås (som tillägg till prompten när ändringen är ett tillägg).
   */
  function layerQuestion(x, sh) {
    const f = editFields(x.id);
    if (!Object.keys(f).length) return "";
    const cust = sh.layers.customer || sh.customer?.label, custName = cust ? `${cust}s sätt` : "Kundens sätt";
    const P = sh.prompt;
    const added = f.prompt !== undefined && P ? appended(P.template, f.prompt) : null;
    const hits = specificHits(sh, [f.label, f.prompt, ...(f.checklist || [])], [sh.label, P?.template, ...sh.checklist.map((c) => c.text)]);
    const onlyAddition = f.prompt_addition !== undefined && Object.keys(f).length === 1;
    const methodOk = !hits.length && f.level === undefined && f.prompt_addition === undefined;
    const custOk = f.label === undefined && f.level === undefined && (f.prompt === undefined || added !== null || hits.length > 0);
    const why = hits.length ? `<span class="why">Metoden gäller alla kunder: ${esc(hits.slice(0, 3).map((h) => `«${h.text}» är ${h.why}`).join(", "))}. `
      + (added !== null || f.prompt_addition !== undefined ? `Spara det i ${esc(custName)} — som ett tillägg till prompten.` : f.prompt !== undefined ? `Skriv det kundunika i rutan «Tillägg för ${esc(cust || "kunden")}» och spara där, eller spara bara här.` : "Spara det bara här.") + `</span>` : "";
    return `<div class="layq"><b>Ändrat här. Ska det gälla fler?</b>`
      + `<button data-act="step-save" data-layer="here"><span class="lvl d">●</span> Bara här</button>`
      + (custOk && sh.customer ? `<button data-act="step-save" data-layer="customer"${hits.length && f.prompt !== undefined && added === null ? " disabled" : ""}><span class="lvl">◐</span> ${esc(custName)}${added !== null && f.prompt_addition === undefined ? " (som tillägg)" : ""}</button>` : "")
      + (f.level === undefined && !onlyAddition ? `<button data-act="step-save" data-layer="method"${methodOk ? "" : ` disabled aria-disabled="true" title="Metoden är generell: inget kundunikt"`}><span class="lvl">◐</span> Metoden</button>` : "")
      + `<button class="quiet" data-act="step-reset">Ångra ändringen</button>${why}</div>`;
  }

  function stepSheetHtml(x) {
    const [task, step] = splitStep(x.id), sd = S.sheetData[sheetKey(x)] || {}, sh = sd.sheet;
    // Innan steget är läst: leveransen och läget ur översiktsraden direkt.
    if (!sh) { const r0 = rowOfTask(task); return `<div class="slabel">Steg${r0 ? ` · ${esc(r0.label)}` : ""}</div><h1 class="stitle">${esc(x.label)}</h1>${r0?.state_text ? `<p class="sline">${esc(r0.state_text)}</p>` : ""}`
      + (sd.error ? `<div class="banner"><span style="flex:1">Steget kunde inte läsas: ${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>` : `<p class="sline mmeta">Hämtar steget …</p>`); }
    const e = edits(x.id), row = rowOfTask(task);
    const label = `Steg${row ? ` · ${row.label}` : ""}${sh.customer?.label ? ` · ${sh.customer.label}` : ""}`;
    const name = `<input class="tname" id="step-label" data-step-id="${esc(x.id)}" value="${esc(e.label ?? sh.label)}" aria-label="Stegets namn">`;
    const reads = sh.reads.length ? sh.reads.map((r) => r.have
      ? `<button class="rd" data-act="material" data-key="${esc(r.key)}" title="Visa bredvid">${esc(r.label)} <span>⇥</span></button>`
      : `<span class="rd miss" title="${esc(r.left_by ? `lämnas av «${r.left_by}»` : "")}">saknas: ${esc(r.label)}</span>`).join("") : `<span class="mmeta">Inget underlag.</span>`;
    const how = `<h3 class="sh">Så görs det</h3><div class="how">`
      + `<span class="hk">Görs av</span><div><span class="who-k ${esc(sh.who)}">${esc(sh.who_text)}</span>${sh.responsible ? `<span class="mmeta"> · ${esc(sh.responsible.label)}</span>` : ""}</div>`
      + `<span class="hk">Var</span><div>${sh.where.length ? esc(sh.where.join(", ")) : `<span class="mmeta">Inte angivet.</span>`}</div>`
      + `<span class="hk">Underlag</span><div class="rds">${reads}</div>`
      + `<span class="hk">Lämnar</span><div>${sh.leaves.length ? esc(sh.leaves.join(", ")) : `<span class="mmeta">Inget som sparas.</span>`}</div>`
      + (sh.enough ? `<span class="hk">Klart när</span><div>${esc(sh.enough)}</div>` : "") + `</div>`;
    let block = assignHtml(x, sh);
    if (sh.prompt) {
      const lv = e.level ?? sh.level?.value ?? "default", P = sh.prompt, cust = sh.layers.customer || sh.customer?.label || "kunden";
      const mode = x.pedit ? "edit" : x.ptpl ? "tpl" : "now";
      block += `<div class="bh"><b>Prompten</b><span class="mmeta">${mode === "edit" ? "skriv direkt · variablerna står som {namn} och fylls i av dirigenten" : "svart på vitt, exakt som Claude får den"}</span>`
        + `<span class="ptabs"><button class="${mode === "now" ? "on" : ""}" data-act="prompt-mode" data-mode="now">Så får Claude den</button><button class="${mode === "tpl" ? "on" : ""}" data-act="prompt-mode" data-mode="tpl">Visa mallen</button>`
        + `<button class="${mode === "edit" ? "on" : ""}" data-act="prompt-mode" data-mode="edit">Redigera</button></span>`
        + `<span class="lvls">${LEVELS.map(([v, l]) => `<button class="${lv === v ? "on" : ""}" data-act="step-level" data-level="${v}">${l}</button>`).join("")}</span></div>`
        + promptBlocks(x, sh, P, mode, cust, e)
        + `<div class="rules"><span class="hk">Claude får inte</span><div>${sh.must_not.length ? sh.must_not.map(esc).join("<br>") : `<span class="mmeta">Inget särskilt.</span>`}</div>`
        + `<span class="hk">Stannar och frågar när</span><div>${sh.ask_when.length ? sh.ask_when.map(esc).join("<br>") : `<span class="mmeta">Inget särskilt.</span>`}</div></div>`;
    }
    if (sh.checklist.length || e.checklist || sh.who === "human") {
      const list = e.checklist ?? sh.checklist.map((c) => c.text), done = new Set(sh.checklist.filter((c) => c.done).map((c) => c.text));
      block += `<div class="bh"><b>Så gör du</b><span class="mmeta">bocka av medan du gör · skriv om ett moment där det står</span></div><div class="moms">`
        + list.map((t, i) => `<div class="mom"><button class="tick${done.has(t) ? " on" : ""}" data-act="step-tick" data-i="${i}" title="Bocka av · ●" aria-pressed="${done.has(t)}">${done.has(t) ? "✓" : ""}</button>`
          + `<span class="mn">${i + 1}</span>${S.momEdit === `${x.id}|${i}` ? `<textarea id="mom-${i}" class="mtext" data-step-id="${esc(x.id)}" rows="${Math.max(2, Math.ceil(t.length / 90))}" aria-label="Moment ${i + 1}">${esc(t)}</textarea>`
            : `<div class="mtext" data-act="mom-edit" data-i="${i}" role="button" tabindex="0" title="Skriv om momentet">${mdHtml(t)}</div>`}<button class="quiet" data-act="mom-del" data-i="${i}" title="Ta bort">✕</button></div>`).join("")
        + `</div><button class="link" data-act="mom-add">+ Lägg till moment</button>`;
    }
    if (sh.operation) block += `<div class="bh"><b>Det här körs</b><span class="mmeta">${esc(sh.operation.name)}</span></div>`
      + `<div class="ops">${sh.operation.values.map((v) => `<span class="hk">${esc(v.name)}</span><span>${esc(v.value)}<span class="mmeta"> · ${esc(LAYER_TEXT[v.layer] || v.layer)}</span></span>`).join("") || `<span class="mmeta">Inga värden.</span>`}</div>`;
    // Lagerfrågan: bara när något ändrats lokalt.
    const layerQ = layerQuestion(x, sh);
    const lay = sh.layers;
    const layerLine = `<div class="layers">Namnet från ${esc(LAYER_TEXT[lay.label])} · instruktionen från ${esc(LAYER_TEXT[lay.instruction])}`
      + (lay.prompt ? ` · prompten från ${esc(LAYER_TEXT[lay.prompt])}` : "")
      + (lay.customer_diffs?.length ? ` · ${esc(lay.customer || "kunden")}s sätt: ${esc(lay.customer_diffs.join("; "))}` : "") + `.</div>`;
    return `<div class="slabel">${esc(label)}</div>${name}<p class="sline">${esc(sh.purpose || "")}</p>`
      + `<div class="sgrid"><div class="smain">${how}${block}${layerQ}${layerLine}${doItHtml(x, sh)}${stepPartsHtml(sh)}</div>${stepMargin(x, sh, sd)}</div>`;
  }

  /**
   * Uppdraget: instruktionen för just det här uppdraget (bara här), i markdown med
   * förhandsvisning. Sparas som uppdragets material (asset_register, kind instruction);
   * den gamla versionen finns kvar. Claude får den före metoden och kundens sätt.
   */
  function assignHtml(x, sh) {
    const a = sh.assignment, text = S.assignEdit?.[x.id] ?? a?.text ?? "", open = !!a || S.assignEdit?.[x.id] !== undefined;
    const head = `<div class="bh"><b>Uppdraget</b><span class="mmeta">bara här · gäller före metoden och kundens sätt${a ? ` · sparat ${esc(shortIso(a.at))}` : ""}</span>${open ? mdTabs(`assign:${x.id}`) : ""}</div>`;
    if (!open) return head + `<button class="link" data-act="assign-start">+ Skriv en instruktion för det här uppdraget</button>`;
    const dirty = S.assignEdit?.[x.id] !== undefined && S.assignEdit[x.id] !== (a?.text ?? "");
    return head + (S.mdPrev?.[`assign:${x.id}`] ? mdHtml(text) : `<textarea id="assign-text" class="rtext" rows="5" placeholder="Vad som gäller just här, i markdown">${esc(text)}</textarea>`)
      + (dirty ? `<div class="doacts"><button class="primary" data-act="assign-save"><span class="lvl d">●</span> Spara uppdraget</button><button class="quiet" data-act="assign-reset">Ångra ändringen</button>${a ? `<span class="mmeta">Den gamla versionen finns kvar.</span>` : ""}</div>` : "");
  }
  async function assignSave(id) {
    const [task, step] = splitStep(id), sh = sheetOf(id), text = (S.assignEdit?.[id] ?? "").trim();
    if (!text) { say("Uppdraget är tomt. Skriv något först.", null, true); render(); return; }
    try {
      await call("asset_register", { asset_type: "core.asset.material", acquisition: "provided", text, mime: "text/markdown",
        filename: `Instruktion för uppdraget – ${sh?.label || step}.md`.replace(/[\\/]/g, "-"), for_task: task, for_step: step,
        ...(sh?.customer?.id ? { customer: sh.customer.id } : {}),
        material: { what: "Instruktionen för det här uppdraget", how: "Gäller i stället för det allmänna och kundens sätt, bara i den här leveransen", level: "step", kind: "instruction" },
        confirmed: true });
      const { [id]: _x, ...rest } = S.assignEdit; S.assignEdit = rest;
      say("Uppdraget är sparat. Claude får det före metoden och kundens sätt.");
      staleStep(id, task);
    } catch (e) { say(`Uppdraget sparades inte: ${e.message || e}. Texten står kvar.`, null, true); }
    render();
  }

  /** Steg med delar: status per del och varv, ur stegets anteckningar och utkast när servern har dem. */
  function stepPartsHtml(sh) {
    if (!sh.parts?.length) return "";
    const PST = { todo: "inte börjad", started: "pågår", in: "inne", enough: "räcker" };
    return `<h3 class="sh">Delarna</h3><div class="mmeta">${sh.round ? `varv ${sh.round} · ` : ""}fylls på i valfri ordning · inget ja per del</div>`
      + sh.parts.map((p) => `<div class="crow"><span>${esc(p.label)}</span><span class="pst ${esc(p.state)}">${esc(PST[p.state] || p.state)}</span></div>`).join("");
  }

  /** Marginalen: Material bredvid när ett underlag är öppet, annars det som redan gjorts. */
  function stepMargin(x, sh, sd) {
    const mat = sd.material && sh.reads.find((r) => r.key === sd.material);
    if (mat) {
      const res = allResults().find((r) => r.step?.label && mat.left_by && r.step.label === mat.left_by);
      return `<aside class="margin side"><div class="mh">Material bredvid</div><b>${esc(mat.label)}</b>`
        + `<div class="mmeta">${mat.left_by ? `lämnas av «${esc(mat.left_by)}»` : "finns i underlaget"}</div>`
        + (res ? `<button class="link" data-act="open-result" data-id="${esc(res.id)}">Öppna ${esc(res.name)} →</button>` : "")
        + `<div class="sw">${sh.reads.filter((r) => r.have && r.key !== mat.key).map((r) => `<button class="link" data-act="material" data-key="${esc(r.key)}">${esc(r.label)}</button>`).join("")}</div>`
        + `<button class="quiet" data-act="material" data-key="">Stäng ✕</button></aside>`;
    }
    const done = sh.done ? `<div>Klart ${esc(shortIso(sh.done.at))} av ${esc(sh.done.by)}${sh.done.no_result ? ` · ${esc(sh.done.no_result)}` : ""}</div>` : `<div class="mmeta">Inte klart.</div>`;
    const [tk, sp] = splitStep(x.id), mine = sh.responsible?.label === S.data?.party?.label;
    const take = !sh.done && sh.who !== "customer" && sh.responsible && !mine
      ? `<div>${esc(sh.responsible.label)} har steget.</div><button class="edge" data-act="take-over" data-task="${esc(tk)}" data-step="${esc(sp)}" data-label="${esc(sh.label)}" title="Steget blir ditt, utan att någon behöver svara · T"><span class="lvl d">●</span> Ta över steget</button>` : "";
    return `<aside class="margin"><div class="mh">Läget</div>${done}${take}`
      + `<div class="mh">Utkast</div>${sh.drafts.length ? sh.drafts.map((d) => `<div>${esc(d.name)} <span class="mmeta">${d.approved_at ? "godkänt" : "utkast"} · ${esc(shortIso(d.at))}</span></div>`).join("") : `<div class="mmeta">Inga.</div>`}`
      + `<div class="mh">Filer</div>${sh.files.length ? sh.files.slice(0, 6).map((f) => `<div>${esc(f.file || f.type)}</div>`).join("") : `<div class="mmeta">Inga.</div>`}`
      + `<div class="mh">Anteckningar</div>${sh.notes.length ? sh.notes.slice(0, 6).map((n) => `<div><button class="link" data-act="open-note" data-id="${esc(n.id)}" data-name="${esc(n.name)}" title="Läs och redigera">${esc(n.name)}</button></div>`).join("") : `<div class="mmeta">Inga.</div>`}`
      + `<div class="mh">Claude får</div><button class="link" data-act="step-brief">Kopiera lägesbilden ↗</button></aside>`;
  }

  /**
   * «Gör det». Servern har ingen egen modell: Claude kör i claude.ai. Vyn kopierar
   * prompten, visar förloppet så långt den kan räkna det ur arket, tar emot svaret
   * i ett streckat utkast och sparar det med content_save (●). Esc avbryter.
   */
  function doItHtml(x, sh) {
    const r = S.run?.[x.id] || { phase: "idle" };
    let body = "";
    if (sh.done) body = `<div class="done-line"><span class="lvl d">●</span> <b>Klart.</b> ${esc(shortIso(sh.done.at))} av ${esc(sh.done.by)}.</div>`;
    else if (sh.prompt && r.phase === "idle") {
      const miss = sh.prompt.missing || [];
      body = (miss.length ? `<div class="missing"><b>Saknas:</b> ${esc(miss.join(", "))}. Claude säger det i utkastet om det fortsätter ändå.</div>` : "")
        + `<div class="doacts"><button class="primary" data-act="run-start"><span class="lvl d">●</span> ${miss.length ? "Kör ändå med Claude" : "Kör med Claude"}</button>`
        + `<button class="link" data-act="run-chat">Arbeta i chatten ↗</button><button class="link" data-act="step-done">Markera klart utan resultat</button></div>`
        + `<div class="mmeta">Prompten kopieras till Claude i claude.ai. Klistra in svaret här; det sparas som ett streckat utkast.</div>`;
    } else if (sh.prompt) {
      const lines = runLines(sh);
      body = `<div class="prog">${lines.map((l, i) => `<div class="${i < r.i || r.phase === "draft" ? "ok" : i === r.i && r.phase === "run" ? "now" : ""}">${i < r.i || r.phase === "draft" ? "✓" : i === r.i && r.phase === "run" ? "…" : "·"} ${esc(l)}</div>`).join("")}`
        + (r.phase === "run" ? `<span class="mmeta">Esc avbryter</span>` : "") + `</div>`
        + `<div class="draftbox"><div class="mmeta">UTKAST · inte sparat</div><textarea id="run-draft" rows="10" data-step-id="${esc(x.id)}" placeholder="Klistra in Claudes svar här">${esc(r.text || "")}</textarea>`
        + `<div class="doacts"><button class="primary" data-act="run-save"${(r.text || "").trim() ? "" : " data-empty=\"1\""}><span class="lvl d">●</span> Spara utkastet</button>`
        + `<button class="link" data-act="run-copy">Kopiera prompten igen</button><button class="quiet" data-act="run-cancel">Avbryt · Esc</button></div></div>`;
    } else if (sh.approval) {
      // Ett godkännandesteg (#306): knappen heter det den gör, och «Godkänn inte» går tillbaka till steget före.
      const subj = approvalSubject(sh);
      body = `<div class="doacts"><button class="primary" data-act="step-done"><span class="lvl d">●</span> Godkänn${sh.approval.of ? ` «${esc(sh.approval.of.label)}»` : ""}</button>`
        + (sh.approval.of ? declineBtn(subj) : "") + `<button class="link" data-act="run-chat">Arbeta i chatten ↗</button></div>` + declineFormHtml(subj);
    } else if (sh.tool?.kind === "image" || sh.tool?.kind === "image_prompt") body = `<div class="doacts"><button class="link" data-act="step-done">Markera klart utan att välja här</button>`
      + `<button class="link" data-act="run-chat">Arbeta i chatten ↗</button></div>`;
    else body = `<div class="doacts"><button class="primary" data-act="step-done"><span class="lvl d">●</span> Markera klart</button>`
      + `<button class="link" data-act="run-chat">Arbeta i chatten ↗</button></div>`;
    const drafts = sh.drafts.filter((d) => !d.approved_at);
    const approve = drafts.length ? `<div class="drafts">${drafts.map((d) => { const subj = draftSubject(d, sh.task, sh.step, sh.label), df = S.diffs?.[d.id];
      return `<div class="mcard draft"><span class="fmt">UTKAST</span><b>${esc(d.name)}</b>`
      + `<span class="mmeta">${esc(shortIso(d.at))}${d.declined ? ` · inte godkänt: «${esc(d.declined.feedback)}»` : ""}</span><span class="dacts"><button class="link" data-act="open-result" data-id="${esc(d.id)}">Läs</button>`
      + `<button class="link" data-act="draft-approve" data-id="${esc(d.id)}" data-name="${esc(d.name)}">● Godkänn</button>${declineBtn(subj)}</span>`
      + declineFormHtml(subj) + (df ? `<div class="mh">Ändringen mot förra versionen</div>${diffHtml(df.before, df.after)}` : "") + historyHtml(d.history) + `</div>`; }).join("")}</div>` : "";
    const ahist = sh.approval ? historyHtml(sh.approval.history) : "";
    return `<h3 class="sh">Gör det</h3>${toolHtml(x, sh)}${body}${approve}${ahist}`;
  }
  /* ── Verktyget i steget (docs/plan-some-enkel.md) ─────────────────────────
   * Servern säger vilket verktyg steget har (sh.tool, räknat ur tillgångstypens
   * works_as i src/plan/step-next.ts). Vyn ritar det; ingen regel per metod.
   *   image / image_prompt — bildväljaren, öppen direkt i steget.
   *   approval / send / preview — det som granskas: texten och bilderna i formaten.
   * Bildväljaren är ett skal: all logik bor i read { op: "image_picker" } och
   * asset_register med ursprung, som i den gamla vyn. */
  const IPS = {};
  const IP_ORIGINS = [["own", "Eget foto"], ["customer", "Kundens bild"], ["ai_generated", "AI-genererad"], ["other", "Annan källa"]];
  const ipThumb = (c) => c.thumbnail_base64 ? `data:${c.thumbnail_mime || "image/webp"};base64,${c.thumbnail_base64}` : c.thumb_url || "";
  const ipKey = (c) => `${c.source}:${c.source_id}`;
  const ipQ = (P) => P.source === "bank" ? P.bankQ : P.source === "hubspot" ? P.hsQ : P.q;
  const ipSize = (c) => c.width && c.height ? `${c.width} × ${c.height} px` : "mått okända";
  const ipFail = (P, e) => { P.error = e?.message || String(e); };
  function toolHtml(x, sh) {
    const k = sh.tool?.kind;
    if (!k) return "";
    if (k === "image" || k === "image_prompt") return sh.done ? "" : ipHtml(x, sh);
    if (k === "approval" || k === "send" || k === "preview") return showsHtml(x, sh);
    return "";
  }
  /** Öppnas av sig själv första gången steget visas: källorna, sökningen och förvalet. */
  function ipHtml(x, sh) {
    let P = IPS[x.id];
    if (!P) {
      if (!sh.customer?.id) return `<div class="missing">Steget har ingen kund, så det finns inga bildkällor att välja ur.</div>`;
      P = IPS[x.id] = { id: x.id, task: sh.task, step: sh.step, customer: sh.customer.id, customerLabel: sh.customer.label, kind: sh.tool.kind,
        source: "bank", q: "", bankQ: "", hsQ: "", results: null, error: null, picked: new Map(), preset: false, compare: false, prompt: null,
        contents: [], content: "", sources: null, formats: [], textArea: null, busy: true, more: false, page: 1 };
      ipStart(P);
    }
    return `<div class="ip" data-ip="${esc(x.id)}">` + ipInner(P) + `</div>`;
  }
  async function ipStart(P) {
    try {
      const list = await call("read", { op: "content_list", customer: P.customer }).catch(() => ({ entries: [] }));
      const all = (list?.entries || []).filter((c) => c.status === "utkast").sort((a, b) => String(b.saved_at).localeCompare(String(a.saved_at)));
      const own = all.filter((c) => c.for_task === P.task);
      P.contents = [...own, ...all.filter((c) => c.for_task !== P.task)];
      P.content = own[0]?.id || "";
      await ipSources(P);
      if (P.kind === "image_prompt") return ipPrompt(P);
      // Ingen bild i kundens filer: sök i nästa källa med orden ur texten.
      await ipSearch(P);
      if (!P.results?.length) { const next = P.sources.find((s) => s.searchable && s.key !== "bank"); if (next) { P.source = next.key; await ipSearch(P); } }
      ipPreset(P);
    } catch (e) { ipFail(P, e); }
    P.busy = false; render();
  }
  /** Förvalet: de 3–4 första träffarna på orden ur texten, jämförda i formaten. Människan väljer. */
  function ipPreset(P) {
    const top = (P.results || []).filter((c) => !(c.too_small || []).length).slice(0, 4);
    if (top.length < 2) return;
    P.picked = new Map(top.map((c) => [ipKey(c), true])); P.preset = true; P.compare = true;
  }
  async function ipSources(P) {
    const d = await call("read", { op: "image_picker", mode: "sources", customer: P.customer, ...(P.content ? { content: P.content } : {}) });
    P.sources = d?.sources || [];
    P.q = d?.suggested_query_en || ""; P.formats = d?.formats || []; P.textArea = d?.text_area || null;
  }
  async function ipSearch(P, page = 1) {
    const src = P.sources?.find((s) => s.key === P.source);
    P.error = null; P.page = page;
    if (!src || src.key === "upload" || src.key === "adobe_stock") { P.results = null; return; }
    try {
      const d = await call("read", { op: "image_picker", mode: "search", customer: P.customer, source: P.source, page,
        ...(ipQ(P) ? { q: ipQ(P) } : {}), ...(P.content ? { content: P.content } : {}) });
      P.results = page > 1 ? [...(P.results || []), ...(d?.candidates || [])] : d?.candidates || [];
      P.more = Boolean(d?.more);
    } catch (e) { ipFail(P, e); P.results = []; }
  }
  async function ipPrompt(P) {
    P.compare = false;
    try { P.prompt = await call("read", { op: "image_picker", mode: "prompt", customer: P.customer, ...(P.content ? { content: P.content } : {}) }); }
    catch (e) { ipFail(P, e); }
  }
  function ipFrame(c, f) {
    const src = ipThumb(c) || c.preview_url, cf = f.crop_fraction || { x: 0, y: 0, w: 1, h: 1 }, ta = f.text_area;
    const pos = (o, s) => s >= 1 ? 0 : (o / (1 - s)) * 100;
    return `<div class="ip-frame" style="aspect-ratio:${f.size.width} / ${f.size.height};${src ? `background-image:url('${esc(src)}');background-size:${100 / cf.w}% ${100 / cf.h}%;background-position:${pos(cf.x, cf.w)}% ${pos(cf.y, cf.h)}%` : ""}">`
      + `<span class="ip-lbl">${esc(String(f.format).replace("x", ":"))}</span>`
      + (ta ? `<span class="ta" style="left:${ta.x * 100}%;top:${ta.y * 100}%;width:${ta.w * 100}%;height:${ta.h * 100}%" title="Mallens textyta"></span>` : "") + `</div>`;
  }
  function ipCard(P, c) {
    const on = P.picked.has(ipKey(c)), img = ipThumb(c), warn = (c.too_small || [])[0];
    return `<div class="ip-card" role="button" tabindex="0" aria-pressed="${on}" data-ip-pick="${esc(ipKey(c))}">`
      + `<div class="ph">${img ? `<img src="${esc(img)}" alt="${esc(c.title)}" loading="lazy">` : ""}</div>`
      + `<div class="t" title="${esc(c.title)}">${esc(c.title)}</div><div class="mmeta">${esc(ipSize(c))}</div>`
      + `<div class="mmeta">${esc([c.photographer ? `Foto ${c.photographer}` : null, c.license].filter(Boolean).join(" · ") || "Ursprung okänt")}</div>`
      + (c.cost ? `<span class="ip-cost">Kostar licens</span>` : "") + (warn ? `<div class="ip-warn">${esc(warn)}</div>` : "") + `</div>`;
  }
  function ipBody(P) {
    if (P.prompt) return `<div class="ip-prompt"><p>${esc(P.prompt.human_instruction)}</p><textarea data-ip-text data-ip-edit aria-label="Bildprompten">${esc(P.promptText ?? P.prompt.prompt)}</textarea>`
      + (P.prompt.image_rules_found ? "" : `<div class="ip-warn">Kunden har inga bildregler i dirigenten än, så Claude frågar om stil och ljus i stället.</div>`)
      + `<div class="doacts"><button class="primary" data-ip-copy="1">Kopiera prompten</button><button data-ip-made="1">Ladda upp den gjorda bilden</button><button class="quiet" data-ip-back="1">Tillbaka till bilderna</button></div>`
      + `<p class="mmeta">Skriv om prompten här om något ska ändras. Gör bilden i bildtjänsten och ladda sedan upp den: den sparas som AI-genererad med prompten och blir ett val bland bilderna.</p></div>`;
    if (P.source === "upload") return `<div class="ip-fields">`
      + `<label><span>Bilden (PNG eller JPG, högst 4 MB)</span><input type="file" data-ip-file accept="image/png,image/jpeg,image/webp"></label>`
      + `<div><span>Var kommer bilden ifrån? Det måste anges.</span><div class="ip-bar">${IP_ORIGINS.map(([v, l], i) => `<label><input type="radio" name="ip-origin" value="${v}"${(P.made ? v === "ai_generated" : !i) ? " checked" : ""}> ${esc(l)}</label>`).join("")}</div></div>`
      + `<label><span>Fotograf eller upphov (valfritt)</span><input data-ip-by></label>`
      + `<label><span>Tjänst, för en AI-bild</span><select data-ip-gen><option value="">–</option><option>ChatGPT</option><option>Gemini</option><option>Midjourney</option><option>Adobe Firefly</option><option>Annan</option></select></label>`
      + `<label><span>Prompten bilden gjordes med, för en AI-bild</span><textarea data-ip-promptin rows="3">${esc(P.made ? P.promptText ?? P.prompt?.prompt ?? "" : "")}</textarea></label></div>`;
    if (P.source === "adobe_stock") {
      const s = P.sources.find((x) => x.key === "adobe_stock");
      const text = `Sök bilder i Adobe Stock till ${P.customerLabel}${P.q ? ` på «${P.q}»` : ""} med Adobe-kopplingen, och visa dem märkta «Kostar licens». `
        + `Licensiera ingenting förrän jag sagt ja — följ receptet «Licensiera stockbild» i dirigenten (read { op: "image_picker", mode: "search", source: "adobe_stock", customer: "${P.customer}" }).`;
      return `<p>${esc(s?.note || "")}</p><p class="mmeta">Adobe Stock nås bara av Claude, med Adobe-kopplingen. Kopiera texten och klistra in den i Claude.</p>`
        + `<div class="ip-prompt"><textarea readonly data-ip-text>${esc(text)}</textarea></div><div class="doacts"><button data-ip-copy="1">Kopiera</button></div>`;
    }
    if (P.busy && !P.results?.length) return `<div class="mmeta">Hämtar kundens bilder och förvalet …</div>`;
    if (P.error && !P.results?.length) return `<div class="ip-warn">${esc(P.error)}</div>`;
    if (!P.results) return "";
    if (!P.results.length) return `<div class="mmeta"><b>Inga bilder${ipQ(P) ? ` för «${esc(ipQ(P))}»` : ""}.</b> Ändra sökorden, välj en annan källa, ladda upp en egen bild eller skapa en bildprompt.</div>`;
    if (P.compare) {
      const sel = P.results.filter((c) => P.picked.has(ipKey(c)));
      return (P.preset ? `<p class="mmeta">Förvalda: de ${sel.length} första träffarna på orden ur texten. Välj en, eller gå till alla bilderna.</p>` : "")
        + `<div class="ip-cmp">${sel.map((c) => `<div class="col"><div class="ip-frames">${(c.fit || []).map((f) => ipFrame(c, f)).join("")}</div>`
        + `<div class="t">${esc(c.title)}</div><div class="mmeta">${esc(ipSize(c))}</div>${(c.too_small || []).map((w) => `<div class="ip-warn">${esc(w)}</div>`).join("")}`
        + `<button data-ip-only="${esc(ipKey(c))}">Välj den här</button></div>`).join("")}</div>`
        + `<p class="mmeta">Den streckade rutan är mallens textyta. Välj en bild där motivet håller i alla format och textytan ligger över en lugn del.</p>`;
    }
    return `<div class="ip-grid">${P.results.map((c) => ipCard(P, c)).join("")}</div>`
      + (P.more ? `<div class="doacts"><button class="quiet" data-ip-more="1">Visa fler</button></div>` : "");
  }
  function ipInner(P) {
    const fmt = (P.formats || []).map((f) => typeof f === "string" ? f : `${String(f.label).replace("x", ":")}`).join(", ");

  /** En fil genom kopplingen: liten i ett anrop, större i bitar om 256 kB (som i den gamla vyn). */
  async function ipUpload(f, fields) {
    const CH = 256 * 1024, mime = f.type || "image/jpeg", yes = `Ja i vyn: ladda upp ${f.name}`.slice(0, 500);
    const b64 = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
    if (f.size <= CH) return call("asset_register", { ...fields, filename: f.name, mime, base64: await b64(f), confirmed: true, user_approval: yes });
    const sha = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await f.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
    const id = `u${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`, total = Math.ceil(f.size / CH);
    let last = null;
    for (let i = 0; i < total; i++) {
      const base64 = await b64(f.slice(i * CH, Math.min(f.size, (i + 1) * CH)));
      for (let attempt = 1; ; attempt++) {
        try { last = await call("asset_register", { ...fields, filename: f.name, mime, base64, chunk: { id, index: i, total, sha256: sha }, confirmed: true, user_approval: yes }); break; }
        catch (e) { if (attempt >= 3 || e?.code === "VALIDATION" || e?.code === "FORBIDDEN") throw new Error(`${f.name}: bit ${i + 1} av ${total} gick inte upp — ${e?.message || e}`); }
      }
    }
    return last;
  }

    return head + `<div class="shows">${V.items.map((it) => it.kind === "text"

      for (const k of Object.keys(S.sheetData)) if (k === `result:${id}` || S.sheetData[k].results?.some((y) => y.id === id)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };

  }
  async function approveDraft(id, name) {
    try { await call("write", { op: "content_approve", id, user_approval: `Ja (● Godkänn «${name}» i vyn)`.slice(0, 500) }); say(`«${name}» är godkänt.`);
      for (const k of Object.keys(S.sheetData)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const t = top1(); if (t) fetchSheet(t, true); }
