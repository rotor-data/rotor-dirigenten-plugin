  const resultCard = (m) => `<div class="mcard${m.status === "draft" ? " draft" : ""}" title="${esc(m.name)}" data-act="open-result" data-id="${esc(m.id)}" role="button">`
    + (m.thumbnail ? (S.thumbs?.[m.id] ? `<img class="mthumb" src="${S.thumbs[m.id]}" alt="" loading="lazy">` : `<span class="mthumb"></span>`) : "")
    + `<span class="fmt">${esc((m.format_text || m.format || "").toUpperCase())}</span><b>${esc(m.name)}</b>`
    + (m.excerpt ? `<span class="mex">${esc(m.excerpt)}</span>` : "")
    + `<span class="mmeta">${esc(m.status_text || "")}${m.version ? ` · v${m.version}` : ""}${m.step?.label ? ` · från «${esc(m.step.label)}»` : ""}</span></div>`;
  /** Lagerraden med vad siffrorna betyder vid hovring: skillnaderna och de egna ändringarna, en per rad. */
  function layersHtml(l) {
    const tip = [l.customer?.list?.length ? `${l.customer.label}s sätt:\n${l.customer.list.map((d) => `· ${d}`).join("\n")}` : "",
      l.own_list?.length ? `Egna ändringar:\n${l.own_list.map((d) => `· ${d}`).join("\n")}` : ""].filter(Boolean).join("\n\n");
    return `<div class="layers"${tip ? ` title="${esc(tip)}"` : ""}>${esc(l.text)}.</div>`;
  }
  /** Så många resultat per ärende i strömmens ark; «Visa alla» visar resten. */
  const RESULTS_PER_CASE = 2;
  /*
   * Materialet i kategorier (Daniel P 2026-10-06): resultaten först, oavsett
   * utkast eller godkänt; sedan grunddokumenten per sort; sist övrigt.
   * Kategorin räknas av servern (src/views/results.ts, materialCategory).
   */
  const BASIS_ORDER = ["Uppdrag", "Brief", "Plan", "Ramar", "Spårens uppdrag"];
  function materialHtml(results) {
    const of = (c) => results.filter((r) => (r.category || "result") === c);
    const res = of("result"), basis = of("basis"), other = of("other");
    const cards = (g) => `<div class="made">${g.map(resultCard).join("")}</div>`;
    const kinds = [...new Set(basis.map((r) => r.basis || "Grunddokument"))].sort((a, b) => (BASIS_ORDER.indexOf(a) + 99) % 99 - (BASIS_ORDER.indexOf(b) + 99) % 99);
    return (res.length ? `<div class="mcat">Resultat · ${res.length}</div>${cards(res)}` : "")
      + (basis.length ? `<div class="mcat">Grunddokument · ${basis.length}</div>`
        + kinds.map((k) => { const g = basis.filter((r) => (r.basis || "Grunddokument") === k); return `<div class="msub">${esc(k)} · ${g.length}</div>${cards(g)}`; }).join("") : "")
      + (other.length ? `<div class="mcat">Övrigt · ${other.length}</div>${cards(other)}` : "");
  }
  /** Vilka delar som är ihopfällda, per leverans; sparas i webbläsaren (utan lagring: bara den här sessionen). */
  const FOLD_KEY = "v6.material.fold";
  let folds = {};
  try { folds = JSON.parse(globalThis.localStorage?.getItem(FOLD_KEY) || "{}") || {}; } catch { folds = {}; }
  const folded = (sheet, task) => !!folds[sheet]?.includes(task);
  function toggleFold(sheet, task) {
    const set = new Set(folds[sheet] || []);
    if (set.has(task)) set.delete(task); else set.add(task);
    folds = { ...folds, [sheet]: [...set] };
    try { globalThis.localStorage?.setItem(FOLD_KEY, JSON.stringify(folds)); } catch { /* lagring stängd: gäller tills sidan laddas om */ }
  }
  /** Strömmens resultat per ärende (nyast först); en leverans i delar per del, i delarnas ordning och i kategorier. */
  function resultsByCase(x, sd, results) {
    // En leverans i delar grupperas per del (öppnar delen), en ström per ärende (öppnar ärendet).
    const byPart = !sd.stream && !!sd.parts;
    const all = !!S.allCases[`res:${x.id}`], title = new Map(byPart ? sd.parts.map((p) => [p.task, p.label]) : (sd.cases || []).map((c) => [c.task, c.title]));
    const head = (task) => byPart
      ? `<button class="link" data-act="open-part" data-task="${esc(task)}" data-parent="${esc(x.id)}" data-label="${esc(title.get(task) || task)}">${esc(title.get(task) || task)}</button>`
      : `<button class="link" data-act="open-case" data-task="${esc(task)}" data-label="${esc(title.get(task) || task)}">${esc(title.get(task) || task)}</button>`;
    const groups = new Map();
    if (byPart) for (const p of sd.parts) groups.set(p.task, []);
    for (const r of results) groups.set(r.task, [...(groups.get(r.task) || []), r]);
    if (byPart) return [...groups].filter(([, g]) => g.length).map(([task, g]) => {
      const shut = folded(x.id, task);
      const n = g.filter((r) => (r.category || "result") === "result").length;
      return `<div class="part"><button class="fold" data-act="mat-fold" data-key="${esc(x.id)}" data-task="${esc(task)}" aria-expanded="${!shut}" title="${shut ? "Visa materialet" : "Fäll ihop"}">${shut ? "▸" : "▾"}</button>${head(task)}`
        + `<span class="mmeta"> · ${n} resultat${g.length > n ? `, ${g.length - n} till` : ""}</span></div>`
        + (shut ? "" : `<div class="mgrp">${materialHtml(g)}</div>`);
    }).join("");
    const hidden = [...groups.values()].reduce((n, g) => n + Math.max(0, g.length - RESULTS_PER_CASE), 0);
    return [...groups].map(([task, g]) => `<div class="part">${head(task)}<span class="mmeta"> · ${g.length} resultat</span></div>`
      + `<div class="made">${(all ? g : g.slice(0, RESULTS_PER_CASE)).map(resultCard).join("")}</div>`).join("")
      + (hidden || all ? `<div class="doacts"><button class="link" data-act="cases-all" data-key="res:${esc(x.id)}">${all ? "Visa bara de senaste" : `Visa alla ${results.length}`}</button></div>` : "");
  }

  /*
   * «Godkänn inte ▾» (Daniel P 2026-10-05): «Gör om» går tillbaka till den som
   * gjorde det (● med Ångra), «Skicka för second opinion» lägger en granskning
   * hos en kollega (◐). Godkännandet är fortfarande den ursprunglige godkännarens.
   *
   * Saken (subj): { key, of?, task, step, name, redo: { kind: "claude"|"human", party?, label }, reopen?, prevStep? }.
   * of = utkastets id; utan of är det ett godkännandesteg (decline.task/step).
   */
  const declineBtn = (subj) => `<button class="link" data-act="decline-open" data-key="${esc(subj.key)}" aria-expanded="${S.decline?.key === subj.key}">Godkänn inte ▾</button>`;
  /** Formuläret under knappen, när det är öppet för just den här saken. */
  function declineFormHtml(subj) {
    const d = S.decline;
    if (!d || d.key !== subj.key) return "";
    S.declineSubj = subj;
    if (!d.mode) return `<div class="declmenu" role="menu"><button class="mi" role="menuitem" data-act="decline-mode" data-mode="redo"><span class="ml"><span class="lvl d">●</span> Gör om</span><span class="mmeta">tillbaka till ${esc(subj.redo.label)}</span></button>`
      + `<button class="mi" role="menuitem" data-act="decline-mode" data-mode="review"><span class="ml">◐ Skicka för second opinion</span><span class="mmeta">en kollega tittar, du godkänner</span></button></div>`;
    if (d.mode === "redo") {
      const ok = sentence(d.feedback || "");
      return `<div class="declform"><div class="mmeta">Vad ska ändras? Minst en mening. ${esc(subj.redo.kind === "claude" ? "Claude kör om med det här i prompten; förra versionen finns kvar." : `${subj.redo.label} får steget tillbaka med det här som meddelande.`)}</div>`
        + `<textarea id="decline-text" rows="3" placeholder="Till exempel: Kortare inledning, och nämn priset i första stycket.">${esc(d.feedback || "")}</textarea>`
        + `<div class="doacts"><button class="primary" data-act="decline-redo"${ok ? "" : " disabled"}><span class="lvl d">●</span> Gör om${subj.redo.kind === "claude" ? " med Claude" : `, tillbaka till ${esc(subj.redo.label)}`}</button>`
        + `<button class="quiet" data-act="decline-close">Avbryt · Esc</button></div></div>`;
    }
    const me = S.data?.party?.id, ppl = (S.data?.colleagues || []).filter((p) => p.id && p.id !== me);
    return `<div class="declform"><div class="mmeta">Vem ska titta? Hen svarar «Ser bra ut», «Ändra så här …» eller «Jag vet inte», och svaret kommer tillbaka hit.</div>`
      + `<div class="parts4">${ppl.map((p) => `<button class="rd${d.to === p.id ? " on" : ""}" data-act="decline-to" data-id="${esc(p.id)}" aria-pressed="${d.to === p.id}">${esc(p.label)}</button>`).join("") || `<span class="mmeta">Inga kolleger att välja.</span>`}</div>`
      + `<textarea id="decline-q" rows="2" placeholder="Fråga (valfri): vad vill du ha en åsikt om?">${esc(d.question || "")}</textarea>`
      + `<div class="doacts"><button class="primary" data-act="decline-review"${d.to ? "" : " disabled"}>◐ Skicka till ${esc(ppl.find((p) => p.id === d.to)?.label || "kollegan")}</button>`
      + `<button class="quiet" data-act="decline-close">Avbryt · Esc</button></div></div>`;
  }
  const sentence = (t) => t.trim().split(/\s+/).filter((w) => /\p{L}/u.test(w)).length >= 3;
  /** Historiken på saken: godkänt, inte godkänt med feedback, second opinion med svar. */
  const historyHtml = (h) => (h || []).length ? `<div class="ahist"><div class="mh">Historik</div>${h.map((l) => `<div class="crow"><span>${l.kind === "approved" ? "●" : l.kind === "declined" ? "✕" : l.kind === "withdrawn" ? "↺" : "◐"}</span>`
    + `<span>${esc(l.text)}${l.feedback ? ` <span class="mmeta">«${esc(l.feedback)}»</span>` : ""}</span><span class="mmeta">${esc(l.by)} · ${esc(fmtDay(l.at))}</span></div>`).join("")}</div>` : "";
  /** Saken för ett utkast på ett steg (stegets ark) eller ett resultat. */
  function draftSubject(d, task, step, stepLabelText) {
    const human = d.made_by?.kind === "human" && d.made_by.party;
    return { key: `d:${d.id}`, of: d.id, task, step, name: d.name, reopen: human ? { task, step } : null, stepLabel: stepLabelText,
      redo: human ? { kind: "human", party: d.made_by.party.id, label: d.made_by.party.label } : { kind: "claude", label: "Claude" } };
  }
  /** Saken för ett resultat: vem som gjorde det står på stegets utkast när arket är läst; annars Claude. */
  function resultSubject(r, title) {
    const sh = r.task && r.step?.id ? S.sheetData[`step:${stepId(r.task, r.step.id)}`]?.sheet : null;
    const d = sh?.drafts?.find((y) => y.id === r.id);
    return draftSubject(d || { id: r.id, name: title, made_by: { kind: "claude" } }, r.task, r.step?.id || null, r.step?.label);
  }
  /** Saken för ett godkännandesteg: det som godkänns är steget före. */
  function approvalSubject(sh) {
    const of = sh.approval?.of;
    const claude = of && (of.who === "claude" || of.who === "mixed");
    return { key: `s:${sh.task}|${sh.step}`, task: sh.task, step: sh.step, name: sh.label,
      reopen: of ? { task: sh.task, step: of.step } : null, prevStep: of ? { step: of.step, label: of.label } : null,
      redo: claude ? { kind: "claude", label: "Claude" } : { kind: "human", party: of?.responsible?.id || null, label: of?.responsible?.label || "den som gjorde det" } };
  }
  async function declineRedo() {
    const subj = S.declineSubj, d = S.decline;
    if (!subj || !d || !sentence(d.feedback || "")) return;
    const feedback = d.feedback.trim();
    const redo = subj.redo.kind === "claude" ? { redo: "claude" } : subj.redo.party ? { redo: subj.redo.party } : {};
    try {
      const r = await call("write", { op: "content_approve", ...(subj.of ? { id: subj.of } : { task: subj.task, step: subj.step }), decline: feedback, ...redo });
      S.decline = null;
      const event = r?.event;
      if (subj.redo.kind === "human") {
        // Steget öppnas igen för den som gjorde det (step_reopened), om det var klart, och hen får feedbacken som meddelande.
        let reopened = null;
        if (subj.reopen) { try { await call("execute_step", { task: subj.reopen.task, step: subj.reopen.step, mark: "undone", reason: `Inte godkänt: ${feedback}` }); reopened = subj.reopen; } catch { /* inte klart: inget att öppna */ } }
        const me = S.data?.party?.id;
        if (subj.redo.party && subj.redo.party !== me && subj.reopen)
          try { await call("write", { op: "message", to: subj.redo.party, text: `Inte godkänt: «${subj.name}». Ändra så här: ${feedback}`, about: { task: subj.reopen.task, step: subj.reopen.step }, confirmed: true }); } catch { /* meddelandet är en bonus */ }
        say(`Inte godkänt. ${subj.redo.label} gör om${reopened ? "; steget är öppet igen" : ""}.`, { fn: async () => {
          await call("write", { op: "content_approve", withdraw: event });
          if (reopened) await call("execute_step", { task: reopened.task, step: reopened.step, mark: "done" });
        } });
      } else {
        const toast = { text: "Inte godkänt. Claude kör om med det du skrev.", undo: { tool: "write", args: { op: "content_approve", withdraw: event } } };
        say(toast.text, toast.undo);
        await redoWithClaude(subj, feedback, toast);
      }
      for (const k of Object.keys(S.sheetData)) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const t = top1(); if (t) fetchSheet(t, true);
    } catch (e) { say(`Inget ändrades: ${e.message || e}`, null, true); }
    render();
  }
  /** Ny körning med feedbacken inbakad: förra texten och vad som ska ändras står i prompten, och svaret sparas som en ny version. */
  async function redoWithClaude(subj, feedback, toast = null) {
    const task = subj.task, step = subj.of ? subj.step : subj.prevStep?.step;
    if (!task || !step) return;
    const id = stepId(task, step);
    let before = "", of = subj.of || S.sheetData[`step:${id}`]?.sheet?.drafts?.[0]?.id || null;
    if (of) { try { const d = await call("read", { op: "content_get", id: of }); before = d?.markdown || ""; } catch { /* förra texten saknas: feedbacken räcker */ } }
    S.redo = { ...(S.redo || {}), [id]: { of, feedback, before } };
    if (top1()?.id !== id) openStep(task, step, subj.stepLabel || subj.prevStep?.label);
    let tries = 0;
    const go = () => { const sd = S.sheetData[`step:${id}`]; if (sd?.sheet?.prompt && !sd.stale) runStart(id, toast); else if (tries++ < 50) setTimeout(go, 200); };
    go();
  }
  /** Prompten vid «Gör om»: förra utkastet och vad som ska ändras. */
  const redoPrompt = (id) => { const r = S.redo?.[id]; return r ? `\n\n—\nFörra utkastet godkändes inte. Ändra så här: ${r.feedback}`
    + (r.before ? `\n\nFörra utkastet:\n${r.before.slice(0, 6000)}` : "") + `\nSkriv om hela utkastet med ändringen.` : ""; };
  /** Rad-för-rad-skillnaden mellan förra och nya versionen. */
  function diffHtml(a, b) {
    const x = (a || "").split("\n"), y = (b || "").split("\n"), n = x.length, m = y.length;
    if (n * m > 400000) return `<div class="mmeta">Texterna är för långa för att jämföra här.</div>`;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && x[i] === y[j]) { out.push(`<div class="dl">${esc(x[i]) || "&nbsp;"}</div>`); i++; j++; }
      else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { out.push(`<div class="dl add">+ ${esc(y[j])}</div>`); j++; }
      else { out.push(`<div class="dl del">− ${esc(x[i])}</div>`); i++; }
    }
    return `<div class="diff">${out.join("")}</div>`;
  }
  async function declineReview() {
    const subj = S.declineSubj, d = S.decline;
    if (!subj || !d?.to) return;
    const review = subj.of || "step";
    const q = (d.question || "").trim();
    const args = { op: "message", to: d.to, review, about: { task: subj.task, ...(subj.step ? { step: subj.step } : {}) },
      text: q ? `Second opinion på «${subj.name}»: ${q}` : `Kan du ge en second opinion på «${subj.name}»? Godkännandet är fortfarande mitt.` };
    try {
      const r = await call("write", args);
      const label = (S.data?.colleagues || []).find((p) => p.id === d.to)?.label || "kollegan";
      S.confirm = { verb: `Skicka till ${label}`, text: `${label} får «${subj.name}» att granska i Där jag behövs.${q ? ` Frågan: «${q}».` : ""} Du godkänner fortfarande själv.`,
        next: r?.next_call || { tool: "write", args: { ...args, confirmed: true } }, onDone: () => { S.decline = null; } };
    } catch (e) { say(`Kunde inte förhandsvisa: ${e.message || e}`, null, true); }

  }

  /* Granskningar i «Där jag behövs»: second opinion som du blivit ombedd om, och svaren på dem du bett om. */
  const REVIEW_TEXT = { ok: "Ser bra ut", change: "Ändra så här", unsure: "Jag vet inte" };
  function reviewsHtml(o) {
    const rs = o?.reviews || [];
    if (!rs.length || !mineOnly()) return "";
    const row = (m) => {
      const open = m.about?.task && m.about?.step ? `<button class="link" data-act="open-step" data-task="${esc(m.about.task)}" data-step="${esc(m.about.step)}" data-label="${esc(m.about_label || "")}">Öppna saken →</button>` : "";

        + `<div class="mt">${esc(m.text ?? "")}</div><div class="doacts">${open}<button class="link" data-act="msg-read" data-id="${esc(m.id)}"><span class="lvl d">●</span> Läst</button></div></div>`;
      const ch = S.reviewChange === m.id;
      return `<div class="msg unread"><div class="mh3"><b>Second opinion från ${esc(m.from.label)}</b>${when}</div>`
        + `<div class="mt">${esc(m.text ?? "(texten kunde inte hämtas)")}</div><div class="doacts">${open}`
        + `<button class="link" data-act="review-answer" data-id="${esc(m.id)}" data-answer="ok"><span class="lvl d">●</span> Ser bra ut</button>`
        + `<button class="link" data-act="review-change" data-id="${esc(m.id)}">Ändra så här …</button>`
        + `<button class="link" data-act="review-answer" data-id="${esc(m.id)}" data-answer="unsure"><span class="lvl d">●</span> Jag vet inte</button></div>`
        + (ch ? `<div class="reply"><textarea id="review-text" rows="3" placeholder="Vad ska ändras? Svaret går till ${esc(m.from.label)}, som godkänner.">${esc(S.reviewText || "")}</textarea><div class="doacts"><button class="primary" data-act="review-answer" data-id="${esc(m.id)}" data-answer="change"${sentence(S.reviewText || "") ? "" : " disabled"}><span class="lvl d">●</span> Skicka till ${esc(m.from.label)}</button></div></div>` : "")
        + `</div>`;
    };
    return `<div class="reviews"><h3 class="sh">Granskningar</h3>${rs.map(row).join("")}</div>`;
  }
  async function reviewAnswer(id, answer) {
    const text = answer === "change" ? (S.reviewText || "").trim() : "";
    if (answer === "change" && !sentence(text)) return;
    try {
      await call("write", { op: "message", reply_to: id, answer, ...(text ? { text: `Ändra så här: ${text}` } : {}), confirmed: true });
      await call("write", { op: "message", read: id });

    } catch (e) { say(`Svaret skickades inte: ${e.message || e}`, null, true); }

  /** Leveransens lagerrad (BESLUT 4): en metodändring tas in per leverans, Ta in eller Låt vara. */
  function methodUpdatesHtml(x, sd) {
    const ups = (sd.layers?.method_updates || []).filter((u) => !(S.leave || {})[`${u.task}`]);
    if (!ups.length) return "";
    return ups.map((u) => `<div class="upd"><span class="lvl">◐</span><span style="flex:1">Metoden har ändrats. ${esc(u.summary || `${u.changes.length} ändringar.`)} Påbörjade och klara steg ändras inte; egna ändringar står kvar.`

  const CAL_MODES = [["day", "Dag"], ["week", "Vecka"], ["2w", "2 veckor"], ["month", "Månad"]];

  /**

  async function orderThread(x) {

      const d = await call("read", { op: "view_file", sheet: "order", mail: q.slice(0, 500) });

      if (d?.mail_error) x.threadErr = d.mail_error;

      x.hitsMore = !!d?.mail_truncated;

      if (!x.hits && threadIdOf(q)) { x.thread = threadIdOf(q); x.threadErr += " Klistra in mejlet nedan; tråden kopplas ändå."; }
      if (x.hits?.length === 1 && !d?.mail_query) return orderHit(x, x.hits[0].id);

  /** Svaret prövas mot listorna: ett id som inte finns blir osäkert, aldrig ett val. */

      + `<div class="lmeta"><span class="pills">${r.system.map((s) => `<span class="pill">${esc(s)}</span>`).join("")}<span class="mmeta">${esc(EFFECT[r.effect] || r.effect)}</span></span>`
      + `<span class="mmeta">${r.last_run ? `körd ${esc(shortIso(r.last_run))}` : "aldrig körd"} · ${r.used_by} använder</span></div></div>`;

  function librarySheetHtml(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, d = sd.lib, tab = x.tab || "methods";

      + `<select id="lib-system" aria-label="System"><option value="">Alla system</option>${(d?.systems || []).map((s) => `<option value="${esc(s)}"${s === x.system ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>`
      + `<select id="lib-group" aria-label="Gruppering">${LIB_GROUP.map(([v, l]) => `<option value="${v}"${v === (x.group || "") ? " selected" : ""}>${l}</option>`).join("")}</select>`
      + (tab === "methods" ? `<button class="plain" data-act="method-new">＋ Ny metod</button>` : "")
      + (d?.hidden_text ? `<button class="link" data-act="lib-all">${x.all ? "Dölj det som inte körts" : `Visa också de ${d.hidden} som inte körts senaste 90 d`}</button>` : "") + `</div>`;

      + (l.count > 30 ? `<div class="mmeta">${l.count - 30} till.</div>` : "") + `</div>`).join("");
    else if (d.groups) body = d.groups.map((g) => `<div class="cgrp"><div class="mh2">${esc(g.label || g.key || "–")} <span class="mmeta">${(g.rows || []).length}</span></div>${(g.rows || []).slice(0, 40).map(libRow).join("")}</div>`).join("");
    else body = d.rows.slice(0, 80).map(libRow).join("") + (d.rows.length > 80 ? `<div class="mmeta">${d.rows.length - 80} till. Sök för att smalna av.</div>` : "");
    const note = d && tab !== "gaps" ? `<div class="mmeta" style="margin:-6px 0 10px">${d.rows.length} visas${d.hidden_text ? ` · ${esc(d.hidden_text)}` : ""}.</div>` : "";
    return `<div class="slabel">Biblioteket</div><h1 class="stitle">Metoder, molekyler och atomer</h1><p class="sline">Sök på vad som ska göras. Sökningen går på vad delarna producerar.</p>${tabs}${tools}${note}<div class="cbody">${body}</div>`;
  }
  let libTimer = null;

  /* ── Metodbyggaren (README «Metod/metodbyggaren», BESLUT 4 och 9; prototypens steg 28) ──
     Ett ark i full bredd. Metoden är generell: en rad per steg som redigeras direkt,
     kundernas sätt i en egen flik med bara skillnaderna. Hela metoden är ett utkast:
     ◐ förhandsvisar skillnaden mot gällande version och grindens råd, och knappen
     sparar en ny version. Leveranserna som följer den väljer Ta in eller Låt vara.
     Utan rätten «Ändra metoder» blir det ett förslag till den som har den.
     Servern räknar anropen ur utkastet (view_file { sheet: "method", draft }). */
  const MB_WHO = [["human", "○", "människa"], ["claude", "✦", "Claude"], ["code", "</>", "kod"], ["customer", "◷", "kunden"]];
  const MB_END = [["continue", "fortsätter"], ["other_path", "tar en annan väg"], ["stop", "slutar"]];
  let mbSeq = 0;
  const mbNew = (id) => String(id || "").startsWith("new:");
  function openMethod(id, label) { if (id) openSheet("method", id, label ? `Metoden ${label}` : "Metoden"); }
  /** ＋ Ny metod, eller en ny metod ur en uppgifts steg (seed: label, delivers, name, steps, task). */
  function newMethod(seed) {
    S.pal = null; S.menu = null;
    openSheet("method", `new:${Date.now().toString(36)}`, seed?.label ? `Ny metod · ${seed.label}` : "Ny metod");
    const t = top1(); if (t && seed) t.seed = seed;
    render();
  }
  const mbRowOf = (s) => ({ key: `r${++mbSeq}`, id: s.id || null, use: s.use || null, label: s.label || "", who: s.who || "human",
    responsible: s.responsible?.id || s.responsible || "", lead_days: s.lead_days ?? 1, hours: s.hours ?? null, approver: s.approver || "",
    checklist: [...(s.checklist || [])], prompt: s.prompt ?? null, needed_by: s.needed_by || "", after: [...(s.after || [])],
    outcomes: (s.outcomes || []).map((o) => ({ id: o.id, label: o.label, ending: o.ending || "continue", leads_to: o.leads_to || "", fixed: !!o.id })),
    branch: s.branch ? { ...s.branch } : null, info: s.info || (s.id ? s : null) });
  const mbComparable = (r) => JSON.stringify([r.id, r.use, r.label.trim(), r.who, r.responsible, Number(r.lead_days), r.hours, r.approver, r.checklist, r.prompt, r.needed_by, r.after, r.outcomes, r.branch]);
  /** Utkastet ur arkets data, en gång per läsning; ‹ och omritning behåller det. */
  function mbInit(x, d) {
    if (x.draft) return;
    if (mbNew(x.id)) {
      const s = x.seed || {};
      x.draft = { label: s.label || "", summary: s.summary || "", completion: s.completion || "", delivers: s.delivers || "", name: s.name || "",
        steps: (s.steps?.length ? s.steps : [{ label: "" }]).map((st) => mbRowOf({ label: st.label, who: st.performer === "llm" ? "claude" : st.performer === "code" ? "code" : "human" })) };
      x.base = null;
    } else {
      x.draft = { label: d.method.label, summary: d.method.summary, completion: d.method.completion, steps: d.steps.map((s) => mbRowOf({ ...s, info: s })) };
      x.base = { head: JSON.stringify([x.draft.label, x.draft.summary, x.draft.completion]), rows: Object.fromEntries(x.draft.steps.map((r) => [r.key, mbComparable(r)])),
        order: x.draft.steps.map((r) => r.key).join() };
    }
  }
  /** Raderna som ändrats mot gällande version (bärnstenskant), och hur många ändringar det är. */
  function mbChanges(x) {
    if (!x.draft) return { n: 0, rows: new Set() };
    if (!x.base) return { n: x.draft.steps.filter((r) => r.label.trim()).length ? 1 : 0, rows: new Set(x.draft.steps.map((r) => r.key)) };
    const rows = new Set(x.draft.steps.filter((r) => x.base.rows[r.key] !== mbComparable(r)).map((r) => r.key));
    const removed = Object.keys(x.base.rows).filter((k) => !x.draft.steps.some((r) => r.key === k)).length;
    const order = x.draft.steps.filter((r) => x.base.rows[r.key]).map((r) => r.key).join() !== x.base.order.split(",").filter((k) => x.draft.steps.some((r) => r.key === k)).join();
    const head = JSON.stringify([x.draft.label, x.draft.summary, x.draft.completion]) !== x.base.head;
    return { n: rows.size + removed + (order ? 1 : 0) + (head ? 1 : 0), rows };
  }
  /** Utkastet som servern tar det. */
  const mbOut = (x) => ({ label: x.draft.label, summary: x.draft.summary, completion: x.draft.completion,
    ...(x.draft.delivers ? { delivers: x.draft.delivers } : {}), ...(x.draft.name ? { name: x.draft.name } : {}),
    steps: x.draft.steps.filter((r) => r.label.trim() || r.id).map((r) => ({ ...(r.id ? { id: r.id } : {}), ...(r.use ? { use: r.use } : {}), label: r.label,
      ...(r.who !== "mixed" ? { who: r.who } : {}), ...(r.responsible ? { responsible: r.responsible } : {}),
      lead_days: Math.max(0, Math.round(Number(r.lead_days) || 0)), ...(typeof r.hours === "number" ? { hours: r.hours } : {}),
      approver: r.approver || null, checklist: r.checklist.filter((c) => c.trim()), ...(r.prompt !== null ? { prompt: r.prompt } : {}),
      needed_by: r.needed_by || null, after: r.after, outcomes: r.outcomes.filter((o) => o.label.trim()).map((o, j) => ({ id: o.id || `outcome_${j + 1}`, label: o.label, ending: o.ending, ...(o.leads_to ? { leads_to: o.leads_to } : {}) })),
      branch: r.branch })) });
  /** Det kundunika som är nytt i utkastet: metoden gäller alla kunder (samma prövning som servern). */
  function mbSpecific(x, d) {
    if (!x.draft) return [];
    const now = [x.draft.label, x.draft.summary, x.draft.completion, ...x.draft.steps.flatMap((r) => [r.label, r.prompt || "", ...r.checklist])];
    const was = mbNew(x.id) ? [] : [d.method.label, d.method.summary, d.method.completion, ...d.steps.flatMap((s) => [s.label, s.prompt || "", ...s.checklist])];
    return specificHits(d, now, was);
  }
  const mbPeopleOpts = (d, cur, none) => `${none ? `<option value="">${esc(none)}</option>` : ""}${(d.people || []).map((p) => `<option value="${esc(p.id)}"${p.id === cur ? " selected" : ""}>${esc(p.label)}</option>`).join("")}`;
  const slugId = (s) => fold(s).replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").replace(/^(?=\d)/, "o_") || "outcome";

  function methodSheetHtml(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, d = sd.m;
    if (sd.error && !d) return `<div class="slabel">Metod</div><div class="banner"><span style="flex:1">${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>`;
    if (!d) return `<div class="slabel">Metod</div><h1 class="stitle">${esc(x.label)}</h1><div class="mmeta">Hämtar metoden …</div>`;
    mbInit(x, d);
    const isNew = mbNew(x.id), tab = x.tab || "method", ch = mbChanges(x);

      + `<input id="mb-label" class="mbtitle" value="${esc(x.draft.label)}" placeholder="Metodens namn, t.ex. Visitkort" aria-label="Metodens namn" autocomplete="off">`
      + `<div class="mbmeta"><label>Levererar ${isNew ? `<select id="mb-delivers"><option value="">välj …</option>${(d.types || []).map((t) => `<option value="${esc(t.id)}"${t.id === x.draft.delivers ? " selected" : ""}>${esc(t.label)}</option>`).join("")}</select>`
        : `<b>${esc(d.method.delivers.label)}</b>`}</label>`
      + `<label class="grow">Klar när <input id="mb-completion" value="${esc(x.draft.completion)}" placeholder="ett villkor som går att kontrollera" autocomplete="off"></label></div>`
      + `<p class="sline">Metoden är allmän: roller, aldrig kundens namn eller värden. Kundens skillnader står i kundens sätt; leveransens egna ändringar går före båda.</p>`;
    const tabs = isNew ? "" : `<div class="tabs"><button class="tab${tab === "method" ? " on" : ""}" data-act="mb-tab" data-tab="method">Metoden <span class="mmeta">${d.steps.length} steg</span></button>`
      + `<button class="tab${tab === "variants" ? " on" : ""}" data-act="mb-tab" data-tab="variants">Kundernas sätt <span class="mmeta">${d.variants.length}</span></button></div>`;
    return head + tabs + (tab === "variants" && !isNew ? mbVariantsHtml(x, d) : mbStepsHtml(x, d, ch));
  }

  function mbStepsHtml(x, d, ch) {
    const rows = x.draft.steps, labels = rows.map((r) => r.label.trim()).filter(Boolean);
    const deciders = rows.filter((r) => r.outcomes.some((o) => o.label.trim()));
    const kind = (r, i) => MB_WHO.map(([k, ic, t]) => `<button class="mbk${r.who === k ? " on" : ""}${k === "claude" ? " cl" : ""}${k === "code" ? " cd" : ""}" data-act="mb-who" data-i="${i}" data-who="${k}" title="${t}" aria-label="${t}" aria-pressed="${r.who === k}">${esc(ic)}</button>`).join("");
    const line = (r) => {
      const s = r.info, bits = [];
      if (s?.where?.length) bits.push(`var: ${s.where.join(", ")}`);
      if (s?.reads?.length) bits.push(`läser: ${s.reads.join(", ")}`);
      if (s?.leaves?.length) bits.push(`lämnar: ${s.leaves.join(", ")}`);
      if (r.use) bits.push("finns i biblioteket, återanvänds");
      if (!r.id && !r.use && r.label.trim()) bits.push("nytt steg: byggaren söker befintliga delar först, annars blir det ett atomförslag");
      if (r.approver) bits.push(`godkänns av ${r.approver === "customer" ? "kunden" : (d.people.find((p) => p.id === r.approver)?.label || r.approver)}`);
      if (r.needed_by) bits.push(r.needed_by === "end" ? "parallellt, klart före leveransen" : `parallellt, klart före «${r.needed_by}»`);
      if (r.after.length) bits.push(`väntar på ${r.after.map((a) => `«${a}»`).join(", ")}`);
      if (r.outcomes.length) bits.push(`utfall: ${r.outcomes.map((o) => o.label).join(" / ")}`);
      if (r.branch) bits.push(`gren: när «${r.branch.decided_by}» ger ${r.branch.outcome}`);
      return bits.length ? `<div class="mbsub">${esc(bits.join(" · "))}</div>` : "";
    };
    const detail = (r, i) => {
      const other = labels.filter((l) => l !== r.label.trim());
      const parts = [];
      parts.push(`<label>Godkänns av <select id="mb-a-${i}"><option value="">ingen</option><option value="customer"${r.approver === "customer" ? " selected" : ""}>Kunden</option>${(d.people || []).map((p) => `<option value="${esc(p.id)}"${p.id === r.approver ? " selected" : ""}>${esc(p.label)}</option>`).join("")}</select></label>`);
      if (r.who === "human" || r.who === "customer" || r.who === "mixed")

      if (r.who === "claude" || r.who === "mixed")
        parts.push(`<label class="full">Prompten <span class="mmeta">det Claude får, svart på vitt; {customer} och {task} fylls i ur uppgiften</span><textarea id="mb-p-${i}" class="ptext" rows="8" placeholder="Ingen prompt i metoden än. Skriv vad Claude ska göra, med rollerna (kunden, ansvarig), aldrig kundens namn.">${esc(r.prompt || "")}</textarea></label>`);
      if (r.who === "code")
        parts.push(`<div class="full mmeta">Koden kör ${r.info?.operation ? `«${esc(r.info.operation.label)}»` : "en operation som byggaren väljer"}. Värdena per kund står i kundens sätt.</div>`);
      parts.push(`<label>Parallellt <select id="mb-n-${i}"><option value="">nej, i tur och ordning</option><option value="end"${r.needed_by === "end" ? " selected" : ""}>ja, klart före leveransen</option>${other.map((l) => `<option value="${esc(l)}"${r.needed_by === l ? " selected" : ""}>ja, klart före «${esc(l)}»</option>`).join("")}</select></label>`);
      parts.push(`<label>Hör till en gren <select id="mb-b-${i}"><option value="">nej, huvudflödet</option>${deciders.filter((dr) => dr !== r).flatMap((dr) => dr.outcomes.filter((o) => o.label.trim()).map((o) => { const v = `${dr.label.trim()}|${o.id || slugId(o.label)}`, cur = r.branch && `${r.branch.decided_by}|${r.branch.outcome}` === v; return `<option value="${esc(v)}"${cur ? " selected" : ""}>när «${esc(dr.label)}» ger «${esc(o.label)}»</option>`; })).join("")}</select></label>`);
      parts.push(`<div class="full"><span class="mbl">Väntar på</span> ${other.length ? other.map((l) => `<button class="mbchk${r.after.includes(l) ? " on" : ""}" data-act="mb-after" data-i="${i}" data-label="${esc(l)}" aria-pressed="${r.after.includes(l)}">${r.after.includes(l) ? "☑" : "☐"} ${esc(l)}</button>`).join("") : `<span class="mmeta">inga andra steg än</span>`}</div>`);

        + r.outcomes.map((o, j) => `<div class="mbout"><input id="mb-o-${i}-${j}" value="${esc(o.label)}" placeholder="t.ex. Kan lösas direkt" autocomplete="off">`
          + `<select id="mb-oe-${i}-${j}">${MB_END.map(([v, l]) => `<option value="${v}"${o.ending === v ? " selected" : ""}>${l}</option>`).join("")}</select>`
          + `<select id="mb-ot-${i}-${j}"><option value="">nästa steg</option>${other.map((l) => `<option value="${esc(l)}"${o.leads_to === l ? " selected" : ""}>till «${esc(l)}»</option>`).join("")}</select>`
          + `<button class="quiet" data-act="mb-odel" data-i="${i}" data-j="${j}" aria-label="Ta bort utfallet">✕</button></div>`).join("")
        + (r.outcomes.length < 4 ? `<button class="link" data-act="mb-oadd" data-i="${i}">＋ Utfall</button>` : "") + `</div>`);
      return `<div class="mbdet">${parts.join("")}</div>`;
    };
    const body = rows.map((r, i) => `<div class="mbrow${ch.rows.has(r.key) ? " ch" : ""}" draggable="true" data-mbdrag="${i}">`
      + `<span class="mbh" title="Dra för att flytta" aria-hidden="true">⋮⋮</span><span class="mbks">${kind(r, i)}</span>`
      + `<input id="mb-l-${i}" value="${esc(r.label)}" placeholder="Verb + vad, t.ex. Skriv svaret" aria-label="Stegets namn" autocomplete="off">`
      + `<select id="mb-r-${i}" aria-label="Ansvarig">${mbPeopleOpts(d, r.responsible, "ansvarig …")}</select>`
      + `<span class="mbn"><input id="mb-d-${i}" value="${esc(r.lead_days)}" inputmode="numeric" aria-label="Ledtid i arbetsdagar">d</span>`

      + `<button class="quiet" data-act="mb-del" data-i="${i}" aria-label="Ta bort steget" title="Ta bort steget">✕</button></span>`

    const hdr = `<div class="mbrow mbhd"><span></span><span>Vem</span><span>Steg</span><span>Ansvarig</span><span>Ledtid</span><span>Timmar</span><span></span></div>`;
    const add = x.add ? mbAddHtml(x) : `<button class="link mbadd" data-act="mb-add">＋ Lägg till steg</button>`;
    const hits = mbSpecific(x, d);
    const warn = hits.length ? `<div class="mbwarn">Metoden gäller alla kunder, och utkastet har det som är unikt för en kund: ${esc(hits.slice(0, 4).map((h) => `«${h.text}» (${h.why})`).join(", "))}. Skriv rollen i stället (kunden, kundens kontakt), och lägg det kundunika i kundens sätt.</div>` : "";

        + d.followers.map((f) => `<div class="crow"><span>${esc(f.label)}<span class="mmeta"> · ${f.started ? `${f.started} steg påbörjade eller klara` : "inget påbörjat"}</span></span>`
          + (f.update && !(S.leave || {})[f.task] ? `<span class="mbupd"><span class="mmeta">${esc(f.update.changes.slice(0, 2).join("; "))}</span><button class="${f.update.preselected === "take" ? "go" : "quiet"}" data-act="upd-take" data-task="${esc(f.task)}">Ta in</button><button class="${f.update.preselected === "leave" ? "go" : "quiet"}" data-act="upd-leave" data-task="${esc(f.task)}">Låt vara</button></span>`

  /** Lägg till steg: sök i biblioteket först (#308), annars ett nytt steg. */
  function mbAddHtml(x) {
    const a = x.add, q = a.q.trim();
    const res = (a.res || []).map((r, i) => `<button class="mvi" data-act="mb-pick" data-i="${i}"><span>${esc(r.label)}</span><span class="mmeta">${esc(r.meta)}</span></button>`).join("");

      + (q ? `<button class="mvi" data-act="mb-pick" data-i="new"><span>Nytt steg «${esc(q)}»</span><span class="mmeta">byggaren söker delarna; saknas en atom blir det ett atomförslag, aldrig en molekyl utan kod</span></button>` : "")
      + `<div class="mmeta" style="margin-top:6px;display:flex;gap:12px"><span style="flex:1">Återanvänd det som finns först; samma steg i flera metoder är meningen.</span><button class="link" data-act="mb-add-close">Stäng</button></div></div>`;
  }
  let mbTimer = null;
  function mbSearch(x) {

    mbTimer = setTimeout(async () => {
      if (!x.add || x.add.q.trim() !== q) return;

      try {
        const [m, mol] = await Promise.all([call("read", { op: "view_file", sheet: "library", tab: "methods", q, all: true }), call("read", { op: "view_file", sheet: "library", tab: "molecules", q, all: true })]);
        const seen = new Set(), out = [];
        for (const r of m?.rows || []) for (const st of r.steps || []) if (!seen.has(st.id) && fold(st.label).includes(fold(q).split(/\s+/)[0] || "")) { seen.add(st.id); out.push({ use: st.id, label: st.label, meta: `steg i ${r.label}` }); }
        for (const r of m?.rows || []) for (const st of r.steps || []) if (!seen.has(st.id) && out.length < 6) { seen.add(st.id); out.push({ use: st.id, label: st.label, meta: `steg i ${r.label}` }); }
        for (const r of (mol?.rows || []).slice(0, 4)) out.push({ use: r.id, label: r.label, meta: `del: ${r.summary || r.name}` });
        if (x.add) x.add = { ...x.add, busy: false, error: null, res: out.slice(0, 8) };
      } catch (e) { if (x.add) x.add = { ...x.add, busy: false, res: [], error: e.code === "FORBIDDEN" ? "Biblioteket syns bara med rätten «Ändra metoder». Lägg till ett nytt steg; byggaren söker ändå befintliga delar." : `Kunde inte söka: ${e.message || e}` }; }
      renderKeep();

  }

  /** Raden i underkant: ändringarna, ◐ Förhandsvisa, och förhandsvisningen med Spara. */

  /** Läsningen av svaret: summeringen, och raderna där grindens råd och varningar står. */
  const mbLines = (r) => String(r?._text || "").split("\n").slice(1).map((l) => l.trim())

      const results = [];
      for (const c of save.calls) {
        try { const r = await call(c.tool, c.args);
          results.push({ what: c.what, ok: r?.ok !== false, summary: summaryText(r), lines: mbLines(r), next: hlNext(r, { tool: c.tool, args: { ...c.args, confirmed: true } }, "Spara metoden") }); }
        catch (e) { results.push({ what: c.what, ok: false, summary: e.message || String(e), lines: [], next: null }); }
      }
      x.pv = { ...save, results, ok: results.length > 0 && results.every((r) => r.ok) };
    } catch (e) { x.pv = { diff: [], results: [], ok: false, error: `Kunde inte förhandsvisa: ${e.message || e}. Inget sparades.` }; }

  }
  async function mbSave(x) {
    const pv = x.pv, d = S.sheetData[sheetKey(x)]?.m; if (!pv?.ok || !d) return;

  /** Kundernas sätt: en rad per kund; öppnad visar den bara skillnaderna, som kan ändras här. */

        + (dirty ? `<div class="mbpvb"><button class="quiet" data-act="vp-undo" data-step="${esc(s.step)}">Ångra</button><button class="go" data-act="vp-save" data-step="${esc(s.step)}">◐ Spara i ${esc(v.customer.label)}s sätt</button></div>` : "") + `</div>`;

      + `<button class="link" data-act="vp-all">${x.vall ? "Visa bara skillnaderna" : "Lägg till en skillnad i ett annat steg"}</button>`;

  /** ◐ En skillnad i kundens sätt: method_variant_build { patch } för ett steg, resten orört (#288). */
  async function vpSave(x, step) {
    const d = S.sheetData[sheetKey(x)]?.m, v = d?.variant, e = (x.vedit || {})[step]; if (!v || !e) return;
    const s = v.steps.find((y) => y.step === step), set = {};
    if (e.responsible !== undefined) set.responsible = e.responsible || null;
    if (e.prompt_addition !== undefined) set.prompt_addition = e.prompt_addition.trim() || null;
    const c = { tool: "write", args: { op: "method_variant_build", patch: { variant: v.id, step, set } } };
    try { const pv = await call(c.tool, c.args);
      const next = hlNext(pv, { tool: c.tool, args: { ...c.args, confirmed: true } }, `Spara i ${v.customer.label}s sätt`);
      S.confirm = { text: summaryText(pv) || `«${s?.label || step}» ändras i ${v.customer.label}s sätt.`, verb: d.decides ? `Spara i ${v.customer.label}s sätt` : `Föreslå för ${d.holders?.[0]?.label || "den ansvarige"}`,
        next, step: { id: null, call: next, layer: "variant", key: step } }; }
    catch (err) { say(`Kunde inte förhandsvisa: ${err.message || err}. Inget sparades.`, null, true); }
    render();
  }

  /** Fälten i metodbyggaren. */
  function mbInput(el) {
    const x = top1(); if (!x || x.kind !== "method" || !x.draft) return;
    const id = el.id, v = el.value, rows = x.draft.steps;
    let m;
    if (id === "mb-label") x.draft.label = v;
    else if (id === "mb-completion") x.draft.completion = v;
    else if (id === "mb-delivers") { x.draft.delivers = v; render(); return; }
    else if (id === "mb-q") { x.add = { ...(x.add || {}), q: v }; mbSearch(x); return; }
    else if ((m = /^mb-([a-z]+)-(\d+)(?:-(\d+))?$/.exec(id))) {
      const r = rows[Number(m[2])]; if (!r) return;
      const f = m[1], j = Number(m[3]);
      if (f === "l") { const old = r.label.trim();
        for (const o of rows) { if (o.needed_by === old && old) o.needed_by = v.trim(); o.after = o.after.map((a) => a === old && old ? v.trim() : a);
          for (const oc of o.outcomes) if (oc.leads_to === old && old) oc.leads_to = v.trim(); if (o.branch?.decided_by === old && old) o.branch = { ...o.branch, decided_by: v.trim() }; }
        r.label = v; }
      else if (f === "r") r.responsible = v;
      else if (f === "d") r.lead_days = v.replace(/[^\d]/g, "");
      else if (f === "h") { const n = Number(String(v).replace(",", ".")); r.hours = v.trim() === "" ? null : Number.isFinite(n) ? n : r.hours; }
      else if (f === "a") r.approver = v;
      else if (f === "c") r.checklist = v.split("\n");
      else if (f === "p") r.prompt = v;
      else if (f === "n") r.needed_by = v;
      else if (f === "b") { if (!v) r.branch = null; else { const k = v.lastIndexOf("|"); r.branch = { decided_by: v.slice(0, k), outcome: v.slice(k + 1) }; } }
      else if (f === "o") { const o = r.outcomes[j]; if (o) { o.label = v; if (!o.fixed) o.id = slugId(v); } }
      else if (f === "oe") { const o = r.outcomes[j]; if (o) o.ending = v; }
      else if (f === "ot") { const o = r.outcomes[j]; if (o) o.leads_to = v; }
    } else if ((m = /^vp-([rp])-(.+)$/.exec(id))) {
      x.vedit = { ...(x.vedit || {}), [m[2]]: { ...((x.vedit || {})[m[2]] || {}), [m[1] === "r" ? "responsible" : "prompt_addition"]: v } };
    }
    x.pv = null;
    renderKeep();
  }
  function mbAct(act, el) {
    const x = top1(); if (!x || x.kind !== "method") return;
    const i = Number(el.getAttribute("data-i")), rows = x.draft?.steps || [];
    const d = S.sheetData[sheetKey(x)]?.m;
    if (act === "mb-tab") { x.tab = el.getAttribute("data-tab"); x.scroll = 0; }
    else if (act === "mb-var") { x.variant = el.getAttribute("data-id"); x.vedit = {}; x.vall = false; fetchSheet(x, true); return; }
    else if (act === "vp-all") x.vall = !x.vall;
    else if (act === "vp-undo") { const { [el.getAttribute("data-step")]: _y, ...rest } = x.vedit || {}; x.vedit = rest; }
    else if (act === "vp-save") { vpSave(x, el.getAttribute("data-step")); return; }
    else if (!x.draft) return;
    else if (act === "mb-who") { const r = rows[i]; if (r) { r.who = el.getAttribute("data-who"); if (r.who === "claude" && r.prompt === null) r.prompt = ""; } }
    else if (act === "mb-open") { const r = rows[i]; x.open = r && x.open !== r.key ? r.key : null; }
    else if (act === "mb-del") { const r = rows[i]; if (r) { const l = r.label.trim(); x.draft.steps = rows.filter((_, j) => j !== i);
      for (const o of x.draft.steps) { if (o.needed_by === l) o.needed_by = ""; o.after = o.after.filter((a) => a !== l); if (o.branch?.decided_by === l) o.branch = null; for (const oc of o.outcomes) if (oc.leads_to === l) oc.leads_to = ""; } } }
    else if (act === "mb-move") { const j = i + Number(el.getAttribute("data-d")); if (rows[i] && rows[j]) { [rows[i], rows[j]] = [rows[j], rows[i]]; } }
    else if (act === "mb-after") { const r = rows[i], l = el.getAttribute("data-label"); if (r) r.after = r.after.includes(l) ? r.after.filter((a) => a !== l) : [...r.after, l]; }
    else if (act === "mb-oadd") { const r = rows[i]; if (r && r.outcomes.length < 4) { r.outcomes.push({ id: "", label: "", ending: "continue", leads_to: "" }); if (r.outcomes.length < 2) r.outcomes.push({ id: "", label: "", ending: "continue", leads_to: "" }); } }
    else if (act === "mb-odel") { const r = rows[i]; if (r) r.outcomes = r.outcomes.filter((_, j) => j !== Number(el.getAttribute("data-j"))); }
    else if (act === "mb-add") { x.add = { q: "", res: [] }; render(); root.querySelector?.("#mb-q")?.focus?.(); return; }
    else if (act === "mb-add-close") x.add = null;
    else if (act === "mb-pick") { const k = el.getAttribute("data-i"), q = x.add?.q.trim() || "";
      const p = k === "new" ? { label: q } : x.add?.res?.[Number(k)];
      if (p) { x.draft.steps = [...rows.filter((r) => r.label.trim() || r.id), mbRowOf({ label: p.label, use: p.use || null, who: "human", responsible: d?.people?.find((y) => y.id === S.data?.party?.id)?.id || "" })]; x.add = null; } }
    else if (act === "mb-reset") { x.draft = null; x.base = null; x.open = null; x.add = null; }
    else if (act === "mb-preview") { mbPreview(x); return; }
    else if (act === "mb-pv-close") x.pv = null;
    else if (act === "mb-save") { mbSave(x); return; }
    if (/^mb-(who|del|move|after|oadd|odel|pick|reset)$/.test(act)) x.pv = null;
    render();
  }
  /** ⋮⋮: dra en rad till en ny plats. */
  function mbDragStart(e) {
    const r = e.target.closest?.("[data-mbdrag]"); if (!r) return;
    S.mbDrag = Number(r.getAttribute("data-mbdrag"));
    try { e.dataTransfer?.setData("text/plain", String(S.mbDrag)); if (e.dataTransfer) e.dataTransfer.effectAllowed = "move"; } catch { /* ingen överföring */ }
  }
  function mbDragOver(e) { if (S.mbDrag === undefined || S.mbDrag === null) return; if (e.target.closest?.("[data-mbdrag]")) e.preventDefault?.(); }
  function mbDrop(e) {
    const from = S.mbDrag; S.mbDrag = null;
    const r = e.target.closest?.("[data-mbdrag]"), x = top1();
    if (from === null || from === undefined || !r || x?.kind !== "method" || !x.draft) return;
    e.preventDefault?.();
    const to = Number(r.getAttribute("data-mbdrag")); if (to === from) return;
    const rows = [...x.draft.steps], [m] = rows.splice(from, 1); rows.splice(to, 0, m); x.draft.steps = rows; x.pv = null; render();
  }
  /** ⌘K: metoderna ur biblioteket, hämtade en gång när paletten öppnas. */

  /* ── «Så görs det» (Daniel P 2026-10-06: «det är inte så tydligt var man ändrar just såna
     återkommande saker») ──
     Ingen ny modell: det som gäller för metoden hos kunden, och i leveransen, med källan
     per värde. Ansvarig och enkla värden ändras på plats (● med Ångra) på den nivå som är
     vald: kundens sätt som standard, eller bara den här leveransen. Större ändringar i
     metodbyggaren; rytmen i avtalet. Skrivningarna är de som finns: method_variant_build
     { patch } och execute_step { handover_to }. */
  function openHow(o) {
    const id = o.task ? `t:${o.task}` : `m:${o.method}|${o.customer || ""}`;
    openSheet("how", id, `Så görs det${o.label ? ` · ${o.label}` : ""}`);
  }
  function howArgs(x) {
    if (x.id.startsWith("t:")) return { task: x.id.slice(2) };
    const [method, customer] = x.id.slice(2).split("|");
    return { method, ...(customer ? { customer } : {}) };
  }
  const HOW_GROUP = { templates: "Mallar och format", channels: "Kanaler", other: "Andra värden" };
  const howData = (x) => S.sheetData[sheetKey(x)]?.how || null;
  const howScope = (x, d) => x.scope || (d.variant ? "customer" : d.task ? "here" : "method");
  function howSheetHtml(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, d = sd.how;
    if (!d) return `<div class="slabel">Så görs det</div><div class="mmeta">${sd.error ? `Kunde inte läsas: ${esc(sd.error.message || sd.error)}` : "Hämtar …"}</div>`;
    const scope = howScope(x, d), cust = d.customer?.label || "kunden", ed = x.edit || {};
    const src = (o) => `<span class="hsrc ${esc(o.source)}" title="Kommer från ${esc(o.source_label)}">${esc(o.source_label)}</span>`;
    const scopes = [d.variant ? ["customer", d.scope.customer] : null, d.task ? ["here", d.scope.here] : null].filter(Boolean);
    const scopeHtml = scopes.length

      : `<p class="mmeta">${esc(cust)} har inget eget sätt för metoden än. Ändra i metodbyggaren; det som bara gäller ${esc(cust)} sparas där som kundens sätt.</p>`;
    const people = (cur) => `<option value=""${cur ? "" : " selected"}>–</option>` + (d.people || []).map((p) => `<option value="${esc(p.id)}"${p.id === cur ? " selected" : ""}>${esc(p.label)}</option>`).join("");
    const steps = d.steps.map((s) => {
      const r = s.responsible, rEdit = scope === "customer" || scope === "here";

      const appr = s.approver ? `<div class="hrow"><span class="mmeta">godkänns av ${esc(s.approver.label)}</span>${src(s.approver)}</div>` : "";
      return `<div class="hrow"><div class="hval"><b>${esc(s.label)}</b>${resp}</div>${src(r)}</div>${appr}`;
    }).join("");
    const groups = ["templates", "channels", "other"].map((g) => {
      const rows = d.steps.flatMap((s) => s.values.filter((v) => v.group === g).map((v) => ({ s, v })));
      if (!rows.length) return "";
      const body = rows.map(({ s, v }) => {
        const k = `${s.step}|${v.key}`, cur = ed[k] ?? v.value, dirty = ed[k] !== undefined && ed[k] !== v.value;
        const field = scope === "customer" && d.variant && !/^\s*[{[]/.test(v.value)
          ? `<input id="how-v-${esc(s.step)}-${esc(v.key)}" value="${esc(cur)}" aria-label="${esc(v.key)} i ${esc(s.label)}">`
            + (dirty ? `<button class="go" data-act="how-save-v" data-step="${esc(s.step)}" data-key="${esc(v.key)}">Spara <span class="lvl d">●</span></button><button class="quiet" data-act="how-reset-v" data-k="${esc(k)}">Ångra</button>` : "")
          : `<span>${esc(v.value.length > 90 ? `${v.value.slice(0, 90)} …` : v.value)}</span>`;
        return `<div class="hrow"><div class="hval"><span class="mmeta">${esc(s.label)} · ${esc(v.key)}</span>${field}</div>${src(v)}</div>`;
      }).join("");
      return g === "other" ? `<details><summary class="sh">${HOW_GROUP[g]} (${rows.length})</summary>${body}</details>` : `<h3 class="sh">${HOW_GROUP[g]}</h3>${body}`;
    }).join("");
    const rec = d.recurring.length ? d.recurring.map((r) => `<div class="hrow"><div class="hval"><span>${esc(r.text)}</span></div><span class="hsrc contract">${esc(r.source_label)}</span></div>`).join("")
      + (d.customer ? `<button class="link" data-act="how-contract" data-id="${esc(d.customer.id)}" data-label="${esc(d.customer.label)}">Ändra rytmen i avtalet ›</button>` : "")
      : `<div class="mmeta">Ingen återkommande rytm i avtalet för den här metoden.</div>`;
    return `<div class="slabel">Så görs det</div><h1 class="stitle">${esc(d.method.label)}${d.customer ? ` · ${esc(d.customer.label)}` : ""}</h1>`
      + `<p class="sline">Det som gäller${d.task ? ` i ${esc(d.task.label)}` : ""}, och var varje värde kommer ifrån: metoden, ${esc(d.customer ? `${genitive(cust)} sätt` : "kundens sätt")}${d.task ? " eller den här leveransen" : ""}.${d.variant?.grounding === "proposed" ? ` ${esc(genitive(cust))} sätt är ett förslag.` : ""}</p>`
      + scopeHtml
      + `<h3 class="sh">Ansvarig och godkännare per steg</h3>${steps}`
      + groups
      + `<h3 class="sh">Rytm</h3>${rec}`
      + `<h3 class="sh">Större ändringar</h3><p class="mmeta">Steg, ordning, instruktioner och metodens egna värden ändras i metodbyggaren.</p>`
      + `<button class="link" data-act="open-method" data-id="${esc(d.method.id)}" data-label="${esc(d.method.label)}">Öppna metodbyggaren ›</button>`;
  }
  function howInput(el) {
    const x = top1(); if (!x || x.kind !== "how") return;
    let m;
    if ((m = /^how-r-(.+)$/.exec(el.id))) { howSave(x, m[1], "responsible", el.value); return; }
    if ((m = /^how-v-([^-]+)-(.+)$/.exec(el.id))) { x.edit = { ...(x.edit || {}), [`${m[1]}|${m[2]}`]: el.value }; renderKeep(); }
  }
  function howAct(act, el) {
    if (act === "how-open") { openHow({ task: el.getAttribute("data-task"), method: el.getAttribute("data-method"), customer: el.getAttribute("data-customer"), label: el.getAttribute("data-label") }); return; }
    const x = top1(); if (!x || x.kind !== "how") return;
    if (act === "how-scope") { x.scope = el.getAttribute("data-scope"); x.edit = {}; render(); }
    else if (act === "how-reset-v") { const { [el.getAttribute("data-k")]: _y, ...rest } = x.edit || {}; x.edit = rest; render(); }
    else if (act === "how-save-v") { const step = el.getAttribute("data-step"), key = el.getAttribute("data-key"); howSave(x, step, key, (x.edit || {})[`${step}|${key}`]); }
    else if (act === "how-contract") { openSheet("customer", el.getAttribute("data-id"), el.getAttribute("data-label")); const t = top1(); if (t?.kind === "customer") { t.tab = "contract"; fetchSheet(t, true); render(); } }
  }
  /** ● på den valda nivån. Kundens sätt: method_variant_build { patch }, Ångra skriver tillbaka det som var. Bara här: en överlämning. */
  async function howSave(x, step, field, value) {
    const d = howData(x), s = d?.steps.find((y) => y.step === step); if (!s) return;
    const scope = howScope(x, d), who = (id) => d.people.find((p) => p.id === id)?.label || "ingen";
    let c, undo = null, text;
    if (scope === "here") {
      if (field !== "responsible" || !value || value === s.responsible.value?.id) { render(); return; }
      c = { tool: "execute_step", args: { task: d.task.id, step, handover_to: value, confirmed: true } };
      text = `«${s.label}» föreslås för ${who(value)} bara i den här leveransen; ${who(value)} tar emot det.`;
    } else if (scope === "customer" && d.variant) {
      const mk = (set) => ({ tool: "write", args: { op: "method_variant_build", patch: { variant: d.variant.id, step, set }, confirmed: true } });
      if (field === "responsible") {
        const before = s.responsible.source === "customer" ? s.responsible.value?.id || null : null;
        c = mk({ responsible: value || null }); undo = mk({ responsible: before });
        text = `«${s.label}»: ${who(value)} är ansvarig, ${d.scope.customer}.`;
      } else {
        const had = s.customer_values || {};
        c = mk({ values: { ...had, [field]: value } }); undo = mk({ values: Object.keys(had).length ? had : null });
        text = `«${s.label}»: ${field} ändrat, ${d.scope.customer}.`;
      }
    } else { render(); return; }
    try {
      await call(c.tool, c.args);
      if (field !== "responsible") { const { [`${step}|${field}`]: _y, ...rest } = x.edit || {}; x.edit = rest; }
      say(text, undo ? { fn: () => call(undo.tool, undo.args) } : null);
      fetchSheet(x, true); refreshSoon();
    } catch (e) { say(`Kunde inte spara: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }

  /* Inställningar → Roller och behörigheter (BESLUT 9). */
  /** Vem som får ta över mina steg: det sparade, med det jag ändrat här ovanpå. */
  function takeDraft(x) {
    const st = S.sheetData[sheetKey(x)]?.settings, saved = st?.take_over || { allow: "all", people: [] };
    return { allow: x.take?.allow ?? saved.allow, people: x.take?.people ?? [...(saved.people || [])] };
  }
  const TAKE_ALLOW = [["all", "Alla hos oss"], ["listed", "Bara dessa personer"], ["none", "Ingen: de får be om att få ta över, och du svarar"]];
  function takeSettingHtml(x, st) {
    const d = takeDraft(x), saved = st.take_over || { allow: "all", people: [] };
    const dirty = d.allow !== saved.allow || (d.allow === "listed" && [...d.people].sort().join() !== [...(saved.people || [])].sort().join());
    const ppl = (S.data?.colleagues || []).filter((p) => p.id !== st.party);
    return `<h3 class="sh">Andra får ta över mina uppgifter</h3><div class="wcards">`
      + TAKE_ALLOW.map(([v, l]) => `<button class="wcard${d.allow === v ? " on" : ""}" data-act="set-take" data-allow="${v}" aria-pressed="${d.allow === v}"><b>${esc(l)}</b></button>`).join("") + `</div>`
      + (d.allow === "listed" ? `<div class="parts4">${ppl.map((p) => `<button class="rd${d.people.includes(p.id) ? " on" : ""}" data-act="set-take-person" data-id="${esc(p.id)}" aria-pressed="${d.people.includes(p.id)}">${d.people.includes(p.id) ? "✓ " : ""}${esc(p.label)}</button>`).join("") || `<span class="mmeta">Inga kolleger att välja.</span>`}</div>` : "")
      + `<div class="mmeta">Den som tar över får stegen direkt, och du får ett meddelande. Får någon inte ta över blir det en förfrågan till dig.</div>`
      + (dirty ? `<div class="doacts"><button class="primary" data-act="set-take-save"><span class="lvl d">●</span> Spara vem som får ta över</button></div>` : "");
  }
  /** ● Den egna inställningen sparas på personens post. */
  async function saveTake() {
    const x = top1(); if (!x) return;
    const st = S.sheetData[sheetKey(x)]?.settings; if (!st) return;
    const d = takeDraft(x), before = st.take_over || { allow: "all", people: [] };
    const value = { allow: d.allow, people: d.allow === "listed" ? d.people : [] };
    try {
      await call("write", { op: "registry_define", change: true, node: { id: st.party, take_over: value } });
      S.sheetData = { ...S.sheetData, [sheetKey(x)]: { ...S.sheetData[sheetKey(x)], settings: { ...st, take_over: value } } };
      x.take = null;
      say(value.allow === "all" ? "Alla hos oss får ta över dina steg." : value.allow === "none" ? "Ingen tar över dina steg utan att fråga dig." : `Bara ${value.people.length} ${value.people.length === 1 ? "person" : "personer"} får ta över dina steg.`,
        { tool: "write", args: { op: "registry_define", change: true, node: { id: st.party, take_over: before } } });
    } catch (e) { say(`Kunde inte spara: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /* Inställningar → Arbetstid (Daniel P 2026-10-07): varifrån upptaget läses, med
     ● och Ångra för att stänga av läsningen via någon annans koppling, och
     arbetsdagen — heltid är ett antagande tills personen bekräftat eller ändrat. */
  function workTimeHtml(x, st) {
    const w = st.workday || {}, b = { ...(st.busy_source || {}), own: (st.connections || []).find((c) => c.key === "google_calendar")?.connected === true }, via = b.via, assumed = !st.planning?.filled;
    const d = x.wd || {}, from = d.from ?? w.from, to = d.to ?? w.to;
    const dirty = d.from !== undefined && Number(d.from) !== w.from || d.to !== undefined && Number(d.to) !== w.to;
    const source = b.own ? `Din egen kalender${via ? `. Läsningen via ${esc(via.party.label)} används inte så länge din egen är kopplad.` : "."}`
      : via && !via.off ? `${esc(via.text)}: bara antal upptagna timmar per dag, aldrig rubriker. Koppla din egen kalender under Kopplingar så gäller den i stället.`
        : via ? `Avstängd av dig. Ingen kalender läses, och hela arbetsdagen räknas som ledig.`
          : `Ingen kalender läses. Hela arbetsdagen räknas som ledig.`;
    const toggle = via && !b.own ? `<div class="doacts"><button class="${via.off ? "primary" : "quiet"}" data-act="busy-via" data-on="${via.off ? "1" : "0"}"><span class="lvl d">●</span> ${via.off ? "Läs via dirigentens koppling igen" : "Stäng av läsningen"}</button></div>` : "";
    return `<h3 class="sh">Arbetstid</h3>`
      + `<div class="crow"><span>Upptagen tid läses från</span><span class="mmeta">${source}</span></div>${toggle}`
      + `<div class="crow"><span>Arbetsdag${assumed ? ` <span class="pill">antagande: heltid</span>` : ""}</span><span class="mmeta">`
      + `<input id="wd-from" type="number" min="0" max="24" value="${esc(from ?? "")}" aria-label="Arbetsdagen börjar" style="width:4em">–`
      + `<input id="wd-to" type="number" min="0" max="24" value="${esc(to ?? "")}" aria-label="Arbetsdagen slutar" style="width:4em"></span></div>`
      + (assumed ? `<div class="mmeta">Heltid är ett antagande tills du bekräftat eller ändrat din arbetstid.</div>` : "")
      + (dirty ? `<div class="doacts"><button class="primary" data-act="wd-save"><span class="lvl d">●</span> Spara min arbetstid</button></div>`

  /** ● Stäng av eller slå på läsningen via någon annans koppling, på den egna posten. Ångra skriver tillbaka. */
  async function saveBusyVia(on) {
    const x = top1(); if (!x) return;
    const st = S.sheetData[sheetKey(x)]?.settings; if (!st?.node?.calendar?.via) return;

      await call("write", { op: "registry_define", change: true, node: { id: st.party, calendar } });
      const node = { ...st.node, calendar };

  /** ● Den egna arbetstiden: arbetsdagen och att den inte längre är ett antagande. Ångra skriver tillbaka. */
  async function saveWorkday() {

    const st = S.sheetData[sheetKey(x)]?.settings; if (!st) return;

    if (!(workday.from >= 0 && workday.to <= 24 && workday.to > workday.from)) { say("Arbetsdagen måste sluta efter att den börjar, mellan 0 och 24.", null, true); return; }

    try {
      await call("write", { op: "registry_define", change: true, confirmed: true, node: { id: st.party, workday, planning } });
      S.sheetData = { ...S.sheetData, [sheetKey(x)]: { ...S.sheetData[sheetKey(x)], settings: { ...st, workday,
        planning: { ...st.planning, filled: true }, node: { ...st.node, workday, planning } } } };
      x.wd = null;
      say(`Din arbetstid är ${workday.from}–${workday.to}.`,

    } catch (e) { say(`Kunde inte spara: ${e.message || e}. Inget ändrades.`, null, true); }

  }

  /* ◎ Fokus: en sak i taget, sedan «Mellan dig och andra». */

  /* Meddelanden: överlämningar, Claude, kollegor och kunder. Svaret hamnar på saken. */

     Fel adress, husadressen, okänd avsändare, osäker plats. Varje rad: en primär
     handling och «Läs mejlet». Inga bedömningar här: support bedöms i ärendet,
     beställningar i beställningen. Flytten är ● med Ångra (classify_accept route). */
  const WAY_TO = { case: "Support", order: "Beställning", possibility: "Möjligt", nothing: "Behöver inget", inbox: "Inkommet" };
  const clockOf = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? "" : d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" }); };
  function inboxSheetHtml(x) {

  /* ── Meddelandena (ordning, del 2): en rad per tråd, läget i ord, tråden som ark ── */

  /** Trådarna ur meddelandena: läget räknas på det senaste och på de mottagna. */

    const as = x.as || "note";
    const args = { op: "content_save", for_task: c.task, ...(c.step ? { for_step: c.step } : {}), markdown: text, confirmed: true,
      ...(as === "note" ? { kind: "anteckning" } : as === "decision" ? { kind: "beslut", name: `Beslut ${S.data?.today || ""}`.trim() } : {}) };
    try { await call("write", args); x.text = ""; say(as === "version" ? "Sparat som en ny version." : as === "decision" ? "Sparat som beslut på saken." : "Sparat som anteckning på saken."); }
    catch (e) { say(`Kunde inte spara: ${e.message || e}. Texten står kvar.`, null, true); }
    render();
  }

  /* Person: kalendern eller dag för dag. */
  function personSheetHtml(x) {
    const sd = S.sheetData[sheetKey(x)] || {}, d = sd.cal, tab = x.tab || "days";
    const tabs = `<div class="tabs"><button class="tab${tab === "days" ? " on" : ""}" data-act="person-tab" data-tab="days">Dag för dag</button><button class="tab${tab === "cal" ? " on" : ""}" data-act="person-tab" data-tab="cal">Kalender</button></div>`;
    let body;
    if (sd.error) body = `<div class="banner"><span style="flex:1">${esc(sd.error.message || sd.error)}</span><button data-act="sheet-retry">Försök igen</button></div>`;
    else if (!d) body = `<div class="mmeta">Hämtar …</div>`;
    else if (tab === "days") body = d.days.map((y) => `<div class="crow${y.over ? " overd" : ""}"><span>${esc(dayLabel(y.d))}</span><span>${calLoad(y)}</span><span class="mmeta">${hh(y.load)} h av ${hh(y.cap)}${y.over ? " · över" : ""}</span></div>`).join("");
    else body = `<div class="cmonth">${d.days.map((y) => `<div class="mday${y.over ? " over" : ""}"><div class="mdh"><span>${esc(dayLabel(y.d))}</span><span class="mmeta">${hh(y.load)} h</span></div>${calLoad(y)}`
      + y.p.map(([i]) => `<div class="mitem" style="border-left-color:${custColor(d, d.steps[i][3])}">${esc(d.steps[i][2])}</div>`).join("") + (y.m.length ? `<div class="mmeta">${y.m.length} möten</div>` : "") + `</div>`).join("")}</div>`;
