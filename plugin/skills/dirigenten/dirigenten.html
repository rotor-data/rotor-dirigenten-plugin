.ov-head{display:flex;justify-content:space-between;padding:14px 18px 6px;border-top:1px solid var(--bg-subtle);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ov-head-count{color:var(--ink-2)}
.ov-item{flex-direction:column;align-items:stretch}
.ov-line{display:flex;align-items:center;gap:8px}
.ov-line>.ov-row{flex:1;min-width:0}
.ov-head-btn{display:flex;align-items:center;gap:6px;border:0;background:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
.ov-head-btn .ov-chev{margin-left:-6px}
.ov-chev{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;background:0;border-radius:8px;cursor:pointer;margin-left:6px}
.ov-chev svg{fill:none;stroke:var(--ink);stroke-width:1.8;transition:transform var(--dur-base)}
.ov-chev[aria-expanded=true] svg{transform:rotate(90deg)}
.ov-chev:hover{background:var(--bg-subtle)}
.ov-shapes{display:flex;gap:3px;align-items:center;border:0;background:0;padding:6px;border-radius:8px;cursor:pointer}
.ov-sh{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--edge);background:var(--bg-page)}
.ov-sh[data-state^=doable]{background:var(--act-do);border-color:var(--act-do)}
.ov-sh[data-state=needs_yes]{width:12px;border-radius:0;border:0;background:var(--customer-state);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.ov-sh[data-state=waiting]{border-color:var(--wait);background:var(--bg-subtle)}

.mat{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px}
.mat-h{font-size:14.5px;font-weight:800}
.mat-meta{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mat-empty{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.mat-group,.mat-sort{margin-top:14px}
.mat-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.mat-things{display:flex;flex-wrap:wrap;gap:8px}
.mat-thing{max-width:100%;min-width:0;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:var(--radius-m);background:var(--bg-subtle);font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.mat-thing:focus-visible,.mat-title:focus-visible,.mat-ph:focus-visible,.ads-img:focus-visible,.ads-body:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.mat-i{flex:none;color:var(--ink-2)}
.mat-ok{color:var(--done-ink);font-weight:800}
.mat-sheet{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mat-sheet-h{font-size:24px;font-weight:800;margin:0}
.mat-task{background:var(--bg);border-radius:var(--radius-l);padding:16px 18px}
.mat-task-h{font-size:19px;font-weight:800;margin:0}
.mat-cards{display:flex;flex-direction:column;gap:6px}
.mat-card{background:var(--bg-subtle);border-radius:var(--radius-m);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mat-title{display:inline-flex;gap:8px;align-items:center;border:0;background:none;padding:0;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.mat-ex{margin:4px 0 0;font-size:12.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-old{display:block;border:0;background:none;padding:2px 0;font:inherit;font-size:12.5px;color:var(--act-do);cursor:pointer}
.mat-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.map-panel:has(.map-mat){width:min(640px,48vw)}
.mat-img{min-width:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mat-img .mat-n{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat-thing .mat-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-thing[data-has-body]{height:auto;min-height:34px;flex-wrap:wrap;padding:7px 12px}
.mat-body{flex-basis:100%;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:normal;text-align:left}
.mat-body:empty{display:none}
.mat-ph,.ads-img{aspect-ratio:1 / 1;width:100%;border:0;border-radius:var(--radius-m);background:var(--bg-subtle) center / cover no-repeat;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px}
.ads-ch{margin-top:12px}
.ads-grid{display:grid;gap:10px;align-items:start}
.ads-hd{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ads-text{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.ads-body{border:0;background:var(--bg-subtle);border-radius:var(--radius-m);padding:8px 10px;text-align:left;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.ads-img[data-approved]{box-shadow:inset 0 0 0 2px var(--done)}
.ads-none{align-self:center}
.rd-box{position:fixed;top:0;right:0;bottom:0;width:min(920px,100vw);overflow:auto;background:var(--bg-page);box-shadow:var(--shadow-overlay);z-index:40}
.rd-box:empty{display:none}
.rd{padding:18px;display:flex;flex-direction:column;gap:12px}
.rd-view{z-index:48;background:var(--bg-sunk)}
.rd-bar a,.rd-tools a{text-decoration:none}
.rd-bar,.rd-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rd-title{min-width:0;flex:1;overflow-wrap:anywhere}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;margin-bottom:8px;background:var(--bg-page);font-size:13.5px}
.rbar button{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--radius-m);padding:4px 11px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.rbar button[aria-pressed="true"]{background:var(--ink);color:var(--act-do-on);border-color:var(--ink)}
.rbar button:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.rbar .zv{font-size:12.5px;min-width:46px;text-align:center}
.rbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rd-pages{overflow:auto;max-width:100%;background:var(--bg-subtle);border-radius:var(--radius-m)}
.rd-spread{display:flex;gap:24px;padding:0 12px}
.page{overflow-wrap:anywhere}
.page h1,.page h3,.page h4{font-weight:800;color:var(--ink);letter-spacing:-.005em}
.page h1{font-size:24px;line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
.page h3{font-size:14.5px;line-height:1.35;margin:12px 0 2px;font-weight:600}
.page h4{font-size:12.5px;line-height:1.6;margin:8px 0 0;font-weight:600;font-style:italic}
.page a{color:var(--act-do)}
.page code{font-size:11px;background:var(--bg-subtle);border-radius:4px;padding:0 3px}
.page .pli{padding-left:14px;position:relative;margin-bottom:3px}
.page .pli::before{content:"\u2013";position:absolute;left:0;color:var(--ink-3)}
.page .pli.num{padding-left:20px}
.page .pli.num::before{content:attr(data-n)}
.page hr{border:0;border-top:1px solid var(--hair);margin:10px 0}
.page pre{font:inherit;font-size:11px;line-height:1.5;background:var(--bg-subtle);padding:6px 8px;border-radius:4px;white-space:pre-wrap;margin:0 0 10px}
.page blockquote{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);font-style:italic}
.ptable{margin:2px 0 12px}
.ptable table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.4;table-layout:fixed}
.ptable th,.ptable td{text-align:left;vertical-align:top;padding:3px 6px 4px 0;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.ptable th{font-weight:600;color:var(--ink);border-bottom-color:var(--line)}
.rd-img{display:block;max-width:100%;border-radius:var(--radius-m);border:1px solid var(--hair);cursor:zoom-in}
.rd-img:focus-visible{outline:2px solid var(--act-do);outline-offset:2px}
.rd-image-stage{min-height:min(70vh,720px);background:var(--bg-subtle);border-radius:var(--radius-m)}
.rd-pdf{width:100%;height:80vh;border:1px solid var(--hair);border-radius:var(--radius-m)}
.rd-html{width:100%;height:80vh;border:1px solid var(--hair);border-radius:var(--radius-m);background:var(--bg)}
.pbody{min-height:0;overflow:hidden}
.rd-note{background:var(--bg);border-radius:var(--radius-m);padding:10px 14px;box-shadow:inset 4px 0 0 var(--customer-state);font-size:13.5px;margin-bottom:8px}
.rd-file{display:flex;gap:16px;align-items:center;padding:16px;border:1px solid var(--hair);border-radius:var(--radius-m);max-width:640px}
.rd-ext{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:80px;padding:0 8px;box-sizing:border-box;border-radius:var(--radius-m);background:var(--bg-subtle);font-size:13.5px;font-weight:800}
.lbx{position:fixed;inset:0;z-index:60;background:var(--scrim);overflow:hidden;touch-action:none}
.lbx img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab}
.lbx.drag img{cursor:grabbing}
.lbx .lbar{position:absolute;top:12px;right:12px;z-index:1;display:flex;gap:6px;align-items:center;background:var(--ink);border-radius:var(--radius-m);padding:4px 6px;color:var(--bg);font-size:13.5px}
.lbx .lbar button{background:none;border:0;color:var(--act-do-on);font:inherit;font-weight:700;padding:4px 8px;border-radius:var(--radius-m);cursor:pointer;white-space:nowrap}
.lbx .lbar button:hover{background:var(--act-neutral-tint)}
.lbx .lbar .zv{min-width:44px;text-align:center}
.lbx .lcap{position:absolute;left:12px;bottom:12px;color:var(--bg);font-size:13.5px;background:var(--ink);border-radius:var(--radius-m);padding:4px 8px}
.rd-edit{width:100%;border:0;background:var(--bg-subtle);border-radius:var(--radius-m);padding:12px 14px;font:inherit;font-size:13.5px;color:var(--ink);resize:vertical}
.rd-failed{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:var(--radius-m);padding:12px 14px;box-shadow:inset 4px 0 0 var(--late)}
.rd-failed .mat-empty{margin:0;flex:1;color:var(--ink)}
.rd-archive-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rd-archive-list li{display:flex;align-items:center;gap:8px;min-width:0}
.rd-archive-list button{max-width:100%;overflow-wrap:anywhere;text-align:left}
.rd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.rd-slides{display:flex;flex-direction:column;gap:16px}
.rd-slide{min-width:0;background:var(--bg-subtle);padding:12px;border-radius:var(--radius-m)}
.rd-video{width:min(1080px,100%);margin:12px auto;display:grid;gap:10px}
.rd-video-frame{position:relative;aspect-ratio:16 / 9;overflow:hidden;border-radius:var(--radius-l);background:var(--ink)}
.rd-video-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.rd-video-preview{max-width:100%;height:auto;border-radius:var(--radius-m)}
.rd-sheet{min-width:0}
.rd-sheet-scroll{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-m)}
.rd-sheet table{border-collapse:collapse;min-width:100%;font-size:12.5px}
.rd-sheet th,.rd-sheet td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:pre-wrap}
.mat-sorts{display:flex;gap:6px;flex-wrap:wrap}
.mat-sorts button[aria-pressed="true"]{background:var(--ink);color:var(--act-do-on)}
.mat-sorts button[aria-pressed="true"] .mat-meta{color:var(--ink-2)}
.mat-thing__thumb svg{width:14px;height:14px}
.mat-thing__name{min-width:0;overflow-wrap:anywhere}
.mat-thing__meta:empty{display:none}
.mat-card__body{min-width:0}

.tm-late{font-weight:800;color:var(--late)}
.tm-none{color:var(--ink-3)}
.tm-extband{position:absolute;top:26px;height:5px;background:var(--wait);border-radius:var(--radius-m)}
.tm-who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tm-item[data-folds]{position:relative}
.tm-fold path,.tm-state{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tm-mo-open{display:grid;gap:2px;align-content:center;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0}
.tm-state{justify-self:center;width:10px;height:10px;border-radius:3px;background:var(--line)}
.tm-state[data-state=doable],.tm-state[data-state=doable_with_gap]{background:var(--act-do)}
.tm-state[data-state=needs_yes]{background:var(--customer-state)}
.tm-state[data-state=done],.tm-state[data-state=done_outside]{background:var(--done)}
.tm-state[data-state=waiting]{background:var(--wait)}
.tm-mobar{opacity:.5;cursor:grab;touch-action:none}
.tm-nospan{position:absolute;top:12px;left:4px;border:1px dashed var(--line);border-radius:var(--radius-pill);background:transparent;padding:0 8px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.tm-edge-grip{position:absolute;top:-4px;bottom:-4px;width:8px;cursor:ew-resize}
.tm-edge-grip[data-edge=start]{left:-4px}
.tm-edge-grip[data-edge=end]{right:-4px}
.tm-mobar[data-staged]{opacity:1;background:transparent;border:1.5px dashed var(--act-do);box-sizing:border-box}
.tm-staged{font-weight:800;color:var(--ink)}
.tm-follow{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tm-mo{position:relative}
.tm-card{position:absolute;left:56px;right:18px;top:calc(100% - 4px);z-index:5;margin:0;padding:12px;background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.tm-card-head,.tm-card-btns,.tm-pick,.tm-pick-scopes{grid-column:1 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tm-card-head .tm-name{flex:1}
.tm-card>.tm-meta:first-of-type{grid-column:1 / -1}
.tm-lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tm-card .d-btn,.tm-foot .d-btn{white-space:nowrap}
.tm-foot{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-radius:var(--radius-l);box-shadow:var(--shadow-card)}
.tm-chip{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:var(--bg-subtle)}
.tm-foot-btns{margin-left:auto;display:flex;gap:6px}
.d-tl { background: var(--bg); border-radius: var(--radius-l); box-shadow: var(--shadow-card); overflow: hidden; margin-top: 14px; }
.d-tl__row { display: grid; grid-template-columns: 280px 1fr; border-top: 1px solid var(--line); min-height: 52px; }
.d-tl__row--scale { border-top: 0; min-height: 34px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.d-tl__row--step { min-height: 38px; background: var(--bg-subtle); }
.d-tl__left { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 13px; border-right: 1px solid var(--line); min-width: 0; }
.d-tl__left .d-meta { font-size: 11.5px; width: 100%; }
.d-tl__row--step .d-tl__left .d-meta { width: auto; }
.d-tl__name { font-weight: 600; color: var(--ink); text-decoration: none; }
.d-tl__track { position: relative; min-height: 36px; }
.d-tl__tick { position: absolute; top: 0; bottom: 0; font-size: 11px; color: var(--ink-3); padding: 9px 0 0 4px; box-sizing: border-box; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.d-tl__tick.is-we { background: var(--bg-subtle); }
.d-tl__tick.is-today { color: var(--act-do-ink); font-weight: 600; }
.d-tl__now { position: absolute; top: 0; bottom: -2000px; width: 2px; background: var(--act-do); opacity: 0.5; z-index: 1; pointer-events: none; }
.d-tl { position: relative; }
.d-tl__band { position: absolute; top: 10px; bottom: 10px; border-radius: 6px; background: var(--now-tint); }
.d-tl__bar { position: absolute; top: 50%; transform: translateY(-50%); height: 22px; border-radius: 6px; font-size: 11.5px; line-height: 22px; padding: 0 8px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--f-ink); background: var(--f-tint); box-shadow: inset 0 0 0 1px var(--f-ring, transparent); cursor: grab; touch-action: none; }
.d-tl__bar span { pointer-events: none; }
.d-tl__bar--sum { height: 10px; cursor: default; }
.d-tl__bar--do { --f-ink: var(--act-do-ink); --f-tint: color-mix(in oklab, var(--act-do) 30%, var(--bg)); }
.d-tl__bar--claude { --f-ink: var(--act-claude-ink); --f-tint: color-mix(in oklab, var(--act-claude) 25%, var(--bg)); }
.d-tl__bar--wait { --f-ink: var(--wait-ink); --f-tint: color-mix(in oklab, var(--customer-state) 35%, var(--bg)); }
.d-tl__bar--late { --f-ink: var(--late-ink); --f-tint: color-mix(in oklab, var(--late) 30%, var(--bg)); }
.d-tl__bar--done { --f-ink: var(--ink-3); --f-tint: var(--bg-subtle); }
.d-tl__bar.is-pending { background: repeating-linear-gradient(135deg, var(--f-tint) 0 6px, transparent 6px 10px); box-shadow: inset 0 0 0 1.5px var(--f-ink); }
.d-tl__bar:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.d-tl__grip { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.d-tl__promise { position: absolute; top: 50%; width: 11px; height: 11px; margin-left: -5px; transform: translateY(-50%) rotate(45deg); background: var(--ink); border-radius: 2px; }
.d-tl__promise--key { position: relative; display: inline-block; top: auto; margin: 0 4px 0 6px; transform: rotate(45deg); width: 8px; height: 8px; }
.d-tl__edge { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); padding: 0 4px; }
.d-tl__legend { margin-top: 10px; }
.d-tl__key { display: inline-block; width: 18px; height: 8px; border-radius: 3px; margin: 0 4px 0 10px; vertical-align: middle; }
.d-tl__key--band { background: var(--now-tint); }
.d-tl__key--do { background: color-mix(in oklab, var(--act-do) 30%, var(--bg)); }
.d-tl__key--wait { background: color-mix(in oklab, var(--customer-state) 35%, var(--bg)); }
.d-tbox { padding: 14px; display: grid; gap: 6px; }
@media (max-width: 1024px) {
.d-tl__row { grid-template-columns: 180px 1fr; }
}
@media (max-width: 640px) {
.d-tl__row { grid-template-columns: 120px 1fr; }
.d-tl__left .d-meta { display: none; }
}
.d-tl__band { top: 50%; bottom: auto; height: 26px; transform: translateY(-50%); }
.d-tl__track--lanes { height: calc(var(--lanes, 1) * 28px + 12px); min-height: 40px; }
.d-tl__track--lanes .d-tl__bar, .d-tl__track--lanes .d-tl__edge { top: calc(var(--lane, 0) * 28px + 9px); transform: none; }
.d-tl__bar.is-dragging { z-index: 5; box-shadow: var(--shadow-overlay); opacity: 0.92; }
.d-tl__row.is-drop { background: var(--act-do-tint); box-shadow: inset 0 0 0 2px var(--act-do); }
.d-tl__row[data-tperson] .d-tl__left .d-meta { width: 100%; }
.d-tl__row[data-tperson] .d-tl__left { align-content: flex-start; align-items: flex-start; padding-top: 10px; }
.d-tl__left { display: grid; align-content: start; gap: 6px; padding: 10px 12px; }
.d-tl__head { display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
.d-tl__name { font-weight: 600; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
.d-tl__toggle { all: unset; cursor: pointer; flex: none; display: grid; place-items: center; width: 20px; height: 20px; margin-top: -1px; border-radius: 6px; color: var(--ink-3); }
.d-tl__toggle:hover { background: var(--bg-subtle); color: var(--ink); }
.d-tl__toggle:focus-visible { outline: 2px solid var(--focus); }
.d-tl__toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.d-tl__tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.d-tl__tags .d-avatar { width: 20px; height: 20px; font-size: 9px; }
.d-tl__row--step .d-tl__left { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 36px; }
.d-tl__row--scale .d-tl__left { display: flex; align-items: center; }
@media (max-width: 1240px) {
.d-tl__row { grid-template-columns: 210px 1fr; }
}
@media (max-width: 640px) {
.d-tl__row { grid-template-columns: 116px 1fr; }
.d-tl__tags { display: none; }
.d-tl__left { padding: 8px; }
.d-tl__name, .d-tl__left .d-person { font-size: 12px; }
.d-tl__row--step .d-tl__left { padding-left: 8px; }
.d-tl__row--step .d-avatar { display: none; }
}
.d-tl__row--step .d-tl__left { flex-wrap: nowrap; }
.d-tl__row--step .d-tl__left > .d-mark, .d-tl__row--step .d-tl__left > .d-avatar { flex: none; }
.d-tl__row--step .d-tl__left > .d-link { min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }

.cal{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cal-week{font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cal-day{display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-dname{font-size:12.5px;font-weight:800;white-space:nowrap}
.cal-day[data-today] .cal-dname{color:var(--act-do)}

.cal-ghead{display:flex;justify-content:space-between;gap:8px;padding:6px 2px 2px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cal-gmeta{color:var(--ink-2);white-space:nowrap}
.cal-layout{align-self:flex-start;white-space:nowrap}
.cal-preview{background:var(--bg-subtle);border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;gap:4px}
.cal-plist{margin:0;padding-left:16px;font-size:12.5px}
.cal-pbtns{display:flex;gap:6px}.cal-pbtns .d-btn{white-space:nowrap}
.cal-check{flex:none;margin:3px 0 0}
.cal-itext{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-iname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-imeta[data-late]{color:var(--late)}
.cal-note{font-size:12.5px;color:var(--ink-2)}
.d-meter i { display: block; height: 100%; background: var(--now); border-radius: 3px; }
.d-meter.is-over i { background: var(--late); }
.d-callout { background: var(--bg-subtle); border-radius: var(--radius-m); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.d-calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.d-cal { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(90px, 1fr)); background: var(--bg); border-radius: var(--radius-l); box-shadow: var(--shadow-card); overflow: hidden; }
.d-cal__corner { border-bottom: 1px solid var(--line); }
.d-cal__head { all: unset; cursor: pointer; padding: 8px 10px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); display: grid; gap: 4px; font-size: 12.5px; }
.d-cal__head small { color: var(--ink-3); font-size: 11px; }
.d-cal__head.is-today b { color: var(--act-do-ink); }
.d-cal__head:hover { background: var(--bg-subtle); }
.d-cal__edge { grid-column: 1; font-size: 10.5px; color: var(--ink-3); padding: 6px; border-bottom: 1px solid var(--line); }
.d-cal__edge--bottom { border-top: 1px solid var(--line); border-bottom: 0; }
.d-cal__slot { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 26px; padding: 3px; display: grid; gap: 3px; background: var(--bg-subtle); }
.d-cal__edge--bottom ~ .d-cal__slot { border-bottom: 0; border-top: 1px solid var(--line); }
.d-cal__hours { grid-column: 1; position: relative; }
.d-cal__hours span { position: absolute; right: 6px; font-size: 10.5px; color: var(--ink-3); transform: translateY(-6px); }
.d-cal__hours span:first-child { transform: none; }
.d-cal__col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--h) - 1px), var(--line) calc(var(--h) - 1px) var(--h)); }
.d-pass { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 4px 6px; box-sizing: border-box; font-size: 11.5px; overflow: hidden; background: var(--f-tint); color: var(--f-ink); box-shadow: inset 3px 0 0 var(--f-bar); cursor: grab; touch-action: none; }
.d-cal__slot .d-pass { position: relative; left: 0; right: 0; }
.d-pass b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-pass small { opacity: 0.8; }
.d-pass--do { --f-tint: var(--act-do-tint); --f-ink: var(--act-do-ink); --f-bar: var(--act-do); }
.d-pass--claude { --f-tint: var(--act-claude-tint); --f-ink: var(--act-claude-ink); --f-bar: var(--act-claude); }
.d-pass--late { --f-tint: var(--late-tint); --f-ink: var(--late-ink); --f-bar: var(--late); }
.d-pass--wait { --f-tint: var(--act-customer-tint); --f-ink: var(--act-customer-ink); --f-bar: var(--customer-state); }
.d-pass--meet { --f-tint: var(--bg); --f-ink: var(--ink); --f-bar: var(--ink-2); box-shadow: inset 3px 0 0 var(--ink-2), inset 0 0 0 1px var(--line-strong); }
.d-pass--busy { --f-tint: var(--bg-subtle); --f-ink: var(--ink-3); --f-bar: var(--line-strong); background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); cursor: default; }
.d-pass.is-pending { background: repeating-linear-gradient(135deg, var(--f-tint) 0 6px, var(--bg) 6px 10px); box-shadow: inset 0 0 0 1.5px var(--f-bar); }
.d-pass:focus-visible { outline: 2px solid var(--focus); }
.d-pass__grip { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: ns-resize; }
.d-cal__key { display: inline-block; width: 16px; height: 9px; border-radius: 3px; margin: 0 4px 0 10px; vertical-align: middle; box-shadow: inset 0 0 0 1.5px var(--act-do); background: repeating-linear-gradient(135deg, var(--act-do-tint) 0 4px, var(--bg) 4px 7px); }
.d-cal__key--ok { background: var(--act-do-tint); box-shadow: inset 3px 0 0 var(--act-do); }
.d-cal__key--meet { background: var(--bg); box-shadow: inset 3px 0 0 var(--ink-2), inset 0 0 0 1px var(--line-strong); }
.d-cal__key--busy { background: repeating-linear-gradient(135deg, var(--bg-subtle) 0 3px, var(--line) 3px 4px); box-shadow: none; }
.d-cal__month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.d-cal__mday { all: unset; cursor: pointer; min-height: 72px; padding: 8px; border-radius: 8px; background: var(--bg); box-shadow: var(--shadow-card); display: grid; align-content: start; gap: 4px; font-size: 12.5px; }
.d-cal__mday small { color: var(--ink-2); font-size: 11px; }
.d-cal__mday.is-out { opacity: 0.45; }
.d-cal__mday.is-today { box-shadow: inset 0 0 0 1.5px var(--act-do); }
.d-calside { background: var(--bg); border-radius: var(--radius-l); box-shadow: var(--shadow-card); padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.d-calside__group { display: grid; gap: 4px; font-size: 13px; }
.d-calside__item { display: flex; gap: 8px; align-items: start; font-size: 13px; cursor: pointer; }
.d-calside__item small { display: block; color: var(--ink-3); font-size: 11.5px; }
@media (max-width: 1024px) {
.d-present, .d-quick, .d-calwrap, .d-msgs { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
.d-cal { grid-template-columns: 40px repeat(var(--cols), minmax(64px, 1fr)); }
}
.d-calside__item { cursor: grab; position: relative; }
.d-calside__item.is-dragging { opacity: 0.45; }
.d-calside__grip { margin-left: auto; color: var(--ink-3); display: grid; place-items: center; }
.d-calside__grip svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; transform: rotate(90deg); }
.d-cal__col.is-drop, .d-cal__mday.is-drop { background: var(--act-do-tint); }
.d-calhint { position: absolute; left: 3px; right: 3px; border-radius: 6px; border: 1.5px dashed var(--act-do); background: color-mix(in oklab, var(--act-do) 12%, transparent); font-size: 11px; color: var(--act-do-ink); padding: 3px 6px; box-sizing: border-box; pointer-events: none; }
.d-calside__item { user-select: none; }

.walk-back{position:fixed;inset:0;background:var(--scrim);z-index:60}
.receipt{z-index:70}
.walk-stack{position:fixed;inset:0;z-index:60}
.walk-underlay{position:fixed;inset:0;z-index:60;pointer-events:none}
.walk-underlay .walk-back{z-index:60}
.walk-browser-back{z-index:61}
.walk-answer{display:grid;gap:8px}
.walk-approval{display:grid;gap:8px}
.walk-reason{width:100%;box-sizing:border-box}
.walk-dialog{position:fixed;z-index:46;left:50%;top:12vh;transform:translateX(-50%);width:min(520px,calc(100vw - 24px))}
.d-walk { background: var(--bg); border-radius: var(--radius-l); box-shadow: var(--shadow-overlay); padding: 18px 22px 22px; display: grid; gap: 12px; top: 8vh; max-height: 84vh; overflow: auto; }
.d-walk__top{display:flex;align-items:center;gap:10px}
.d-walk__kind{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--f-tint,var(--act-do-tint));color:var(--f-ink,var(--act-do-ink))}
.d-walk__kind.d-fam--customer{background:var(--act-customer-tint);color:var(--act-customer-ink)}
.d-walk__kind.d-fam--do{background:var(--act-do-tint);color:var(--act-do-ink)}
.d-walk .d-title{margin:0}
.d-walk__actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.d-walk__actions[hidden],.d-walk__no[hidden]{display:none}
.d-walk__list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.d-walk__list li{display:grid;grid-template-columns:8px 1fr;gap:2px 10px;align-items:baseline}
.d-walk__list small{grid-column:2;color:var(--ink-3)}
.d-walk__preview .d-mail__body{max-height:160px;overflow:auto}
.d-walknav{display:inline-flex;align-items:center;gap:4px}
.d-walknav__pos{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-2);padding:3px 8px;border-radius:7px}
.d-walknav__pos:hover{background:var(--bg-subtle);color:var(--ink)}
.d-walknav__pos svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.d-walknav__dots{display:inline-flex;gap:3px;margin-left:6px}
.d-walknav__dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); opacity: 0.5; }
.d-walknav__dots i.is-on{opacity:1;background:var(--ink);transform:scale(1.25)}
.d-walknav__dots i[data-d="yes"],.d-walknav__dots i[data-d="done"]{background:var(--done);opacity:1}
.d-walknav__dots i[data-d="no"]{background:var(--late);opacity:1}
.d-walknav__dots i[data-d="later"]{background:var(--wait);opacity:1}
.d-walk__dec{margin:0;padding:8px 12px;border-radius:8px;background:var(--bg-subtle);font-size:13px}
.d-walk__dec--yes,.d-walk__dec--done{background:var(--done-tint);color:var(--done-ink)}
.d-walk__dec--no{background:var(--late-tint);color:var(--late-ink)}
.d-walk__hint{margin:0}

.fl{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl-tools .d-btn,.fl-chips .d-btn,.fl-folders .d-btn{white-space:nowrap}
.fl-tools .d-btn[aria-pressed="true"],.fl-chips .d-btn[aria-pressed="true"],.fl-folders .d-btn[aria-pressed="true"]{background:var(--ink);color:var(--act-do-on)}

.fl-chips{display:flex;gap:6px;flex-wrap:wrap}
.fl-body{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:14px;align-items:start}
.fl-folders{background:var(--bg);border-radius:var(--radius-l);padding:12px;display:flex;flex-direction:column;gap:4px}
.fl-folders .d-btn{justify-content:space-between;display:flex;gap:8px;text-align:left;overflow:hidden;text-overflow:ellipsis}
.d-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
.d-file { background: var(--bg); border-radius: var(--radius-l); box-shadow: var(--shadow-card); padding: 10px; display: grid; gap: 6px; font-size: 13px; align-content: start; }
.d-file b { font-weight: 500; }

.d-file__thumb--slides { background: linear-gradient(160deg, ${xa.slideStart}, ${xa.slideEnd}); color: ${xa.slideInk}; }
.d-file__thumb--video { background: linear-gradient(160deg, ${xa.videoStart}, ${xa.videoEnd}); color: ${xa.videoInk}; }
.d-file__thumb--web { background: linear-gradient(120deg, ${xa.webStart}, ${xa.webEnd}); }
.d-file__thumb--zip { background: var(--act-customer-tint); }
.d-file__thumb span { font-size: 12px; font-weight: 600; }
.fl-card{min-width:0;border:0;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}
.fl-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fl-ph{width:100%;overflow:hidden}
.fl-n{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fl-tie{background:var(--bg);border-radius:var(--radius-l);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.fl-tie select{font:inherit;font-size:13.5px;border:0;background:var(--bg-subtle);border-radius:var(--radius-m);padding:6px 10px;color:var(--ink);max-width:100%}
