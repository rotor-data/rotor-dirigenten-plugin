  /**
   * «Be Claude om förslag»: med förmågan sample svarar Claude i vyn, i chattens ark
   * (Spara tillbaka), och läser själv med plan_state — bara läsande, ingenting
   * ändras. Utan sample: frågan kopieras till vanliga chatten som förut.
   */
  async function suggestInView(t) {
    if (!sample) return copyToChat(suggestPrompt(t), "frågan till Claude");
    openSheet("chat", `c${S.sheets.length}`, "Claude föreslår");
    const x = top1(); if (!x || x.kind !== "chat") return;
    const ctl = new AbortController();
    x.claude = { busy: true, ctl }; x.text = ""; render();
    const read = { name: "plan_state", description: "Läser planen ur dirigenten med användarens behörighet. Argumenten som till dirigentens plan_state. Kan inte ändra något.",
      inputSchema: { type: "object", properties: {} },
      execute: async (i) => {
        try { const d = await call("plan_state", i && typeof i === "object" ? i : {}); const txt = JSON.stringify(d ?? null);
          return txt.length > 12000 ? `${txt.slice(0, 12000)}\n… (resten utelämnat — fråga smalare)` : txt; }
        catch (e) { return `FEL från plan_state: ${e?.message || e}. Ändra argumenten i stället för att göra om samma anrop.`; } } };
    try {
      const r = await sample([{ role: "user", content: `${suggestPrompt(t)}\nSvara på svenska, kort och konkret. Du läser med verktyget plan_state; du kan inte ändra något, så skriv förslagen så att användaren kan genomföra dem i vyn.` }],
        { modelTier: "default", signal: ctl.signal, tools: [read], onText: ({ text }) => { if (x.claude?.busy) { x.text = String(text || ""); renderKeep(); } } });
      x.text = String(r?.text || x.text || ""); x.claude = { done: true };
    } catch (e) {
      if (e?.code === "not_granted") sample = null;
      x.claude = { note: e?.code === "cancelled" ? "Avbrutet." : `Claude svarade inte (${e?.message || e}).` };
    }
    render();
  }
  /** «Arbeta i chatten»: en färdig prompt till vanliga Claude-chatten, som har samma verktyg mot dirigenten. */
  function copyToChat(text, what, toast = null) {
    const nav = typeof navigator !== "undefined" ? navigator : null;
    return (nav?.clipboard?.writeText(text) ?? Promise.reject(new Error("urklippet går inte att nå här")))
      .then(() => { say(`${toast ? `${toast.text} ` : ""}Kopierat: ${what}. Klistra in i vanliga Claude-chatten.`, toast?.undo || null); render(); },
        (e) => { say(`Kunde inte kopiera: ${e.message || e}. Prompten: ${text}`, null, true); render(); });
  }
  function chatPrompt(key) {
    const row = rowOf(key);
    return /^d_/.test(key)
      ? `Arbeta med dirigenten: leveransen «${row?.label || key}» (${key}). Läs läget med plan_state { delivery: "${key}" } och säg vad som är nästa steg.`
      : `Arbeta med dirigenten: uppgiften «${row?.label || key}» (${key}). Läs läget med plan_state { task: "${key}" } och säg vad som är nästa steg.`;
  }

  /* ── Högerklick, tangenter och ⌘K (FAS1 1.4, BESLUT 12) ──
     En meny för steg, rad och Igång. Varje handling i den nås också med en tangent
     på det man pekar på, eller med ⌘K, som söker bland samma handlingar. */
  const isoPlus = (iso, n) => new Date(Date.parse(`${iso}T12:00:00Z`) + n * 864e5).toISOString().slice(0, 10);
  const weekday = (iso) => new Date(`${iso}T12:00:00Z`).getUTCDay();
  /** Nästa (eller förra) arbetsdag. */
  const workdayFrom = (iso, dir) => { let d = isoPlus(iso, dir); while (weekday(d) === 0 || weekday(d) === 6) d = isoPlus(d, dir); return d; };

  /** Allt vyn vet om ett steg: ur översiktens rad, annars ur ett öppet leveransark. */
  function findStep(task, step) {
    const o = S.data;
    if (!o) return null;
    const row = rowOfTask(task);
    if (row) { const i = row.tasks.indexOf(task), x = row.steps.find((y) => y[0] === i && y[1] === step);
      if (x) { const st = stepOf(o, row, x); return { task, step, label: st.label, state: st.state, who: st.who,
        start: isoPlus(o.today, st.s), end: isoPlus(o.today, st.e), row }; } }
    for (const k of Object.keys(S.sheetData)) for (const t of S.sheetData[k].plans || []) {
      if (t.task !== task) continue;
      const s = t.steps.find((y) => y.step === step);
      if (s) return { task, step, label: s.label, state: s.done ? "done" : s.side === "customer" ? "customer" : "todo", who: s.who,
        start: s.window?.[0] || null, end: s.window?.[1] || null, row };
    }
    const tt = S.time?.tl && taskOf(S.time.tl, task), ts = tt?.steps.find((x) => x.id === step);
    if (ts) return { task, step, label: ts.n, state: ts.dn ? "done" : ts.x ? "customer" : "todo", who: nameOf(ts.w), start: ts.s, end: ts.e, row };
    const it = (o.running || []).find((x) => x.task === task && x.step === step);
    return it ? { task, step, label: it.label, state: "todo", who: o.party?.label, start: null, end: null, row } : null;
  }
  /** Radens nästa steg: ditt först, annars det första som inte är klart. */
  function nextOfRow(row) {
    const o = S.data, me = o?.party?.label;
    const open = row.steps.map((x) => stepOf(o, row, x)).filter((s) => s.state !== "done" && s.state !== "customer");
    const st = open.find((s) => s.who === me) || open[0];
    return st ? findStep(st.task, st.id) : null;
  }
  /** Det man pekar på, ur `data-ctx`: "step|<uppgift>|<steg>" eller "row|<nyckel>". */
  function targetOf(ctx) {
    if (!ctx) return null;
    const [kind, a, b] = ctx.split("|");
    if (kind === "step") { const s = findStep(a, b); return s ? { kind, ctx, ...s } : null; }
    if (kind === "row") { const row = rowOf(a); if (!row || row.kind === "inbox") return null;
      return { kind, ctx, row, label: row.label, step: nextOfRow(row) }; }
    if (kind === "case") { const c = findCase(a); if (!c) return null;
      return { kind, ctx, task: a, row: c.row, label: c.title, step: c.step ? caseStep(a, c) : null }; }
    return null;
  }
  /**
   * Ett ärende (en uppgift i en ström eller ett projekt): rubriken och det aktuella
   * steget, ur översiktens rad, ett öppet leveransark eller ett öppet ärendeark.
   */
  function findCase(task) {
    const o = S.data;
    for (const r of o?.rows || []) { const c = (r.cases || []).find((y) => y.task === task);
      if (c) return { title: c.title, step: c.step || null, stepLabel: c.now >= 0 ? o.names[c.now] : null, who: c.who >= 0 ? o.names[c.who] : null, row: r }; }
    for (const k of Object.keys(S.sheetData)) {
      const t = (S.sheetData[k].delivery?.tasks || []).find((y) => y.id === task);
      if (t) return { title: caseTitle(t.label), step: t.current?.step || null, stepLabel: t.current?.label || null, who: t.current?.responsible || null, row: rowOfTask(task) };
      const sd = S.sheetData[k];
      if (k === `case:${task}` && (sd.case || sd.plan)) { const st = (sd.plan?.steps || []).find((y) => !y.done);
        return { title: sd.case?.subject || S.sheets.find((y) => y.kind === "case" && y.id === task)?.label || task, step: st?.step || null, stepLabel: st?.label || null, who: st?.who || null, row: rowOfTask(task) }; }
    }
    return null;
  }
  const caseTitle = (l) => String(l || "").replace(/^Supportärende \(|\)$/g, "");
  /** Ärendets aktuella steg som ett steg för menyn; namnet i kvittot är ärendets rubrik. */
  function caseStep(task, c) {
    const s = findStep(task, c.step);
    const label = s?.label || c.stepLabel || c.step;
    return { ...(s || { task, step: c.step, state: "todo", who: c.who, start: null, end: null, row: c.row }), label, stepLabel: label, caseTitle: c.title };
  }
  const people = () => [...(S.data?.party ? [{ id: S.data.party.id, label: S.data.party.label }] : []), ...(S.data?.colleagues || [])];

  /**
   * Menyn för det man pekar på. `key` är tangenten som gör samma sak på det man
   * pekar på; `lvl` är skrivnivån (● direkt, ◐ förhandsvisa).
   */
  function menuItems(t) {
    if (!t) return [];
    const s = t.kind === "step" ? t : t.step;
    const rowKey = t.row?.key;
    const out = [];
    if (t.kind === "case") out.push({ id: "open", l: "Öppna ärendet", key: "↵", run: () => openCase(t.task, t.label) });
    // Byte av metod är ett eget, uttryckligt val i ärendets meny, aldrig ett förslag.
    const sw = t.kind === "case" ? S.sheetData[`case:${t.task}`]?.line?.switch : null;
    if (sw) out.push({ id: "switch", l: sw.label, lvl: "◐", run: () => switchMethod(t.task, sw) });
    else if (rowKey) out.push({ id: "open", l: "Öppna leveransen", key: "↵", run: () => openSheet("delivery", rowKey, t.row.label) });
    out.push({ id: "peek", l: "Titta", key: "␣", run: () => { S.peek = t; render(); } });
    if (s && s.state !== "done" && s.state !== "customer") {
      const on = isRunning(s.task, s.step);
      out.push({ id: "igang", l: on ? "Ta bort från Igång" : "Lägg i Igång", key: "I", lvl: "●", run: () => setRunning(s.task, s.step, s.label, !on) });
      for (const p of people()) if (p.label !== s.who)
        out.push({ id: `handover:${p.id}`, l: `Lämna över till ${p.label}`, lvl: "◐", run: () => inTime(s, { to: p.id }) || previewTime([{ task: s.task, step: s.step, to: p.id }], `Föreslå ${p.label}`) });
      if (s.start && s.end) {
        out.push({ id: "later", l: "En dag senare", key: "→", lvl: "◐", run: () => inTime(s, { shift: 1 }) || previewTime([{ task: s.task, step: s.step, start: workdayFrom(s.start, 1), end: workdayFrom(s.end, 1) }], "Flytta 1 steg") });
        out.push({ id: "earlier", l: "En dag tidigare", key: "←", lvl: "◐", run: () => inTime(s, { shift: -1 }) || previewTime([{ task: s.task, step: s.step, start: workdayFrom(s.start, -1), end: workdayFrom(s.end, -1) }], "Flytta 1 steg") });
      }
      out.push({ id: "done", l: "Markera klart", key: "E", lvl: "●", run: () => markDone(s) });
    }
    // Ta över (v6): direkt, utan mottagarens ja; den som hade det får ett meddelande.
    const me = S.data?.party?.label;
    if (t.kind === "case") out.push({ id: "take", l: "Ta över ärendet", key: "T", lvl: "●", run: () => takeOver(t.task, null, t.label) });
    else if (s && s.state !== "done" && s.state !== "customer" && s.who && s.who !== me)
      out.push({ id: "take", l: "Ta över steget", key: "T", lvl: "●", run: () => takeOver(s.task, s.step, s.label) });
    if (t.kind === "row" && t.row.tasks?.length === 1 && t.row.kind !== "stream" && (t.row.people || []).some((p) => p !== S.data?.party?.id))
      out.push({ id: "take-task", l: "Ta över uppgiften", lvl: "●", run: () => takeOver(t.row.tasks[0], null, t.row.label) });
    out.push(...hlMenu(t));
    if (targetSheets(t).length) out.push({ id: "link", l: "Kopiera länk", key: "⇧⌘C", run: () => copyLink(targetSheets(t)) });
    out.push({ id: "chat", l: "Arbeta i chatten ↗", run: () => copyToChat(t.kind === "case" ? casePrompt(t.task, t.label) : s ? stepPrompt(s) : chatPrompt(rowKey), "prompten") });
    out.push({ id: "claude", l: sample ? "Be Claude om förslag" : "Be Claude om förslag ↗", run: () => suggestInView(t) });
    return out;
  }
  /** I Tid blir flytta och lämna över ett streckat utkast, som Genomför sedan skickar. */
  function inTime(s, how) {
    const T = S.time;
    if (S.body !== "time" || !T?.tl) return false;
    const t = taskOf(T.tl, s.task), st = t?.steps.find((x) => x.id === s.step);
    if (!st || st.dn || st.lk) return false;
    const p = placed(consequences(), t, st);
    if (how.to) draftSet(s.task, s.step, { to: how.to });
    if (how.shift) draftSet(s.task, s.step, { start: workdayFrom(p.s, how.shift), end: workdayFrom(p.e, how.shift) });
    S.menu = null; render();
    return true;
  }
  const casePrompt = (task, label) => `Arbeta med dirigenten: ärendet «${label}» (uppgift ${task}). Läs det med read { op: "view_file", sheet: "case", task: "${task}" } och hjälp mig utreda och svara. Skicka inget utan mitt ja.`;
  const stepPrompt = (s) => `Arbeta med dirigenten: steget «${s.label}» (${s.step}) i uppgiften ${s.task}${s.row ? ` («${s.row.label}»)` : ""}. Läs steget med read { op: "step_sheet", task: "${s.task}", step: "${s.step}" } och hjälp mig göra det.`;
  const suggestPrompt = (t) => `Arbeta med dirigenten: föreslå hur «${t.row?.label || t.label}» kan planeras om så att den håller och ingen blir överbelastad. Läs plan_state { timeline: { ${t.row && /^d_/.test(t.row.key) ? `delivery: "${t.row.key}"` : `party: "${S.data?.party?.id || ""}"`} } }. Visa förslagen som ändringar för execute_step { time } och genomför inget utan mitt ja.`;

  /** Markera klart (●): direkt, med Ångra som öppnar steget igen. */
  /**
   * Ta över (●): steget, eller hela uppgiften eller ärendet utan step. Servern
   * säger vad som togs och vad som blev en förfrågan; kvittot har Ångra.
   */
  async function takeOver(task, step, label) {
    S.menu = null; S.peek = null; render();
    if (offline()) { say("Ta över kan inte göras förrän dirigenten svarar. Inget ändrades.", null, true); render(); return; }
    try {
      const r = await call("execute_step", step ? { task, step, take_over: true } : { task, take_over: true });
      say(summaryText(r) || `Du tog över «${label}».`, r?.undo || null);
      for (const k of Object.keys(S.sheetData)) if (k === `case:${task}` || k.startsWith(`step:${task}`) || k.startsWith("delivery:")) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
      const tp = top1(); if (tp) fetchSheet(tp, true);
      refreshSoon();
    } catch (e) { say(`Kunde inte ta över «${label}»: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  async function markDone(s) {
    S.menu = null; S.peek = null; render();
    if (offline()) { queue({ kind: "done", task: s.task, step: s.step, label: s.label }); return; }
    try {
      await call("execute_step", { task: s.task, step: s.step, mark: "done" });
      say(`«${s.label}» är klart.`, { tool: "execute_step", args: { task: s.task, step: s.step, mark: "undone", reason: "Ångrat i vyn direkt efter att det markerades klart." } });
      refreshSoon();
    } catch (e) {
      if (unreachable(e)) { S.error = e; queue({ kind: "done", task: s.task, step: s.step, label: s.label }); return; }
      say(`Kunde inte markera «${s.label}» klart: ${e.message || e}. Inget ändrades.`, null, true);
    }
    render();
  }
  /**
   * Flytta och lämna över (◐): servern räknar planen med ändringen och säger vad den gör;
   * först knappen genomför. En överlämning väntar sedan på mottagarens ja.
   */
  async function previewTime(changes, verb, onDone = null) {
    S.menu = null; S.peek = null;
    // ◐ och ■ köas inte (BESLUT 11): de kräver förhandsvisning, och den kan bara servern räkna.
    if (offline()) { say("Flytta och lämna över kräver förhandsvisning och kan inte göras förrän dirigenten svarar. Ändringen står kvar här.", null, true); render(); return; }
    S.confirm = { loading: true, verb, text: "Räknar om planen …" };
    render();
    try {
      const r = await call("execute_step", { time: { changes } });
      // Spräcker ändringen en leverans är Genomför ett nytt löfte (accept_late), och knappen säger det.
      const late = (r?.tasks || []).some((t) => t.late_by > 0);
      S.confirm = { verb, text: summaryText(r), late, onDone,
        next: r?.next || { tool: "execute_step", args: { time: { changes, confirmed: true, ...(late ? { accept_late: true } : {}) } } } };
    } catch (e) { S.confirm = null; say(`Kunde inte räkna på ändringen: ${e.message || e}`, null, true); }
    render();
  }
  /** Serverns sammanfattning, utan det tekniska prefixet. */
  const summaryText = (r) => String(r?.summary || r?.text || "").replace(/^Förhandsvisning:\s*/, "").replace(/\s*Inget är (?:sparat|skrivet)\.\s*$/, "");
  async function confirmTime() {
    const c = S.confirm;
    if (!c?.next) return;
    S.confirm = { ...c, loading: true };
    render();
    try {
      const r = await call(c.next.tool, c.next.args);
      S.confirm = null;
      say(`Genomfört. ${summaryText(r).replace(/^Genomfört \(nr [^)]*\)\.\s*/, "")}`, r?.receipt?.undo || null);
      c.onDone?.();
      refreshSoon();
    } catch (e) { S.confirm = null; say(`Inget genomfördes: ${e.message || e}`, null, true); }
    render();
  }
  const confirmHtml = () => !S.confirm ? "" : `<div class="confirm${S.confirm.house ? " house" : ""}" role="dialog" aria-label="Förhandsvisning"><span class="ci">${S.confirm.house ? "■" : "◐"}</span><span class="ctext">${esc(S.confirm.text)}</span>`
    + `<button class="quiet" data-act="confirm-cancel">Avbryt</button>`
    + `<button class="go" data-act="confirm-go"${S.confirm.loading || !S.confirm.next ? " disabled" : ""}>${S.confirm.house ? "■" : "◐"} ${esc(S.confirm.verb)}${S.confirm.late ? ", nytt löfte" : ""}</button></div>`;

  function menuHtml() {
    const m = S.menu;
    if (!m) return "";
    const items = menuItems(m.target);
    return `<div class="menu" role="menu" style="left:${Math.round(m.x)}px;top:${Math.round(m.y)}px">`
      + items.map((it, i) => `${(it.id.startsWith("handover:") && !items[i - 1]?.id.startsWith("handover:")) || it.id === "done" || it.id === "chat" ? `<div class="msep"></div>` : ""}`
        + `<button role="menuitem" class="mi${i === m.i ? " on" : ""}" data-act="menu-run" data-i="${i}"><span class="ml">${esc(it.l)}</span>`
        + `<span class="mk">${it.lvl ? `<span class="lvl${it.lvl === "●" ? " d" : ""}">${it.lvl}</span>` : ""}${it.key ? `<kbd>${esc(it.key)}</kbd>` : ""}</span></button>`).join("") + `</div>`;
  }
  function peekHtml() {
    const t = S.peek;
    if (!t) return "";
    const s = t.kind === "step" ? t : t.step;
    const lines = t.kind === "case" ? [s ? `Nu: ${s.stepLabel}${s.who ? ` · ${s.who}` : ""}` : "Inget steg kvar", t.row ? `i ${t.row.label}` : "", isRunning(t.task, s?.step) ? "i Igång" : ""]
      : t.kind === "row"
      ? [t.row.state_text, s ? `Nästa: ${s.label}${s.who ? ` · ${s.who}` : ""}` : ""]
      : [`${STATE[s.state] || s.state}${s.who ? ` · ${s.who}` : ""}`, s.start ? `får ligga mellan ${shortIso(s.start)} och ${shortIso(s.end)}` : "", s.row ? `i ${s.row.label}` : ""];
    return `<div class="peek" role="dialog" aria-label="Titta"><div class="pl">${t.kind === "row" ? "LEVERANS" : t.kind === "case" ? "ÄRENDE" : "STEG"}</div><div class="pt">${esc(t.label)}</div>`
      + lines.filter(Boolean).map((x) => `<div class="pm">${esc(x)}</div>`).join("") + `<div class="ph">␣ eller Esc stänger · ↵ öppnar</div></div>`;
  }

  /* ── Utan metod, och flytta till leverans (Daniel P 2026-10-05: «saker som saknar metoder blir lite
     hemlösa också. Vad gör man av dem? Och att man kanske vill flytta in saker i en leverans?») ──
     En uppgift utan metod och steg får tre vägar: ge den en metod (registrets förslag, återanvändning
     först, ◐), gör den med några steg (Claudes förslag streckat, ◐) eller bara gör det (ett steg, ●).
     Med egna steg och klar: spara stegen som metod (◐). Flytta till leverans: högerklick, ⌘K eller dra
     raden till leveransen; förhandsvisas (◐) med vad som händer med datum och plan. */
  const hlState = (task) => ((S.hl ||= {})[task] ||= { way: null, text: "", claude: null });
  /** Uppgiftens plan (plan_state { task, format: "plan" }): ur ett öppet ark, annars hämtad en gång. */
  function hlPlan(task) {
    for (const k of [`delivery:${task}`, `part:${task}`]) { const p = S.sheetData[k]?.plans?.[0]; if (p) return p; }
    const c = (S.hlPlans ||= {})[task];
    if (c) return c.plan || null;
    S.hlPlans[task] = { loading: true };
    call("plan_state", { task, format: "plan" }).then((d) => { S.hlPlans[task] = { plan: d?.tasks?.[0] || null }; render(); },
      () => { S.hlPlans[task] = { plan: null }; render(); });
    return null;
  }
  /** Uppgiften som översikten känner den: namn, kund och leveransen den ligger i. */
  function hlTask(task) {
    const row = rowOfTask(task), c = row?.cases?.find((y) => y.task === task);
    const inDelivery = row && (row.kind === "delivery" || row.kind === "stream");
    return { task, row, label: c?.title || (row && !inDelivery ? row.label : null) || hlPlan(task)?.label || task,
      customer: row?.customer || null, cur: inDelivery ? { key: row.key, label: row.label } : null,
      homeless: !!(c ? c.no_method : row?.no_method) };
  }
  const hlInvalidate = (task) => { if (S.hlPlans) delete S.hlPlans[task];
    for (const k of Object.keys(S.sheetData)) if (k === `delivery:${task}` || k === `part:${task}` || k.startsWith("delivery:d_")) S.sheetData = { ...S.sheetData, [k]: { ...S.sheetData[k], stale: true } };
    const t = top1(); if (t && S.sheetData[sheetKey(t)]?.stale) fetchSheet(t, true); refreshSoon(); };
  /** Förhandsvisningens nästa anrop, med jaet som knappen ger när servern väntar ett. */
  function hlNext(r, fallback, verb) {
    const nx = r?.next || r?.next_call || fallback, a = { ...(nx.args || {}) };
    if (/^</.test(String(a.user_approval || ""))) a.user_approval = `Ja (◐ ${verb} i vyn)`;
    return { tool: nx.tool, args: a };
  }

  /** Rutan för en uppgift utan metod: frågan, de tre vägarna och vägen som är vald. */
  function homelessHtml(task, label, plan) {
    const st = hlState(task), nm = plan?.no_method;
    const opt = (way, l, lvl) => `<button class="hlopt${st.way === way ? " on" : ""}" data-act="hl-way" data-task="${esc(task)}" data-way="${way}">${esc(l)} <span class="lvl${lvl === "●" ? " d" : ""}">${lvl}</span></button>`;
    let body = "";
    if (st.way === "method") {
      const sug = nm?.suggestions || [];
      body = !plan ? `<div class="mmeta">Söker i registret efter metoder som liknar …</div>`
        : sug.length ? sug.map((s) => `<div class="sug"><div class="sl"><b>${esc(s.label)}</b><div class="mmeta">${esc(s.why)} · ${s.steps} steg${s.same_type ? "" : " · lånas: levererar något annat"}</div></div>`
            + `<button class="go" data-act="hl-lock" data-task="${esc(task)}" data-method="${esc(s.id)}" data-label="${esc(s.label)}">◐ Ge den «${esc(s.label)}»</button></div>`).join("")
          + `<div class="mmeta">Förslagen kommer ur registret: först metoder som levererar samma sak, sedan de som liknar mest. Inget passar? Gör den med några steg och spara dem som metod när den är klar.</div>`
        : `<div class="mmeta">Registret har ingen metod som liknar «${esc(label)}». Gör den med några steg, och spara stegen som metod när den är klar.</div>`;
      body += `<div><button class="link" data-act="hl-chat" data-task="${esc(task)}">Be Claude föreslå i chatten ↗</button></div>`;
    } else if (st.way === "steps") {
      const c = st.claude, n = st.text.split("\n").map((x) => x.trim()).filter(Boolean).length;
      body = (c?.busy ? `<div class="mmeta">Claude föreslår steg … ${esc(c.stream || "")}</div>` : c?.note ? `<div class="mmeta">${esc(c.note)}</div>` : "")
        + `<textarea id="hl-steps" data-task="${esc(task)}" aria-label="Stegen, ett per rad" placeholder="Ett steg per rad, verbet först">${esc(st.text)}</textarea>`
        + `<div class="mmeta">${c?.done ? "Claudes förslag, streckat tills det läggs in. " : ""}Ett steg per rad, verbet först. Stegen finns bara i den här uppgiften; metoderna rörs inte.</div>`
        + `<div style="display:flex;gap:14px;align-items:center"><button class="hlgo" data-act="hl-steps-go" data-task="${esc(task)}"${n ? "" : " disabled"}>◐ Lägg in ${n || ""} steg</button>`
        + (sample ? `<button class="link" data-act="hl-ask" data-task="${esc(task)}">Fråga Claude ${c?.done ? "igen" : ""}</button>` : `<button class="link" data-act="hl-chat-steps" data-task="${esc(task)}">Be Claude föreslå i chatten ↗</button>`) + `</div>`;
    }
    return `<div class="hl" data-hl="${esc(task)}"><div class="hlq">Utan metod — vad gör vi med den?</div>`
      + `<div class="hlw">${esc(nm?.text || "Uppgiften har ingen metod och inga steg, så den syns inte i planen och ingen har den.")}</div>`
      + `<div class="hlopts">${opt("method", "Ge den en metod", "◐")}${opt("steps", "Gör den med några steg", "◐")}${opt("do", "Bara gör det", "●")}`
      + `<button class="hlopt" data-act="hl-move" data-task="${esc(task)}">Flytta till leverans … <span class="lvl">◐</span></button></div>`
      + (body ? `<div class="hlbody">${body}</div>` : "") + `</div>`;
  }
  /** I arket: rutan för `none`, och för `own` en rad med «Spara som metod» när stegen är klara. */
  function hlSheetHtml(plan) {
    if (!plan?.method_status) return "";
    if (plan.method_status === "none") return homelessHtml(plan.task, plan.label, plan);
    const done = plan.steps.length > 0 && plan.steps.every((s) => s.done);
    return `<div class="hl"><div class="hlq">Utan metod: stegen finns bara i den här uppgiften</div>`
      + (done ? `<div class="hlw">Allt är klart. Spara stegen som metod, så kan nästa ${esc(plan.deliverable_type?.label || "uppgift")} göras likadant.</div>`
          + `<div class="hlopts"><button class="hlopt" data-act="hl-save" data-task="${esc(plan.task)}">Spara som metod <span class="lvl">◐</span></button>`
          + (plan.save_as_method ? `<button class="hlopt" data-act="hl-build" data-task="${esc(plan.task)}">Ändra först i metodbyggaren</button>` : "") + `</div>`
        : `<div class="hlw">När den är klar kan stegen sparas som metod.</div>`) + `</div>`;
  }

  async function hlWay(task, way) {
    const st = hlState(task);
    if (way === "do") return hlJustDo(task);
    st.way = st.way === way ? null : way;
    if (st.way === "steps" && !st.text && sample) hlAsk(task);
    render();
  }
  /** Ge den en metod (◐): servern förhandsvisar låsningen; knappen genomför. */
  async function hlLock(task, method, label) {
    if (offline()) { say("Att ge uppgiften en metod kräver förhandsvisning och kan inte göras förrän dirigenten svarar.", null, true); render(); return; }
    const verb = `Ge den «${label}»`;
    S.confirm = { loading: true, verb, text: "Räknar på metoden …" }; render();
    const args = { op: "task_lock", task, method, reason: "Uppgiften saknade metod; metoden valdes i vyn (Ge den en metod)." };
    try {
      const r = await call("write", args);
      S.confirm = { verb, text: summaryText(r) || `«${label}» blir uppgiftens metod.`, next: hlNext(r, { tool: "write", args: { ...args, confirmed: true } }, verb),
        onDone: () => { hlState(task).way = null; hlInvalidate(task); } };
    } catch (e) { S.confirm = null; say(`Kunde inte förhandsvisa metoden: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /** Bara gör det (●): ett steg «Gör: …» hos den som trycker, direkt, med Ångra. */
  async function hlJustDo(task) {
    const h = hlTask(task), me = S.data?.party;
    if (offline()) { say("«Bara gör det» kan inte göras förrän dirigenten svarar. Inget ändrades.", null, true); render(); return; }
    const label = `Gör: ${h.label}`.slice(0, 120);
    try {
      const r = await call("write", { op: "task_lock", task, add_step: { after: null, label, ...(me?.id ? { who: me.id } : {}), new_reason: "Bara gör det, i vyn" }, confirmed: true });
      say(`«${label}» ligger nu i uppgiften, hos dig.`, r?.step ? { tool: "write", args: { op: "task_lock", task, add_step: { remove: r.step }, confirmed: true } } : null);
      hlState(task).way = null; hlInvalidate(task);
    } catch (e) { say(`Kunde inte lägga in steget: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }
  /** Claude föreslår 2–5 steg (förmågan sample, snabbaste nivån), streckat i rutan. */
  async function hlAsk(task) {
    const st = hlState(task), h = hlTask(task), plan = hlPlan(task);
    if (!sample) return;
    st.claude?.ctl?.abort();
    const ctl = new AbortController(), c = { busy: true, ctl, stream: "" };
    st.claude = c; render();
    const prompt = ["Du föreslår hur en uppgift görs, när ingen metod finns för den. Du skriver ingenting själv.",
      `Uppgiften: «${h.label}».`, h.customer?.label ? `Kunden: ${h.customer.label}.` : "",
      plan?.deliverable_type?.label ? `Det som ska levereras: ${plan.deliverable_type.label}.` : "", plan?.due ? `Klar senast: ${plan.due}.` : "",
      "Föreslå 2–5 steg i ordning. Varje steg är det en person gör vid ett tillfälle och som ger ett resultat. Verbet först, högst 60 tecken, inga personnamn.",
      'Svara med ENBART JSON: {"steps":["<steg>", "..."]}'].filter(Boolean).join("\n");
    try {
      const r = await sample.json(prompt, { modelTier: "quick", signal: ctl.signal, onText: ({ text: t }) => { if (st.claude === c) { c.stream = String(t || "").slice(-80); renderKeep(); } } });
      if (st.claude !== c) return;
      const steps = (Array.isArray(r?.steps) ? r.steps : []).map((x) => String(x || "").replace(/\s+/g, " ").trim().slice(0, 120)).filter(Boolean).slice(0, 5);
      st.claude = steps.length ? { done: true } : { note: "Claude gav inga steg. Skriv dem själv, ett per rad." };
      if (steps.length) st.text = steps.join("\n");
    } catch (e) {
      if (st.claude !== c) return;
      if (e?.code === "not_granted") sample = null;
      st.claude = { note: e?.code === "cancelled" ? "Avbrutet." : `Claude svarade inte (${e?.message || e}). Skriv stegen själv, ett per rad.` };
    }
    render();
  }
  /** Gör den med några steg (◐): förhandsvisa det första på servern, lägg sedan in alla i ordning. */
  async function hlStepsGo(task) {
    const st = hlState(task), h = hlTask(task), me = S.data?.party;
    const lines = st.text.split("\n").map((x) => x.trim().slice(0, 120)).filter(Boolean).slice(0, 8);
    if (!lines.length) return;
    if (offline()) { say("Stegen kräver förhandsvisning och kan inte läggas in förrän dirigenten svarar. Texten står kvar.", null, true); render(); return; }
    const verb = `Lägg in ${lines.length} steg`;
    S.confirm = { loading: true, verb, text: "Prövar stegen …" }; render();
    const add = (label, after, confirmed) => call("write", { op: "task_lock", task, add_step: { after, label, ...(me?.id ? { who: me.id } : {}) }, ...(confirmed ? { confirmed: true } : {}) });
    try {
      const r = await add(lines[0], null, false);
      const end = /Klart (\d{4}-\d{2}-\d{2})[^.]*\./.exec(summaryText(r))?.[0] || "";
      S.confirm = { verb, text: `${lines.map((l) => `«${l}»`).join(", ")} läggs in i «${h.label}», i den ordningen och hos dig — bara i den här uppgiften, metoderna rörs inte.${end ? ` ${end.replace(/^Klart/, "Första steget klart")}` : ""}`,
        next: { tool: "write", args: {} }, run: async () => {
          let after = null; const added = [];
          for (const l of lines) { const w = await add(l, after, true); after = w?.step || after; added.push(w?.step); }
          say(`${lines.length} steg ligger nu i «${h.label}».`, added[0] ? { tool: "write", args: { op: "task_lock", task, add_step: { remove: added[0] }, confirmed: true } } : null);
          st.way = null; st.text = ""; st.claude = null; hlInvalidate(task);
        } };
    } catch (e) { S.confirm = null; say(`Kunde inte pröva stegen: ${e.message || e}. Inget lades in.`, null, true); }
    render();
  }
  /** Spara som metod (◐): stegen blir en metod för det uppgiften levererar; servern återanvänder först. */
  async function hlSave(task) {
    const plan = hlPlan(task), save = plan?.save_as_method;
    if (!save) return;
    const verb = "Spara som metod";
    S.confirm = { loading: true, verb, text: "Bygger metoden ur stegen …" }; render();
    const args = save.args;
    try {
      const r = await call(save.tool, args);
      if (r?.ok === false) { S.confirm = null; say(`${summaryText(r) || "Metoden går inte att spara än."} Be Claude i chatten göra klart den.`, null, true); render(); return; }
      S.confirm = { verb, text: summaryText(r) || "Stegen blir en metod.", next: hlNext(r, { tool: "write", args: { ...args, confirmed: true } }, verb), onDone: () => hlInvalidate(task) };
    } catch (e) { S.confirm = null; say(`Kunde inte bygga metoden: ${e.message || e}. Inget sparades.`, null, true); }
    render();
  }
  async function hlRunConfirm() {
    const c = S.confirm; if (!c?.run) return;
    S.confirm = { ...c, loading: true }; render();
    try { await c.run(); S.confirm = null; } catch (e) { S.confirm = null; say(`Allt kunde inte läggas in: ${e.message || e}. Det som hann läggas in står kvar.`, null, true); refreshSoon(); }
    render();
  }

  /* Flytta till leverans: en väljare bland kundens leveranser, eller en ny; ta ur går också. */
  function openMove(task) {
    const h = hlTask(task);
    S.menu = null; S.peek = null; S.pal = null;
    S.mv = { task, label: h.label, customer: h.customer, cur: h.cur, q: "", i: 0 };
    render();
    setTimeout(() => root.querySelector?.("#mv-q")?.focus?.(), 0);
  }
  function mvChoices() {
    const m = S.mv; if (!m) return [];
    const q = fold(m.q).trim();
    const own = (S.data?.rows || []).filter((r) => (r.kind === "delivery" || r.kind === "stream") && r.key !== m.cur?.key
      && (!m.customer?.id || r.customer?.id === m.customer.id) && (!q || fold(r.label).includes(q)));
    const out = own.slice(0, 8).map((r) => ({ ref: r.key, l: r.label, meta: r.due ? `leverans ${shortIso(r.due)}` : r.kind === "stream" ? "löpande" : "" }));
    if (m.q.trim() && !own.some((r) => fold(r.label) === q)) out.push({ ref: m.q.trim(), l: `Ny leverans «${m.q.trim()}»`, meta: "skapas" });
    if (m.cur) out.push({ ref: null, l: `Ta ur «${m.cur.label}»`, meta: "planeras för sig" });
    return out;
  }
  function mvHtml() {
    const m = S.mv; if (!m) return "";
    const list = mvChoices();
    if (m.i >= list.length) m.i = Math.max(0, list.length - 1);
    return `<div class="mv" role="dialog" aria-label="Flytta till leverans"><b>Flytta «${esc(m.label)}» till leverans</b>`
      + `<div class="mmeta">${m.customer?.label ? `${esc(m.customer.label)}s leveranser` : "Kundens leveranser"}${m.cur ? ` · ligger nu i «${esc(m.cur.label)}»` : ""}</div>`
      + `<input id="mv-q" placeholder="Sök, eller skriv namnet på en ny leverans" value="${esc(m.q)}" autocomplete="off" aria-label="Sök leverans">`
      + (list.map((c, i) => `<button class="mvi${i === m.i ? " on" : ""}" data-act="mv-pick" data-i="${i}"><span>${esc(c.l)}</span><span class="mmeta">${esc(c.meta)}</span></button>`).join("")
        || `<div class="mmeta">Kunden har ingen annan leverans. Skriv ett namn för en ny.</div>`)
      + `<div class="mmeta" style="margin-top:8px;display:flex;gap:12px"><span style="flex:1">↑↓ väljer · ↵ förhandsvisar · Esc stänger</span><button class="link" data-act="mv-close">Avbryt</button></div></div>`;
  }
  function mvKey(e, k, stop) {
    const n = mvChoices().length;
    if (k === "Escape") { stop(); S.mv = null; render(); return true; }
    if (k === "ArrowDown" || k === "ArrowUp") { stop(); S.mv.i = n ? (S.mv.i + (k === "ArrowDown" ? 1 : n - 1)) % n : 0; render(); return true; }
    if (k === "Enter") { stop(); const c = mvChoices()[S.mv.i]; if (c) mvPreview(S.mv.task, c.ref, S.mv.label); return true; }
    return false;
  }
  /** ◐: servern räknar leveransen med uppgiften i (eller ur) och säger vad som händer med datum och plan. */
  async function mvPreview(task, ref, label) {
    S.mv = null;
    if (offline()) { say("Att flytta till en leverans kräver förhandsvisning och kan inte göras förrän dirigenten svarar.", null, true); render(); return; }
    const verb = ref === null ? "Ta ur leveransen" : "Flytta till leveransen";
    S.confirm = { loading: true, verb, text: "Räknar leveransen …" }; render();
    const args = { task, values: { delivery: ref } };
    try {
      const r = await call("execute_step", args);
      if (r?.written === false && !r?.preview && !r?.next) { S.confirm = null; say(summaryText(r) || "Inget ändras."); render(); return; }
      S.confirm = { verb, text: summaryText(r) || `«${label}» flyttas.`, next: hlNext(r, { tool: "execute_step", args: { ...args, confirmed: true } }, verb), onDone: () => hlInvalidate(task) };
    } catch (e) { S.confirm = null; say(`Kunde inte räkna på flytten: ${e.message || e}. Inget ändrades.`, null, true); }
    render();
  }

  /** Menyn och ⌘K: flytta, ta ur, och de tre vägarna för en uppgift utan metod. */
  function hlMenu(t) {
    const task = t.kind === "case" ? t.task : t.kind === "row" && t.row?.tasks?.length === 1 && t.row.kind === "task" ? t.row.tasks[0] : null;
    if (!task) return [];
    const h = hlTask(task), out = [];
    if (h.homeless) {
      out.push({ id: "hl-method", l: "Ge den en metod …", lvl: "◐", run: () => hlOpen(task, "method") });
      out.push({ id: "hl-steps", l: "Gör den med några steg …", lvl: "◐", run: () => hlOpen(task, "steps") });
      out.push({ id: "hl-do", l: "Bara gör det", lvl: "●", run: () => hlJustDo(task) });
    }
    out.push({ id: "move", l: h.cur ? "Flytta till en annan leverans …" : "Flytta till leverans …", lvl: "◐", run: () => openMove(task) });
    if (h.cur) out.push({ id: "unmove", l: `Ta ur «${h.cur.label}»`, lvl: "◐", run: () => mvPreview(task, null, h.label) });
    return out;
  }
  /** Öppna uppgiften med en väg vald: raden fälls ut i översikten, eller delens ark öppnas. */
  function hlOpen(task, way) {
    const h = hlTask(task), st = hlState(task);
    st.way = way;
    if (h.row && h.row.kind === "task") { if (!S.sheets.length && S.body === "list") S.open = { ...S.open, [h.row.key]: true }; else openSheet("delivery", h.row.key, h.row.label); }
    else if (h.row) openPart(task, h.row.key, h.label);
    if (way === "steps" && !st.text && sample) hlAsk(task);
    render();
  }
  function hlPalette() {
    const out = [];
    for (const r of S.data?.rows || []) {
      if (r.kind === "task" && r.tasks.length === 1) {
        const task = r.tasks[0], where = r.customer?.label || "";
        if (r.no_method) {
          out.push({ id: "hl-method", l: `Ge «${r.label}» en metod`, where, lvl: "◐", hay: fold(`ge metod utan metod ${r.label} ${where}`), run: () => hlOpen(task, "method") });
          out.push({ id: "hl-steps", l: `Gör «${r.label}» med några steg`, where, lvl: "◐", hay: fold(`gor steg utan metod ${r.label} ${where}`), run: () => hlOpen(task, "steps") });
        }
        out.push({ id: "move", l: `Flytta «${r.label}» till leverans …`, where, lvl: "◐", hay: fold(`flytta leverans ${r.label} ${where}`), run: () => openMove(task) });
      }
      for (const c of r.cases || [])
        out.push({ id: "move", l: `Flytta «${c.title}» till en annan leverans …`, where: r.label, lvl: "◐", hay: fold(`flytta leverans ta ur ${c.title} ${r.label}`), run: () => openMove(c.task) });
    }
    return out;
  }
  function hlAct(act, el) {
    const task = el.getAttribute("data-task");
    if (act === "hl-way") hlWay(task, el.getAttribute("data-way"));
    else if (act === "hl-lock") hlLock(task, el.getAttribute("data-method"), el.getAttribute("data-label"));
    else if (act === "hl-ask") hlAsk(task);
    else if (act === "hl-steps-go") hlStepsGo(task);
    else if (act === "hl-save") hlSave(task);
    else if (act === "hl-build") { const fp = hlPlan(task)?.save_as_method?.args?.from_plan; if (fp) { newMethod({ ...fp, task, task_label: hlTask(task).label }); return; } }
    else if (act === "hl-move") openMove(task);
    else if (act === "hl-chat") copyToChat(`Arbeta med dirigenten: uppgiften «${hlTask(task).label}» (${task}) saknar metod. Sök i registret efter en metod som kan göra den (återanvänd först, också en metod för en annan leveranstyp), föreslå 1–3 med skäl, och visa förhandsvisningen från write { op: "task_lock", task: "${task}", method, reason } för den jag väljer. Lås inget utan mitt ja.`, "frågan till Claude");
    else if (act === "hl-chat-steps") copyToChat(`Arbeta med dirigenten: uppgiften «${hlTask(task).label}» (${task}) saknar metod. Föreslå 2–5 steg för just den här uppgiften, verbet först, och visa förhandsvisningen från write { op: "task_lock", task: "${task}", add_step } för det första. Lägg inte in något utan mitt ja.`, "frågan till Claude");
    else if (act === "mv-close") S.mv = null;
    else if (act === "mv-pick") { const c = mvChoices()[Number(el.getAttribute("data-i"))]; if (c && S.mv) { mvPreview(S.mv.task, c.ref, S.mv.label); return; } }
    render();
  }
  /** Dra en uppgift eller ett ärende till en leverans hos samma kund: samma förhandsvisning som menyn. */
  function hlDragStart(e) {
    const d = e.target.closest?.("[data-drag]"); if (!d) return;
    S.drag = { task: d.getAttribute("data-drag") };
    try { e.dataTransfer?.setData("text/plain", S.drag.task); if (e.dataTransfer) e.dataTransfer.effectAllowed = "move"; } catch { /* ingen överföring */ }
  }
  const hlDropRow = (e) => { const w = e.target.closest?.(".wrap[data-row]"), r = w && rowOf(w.getAttribute("data-row"));
    if (!S.drag || !r || (r.kind !== "delivery" && r.kind !== "stream")) return null;
    const h = hlTask(S.drag.task);
    return h.cur?.key === r.key || (h.customer?.id && r.customer?.id !== h.customer.id) ? null : { w, r }; };
  function hlDragOver(e) {
    for (const x of root.querySelectorAll?.(".wrap.dropok") || []) x.classList.remove("dropok");
    const t = hlDropRow(e); if (!t) return;
    e.preventDefault?.(); t.w.classList.add("dropok");
  }
  function hlDrop(e) {
    const t = hlDropRow(e), task = S.drag?.task; S.drag = null;
    for (const x of root.querySelectorAll?.(".wrap.dropok") || []) x.classList.remove("dropok");
    if (!t || !task) return;
    e.preventDefault?.(); mvPreview(task, t.r.key, hlTask(task).label);
  }

  /* ⌘K: samma handlingar som menyn, för allt som syns, plus att öppna en leverans. */
  const fold = (x) => String(x || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function paletteEntries() {
    const o = S.data;
    if (!o) return [];
    const out = [];
    out.push({ id: "order", l: "Ny beställning …", where: "skriv själv, mejltråd, möte eller chatten", key: "N", hay: fold("ny beställning order intag mejl möte lägg in"), run: () => openOrder() });
    const cur = targetOf(S.cur);
    if (cur) for (const it of menuItems(cur)) out.push({ ...it, where: cur.label, hay: fold(`${it.l} ${cur.label} ${cur.row?.label || ""}`), cur: true });
    for (const r of o.rows) {
      if (r.kind === "inbox") continue;
      out.push({ id: "open", l: `Öppna ${r.label}`, where: r.customer?.label || "", hay: fold(`öppna ${r.label} ${r.customer?.label || ""}`), run: () => openSheet("delivery", r.key, r.label) });
      for (const x of r.steps) {
        const st = stepOf(o, r, x);
        const t = targetOf(`step|${st.task}|${st.id}`);
        if (!t) continue;
        for (const it of menuItems(t)) if (it.id !== "open" && !(cur && cur.ctx === t.ctx))
          out.push({ ...it, l: /«/.test(it.l) ? it.l : `${it.l}: «${st.label}»`, where: r.label, hay: fold(`${it.l} ${st.label} ${r.label} ${r.customer?.label || ""}`) });
      }
    }
    out.push(...hlPalette(), ...mbPalette());
    return out;
  }
  function paletteResults() {
    const q = fold(S.pal?.q).split(/\s+/).filter(Boolean);
    const all = paletteEntries();
    if (!q.length) return all.filter((e) => e.cur || e.id === "open" || e.id === "order").slice(0, 10);
    return all.filter((e) => q.every((w) => e.hay.includes(w))).slice(0, 12);
  }
  function paletteHtml() {
    if (!S.pal) return "";
    const res = paletteResults();
    S.pal.res = res;
    if (S.pal.i >= res.length) S.pal.i = Math.max(0, res.length - 1);
    return `<div class="pal" role="listbox">${res.map((e, i) => `<button class="pi${i === S.pal.i ? " on" : ""}" data-act="pal-run" data-i="${i}" role="option">`
      + `<span class="pl1">${esc(e.l)}</span><span class="pw">${esc(e.where || "")}</span>${e.lvl ? `<span class="lvl${e.lvl === "●" ? " d" : ""}">${e.lvl}</span>` : ""}</button>`).join("")
      || `<div class="pe">Inget som heter så. Skriv om, eller be Claude i chatten.</div>`}<div class="pf">↑↓ väljer · ↵ gör · Esc stänger</div></div>`;
  }
  function openPalette() { S.menu = null; S.peek = null; S.pal = { q: "", i: 0, res: [] }; mbIndex(); render(); focusPalette(); }
  function focusPalette() { const inp = root.querySelector?.("#pal-q"); if (inp) { inp.focus?.(); const n = inp.value?.length || 0; inp.setSelectionRange?.(n, n); } }
  function runEntry(e) { if (!e) return; S.pal = null; S.menu = null; S.peek = null; e.run(); render(); }

  /** Tangenterna på det man pekar på: samma som i menyn. */
  function keyOnTarget(k) {
    const t = targetOf(S.cur);
    if (!t) return false;
    const it = menuItems(t).find((x) => x.key === k);
    if (!it) return false;
    it.run();
    return true;
  }

  /* ── whatIf: kopia av src/plan/what-if.ts, så som tsc skriver den (dist); test/v6-view.test.ts prövar att den är lika ── */
  const DAY_MS = 86_400_000;
  const isoOf = (ms) => new Date(ms).toISOString().slice(0, 10);
