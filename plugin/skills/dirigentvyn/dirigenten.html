:root {
  --bg: #ffffff; --bg-page: #fafafb; --bg-subtle: #f5f5f7; --bg-hover: #f2f2f5; --bg-selected: #edf6f6;
  --line: #ececf0; --line-strong: #dcdce3;
  --text: #18181d; --text-2: #62626e; --text-3: #6c6c78;
  --accent: #007e84; --accent-hover: #006a70; --accent-ink: #00666b; --accent-weak: #e3f2f2;
  --red: #c4312a; --red-weak: #fbecea; --amber: #8a5300; --amber-weak: #fbf1e1;
  --green: #2f7d4f; --green-weak: #e8f3ec; --blue: #2f62c4; --blue-weak: #eaf0fb;
  --gray: #8a8a94; --gray-weak: #f0f0f2; --claude: #6647b0; --claude-weak: #f3effb;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-page: 20px; --fs-section: 15px; --fs-row: 14px; --fs-body: 14px; --fs-meta: 12.5px; --fs-label: 11.5px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 48px;
  --r-sm: 9px; --r-lg: 14px; --r-pill: 999px; --h-control: 32px; --h-row: 44px;
  --shadow: 0 16px 40px -16px rgba(20, 20, 40, .28), 0 2px 8px rgba(20, 20, 40, .06);
  --shadow-card: 0 1px 2px rgba(20, 20, 40, .04), 0 2px 6px rgba(20, 20, 40, .04);
}
body[data-density="compact"] { --h-control: 28px; --h-row: 32px; --s4: 12px; --s5: 16px; --s6: 20px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg-page); color: var(--text); }
body { font: 400 var(--fs-body)/1.5 var(--font); font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased; word-spacing: .02em; }
button, input, select, textarea { font: inherit; color: inherit; }
/* Rutorna har egen bakgrund och text (Daniel P 2026-09-25: "flera inputrutor
   (jag tror alla med någon form av up-down-counter) svarta och texten är också
   svart"). Utan det tog webbläsarens mörka läge rutorna, men inte texten. */
:root { color-scheme: light; }
input, select, textarea { background-color: var(--bg); color: var(--text); color-scheme: light; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── skal ─────────────────────────────── */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr) 360px; height: 100vh; }
body.panel-closed .app { grid-template-columns: 216px minmax(0, 1fr) 0; }
body.rail-narrow .app { grid-template-columns: 60px minmax(0, 1fr) 360px; }
body.rail-narrow.panel-closed .app { grid-template-columns: 60px minmax(0, 1fr) 0; }
/* Menyn infälld (Daniel P 2026-09-25: "vore ju bra att kunna fälla in
   vänstermenyn så att bara ikonerna syns"): namnen syns som titel vid musen. */
body.rail-narrow .rail .nav .txt, body.rail-narrow .rail .brand, body.rail-narrow .rail .me .txt { display: none; }
body.rail-narrow .rail .nav { justify-content: center; padding: 8px 0; position: relative; }
body.rail-narrow .nav .count { position: absolute; top: 2px; right: 6px; margin: 0; font-size: 10px; }
body.rail-narrow .rail .me { justify-content: center; }

.row .t .cust { color: var(--text-2); font-weight: 400; }
.row .s { color: var(--text-2); font-size: var(--fs-meta); white-space: nowrap; }
.row .why { color: var(--text-2); font-size: var(--fs-meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Steget som tagg under arbetets rubrik (Daniel P 2026-09-25). */
.chip.steg { height: 18px; margin-right: 6px; background: transparent; border: 1px solid var(--line-strong); color: var(--text-2); font-size: 11.5px; vertical-align: 1px; }
.row .txt { min-width: 0; display: flex; flex-direction: column; }
/* Granskningen under ett förslag i Till dig: det som måste rättas, och det som liknar. */
.row .why .vet-problem, .row .why .vet-similar, .vet .vet-problem, .vet .vet-similar { display: block; white-space: normal; margin-top: 2px; }
.vet-problem { color: var(--red); } .vet-similar { color: var(--text-2); }
.row .when { text-align: right; }
.row .when.late { color: var(--red); }
.row .acts { display: flex; gap: 4px; align-items: center; }
.row.done { opacity: .55; }
.row.done .t { text-decoration: line-through; }
.empty { padding: var(--s6) var(--s4); color: var(--text-2); }
.empty b { color: var(--text); display: block; margin-bottom: 2px; font-weight: 500; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.stack { display: flex; flex-direction: column; gap: var(--s4); }
.mod.half { grid-column: span 1; } .mod.full { grid-column: 1 / -1; }

/* ── kedjan ──────────────────────────── */
.chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.chain .node { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 12.5px; white-space: nowrap; max-width: 220px; cursor: pointer; }
.chain .node span.l { overflow: hidden; text-overflow: ellipsis; }
.chain .node span.who { color: var(--text-3); font-size: 11.5px; flex-shrink: 0; }
.chain .node span.who.pending { color: var(--amber); }
.chain .node.done { color: var(--green); background: var(--green-weak); border-color: var(--green); }
.chain .node.done span.l { text-decoration: line-through; }
.chain .node .tick { width: 18px; height: 18px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--bg); color: var(--text-3); display: inline-grid; place-items: center; cursor: pointer; }
.chain .node .tick:hover { color: var(--green); border-color: var(--green); }
.chain .node .tick svg { width: 12px; height: 12px; }
.chain .node.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-weak); font-weight: 500; }
.chain .node.crit::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.chain .node.added { border-color: var(--green); background: var(--green-weak); }
.chain .node.removed { border-style: dashed; color: var(--text-3); text-decoration: line-through; }
.chain .node.changed { border-color: var(--amber); background: var(--amber-weak); }
/* Ett steg som bara finns i uppgiften, inte i metoden (Daniel P 2026-09-25). */
.chain .node.own { border-style: dashed; border-color: var(--accent); }
.chain .addstep { width: 20px; height: 20px; padding: 0; border: 1px dashed var(--line-strong); border-radius: 50%; background: var(--bg); color: var(--text-3); font-size: 13px; line-height: 1; cursor: pointer; }
.chain .addstep:hover { color: var(--accent); border-color: var(--accent); }
/* Paletten: dra in ett steg i uppgiften (Daniel P 2026-09-25). */
.stpal { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.stpal .grp { font-size: 12px; color: var(--text-2); margin: 12px 0 6px; font-weight: 600; }
.stpal .cards { display: flex; flex-wrap: wrap; gap: 8px; }
.stpal .palq { width: 100%; max-width: 360px; margin: 0 0 8px; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--text); }
.stcard { display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 8px 10px; max-width: 280px; cursor: grab; touch-action: none; user-select: none; }
.stcard:hover { border-color: var(--accent); }
.stcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stcard .l { font-weight: 500; }
.stcard .chip { align-self: flex-start; }
.stghost { position: fixed; pointer-events: none; z-index: 1000; opacity: .92; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.chain .addstep.drop-ok { border: 2px solid var(--green); color: var(--green); background: var(--green-weak); }
.chain .addstep.drop-warn { border: 2px solid var(--amber); color: var(--amber); background: var(--amber-weak); }
.chain .addstep.drop-no { border: 2px solid var(--line-strong); color: var(--text-3); opacity: .45; cursor: not-allowed; }
.chain .addstep.drop-hover, .chain .addstep.drop-kbd { transform: scale(1.35); box-shadow: 0 0 0 3px var(--accent-weak); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 767px) { .stcard { cursor: pointer; touch-action: auto; max-width: none; width: 100%; } }
.chain .arrow { color: var(--text-2); font-size: 11px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.dots i.done { background: var(--green); } .dots i.now { background: var(--accent); }
.progress { display: inline-flex; gap: 2px; } .progress i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); } .progress i.on { background: var(--green); }

/* ── spann och tidslinje ─────────────── */
.span { display: inline-flex; align-items: center; gap: 8px; }
.spanbar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.spanbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.tl { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: auto; }
.tl table { border-collapse: collapse; width: 100%; min-width: 760px; }
.tl th { font-weight: 500; font-size: 12px; color: var(--text-2); text-align: left; padding: 8px; border-bottom: 1px solid var(--line); background: var(--bg-subtle); position: sticky; top: 0; }
.tl td { border-bottom: 1px solid var(--line); padding: 0; height: 44px; }
.tl td.who { padding: 6px 12px; width: 240px; min-width: 200px; }
.tl .lane { position: relative; height: 44px; }
.tl .bar { position: absolute; top: 12px; height: 20px; border-radius: var(--r-pill); background: var(--accent-weak); border: 1px solid #b5dcdd; font-size: 11.5px; padding: 1px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.tl .bar.crit { background: var(--amber-weak); border-color: #eacd9b; }
/* Klart syns (Daniel P 2026-09-25): grön, bock och överstruket. */
.tl .bar.done { background: var(--green-weak); border-color: var(--green); color: var(--green); text-decoration: line-through; opacity: .8; }
.tl .bar .tick { width: 16px; height: 16px; margin: 0 4px 0 -4px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--bg); color: var(--text-3); display: inline-grid; place-items: center; vertical-align: -3px; cursor: pointer; }
.tl .bar .tick:hover { color: var(--green); border-color: var(--green); }
.tl .bar .tick svg, .tl .bar .ok svg { width: 11px; height: 11px; }
.tl .bar .ok { color: var(--green); margin-right: 3px; vertical-align: -1px; }
.tick.iconbtn:hover { color: var(--green); border-color: var(--green); }
.tl .bar.late { background: var(--red-weak); border-color: #efbdb8; }
.tl .todayline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--claude); opacity: .5; }

.teamgrid { display: grid; grid-template-columns: 160px repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.teamgrid > div { padding: 10px 12px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 52px; }
.teamgrid > div:nth-child(5n+1) { border-left: 0; }
.teamgrid .h { background: var(--bg-subtle); font-size: 12px; color: var(--text-2); min-height: 0; }
.load i.meet { background: var(--text-3); }
.load { display: flex; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
.load i { display: block; height: 100%; background: var(--accent); }
.load i.over { background: var(--red); }

/* ── arbetsyta ───────────────────────── */
.wshead { display: flex; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s4); }
.wshead .titles { min-width: 0; flex: 1; }
.wshead h1 { margin: 2px 0 6px; }
.wshead .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--text-2); font-size: var(--fs-meta); }
.ws2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: var(--s4); margin: var(--s4) 0; }
.section { padding: var(--s4); }
.section h2 { margin-bottom: var(--s2); display: flex; align-items: center; gap: 8px; }
.section h2 .right { margin-left: auto; }
.need { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.need:first-of-type { border-top: 0; }
.need .ok { color: var(--green); } .need .no { color: var(--text-3); }
.need .t { flex: 1; min-width: 0; }
ol.how { margin: 0; padding-left: 20px; } ol.how li { padding: 3px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; } .check input { margin-top: 3px; }
.doarea { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.running { display: flex; align-items: center; gap: 10px; font-size: var(--fs-meta); color: var(--text-2); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--claude); animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.draft { border: 1px solid #e2d9f5; border-left: 3px solid var(--claude); border-radius: 12px; padding: var(--s3) var(--s4); background: var(--bg); }
.draft .from { color: var(--claude); font-size: 12px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
.draft pre { white-space: pre-wrap; font: inherit; margin: 8px 0; }
.bar-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.bar-actions .right { margin-left: auto; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: var(--s4); overflow-x: auto; scrollbar-width: none; }
.tabs button { white-space: nowrap; }
.tabs button { border: 0; background: none; padding: 8px 10px; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .n { color: var(--text-2); font-weight: 400; margin-left: 4px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: var(--fs-label); font-weight: 500; color: var(--text-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 10px; background: var(--bg); color: var(--text); min-height: var(--h-control); }
.field textarea { resize: vertical; min-height: 72px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.fields .wide { grid-column: 1 / -1; }

/* ── förslag, förhandsvisning, dialog ─── */
.suggest { border: 1px solid #e2d9f5; border-left: 3px solid var(--claude); border-radius: 12px; padding: var(--s3) var(--s4); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.suggest .from { color: var(--claude); font-size: 12px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
.suggest .from .why { margin-left: auto; color: var(--text-3); font-weight: 400; }
.preview { border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); background: var(--bg); }
.preview .row2 { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.preview .row2 > span:first-child { color: var(--text-2); font-size: var(--fs-meta); }
.overlay { position: fixed; inset: 0; background: rgba(20, 20, 30, .28); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 50; }
.dialog { background: var(--bg); border-radius: 18px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 84vh; overflow: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
.dialog h2 { font-size: 16px; }
.radio { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent); background: var(--bg-selected); }
.radio input { margin-top: 3px; }
.radio .d { color: var(--text-2); font-size: var(--fs-meta); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 16px; border-radius: var(--r-pill); display: flex; gap: 14px; align-items: center; z-index: 60; box-shadow: var(--shadow); font-size: 13.5px; }
.toast button { border: 0; background: none; color: #9fdcdf; font-weight: 600; }
.palette { width: min(560px, 100%); padding: 0; gap: 0; }
.palette input { border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 15px; outline: none; }
.palette .item { display: flex; gap: 10px; align-items: center; padding: 9px 16px; cursor: pointer; }
.palette .item:hover, .palette .item.sel { background: var(--bg-hover); }
.palette .item .meta { margin-left: auto; }
.palette .grp { padding: 8px 16px 4px; font-size: 11.5px; color: var(--text-3); font-weight: 500; }

/* ── panelen ─────────────────────────── */
.panel { border-left: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
body.panel-closed .panel { display: none; }
.panel .phead { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 var(--s4); border-bottom: 1px solid var(--line); }
.panel .phead b { color: var(--claude); font-weight: 600; }
.panel .phead .right { margin-left: auto; display: flex; gap: 4px; }
.pbody { flex: 1; overflow: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.here { font-size: var(--fs-meta); color: var(--text-2); background: var(--bg-subtle); border: 0; border-radius: var(--r-sm); padding: 8px 10px; }
.here b { color: var(--text); font-weight: 500; }
.cans { display: flex; flex-wrap: wrap; gap: 6px; }
.can { border: 1px solid #ddd3f3; background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.can:hover { border-color: var(--claude); }
.can .tier { color: var(--text-2); font-size: 11px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-self: flex-end; background: var(--accent-weak); border: 0; border-radius: 14px 14px 4px 14px; padding: 8px 11px; max-width: 90%; }
.msg.ai { font-size: 13.5px; }
.md { line-height: 1.5; overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md h4 { font-size: 13.5px; font-weight: 600; margin: 12px 0 4px; }
.md h4:first-child { margin-top: 0; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg-subtle); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md strong { font-weight: 600; }
.msg.ai .who { color: var(--claude); font-size: 12px; font-weight: 500; }
.msg.ai .foot { display: flex; gap: 4px; }
.rate { display: flex; gap: 6px; align-items: center; }
.rate .iconbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.rate .down svg { transform: rotate(180deg); }
.rate-why { display: flex; gap: 6px; }
.rate-why input { flex: 1; min-width: 0; font: inherit; font-size: 13px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 4px 8px; background: var(--bg); color: var(--text); }
.pactivity { border-top: 1px solid var(--line); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-meta); }
.usage { display: flex; gap: 8px; align-items: center; color: var(--text-2); }
.usage .load { width: 80px; margin: 0; }
.composer { padding: var(--s3) var(--s4) var(--s4); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.composer textarea { border: 1px solid var(--line-strong); border-radius: 16px; padding: 9px 11px; resize: none; min-height: 60px; background: var(--bg); }
.composer .opts { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); }
.composer .opts .right { margin-left: auto; display: flex; gap: 6px; }

.proto-note { font-size: 12px; color: var(--text-3); border-top: 1px dashed var(--line); margin-top: var(--s6); padding-top: var(--s3); }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--s4); }
.stepper span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--bg-subtle); color: var(--text-2); }
.stepper span.on { background: var(--accent-weak); color: var(--accent-ink); font-weight: 600; }
.stepper span.done { color: var(--green); }
.improve { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.improve .card { padding: var(--s4); display: flex; flex-direction: column; gap: 6px; }
.improve .gain { font-size: 18px; font-weight: 600; }

@media (max-width: 1200px) {
  .app, body.rail-narrow .app { grid-template-columns: 60px minmax(0, 1fr); }
  .rail .nav .txt, .rail .brand small, .rail .me .txt, .nav .count { display: none; }
  .rail .railtoggle { display: none; }
  .panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(380px, 92vw); z-index: 40; box-shadow: var(--shadow); }
  body:not(.panel-open) .panel { display: none; }
  .ws2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app, body.rail-narrow .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; bottom: 0; left: 0; right: 0; flex-direction: row; justify-content: space-around; padding: 4px; border-right: 0; border-top: 1px solid var(--line); z-index: 30; }
  /* Initialerna står kvar i raden: annars når man inte Inställningar på telefonen (B-218). */
  .rail .brand, .rail .spacer { display: none; }
  main { padding-bottom: 60px; }
  .page { padding: var(--s4) var(--s4) var(--s8); }
  .top { padding: 0 var(--s4); } .kbd { min-width: 0; } .kbd span { display: none; } .top .seg, .top .fresh, #font-pick { display: none; }
  .grid2, .fields, .improve { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; }
  .row .when, .row .kindcell { display: none; }
  .panel { width: 100vw; top: auto; height: 80vh; border-radius: 14px 14px 0 0; }
}

/* Tidslinjens steg går att dra (B-215): framåt senareläggs, bakåt flyttas det tidigare. */
.lane .sbar { cursor: grab; touch-action: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.lane .sbar.dragging { cursor: grabbing; opacity: .85; z-index: 3; }
.lane .dueline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .6; }
.lane .sbar.done { cursor: pointer; opacity: .45; }
/* Spannet i tidslinjen: från–till, stegvis bakåt och framåt, och zoom. */
.tlspan { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.tlspan input[type="date"] { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--text); }
/* Materialet steget behöver från stegen före står överst på steget. */
.needed { border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 12px; }
.need[aria-selected="true"] { background: var(--bg-selected); border-radius: var(--r-sm); }

/* Inställningar (B-218). Fälten ärver .field, som sätter textfärgen — ett
   klockslag som står i samma färg som botten ser tomt ut (B-177). */
.setrow { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-top: 1px solid var(--line); }
.setrow:first-child { border-top: 0; }
.setrow .txt { flex: 1; min-width: 0; }
.setrow .t { font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.setrow .acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
@media (max-width: 760px) { .setrow { flex-direction: column; gap: var(--s2); } }
.setrow ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); font-size: var(--fs-meta); }
.setchecks { display: flex; flex-wrap: wrap; gap: 2px 18px; margin: 4px 0 var(--s3); }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, .18); vertical-align: -1px; margin-right: 4px; }
.warnnote { color: var(--amber); font-size: var(--fs-meta); margin-top: 4px; }
a.btn { text-decoration: none; color: var(--text); }
.settime { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: flex-end; }
.settime .field { min-width: 150px; }
.setbar { position: sticky; bottom: 0; background: var(--bg-page); padding: var(--s3) 0; margin-top: var(--s4); border-top: 1px solid var(--line); }

/* Filer (B-217): mappar, rutnätet med förhandsbilder, och där en fil kan släppas. */
.fsearch { border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 10px; height: var(--h-control); background: var(--bg); color: var(--text); min-width: 220px; font: inherit; }
.fpath { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: calc(-1 * var(--s3)) 0 var(--s4); font-size: var(--fs-meta); color: var(--text-2); }
.fpath .i { width: 12px; height: 12px; color: var(--text-3); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--s3); padding: var(--s4); }
.fgrid + .row { border-top: 1px solid var(--line); }
.fcard { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fcard .ph { aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-subtle); display: grid; place-items: center; overflow: hidden; color: var(--text-3); }
.fcard .ph img { width: 100%; height: 100%; object-fit: contain; }
.fcard .t { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .btn { align-self: flex-start; }
.row.frow { cursor: default; }
.row.frow:hover { background: none; }
.fcards + .fcards { margin-top: var(--s4); }
[data-fdrop].fdrop-on, [data-lvdrop].fdrop-on { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-weak); }
.flink { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 10px; font: inherit; color: var(--text-2); background: var(--bg-subtle); margin-bottom: var(--s3); }
@media (max-width: 760px) { .fsearch { min-width: 0; width: 100%; } }

<script>
(() => {
  /* Vilken version sidan är. Stämplas av `npm run bundle` ur git, samtidigt
     som servern — skriv inte raden för hand. Servern svarar med sin version i
     plan_state (views.version), och skiljer de sig säger sidan det: en gammal
     publicering fungerar ofta ändå, men saknar det som byggts sedan dess. */
  const SIDA = { version: "a526378", published: "2026-09-25" };
  /*
   * Datalagret (B-210). Prototypen läste window.DATA, en tillplattad
   * ögonblicksbild. Vyn läser serverns egna svar: plan_state med agendan,
   * library_search och posten. Ingenting räknas om här som servern redan
   * räknat — agendan, belastningen och vilket steg en fråga stoppar kommer
   * därifrån (docs/view-design.md 14.1).
   *
   * Verktygen sidan anropar hos dirigenten. Den som lägger ut vyn måste ha
   * exakt de här i artefaktens manifest — ett verktyg som saknas där går inte
   * att anropa, utan att det syns var felet sitter (B-164):
   * plan_state, intake_status, intake_submit, guide, library_search,
   * classify_accept, execute_step, method_variant_build, asset_register,
   * asset_get (Filer, B-217).
   * Förmågorna: mcp, sample, downloads (Filer sparar en fil direkt).
   */
  const SERVER = "rotor-dirigenten";
  let mcp = null;
  /*
   * Vyn på dirigentens egen adress (/vy). I Cowork, och för den som inte äger
   * artefakten, finns ingen koppling. Samma fil serveras då på dirigentens
   * adress, och anropen går direkt till /mcp med inloggningens cookie. Svaret
   * blir samma form som mcp.callTool ger, så resten av vyn märker ingen
   * skillnad. Claude i panelen och HubSpot finns bara i claude.ai.
   */
  const WEB = { on: false, loginUrl: "/vy/login", logoutUrl: "/vy/logout" };
  function webMcp(fetchFn) {
    let seq = 0;
    const rpc = async (method, params) => {
      let res;
      try {
        res = await fetchFn("/mcp", { method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-Rotor-View": "1" },
          body: JSON.stringify({ jsonrpc: "2.0", id: ++seq, method, params }) });
      } catch (e) { throw Object.assign(new Error(`dirigenten svarar inte: ${e?.message || e}`), { code: "NETWORK" }); }
      let body = null;
      try { body = await res.json(); } catch { /* inte JSON */ }
      if (res.status === 401) throw Object.assign(new Error("Du är inte inloggad, eller så har inloggningen gått ut."), { code: "NO_SESSION" });
      if (body?.error) throw Object.assign(new Error(body.error.message || `fel ${body.error.code}`), { code: res.status === 403 ? "FORBIDDEN" : "RPC_ERROR" });
      if (!res.ok) throw Object.assign(new Error(`dirigenten svarade ${res.status}`), { code: `HTTP_${res.status}` });
      return body?.result;
    };
    return {
      web: true,
      callTool: (server, tool, input) => server !== SERVER
        ? Promise.reject(Object.assign(new Error(`${server} går bara att nå när vyn är öppen i claude.ai. Här finns bara dirigenten.`), { code: "NOT_CONNECTED" }))
        : rpc("tools/call", { name: tool, arguments: input || {} }),
    };
  }
  /** Vägen anropen tar: claude.ai-kopplingen som förut, annars dirigentens egen adress, annars ingen. */
  async function pickMcp(env) {
    if (env.claude?.use) return { mcp: await env.claude.use("mcp"), web: false };
    const origin = env.document?.querySelector?.('meta[name="rotor-web-origin"]')?.getAttribute("content");
    if (origin && origin === env.location?.origin) return { mcp: webMcp(env.fetch), web: true };
    return { mcp: null, web: false };
  }
  const noClaude = () => WEB.on
    ? "Claude i panelen finns bara när vyn är öppen i claude.ai. Kopiera till chatten tar med det till vanliga Claude-chatten."
    : "Claude är inte tillgänglig i den här vyn.";
  const S = { plan: null, agenda: null, meetings: {}, lib: null, error: null, fetchedAt: null, at: {} };
  const data = (r) => { const p = r && (r.payload ?? r); if (p?.structuredContent) return p.structuredContent;
    if (Array.isArray(p?.content)) { try { return JSON.parse(p.content[0].text); } catch { /* inte JSON */ } } return p; };
  /**
   * Det en felrapport tar med sig (B-221): de senaste anropen (verktyg, vilka
   * fält, felkod — aldrig innehållet) och de senaste felen vyn visat.
   */
  const RECENT = { calls: [], errors: [], loadedAt: new Date().toISOString() };
  const noteError = (text) => { RECENT.errors.push({ at: new Date().toISOString(), text: String(text).slice(0, 500) }); if (RECENT.errors.length > 10) RECENT.errors.shift(); };
  window.addEventListener("error", (e) => noteError(`${e.message} (${e.filename?.split("/").pop() || "vyn"}:${e.lineno})`));
  window.addEventListener("unhandledrejection", (e) => noteError(`ohanterat: ${e.reason?.message || e.reason}`));
  const call = (tool, input) => callOn(SERVER, tool, input);
  /** Ett anrop till en koppling. Dirigenten är förvalet; Claude läser också ur HubSpot (B-229). */
  async function callOn(server, tool, input) {
    if (!mcp) throw Object.assign(new Error(`anslutningen ${server} är inte tillgänglig här — öppna vyn i claude.ai med kopplingen på`), { code: "NOT_CONNECTED" });
    let r;
    const rec = { at: new Date().toISOString(), tool: server === SERVER ? tool : `${server}/${tool}`, keys: Object.keys(input || {}) };
    RECENT.calls.push(rec); if (RECENT.calls.length > 15) RECENT.calls.shift();
    try { r = await mcp.callTool(server, tool, input); }
    catch (e) { const f = data(e?.result)?.error; rec.error = f?.code || e?.code || String(e?.message || e).slice(0, 200); throw f ? Object.assign(new Error(f.message + (f.next_action ? " — " + f.next_action : "")), { code: f.code }) : e; }
    const d = data(r);
    if (d?.error?.message) { rec.error = d.error.code || "fel"; throw Object.assign(new Error(d.error.message + (d.error.next_action ? " — " + d.error.next_action : "")), { code: d.error.code, context: d.error.context }); }
    return d;
  }
  /**
   * Hämtningen, ett anrop i taget och med läget utskrivet (B-213).
   *
   * Första versionen hämtade planen och biblioteket samtidigt och visade bara
   * "Hämtar…" tills båda kommit. Daniel P såg ingenting alls: frågar sidan om
   * lov för kopplingen, eller svarar ett anrop aldrig, står den still utan att
   * säga varför. Nu hämtas planen först — det är den Idag behöver — och varje
   * steg står på skärmen, med en gräns för hur länge det får ta.
   */
  const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, bad) =>
    setTimeout(() => bad(new Error(`${what} svarade inte på ${ms / 1000} s — godkänn kopplingen om sidan frågar, och tryck Hämta igen`)), ms))]);
  /** Posten (intake_status queue). Hämtas efter planen och när In öppnas. */
  async function loadQueue() {
    try { const d = await withTimeout(call("intake_status", { queue: true, days: 60 }), 45000, "Posten");
      S.queue = d?.queue ?? null; S.queueError = null; S.at.queue = Date.now(); }
    catch (e) { S.queueError = e; }
    render();
  }
  /** Leveranstyperna ett ärende kan bli: guide, annars det metoderna levererar. */
  async function deliverableTypes() {
    if (S.types) return S.types;
    try { const d = await call("guide", {});
      S.types = (d?.guide?.topics || []).filter((t) => t.kind === "deliverable").map((t) => ({ id: t.key, label: t.label })); }
    catch { S.types = []; }
    if (!S.types.length) S.types = [...new Map((S.lib?.entries || []).filter((e) => e.kind === "method")
      .flatMap((m) => (m.output || []).map((o) => [o, { id: o, label: o }]))).values()];
    return S.types;
  }
  /** Kunderna och personerna, ur planen: de som har arbete hos oss. */
  const customerList = () => [...new Map(tasks().filter((t) => t.customer?.id).map((t) => [t.customer.id, t.customer])).values()];
  const peopleList = () => [...new Map(tasks().flatMap((t) => t.steps).filter((st) => st.responsible?.id).map((st) => [st.responsible.id, st.responsible])).values()];

  /** Biblioteket med alla sorter — bara när något behöver det, inte vid varje återkomst. */
  function loadLib() {
    if (S.libLoading || !mcp) return;
    S.libLoading = true;
    withTimeout(call("search", { do: "browse", include: ["call", "operation", "atom_proposal", "method", "method_variant", "step"] }), 45000, "Biblioteket")
      // Metoder ritas om när biblioteket kommit; andra ytor behöver det inte
      // och ritas inte om medan någon skriver där.
      .then((lib) => { S.lib = lib; S.libError = null; S.at.lib = Date.now(); }).catch((e) => { S.libError = e; })
      .finally(() => { S.libLoading = false; if (state.screen === "metoder") render(); });
  }
  async function load() {
    try {
      if (!mcp) throw new Error(`anslutningen ${SERVER} är inte tillgänglig här — öppna sidan i claude.ai med kopplingen påslagen`);
      // Två anrop: plan_state med agenda svarar BARA med agendan, inte med
      // planen. Första versionen läste båda ur samma svar, fick ingen plan och
      // stod på "Hämtar" för evigt — och den lokala stubben dolde det, för den
      // svarade med båda i ett (B-213).
      S.phase = "Hämtar din lista…"; render();
      // Hur långt fram listan räcker (Daniel P 2026-09-25): 1 = resten av veckan, 0 = allt.
      const a = await withTimeout(call("plan_state", { agenda: true, weeks: aheadWeeks() }), 45000, "Listan");
      if (!a?.agenda) throw new Error("servern skickade ingen agenda — den kan vara en äldre version");
      S.agenda = a.agenda; S.at.agenda = Date.now();
      S.phase = "Hämtar planen…"; render();
      const p = await withTimeout(call("plan_state", { weeks: state.horizon }), 45000, "Planen");
      if (!p?.plan) throw new Error("servern skickade ingen plan");
      S.plan = p.plan; S.meetings = p.meetings ?? {}; S.error = null;
      S.serverVersion = p.views?.version ?? null;
      S.fetchedAt = new Date(); S.phase = null; S.at.plan = Date.now();
      render();
      // Resten behövs inte för Idag och får inte hålla den. Biblioteket med
      // alla sorter: utan include ger library_search bara atomer och molekyler.
      loadQueue();
      loadLib();
    } catch (e) { S.error = e; S.phase = null; render(); }
  }

  /**
   * Var sort sin livslängd (Daniel P 2026-09-25: "kan vi inte ha en smartare
   * cachning - vissa saker kanske behöver uppdateras oftare, vissa mer
   * sällan"). Listan med meddelanden oftast, planen och biblioteket sällan.
   * Det man själv ändrar hämtas som förut direkt efteråt (load).
   */
  const TTL = { agenda: 60_000, queue: 180_000, plan: 600_000, lib: 1_800_000, settings: 3_600_000 };
  const stale = (k) => !S.at[k] || Date.now() - S.at[k] > TTL[k];
  async function refreshAgenda() {
    try { const a = await withTimeout(call("plan_state", { agenda: true, weeks: aheadWeeks() }), 45000, "Listan");
      if (a?.agenda) { S.agenda = a.agenda; S.at.agenda = Date.now(); render(); } } catch { /* det gamla står kvar */ }
  }
  async function refreshPlan() {
    try { const p = await withTimeout(call("plan_state", { weeks: state.horizon }), 45000, "Planen");
      if (p?.plan) { S.plan = p.plan; S.meetings = p.meetings ?? {}; S.serverVersion = p.views?.version ?? null;
        S.fetchedAt = new Date(); S.at.plan = Date.now(); render(); } } catch { /* det gamla står kvar */ }
  }
  /** Bara det som blivit gammalt hämtas; resten står kvar. */
  function refreshStale() {
    if (!mcp || S.phase || document.visibilityState !== "visible") return;
    if (!S.plan) return load();
    if (stale("agenda")) refreshAgenda();
    if (stale("plan")) refreshPlan();
    if (stale("queue")) loadQueue();
    if (state.screen === "metoder" && stale("lib")) loadLib();
    if (stale("settings")) loadSettings();
  }
  setInterval(refreshStale, 60_000);
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const SP = `<svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'/><path d='M19 16v4M17 18h4'/></svg>`;

'm13 6 6 6-6 6'/>", "link": "<path d='M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1'/><path d='M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'/>", "upload": "<path d='M12 16V4'/><path d='m7 9 5-5 5 5'/><path d='M4 20h16'/>", "stop": "<circle cx='12' cy='12' r='9'/><path d='M9 9h6v6H9z'/>", "up": "<path d='m6 15 6-6 6 6'/>", "down": "<path d='m6 9 6 6 6-6'/>", "plus": "<path d='M12 5v14M5 12h14'/>", "trash": "<path d='M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13'/>", "history": "<path d='M3 12a9 9 0 1 0 3-6.7L3 8'/><path d='M3 3v5h5M12 7v5l3 2'/>", "panel": "<rect x='3' y='4' width='18' height='16' rx='2'/><path d='M15 4v16'/>", "thumb": "<path d='M7 10v11'/><path d='M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z'/>"};
  const ic = (n) => `<svg class='i' viewBox='0 0 24 24' aria-hidden='true'>${ICON[n] || ''}</svg>`;
  const TODAY = new Date().toISOString().slice(0, 10);
  const DAY = 864e5;
  const d = (s) => new Date(String(s).slice(0, 10) + "T00:00:00Z");
  const iso = (x) => x.toISOString().slice(0, 10);
  const add = (s, n) => iso(new Date(d(s).getTime() + n * DAY));
  const diff = (a, b) => Math.round((d(a) - d(b)) / DAY);
  const MON = ["jan", "feb", "mars", "apr", "maj", "juni", "juli", "aug", "sep", "okt", "nov", "dec"];
  const WD = ["sön", "mån", "tis", "ons", "tors", "fre", "lör"];
  const short = (s) => s ? `${d(s).getUTCDate()} ${MON[d(s).getUTCMonth()]}` : "–";
  const wday = (s) => `${WD[d(s).getUTCDay()]} ${short(s)}`;
  const week = (s) => { const t = d(s); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / DAY + 1) / 7); };
  const monday = (s) => add(s, -((d(s).getUTCDay() + 6) % 7));
  const KIND = { code: ["code", "kod"], llm: ["sparkles", "Claude"], human: ["user", "en människa"], mixed: ["users", "kod och människa"], ext: ["building", "kunden eller någon utanför Rotor"] };
  const kindMark = (k) => { const x = KIND[k] || KIND.human; return `<span class="kind ${k || "human"}" title="Görs av ${x[1]}" aria-label="Görs av ${x[1]}">${ic(x[0])}</span>`; };
  const ORIGIN = { decided: "beslutad", measured: "mätt", derived: "uträknad", guessed: "gissad" };
  const originMark = (k) => `<span class="origin ${k}" title="Talet är ${ORIGIN[k]}"><i></i>${ORIGIN[k]}</span>`;
  const custDot = (c) => `<span class="dot" style="background:${esc(c || "#999")}"></span>`;
  let state = { screen: "idag", obj: null, filter: "all", planMode: "tidslinje", horizon: 4, tlFrom: null, tlWeeks: 4, inTab: "bedoma", metTab: "bibliotek" };
  let density = "airy";
  const store = (() => { try { return JSON.parse(localStorage.getItem("proto-dirigenten") || "{}"); } catch { return {}; } })();
  const save = () => { try { localStorage.setItem("proto-dirigenten", JSON.stringify(store)); } catch { /* privat läge */ } };

  /* ── rubrikregeln (avsnitt 6.4) ── */
  const VERBS = ["Skicka", "Skriv", "Frilägg", "Bestäm", "Godkänn", "Svara", "Ring", "Beställ", "Uppdatera", "Kontrollera", "Publicera", "Granska", "Planera", "Boka", "Lägg", "Ladda", "Hämta", "Rätta", "Bygg", "Läs", "Skapa", "Skala", "Avgör", "Välj", "Rendera", "Spara", "Samla", "Förbered", "Ta", "Utred", "Sammanfatta", "Hitta", "Klona", "Ändra", "Exportera", "Sätt", "Markera", "Kör", "Presentera", "Testa", "Rensa", "Mappa", "Generera", "Fyll", "Kopiera", "Registrera", "Aktivera", "Utbilda", "Lansera", "Besluta", "Inventera", "Färdigställa", "Begär", "Kunden", "Piia", "Planeringsmöte:"];
  const hasVerb = (label) => VERBS.some((v) => String(label).startsWith(v));
  /** Frågans rubrik: agendans när den finns (servern sätter den), annars frågan ordagrant. */
  const headlineForOpen = (o) => (S.agenda?.items || []).find((x) => x.open === o.id)?.headline
    || (o.question ? `“${o.question}”` : lbl(o.what, o.about));
  /** Frågans sammanhang: uppgiften och steget den stoppar (servern ger `step`, B-190). */
  const qCtx = (o) => { const t = taskById(o.task); return { t, stop: stepOf(t, o.step) }; };
  const deliv = (t) => taskName(t);
  /* ── Metoder: biblioteket, ledtiderna och ett utkast till nästa version (B-216) ──
     Allt läses ur serverns svar: library_search (metoder, steg, molekyler,
     kundflöden, atomförslag), measure_debt (ledtiderna med ursprung) och
     planen (stegen som används, med ansvarig, recept och instruktion).
     Prototypen läste D.methods och D.stepKinds och förstod några fasta
     formuleringar; nu föreslår Claude, och registry_define skriver. */
  const libEntries = (kind) => (S.lib?.entries || []).filter((e) => e.kind === kind);
  const libById = (id) => (S.lib?.entries || []).find((e) => e.id === id) ?? null;
  const methodById = (id) => libEntries("method").find((m) => m.id === id) ?? null;
  const stepIds = (m) => (m?.parts || []).map((p) => p.id);
  /** Steget som planen har det: ansvarig, recept och instruktion finns bara där. */
  const stepInfo = (id) => { for (const t of tasks()) { const s = t.steps.find((x) => x.step === id); if (s) return s; } return null; };
  /**
   * Vem som gör steget: planens `performer_kind` när steget används, annars
   * molekylernas `performer` i biblioteket — samma källa servern läser.
   */
  const stepKind = (id) => {
    const p = stepInfo(id); if (p) return kindOf(p);
    const op = libById(libById(id)?.parts?.[0]?.id);
    const kinds = new Set((op?.parts || []).map((c) => libById(c.id)?.performer).filter(Boolean));
    return !kinds.size ? "human" : kinds.size > 1 ? "mixed" : [...kinds][0];
  };
  /** Obyggda atomförslag steget vilar på (B-107): där stannar metoden. */
  const stepBlockers = (id) => (libById(libById(id)?.parts?.[0]?.id)?.parts || []).map((c) => libById(c.id)).filter((e) => e?.kind === "atom_proposal" && e.unbuilt);
  const sharedWith = (id, m) => libEntries("method").filter((x) => x.id !== m.id && stepIds(x).includes(id));
  const methodTasks = (m) => tasks().filter((t) => t.method === m.id);
  const methodVariants = (m) => libEntries("method_variant").filter((v) => v.input?.[0] === m.id);
  const typeLabel = (id) => (S.types || []).find((x) => x.id === id)?.label || "";
  const custLabel = (id) => customerList().find((c) => c.id === id)?.label || "";
  /** Ledtiden med ursprung, ur measure_debt (B-178, B-185). */
  const leadOf = (id) => (S.lead?.rows || []).find((r) => r.step === id) ?? null;
  const ORIGIN_OF = { inferred: "derived" };      // servern säger inferred, vyn skriver uträknad
  async function loadLeadTimes() {
    S.lead = { ...(S.lead || {}), loading: true };
    try { const d = await withTimeout(call("library_check", { do: "measure" }), 45000, "Ledtiderna");
      S.lead = { rows: d?.lead_times || [], at: new Date() }; }
    catch (e) { S.lead = { rows: S.lead?.rows || null, error: e }; }
    if (state.screen === "metoder") render();
  }
  const ensureLeadTimes = () => { if (!S.lead) loadLeadTimes(); };
  const ensureLib = () => { if (!S.lib && !S.libError) return;
    if (!S.lib) { S.libError = null; withTimeout(call("search", { do: "browse", include: ["call", "operation", "atom_proposal", "method", "method_variant", "step"] }), 45000, "Biblioteket")
      .then((lib) => { S.lib = lib; }).catch((e) => { S.libError = e; }).finally(() => render()); } };

  /** Det som går att ändra på ett steg, som det står i dag. */
  /**
   * Husets instruktion på molekylen, ur biblioteket. Planens `instruktion` kan
   * vara kundens (B-114) — den får aldrig skrivas tillbaka som husets.
   */
  const houseInstruktion = (p) => { const e = libById(p?.instruktion?.molecule?.id);
    return e?.instruction?.form === "sex_falt" ? e.instruction.value : null; };
  const howTarget = (p) => houseInstruktion(p) ? p.instruktion.molecule.id : p?.recipe?.molecule?.id || p?.recipe_target?.id || null;
  const howNow = (p) => houseInstruktion(p)?.saa_goer_du?.length ? houseInstruktion(p).saa_goer_du.join("\n")
    : lines(p?.recipe?.how).join("\n");
  function startEdit(m) {
    return { steps: stepIds(m).map((id, i) => {
      const e = libById(id), p = stepInfo(id), lt = leadOf(id);
      const now = { label: e?.label || p?.label || "Steg", who: p?.responsible?.id || "", lead: lt ? lt.days : null, how: howNow(p) };
      return { id, ...now, orig: now, origIndex: i, kind: stepKind(id), leadOrigin: lt?.origin || null, added: false, removed: false, moved: false };
    }), sel: 0, desc: "", proposal: null, pick: null };
  }
  const FIELD_CHANGED = (x) => ["label", "who", "lead", "how"].some((k) => String(x[k] ?? "").trim() !== String(x.orig?.[k] ?? "").trim());
  const editStatus = (x) => x.added ? "added" : x.removed ? "removed" : FIELD_CHANGED(x) ? "changed" : x.moved ? "moved" : "";
  const editChanges = (ed) => ed.steps.filter((x) => editStatus(x));
  const STATUS_TXT = { added: ["green", "tillagt"], changed: ["amber", "ändrat"], removed: ["", "tas bort"], moved: ["", "flyttat"] };
  const personLabel = (id) => peopleList().find((p) => p.id === id)?.label || (id ? personName(id) : "");
  function editorList(m) {
    const ed = state.obj.edit;
    return ed.steps.map((x, i) => { const st = editStatus(x);
      return `<div class="edstep ${st}" data-edsel="${i}" aria-selected="${i === ed.sel}" tabindex="0">`
      + `<span class="n">${i + 1}</span>${kindMark(x.kind)}<span class="t">${esc(x.label || "Steg utan namn")}<span class="why">${esc(personLabel(x.who) || "ansvarig syns inte här")}${x.lead != null ? ` · ${x.lead} arbetsdag${x.lead === 1 ? "" : "ar"}` : ""}${sharedWith(x.id, m).length ? " · delas med annan metod" : ""}</span></span>`
      + `<span>${st ? `<span class="chip ${STATUS_TXT[st][0]}">${STATUS_TXT[st][1]}</span>` : ""}</span></div>`; }).join("");
  }
  // Ett fält som ändras ritar bara om listan och räknaren — aldrig panelen man
  // skriver i. Förr ritades hela sidan om vid varje ändring, och sidan hoppade.
  function patchEditor() {
    const m = methodById(state.obj.id), ed = state.obj.edit, n = editChanges(ed).length;

    const b = $("[data-edreview]"); if (b) { b.disabled = !n; b.textContent = n ? `Granska och spara (${n})` : "Granska och spara"; }
    const h = $("[data-edhead]"); if (h) h.textContent = `Steg ${ed.sel + 1}`;
  }
  /** Lägg till ett steg: det söks i biblioteket. Ett helt nytt steg byggs med Bygg en metod. */
  function stepPicker(m) {
    const ed = state.obj.edit, q = (ed.pick || "").trim().toLowerCase();
    const have = new Set(ed.steps.map((x) => x.id));

    return `<div class="suggest" style="margin-top:8px"><label class="field"><span>Lägg till ett steg som finns i biblioteket</span><input data-edpick value="${esc(ed.pick)}" placeholder="Sök på stegets namn"></label>`
      + `<div data-edhits>${hits.map((s) => `<div class="need" style="cursor:pointer" data-edaddstep="${esc(s.id)}">${kindMark(stepKind(s.id))}<span class="t">${esc(s.label)}${s.used_by ? ` <span class="meta">· i ${s.used_by} metod${s.used_by === 1 ? "" : "er"}</span>` : ""}</span><button class="btn sm" data-edaddstep="${esc(s.id)}">Lägg till</button></div>`).join("")
      + (q && !hits.length ? `<div class="meta">Inget steg i biblioteket heter så. Ett helt nytt steg byggs med <button class="linkbtn" data-build="1">Bygg en metod</button> — här går det inte än.</div>` : "")}</div>`
      + `<div class="bar-actions"><button class="btn sm quiet" data-edpickclose="1">Stäng</button></div></div>`;
  }
  function methodEditor(m) {
    const ed = state.obj.edit, cur = ed.steps[ed.sel], sh = cur ? sharedWith(cur.id, m) : [];

    const people = peopleList();
    const panel = cur ? `<div class="card section"><h2><span data-edhead>Steg ${ed.sel + 1}</span>${cur.removed ? " · tas bort" : ""}</h2>`

      + `<div class="meta" style="margin-top:8px">${kindMark(cur.kind)} ${esc({ code: "Kod gör steget", llm: "Claude gör steget, en människa godkänner", human: "En människa gör steget", mixed: "Kod och människa", ext: "Kunden eller en partner" }[cur.kind] || "")} <span class="meta">· ändras i stegets molekyler, inte här</span></div>`
      + `<div class="fields2" style="margin-top:12px"><label class="field"><span>Ansvarig</span><select data-edfield="who">${cur.who ? "" : `<option value="">Som i registret (syns inte här)</option>`}${people.map((x) => `<option value="${esc(x.id)}" ${x.id === cur.who ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select></label>`
      + `<label class="field"><span>Ledtid i arbetsdagar ${cur.lead !== cur.orig.lead ? originMark("decided") : cur.leadOrigin ? originMark(ORIGIN_OF[cur.leadOrigin] || cur.leadOrigin) : ""}</span><input type="number" min="0" step="1" data-edfield="lead" value="${cur.lead ?? ""}" placeholder="${cur.added ? "som steget har i registret" : "t.ex. 2"}"></label></div>`
      + `<label class="field" style="margin-top:12px"><span>Så görs det (en rad per moment)</span><textarea data-edfield="how" rows="4" ${target ? "" : "disabled"} placeholder="${target ? "Skriv momenten, eller låt Claude föreslå" : ""}">${esc(cur.how)}</textarea></label>`
      + (target ? `<div class="bar-actions" style="margin-top:6px"><button class="btn sm ai" data-edhow="1">${SP} Föreslå hur det görs</button><span class="meta">utifrån namnet och vad steget lämnar · gäller alla som kör steget</span></div>`
        : `<div class="meta" style="margin-top:4px">${p ? "Steget har ingen molekyl som görs av en människa eller Claude, så det finns inget recept att skriva här."

      + `<div class="meta" style="margin-top:8px">Krav före steget: ${(libById(cur.id)?.input || []).length ? esc(libById(cur.id).input.join(" · ")) : "inga"}</div>`
      + (sh.length ? `<div class="shared" style="margin-top:12px"><div class="label">Steget används också i ${sh.map((x) => `«${esc(x.label)}»`).join(", ")}</div><div class="meta">Namn, ansvarig, ledtid och hur det görs ändras där också. En egen kopia bara för den här metoden går inte att göra än.</div></div>` : "")
      + `<div class="bar-actions" style="margin-top:12px"><button class="btn sm" data-edmove="-1" aria-label="Flytta upp">${ic("up")} Upp</button><button class="btn sm" data-edmove="1" aria-label="Flytta ned">${ic("down")} Ned</button>`
      + `<span class="right"><button class="btn sm danger" data-edremove="1">${cur.removed ? "Behåll steget" : cur.added ? `${ic("trash")} Ta bort igen` : `${ic("trash")} Ta bort ur metoden`}</button></span></div></div>` : "";
    return `<div class="suggest" style="margin-bottom:16px"><div class="from">Utkast till nästa version · gäller alla som använder metoden</div>`
      + `<span class="meta">Utkastet finns bara här tills du sparar. Gäller det bara en kund? <button class="linkbtn" data-adapt="1">Anpassa för kund</button> i stället.</span>`
      + `<label class="field wide"><span>Beskriv ändringen, så föreslår Claude den i listan</span><textarea rows="2" data-eddesc="1" placeholder="t.ex. lägg till korrektur efter utkastet, ta bort sammanfattningen, godkännandet tar 2 dagar">${esc(ed.desc || "")}</textarea></label>`
      + `<div class="bar-actions"><button class="btn sm ai" data-edclaude="1" ${ed.desc?.trim() ? "" : "disabled"}>${SP} Föreslå ändringar</button><span class="meta">Förslaget läggs i utkastet först när du godtar det.</span></div>`
      + (ed.proposal ? proposalCard(ed.proposal) : "") + `</div>`
      + `<div class="ws2"><div class="card section"><h2>Stegen <span class="right"><button class="btn quiet sm" data-edadd="1">${ic("plus")} Lägg till steg</button></span></h2><div class="edlist">${editorList(m)}</div>${ed.pick !== null ? stepPicker(m) : ""}</div>${panel}</div>`
      + `<div class="savebar"><span class="meta"><b data-edcount>${n} ändring${n === 1 ? "" : "ar"} i utkastet</b> · inget är sparat än</span><span class="right"><button class="btn quiet" data-edcancel="1">Släng utkastet</button><button class="btn primary" data-edreview="1" ${n ? "" : "disabled"}>${n ? `Granska och spara (${n})` : "Granska och spara"}</button></span></div>`;
  }

  /**
   * Claude läser ändringen och föreslår den som rader (14.3). Nivå default,
   * med utkastets steg, personerna och bibliotekets steg som underlag. Svaret
   * prövas här: ett steg-id som inte finns blir "förstod inte", aldrig en rad.
   */
  async function proposeEdit(btn) {
    const ed = state.obj.edit, m = methodById(state.obj.id);
    if (!sample) return toast(noClaude(), null, true);
    return busy(btn, async () => {
      try {
        const people = peopleList(), have = new Set(ed.steps.map((x) => x.id));
        const lib = libEntries("step").filter((s) => !have.has(s.id));

  function newEditStep(id) {

  function applyProposal(ed) {
    const held = ed.steps[ed.sel];
    const find = (id) => ed.steps.find((x) => x.id === id);
    const place = (x, after) => { const i = after == null ? 0 : ed.steps.indexOf(find(after)) + 1; ed.steps.splice(Math.max(0, i), 0, x); };
    for (const c of ed.proposal.ok.filter((x) => x.on)) {
      const x = find(c.step);
      if (c.op === "remove" && x) { if (x.added) ed.steps.splice(ed.steps.indexOf(x), 1); else x.removed = true; }
      if (c.op === "move" && x) { ed.steps.splice(ed.steps.indexOf(x), 1); place(x, c.after); x.moved = true; }
      if (c.op === "add" && !x) place(newEditStep(c.step), c.after);
      if (c.op === "rename" && x) x.label = String(c.label).trim();
      if (c.op === "lead" && x) x.lead = c.days;
      if (c.op === "responsible" && x) x.who = c.person;

    ed.proposal = null; ed.desc = "";

  /**

    const m = methodById(state.obj.id), ed = state.obj.edit;
    const writes = [];
    for (const x of ed.steps.filter((y) => !y.removed)) {
      const node = { id: x.id };
      if (x.label.trim() !== x.orig.label) node.label = x.label.trim();
      if (x.who && x.who !== x.orig.who) node.responsible = x.who;
      if (x.lead != null && x.lead !== x.orig.lead) node.lead_time = { days: x.lead, origin: "decided", unit: "workdays" };
      if (Object.keys(node).length > 1) writes.push({ what: `«${x.label}»`, node });
      if (x.how.trim() !== x.orig.how.trim()) {
        const p = stepInfo(x.id), mol = howTarget(p), ms = lines(x.how), hi = houseInstruktion(p);
        if (hi) writes.push({ what: `momenten i «${x.label}»`, node: { id: mol, instruktion: { ...hi, saa_goer_du: ms } } });
        else if (mol) writes.push({ what: `momenten i «${x.label}»`, node: { id: mol, instruction: ["Vad behövs", p?.recipe?.needs || "(?)", "", "Så gör du", ms.map((y, k) => `${k + 1}. ${y}`).join("\n"), "", "Kontrollera", p?.recipe?.check || "(?)"].join("\n") } });
      }
    }
    const ids = ed.steps.filter((x) => !x.removed).map((x) => x.id);

      const done = [];
      for (const w of writes) {
        try { await call("registry_define", { change: true, node: w.node }); done.push(w.what); }
        catch (e) {
          const out = $("#ed-out");
          if (out) out.innerHTML = `<div class="meta" style="color:var(--red)">Grinden sa nej till ${esc(w.what)}: ${esc(e.message || e)}${done.length ? `. Redan sparat: ${esc(done.join(", "))}.` : ". Inget är sparat."}</div>`;
          if (done.length) { loadLeadTimes(); load(); }

      loadLeadTimes();

    });
  }

  // Längden nästa pass får: det som är kvar, högst den valda längden per pass.
  const adderLen = () => { const c = state.cal; const laid = c.earlier.reduce((a, x) => a + x.minutes, 0) + c.draft.reduce((a, x) => a + x.minutes, 0);

  function freeTimes(dd, len) {

  function calPick(colEl, clientY) {
    const c = state.cal, dd = colEl.dataset.calcol;

    if (dd < TODAY || (dd === TODAY && m < toMin(nowHM()))) return toast("Den tiden har redan varit.", false);
    const laid = c.earlier.reduce((a, x) => a + x.minutes, 0) + c.draft.reduce((a, x) => a + x.minutes, 0);
    const len = Math.max(30, Math.min(c.len, c.total - laid > 0 ? c.total - laid : c.len));
    const from = Math.min(m, CAL_END * 60 - len);
    const b = busyAt(dd, from, len);
    if (b) return toast(`Krockar med ${b.title || "ett annat pass"} ${toHm(b.from ?? toMin(b.time))}. Välj en annan tid.`, false);

  function suggestPasses() {

        title: `${esc(workTitle(t, x))}${addonChip(t)}${lvlChip}`, cust: lbl(x.customer),
