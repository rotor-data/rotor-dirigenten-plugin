      + (rows.length ? [...per].map(([name, rs]) => `<details class="card section" open style="margin-bottom:12px"><summary><b>${esc(name)}</b> <span class="meta">${rs.length} steg · ${rs.reduce((a, r) => a + (r.days || 0), 0)} dagar i dag${rs.filter((r) => r.origin === "guessed").length ? ` · ${rs.filter((r) => r.origin === "guessed").length} gissade` : ""}</span></summary>`
        + rs.map((r) => { const p = prop[r.step];
          return `<div class="need" data-ltrow="${esc(r.step)}"><span class="t">${esc(r.label)} ${originMark(ORIGIN_OF[r.origin] || r.origin)}<div class="meta">${r.reported_hours != null ? `Rapporterat: ${esc(String(r.reported_hours).replace(".", ","))} h på ${r.reports} gång${r.reports === 1 ? "" : "er"}` : "Ingen tid rapporterad än"}${p ? ` · <span style="color:var(--claude)">${SP} Claude föreslår ${p.days} d: ${esc(p.why)}</span>` : ""}</div></span>`
            + `<label class="meta">dagar <input type="number" min="0" step="1" data-ltdays="${esc(r.step)}" value="${esc(draft[r.step] ?? p?.days ?? r.days)}" style="width:64px"></label>`
            + `<button class="btn sm quiet ai" data-ltask="${esc(r.step)}" title="Claude föreslår, skriver ingenting" aria-label="Låt Claude föreslå ledtiden för ${esc(r.label)}">${SP}</button><button class="btn sm" data-ltset="${esc(r.step)}">Sätt</button></div>`; }).join("") + `</details>`).join("")
        : `<div class="empty"><b>${all.length ? "Ingen gissad ledtid kvar." : "Inga steg med ledtid i registret."}</b>${all.length ? "Planen räknar med tal någon står för." : ""}</div>`);
  }
  /**
   * Claude föreslår ledtider — men skriver ingenting (B-178). Svaret står i
   * fältet och på raden tills en människa sätter talet, och då blir ursprunget
   * beslutat, inte gissat.
   */
  async function suggestLeadTimes(ids = null) {
    state.screen = "metoder"; state.obj = null; state.metTab = "ledtider";
    if (!S.lead?.rows) { await loadLeadTimes(); }
    const rows = (S.lead?.rows || []).filter((r) => ids ? ids.includes(r.step) : r.origin === "guessed");
    if (!rows.length) { render(); return toast("Ingen gissad ledtid att föreslå för."); }
    if (!sample) return toast(noClaude(), null, true);
    if (running) return toast("Claude arbetar redan. Vänta, eller avbryt.", null, true);
    running = { label: `Claude föreslår ${rows.length} ledtid${rows.length === 1 ? "" : "er"}`, since: Date.now(), abort: new AbortController() }; render(); renderPanel();
    try {
      const r = await sample.json(["Du bedömer hur lång LEDTID steg behöver i en plan. Ledtid är inte arbetstid: det är hur många ARBETSDAGAR steget behöver få ta från att det kan börja till att det är klart. Ett steg med två timmars arbete som väntar på kundens svar har längre ledtid än arbetstiden.",
        "Stegen (id exakt):", ...rows.map((x) => `- ${x.step} · ${x.label} · i ${x.method_label || "ingen metod"} · i dag ${x.days} dagar (${ORIGIN[ORIGIN_OF[x.origin] || x.origin] || x.origin}) · ${x.reported_hours != null ? `rapporterat ${x.reported_hours} h på ${x.reports} gånger` : "ingen tid rapporterad"}`),
        "Är underlaget för tunt för ett steg: utelämna det. Hitta inte på ett tal för att fältet ska bli ifyllt.",
        'Svara med ENBART JSON: {"lead_times":[{"step":"<id>","days":<heltal>,"why":"<en mening>"}]}'].join("\n"), { modelTier: "quick", signal: running.abort.signal });
      const ok = (Array.isArray(r?.lead_times) ? r.lead_times : []).filter((x) => rows.some((y) => y.step === x?.step) && Number.isInteger(x.days) && x.days >= 0);
      for (const x of ok) { (S.ltProp ||= {})[x.step] = { days: x.days, why: String(x.why || "") }; if (S.ltDraft) delete S.ltDraft[x.step]; }
      toast(ok.length ? `Claude föreslår ${ok.length} ledtid${ok.length === 1 ? "" : "er"}. Inget är satt än.` : "Claude hade inget underlag att föreslå något på.");
    } catch (e) { if (e?.code !== "cancelled") fail("Förslaget kom inte fram", e); }
    finally { running = null; render(); renderPanel(); }
  }
  /** Sätt ledtiden i registret. Ursprunget blir beslutat: en människa står för talet. */
  async function setLeadTime(id, { quiet = false } = {}) {
    const r = (S.lead?.rows || []).find((x) => x.step === id); if (!r) return false;
    const el = document.querySelector(`[data-ltdays="${CSS.escape(id)}"]`);
    const days = Number(el ? el.value : S.ltDraft?.[id] ?? S.ltProp?.[id]?.days);
    if (!Number.isInteger(days) || days < 0) { toast(`Ledtiden för ${r.label} måste vara noll eller fler hela dagar.`, null, true); return false; }
    await call("registry_define", { change: true, node: { id, lead_time: { days, origin: "decided", unit: "workdays" } } });
    if (S.ltProp) delete S.ltProp[id]; if (S.ltDraft) delete S.ltDraft[id];
    if (!quiet) { await loadLeadTimes(); await afterWrite(`${r.label} tar ${days} arbetsdag${days === 1 ? "" : "ar"}. Planen räknas om på det.`); }
    return true;
  }
  async function setAllLeadTimes(btn) {
    const ids = Object.keys(S.ltProp || {});
    return busy(btn, async () => { let n = 0;
      for (const id of ids) { try { if (await setLeadTime(id, { quiet: true })) n++; } catch (e) { fail(`Ledtiden för ${leadOf(id)?.label || "steget"} sattes inte`, e); break; } }
      await loadLeadTimes(); await afterWrite(`${n} ledtid${n === 1 ? "" : "er"} satta. Planen räknas om på dem.`); });
  }
  /** Luckorna: obyggda atomförslag (B-107). Koden byggs av en människa ur förslaget. */
  function gapsList() {
    const us = libEntries("atom_proposal").filter((u) => u.unbuilt);
    if (!us.length) return `<div class="empty"><b>Inga obyggda atomförslag.</b>Varje steg som vilar på kod har koden.</div>`;
    const stopsIn = (u) => libEntries("method").filter((m) => stepIds(m).some((id) => stepBlockers(id).some((b) => b.id === u.id)));
    return `<div class="card">${us.map((u) => { const ms = stopsIn(u);
      return row({ kind: `<span class="kind warn" title="Behöver åtgärd">${ic("alert")}</span>`, title: `Bygg atomen: ${esc(u.label)}`,
        why: `Atomförslag · obyggt${u.surface ? ` · ${esc(u.surface)}` : ""} · ${ms.length ? `${ms.map((m) => `«${esc(m.label)}»`).join(", ")} stannar här` : u.used_by ? `används i ${u.used_by} molekyl${u.used_by === 1 ? "" : "er"}` : "ingen metod använder det än"}`,
        act: `<button class="btn sm" data-copybuild="${esc(u.id)}">Kopiera kommandot</button>` }); }).join("")}</div>`
      + `<p class="meta">Kommandot bygger koden ur förslaget i en arbetskopia av repot. Atomen blir verklig först när koden finns och provet passerar.</p>`;
  }

  /* ── Bygg en metod: Claude tolkar texten till steg, method_build prövar (B-115, B-107) ── */
  const BUILD_STAGES = ["Beskriv", "Claude föreslår, dirigenten prövar", "Svara och spara"];
  const slugOf = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
  const openBuild = () => { state.screen = "metoder"; deliverableTypes().then(render);
    open({ type: "build", title: "Ny metod", stage: 1, text: "", delivers: "", responsible: S.agenda?.party?.id || "", draft: null, answer: null, answers: {} }); };
  async function buildInterpret(btn) {
    const b = state.obj;
    if (!b.text.trim()) return toast("Skriv vad metoden ska göra först.", null, true);
    if (!sample) return toast(noClaude(), null, true);
    return busy(btn, async () => {
      try {
        const r = await sample.json(["Du läser en arbetsplan skriven på vanlig svenska och delar den i steg. Du bestämmer INGENTING om systemet — du säger bara vad varje steg gör, så att dirigenten kan söka i sitt bibliotek.",
          `Planen:\n"""\n${b.text}\n"""`,
          b.delivers ? `Leveranstypen: ${typeLabel(b.delivers)}.` : "",
          "Ett steg är EN effekt: en sak som händer, av en utförare. performer: code när ett skript gör det, llm när en modell gör det, human när en människa gör det. Dela hellre i två steg än att skriva ett som gör två saker. Behåll ordningen i planen.",
          "Fyll aldrig i ett fält texten inte säger något om — utelämna det, så blir det en fråga. Gissa aldrig en ledtid. label och summary på svenska; name på engelska, snake_case.",
          'Svara med ENBART JSON: {"label":"<metodens namn>","summary":"<en mening>","name":"<modul>.method.<namn_på_engelska>","completion":"<när leveransen är klar, bara om texten säger det>","steps":[{"label":"<verb först>","summary":"<en mening>","from_plan_line":"<meningen ur texten, ordagrant>","performer":"code|llm|human","surface":"<system, bara om det står>","effect":{"verb":"reads|creates|updates|deletes|sends|publishes","object":"<vad som påverkas>"},"needs":[],"leaves":[]}]}'].filter(Boolean).join("\n"),
          { modelTier: "default" });
        if (!r?.label || !Array.isArray(r.steps) || !r.steps.length || r.steps.some((s) => !s?.label || !s?.summary))
          throw new Error("Claude svarade inte med en metod i steg — skriv planen tydligare och försök igen");
        const steps = r.steps.map((s) => Object.fromEntries(Object.entries(s).filter(([, v]) => v != null && v !== "" && !(Array.isArray(v) && !v.length))));
        b.draft = { plan_text: b.text, label: r.label, summary: r.summary || r.label, ...(r.name ? { name: r.name } : {}), ...(r.completion ? { completion: r.completion } : {}),
          ...(b.delivers ? { delivers: b.delivers } : {}), ...(b.responsible ? { responsible: b.responsible } : {}), steps };
        b.answers = {}; await buildTest();
      } catch (e) { fail("Kedjan kunde inte föreslås", e); }
    });
  }
  /** Torrkörningen: method_build utan commit skriver ingenting. */
  async function buildTest() {
    const b = state.obj;
    try { b.answer = await call("method_build", { from_plan: b.draft }); b.error = null; }
    catch (e) { b.answer = null; b.error = e.message || String(e); }
    b.stage = 2; render();
  }
  /** Ett svar på en av byggarens frågor läggs i utkastet, på det fält frågan gäller. */
  function applyAnswers(b) {
    const a = b.answers;
    for (const q of b.answer?.needs_answer || []) {
      const v = (k = "") => String(a[q.field + k] ?? "").trim();
      const [head, sl, ...rest] = q.field.split(".");
      if (head !== "steps") { if (v()) b.draft[q.field] = v(); continue; }
      const s = b.draft.steps.find((x) => slugOf(x.label) === sl); if (!s) continue;
      const f = rest.join(".");
      if (f === "lead_time") { if (v() !== "" && Number.isInteger(+v()) && +v() >= 0) s.lead_time = { days: +v(), origin: v("#origin") || "guessed", unit: "workdays" }; }
      else if (f === "recipe") { if (v("#needs") && v("#how") && v("#check")) s.recipe = { needs: v("#needs"), how: v("#how"), check: v("#check") }; }
      else if (f === "done_when") { if (v()) s.done_when = lines(v()); }
      else if (f.startsWith("schema.")) { if (v()) s.schema = { ...(s.schema || {}), [f.slice(7)]: v() }; }
      else if (v()) s[f] = v();
    }
  }
  function answerField(q) {
    const a = state.obj.answers, f = q.field, val = (k = "") => esc(a[f + k] ?? "");
    const inp = (k = "", ph = "") => `data-bdans="${esc(f + k)}" value="${val(k)}" placeholder="${esc(ph)}"`;
    const people = peopleList();
    const control = f === "delivers" ? `<select data-bdans="${esc(f)}"><option value="">Välj</option>${(S.types || []).map((t) => `<option value="${esc(t.id)}" ${a[f] === t.id ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select>`
      : f.endsWith(".responsible") ? `<select data-bdans="${esc(f)}"><option value="">Välj</option>${people.map((x) => `<option value="${esc(x.id)}" ${a[f] === x.id ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>`
      : f.endsWith(".lead_time") ? `<span class="bar-actions"><input type="number" min="0" step="1" style="width:80px" ${inp("", "dagar")}><select data-bdans="${esc(f)}#origin"><option value="guessed" ${a[f + "#origin"] !== "decided" ? "selected" : ""}>gissad</option><option value="decided" ${a[f + "#origin"] === "decided" ? "selected" : ""}>beslutad</option></select></span>`

  }
  const MATCH = { existing: ["", "finns"], new_molecule: ["changed", "ny"], gap: ["removed", "saknas"] };

          `Ett nytt steg: add [{step: id på ett steg som FINNS i biblioteket, after: id eller null}]. Steg i biblioteket: ${libEntries("step").filter((s) => !ids.includes(s.id)).map((s) => `${s.id} (${s.label})`).join("; ")}. Finns steget inte: skriv det i gaps — hitta aldrig på ett id.`,
          `Svara med ENBART JSON: {"label":"kort namn","summary":"en mening","customer":"${cust}","base":"${m.id}","remove":[],"responsible":{},"add":[],"gaps":[]}`].join("\n"), { modelTier: "default" });

          + (Object.keys(flow.responsible || {}).length ? `<div class="meta">Ny ansvarig: ${Object.entries(flow.responsible).map(([sid, pid]) => `${esc(name(sid))} → ${esc(personLabel(pid))}`).join(", ")}</div>` : "")

    });
  }

  /* ── objekt ── */
  /* ── fälten för det ett steg lämnar ── */
  /** Det ett handsteg lämnar (B-198): ett fält per tillgångstyp. Sparas när steget markeras klart. */
  function deliverBlock(t, s) {
    const inp = (state.obj.inputs ||= { parts: {}, files: {}, note: "" });
    const leaves = s.leaves || [];

    build() {

        + `<div class="fields2" style="margin-top:12px"><label class="field"><span>Vad kunden får · valfritt</span><select data-bddelivers><option value="">Välj senare</option>${(S.types || []).map((t) => `<option value="${esc(t.id)}" ${b.delivers === t.id ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select></label>`
        + `<label class="field"><span>Ansvarig för stegen · valfritt</span><select data-bdresp><option value="">Välj senare</option>${people.map((x) => `<option value="${esc(x.id)}" ${b.responsible === x.id ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select></label></div>`
        + `<div class="bar-actions" style="margin-top:10px"><button class="btn primary ai" data-bdpropose="1">${SP} Föreslå kedjan</button><span class="meta">nivå balanserad · dirigenten söker i biblioteket per steg · inget skrivs</span></div></div>`;
      if (b.stage === 1) return `<div class="wshead"><div class="titles"><span class="meta">Metoder · bygg en metod</span><h1>Ny metod</h1></div></div>` + stepper + describe;

        + `<div class="bar-actions">${b.savedId && methodById(b.savedId) ? `<button class="btn primary" data-open-method="${esc(b.savedId)}">Öppna metoden</button>` : ""}<button class="btn quiet" data-bdrestart="1">Bygg en till</button></div></div>`;
      const steps = a?.steps || [];
      const qs = a?.needs_answer || [];
      return `<div class="wshead"><div class="titles"><span class="meta">Metoder · bygg en metod</span><h1>${esc(b.draft?.label || "Ny metod")}</h1><div class="line">${esc(b.draft?.summary || "")}</div></div></div>` + stepper
        + (b.error ? `<div class="card section"><h2>Dirigenten sa nej</h2><p class="meta" style="color:var(--red)">${esc(b.error)}</p><div class="bar-actions"><button class="btn" data-bdback="1">Ändra texten</button></div></div>`
          : `<div class="card section"><h2>Förslaget, prövat mot biblioteket</h2><div class="chain">${steps.map((s, i) => `${i ? `<span class="arrow">${ic("chev")}</span>` : ""}<span class="node ${MATCH[s.status]?.[0] || ""}">${kindMark({ code: "code", llm: "llm" }[b.draft.steps[i]?.performer] || "human")}<span class="l">${esc(s.label)}</span></span>`).join("")}</div>`
            + steps.map((s) => `<div class="need"><span class="chip ${s.status === "gap" ? "red" : s.status === "new_molecule" ? "amber" : "green"}">${MATCH[s.status]?.[1] || esc(s.status)}</span><span class="t">${esc(s.label)}<div class="meta">${[
              s.from_plan_line ? `Ur texten: «${esc(s.from_plan_line)}»` : "",
              s.uses ? `Använder ${esc(s.uses.label)}, som redan finns — ${esc(s.uses.why)}` : "",
              s.status === "new_molecule" ? "Blir en ny molekyl; koden finns" : "",
              s.gap ? `Saknas i koden: ${esc(s.gap.what)}${s.gap.proposal ? " — blir ett atomförslag som en människa bygger" : ""}` : "",
              s.stop ? "Här lämnar något huset och ska godkännas först" : ""].filter(Boolean).join(" · ")}</div></span></div>`).join("")
            + `<p class="meta">finns = återanvänds · <span style="color:var(--amber)">ny</span> = ny molekyl, koden finns · saknas = atomförslag, en människa bygger koden</p>`
            + ((a?.stops_at || []).length ? `<p class="meta" style="color:var(--amber)">${a.stops_at.map((x) => `Metoden stannar vid «${esc(x.step)}»: ${esc(x.why)}`).join("<br>")}</p>` : "") + `</div>`
            + (qs.length ? `<div class="card section" style="margin-top:16px"><h2>Det som måste bestämmas innan metoden kan sparas</h2><div class="fields">${qs.map(answerField).join("")}</div>`
              + `<div class="bar-actions" style="margin-top:10px"><button class="btn primary" data-bdtest="1">Pröva igen</button><span class="meta">Svaren läggs i utkastet och dirigenten prövar det. Inget skrivs.</span></div></div>` : "")
            + `<div class="bar-actions" style="margin-top:16px">${a?.writable ? `<button class="btn primary" data-bdsave="1">Spara metoden</button><span class="meta">${a.runnable === false ? "Går att spara, inte att köra hela vägen: den vilar på atomförslag som inte är byggda." : "Dirigenten har prövat den. Inget är skrivet än."}</span>` : `<span class="meta">Går inte att spara än: ${esc([qs.length ? "svara på frågorna ovan" : "",

  /* ── panelen ── */
  // Prototypens exempelsamtal (CONVO) är borta: samtalet är riktig Claude (B-212).

  /* ── Claudepanelen (9.1, B-212) ──────────────────────────────────────────
     Samtalet är riktig Claude (sample), med det man tittar på som
     sammanhang. Prototypens samtal var ett exempel och förbrukningsmätaren
     påhittad; mätaren visas inte förrän ett tak är bestämt (14.2). */
  let sample = null;
  /* ── Samtalen i panelen (B-245) ──────────────────────────────────────
     Daniel P: kunna rensa chatten, och att den minns vad man pratade om när
     man byter fönster. Ett samtal per ställe — steg, ärende, fråga, metod,
     yta. Nytt samtal lägger det gamla under Tidigare, så att man kan gå
     tillbaka. Samtalen sparas i webbläsaren i två veckor, för den här
     personen på den här datorn; det som ska finnas kvar på riktigt sparas i
     dirigenten (resultat, kopplingar, anteckningar). Lägesbilden sparas
     inte — den hämtas ny vid varje fråga. */
  const SAMTAL_KEY = "dirigent.samtal.v1", SAMTAL_DAGAR = 14;
  const placeKey = () => state.obj ? (state.obj.type === "step" ? `step:${state.obj.task}|${state.obj.step}` : `${state.obj.type}:${state.obj.id || state.obj.key || ""}`) : `yta:${state.screen}`;
  function loadSamtal() {
    const m = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem(SAMTAL_KEY) || "{}"), gräns = Date.now() - SAMTAL_DAGAR * 86400000;
      for (const [k, v] of Object.entries(raw)) {
        const old = (v.old || []).filter((o) => Date.parse(o.at) > gräns);
        const färsk = Date.parse(v.at) > gräns;
        if (färsk || old.length) m.set(k, { at: v.at, msgs: färsk ? v.msgs || [] : [], old });
      }
    } catch { /* ingen lagring: samtalen lever bara i sidan */ }
    return m;
  }
  const samtal = loadSamtal();
  const lagrad = (m) => m.role === "user" ? { role: m.role, content: `Fråga: ${m.text}`, text: m.text, ...(m.step ? { step: m.step } : {}) }
    : { role: m.role, content: String(m.content || m.text || "").slice(0, 8000), text: m.text, ...(m.error ? { error: true } : {}), ...(m.meter ? { meter: m.meter } : {}), ...(m.rating ? { rating: m.rating } : {}) };
  function saveSamtal() {
    try {
      const o = {};
      for (const [k, v] of samtal) if (v.msgs.length || v.old.length) o[k] = { at: v.at, msgs: v.msgs.filter((m) => m.text !== "Tänker…").map(lagrad), old: v.old };

  /**
   * Claudes svar som läsbar text (B-241). Daniel P: "svaren borde vara mycket
   * bättre formatterade så att de är läsbara". En liten markdown: stycken,
   * rubriker, fetstil, kursiv, kod, länkar och listor. Texten tvättas FÖRST —
   * ingenting ur svaret kan bli HTML som körs.
   */
  function md(text) {
    const inline = (t) => esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const ut = []; let lista = null, stycke = [];
    const tömStycke = () => { if (stycke.length) { ut.push(`<p>${stycke.map(inline).join("<br>")}</p>`); stycke = []; } };
    const tömLista = () => { if (lista) { ut.push(`<${lista.typ}${lista.start > 1 ? ` start="${lista.start}"` : ""}>${lista.rader.map((r) => `<li>${r.map(inline).join("<br>")}</li>`).join("")}</${lista.typ}>`); lista = null; } };
    for (const rad of rader) {
      const r = rad.trimEnd();
      const h = /^(#{1,4})\s+(.*)$/.exec(r);
      const ul = /^\s*[-*•]\s+(.*)$/.exec(r);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(r);
      if (!r.trim()) { tömStycke(); tömLista(); continue; }
      if (h) { tömStycke(); tömLista(); ut.push(`<h4>${inline(h[2])}</h4>`); continue; }
      if (ul || ol) { tömStycke(); const typ = ul ? "ul" : "ol";
        if (lista && lista.typ !== typ) tömLista();
        (lista ||= { typ, rader: [], start: ol ? Number(/^\s*(\d+)/.exec(r)[1]) : 1 }).rader.push([(ul || ol)[1]]); continue; }
      // En indragen rad under en punkt hör till punkten, och listan fortsätter.
      if (lista && /^\s{2,}\S/.test(rad)) { lista.rader[lista.rader.length - 1].push(r.trim()); continue; }
      tömLista(); stycke.push(r);
    }
    tömStycke(); tömLista();
    return ut.join("");
  }
  /**

  /**
   * Samtalet inom taket (B-253): 64 kB text per anrop, verktygsrundorna

    }

  /* ── Så görs steget (B-240) ─────────────────────────────────────────────
     Delarna i stegets operation, i ordning, med vem som gör dem. Det enkla
     görs här — byta till människa, flytta, ta bort. Det som kräver
     resonemang — skriva en Claude-del, hitta kod, lägga till något ur
     biblioteket — görs i vanliga Claude-chatten, med en prompt ur Kopiera
     till chatten (docs/kvar.md 20).
     En ny version skrivs med registry_define (change) på operationen, med
     bindningarna kvar, efter att library_check prövat kedjan. */
  const partOf = (id) => id === "human" ? { label: "Görs för hand", performer: "human", input: [], output: [] }
    : id === "inline" ? { label: "Skript i operationen", performer: "code", input: [], output: [] }
      : (libById(id) || { label: id, input: [], output: [] });
  const partKind = (id) => { const e = partOf(id); return e.kind === "atom_proposal" ? "code" : e.performer || "human"; };
  const readableField = (x) => { const n = libEntries("asset").find?.((a) => a.name === x); return n?.label || String(x).split(".").pop().replace(/_/g, " "); };
  async function openStepEdit(stepId) {
    const st = libById(stepId), opId = st?.parts?.[0]?.id, op = libById(opId);
    state.screen = state.screen === "metoder" ? "metoder" : state.screen;
    open({ type: "stepedit", id: stepId, op: opId, title: st?.label || "Steget", loading: true, calls: [], orig: "[]" });
    if (!op) { state.obj.loading = false; state.obj.error = "steget har ingen operation i biblioteket"; return render(); }
    try {
      const d = await call("search", { do: "browse", kind: "operation", q: op.name, format: "full", limit: 20 });
      const full = (d?.entries || []).find((e) => e.id === opId);
      if (!full?.node) throw new Error("servern skickade inte operationens delar — den kan vara en äldre version");
      const calls = full.node.calls.map((c) => typeof c === "string" ? { call: c } : { ...c });
      Object.assign(state.obj, { loading: false, node: full.node, calls, orig: JSON.stringify(calls) });
    } catch (e) { state.obj.loading = false; state.obj.error = e.message || String(e); }
    render();
  }
  let checkTimer = null;
  function peChanged() {
    const o = state.obj; if (o?.type !== "stepedit") return;
    if (JSON.stringify(o.calls) === o.orig) { o.check = null; return render(); }
    o.check = "pending"; render();
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
      const cur = state.obj; if (cur !== o) return;
      try { const d = await call("library_check", { operation: { ...o.node, calls: o.calls.map((c) => c.bind ? c : c.call) } });
        o.check = { ok: true, message: d?.ok ? "" : "" }; }
      catch (e) { o.check = { ok: false, message: e.message || String(e) }; }
      if (state.obj === o) render();
    }, 400);
  }
  function peSave(btn) {
    const o = state.obj; const calls = o.calls.map((c) => c.bind ? c : c.call);
    const before = JSON.parse(o.orig).map((c) => c.bind ? c : c.call);
    return busy(btn, async () => {
      try {
        await call("registry_define", { change: true, node: { id: o.op, calls } });
        const undo = () => call("registry_define", { change: true, node: { id: o.op, calls: before } }).then(() => refreshLib()).then(load);
        await refreshLib(); await load();
        o.orig = JSON.stringify(o.calls); o.check = null; render();
        toast(`Ny version av «${o.title}» är sparad.`, undo);
      } catch (e) { fail("Versionen sparades inte", e); }
    });
  }
  async function refreshLib() {

  /** Byt vem som gör en del. Människa byts här; Claude och kod resoneras fram i vanliga chatten. */
  function peKind(i, kind) {

  /* ── Kopiera till chatten (docs/kvar.md 14 och 20) ──────────────────────
     Panelen bygger inga metoder och gör inga Claude-steg. Det görs i vanliga

  const CHAT_RULES = ["Arbetssätt:",

  const idOf = (x) => x?.id ? ` (id ${x.id})` : "";
  /** Stegets instruktion som rader, ur registrets sex fält eller receptet. */
  function instructionLines(s) {

      rad.push("Så gör du:", ...aiMoments(s).map((m, n) => `  ${n + 1}. ${m}`));
      if (i.svarsform) rad.push(`Svarets form: ${i.svarsform}`);
      if ((i.far_inte || []).length) rad.push(`Får inte: ${i.far_inte.join(" · ")}`);
      if ((i.fraaga_naer || []).length) rad.push(`Stanna och fråga när: ${i.fraaga_naer.join(" · ")}`);
    } else if (s.recipe?.how || s.recipe?.text) rad.push(`Instruktion: ${s.recipe.how || s.recipe.text}`);
    else rad.push("Steget saknar instruktion i registret. Fråga mig vad det ska göra innan du börjar.");

  /** Till och Kopia under avsändaren; den bevakade adressen i fetstil. */

  /** Trådens poster, samma utseende i ärendet och i steget. */

  /**
   * Mejltråden i ett steg vars uppgift kom ur ett ärende (B-224). Hämtas en

  /**
   * En tråd hämtas en gång och sparas per tråd, inte på fönstret som bad om

  function fetchThread(thread, force = false) {

    const promise = withTimeout(call("intake_status", { thread, all_posts: true }), 60000, "Tråden")
      .then((d) => { S.threads.set(thread, { detail: d }); return d; },

    S.threads.set(thread, { loading: true, promise });

  /* ── Planen: ändra stegen och dragandet (B-215) ──────────────────────── */
  /**

  function changeDialog(taskId) {

      + `<div class="chain" style="margin:8px 0">${t.steps.map((x, i) => `${i ? `<span class="arrow">${ic("chev")}</span>` : ""}<span class="node ${x.done ? "done" : ""}">${x.done ? `<span class="ok" style="color:var(--green)">${ic("check")}</span>` : kindMark(kindOf(x))}<span class="l">${esc(x.label)}</span></span>`).join("")}</div>`

  async function readChange(btn) {

    if (!sample) return toast(noClaude(), null, true);
    return busy(btn, async () => {
      $("#chg-out").innerHTML = `<div class="running"><span class="spin"></span>Claude läser ändringen…</div>`;
      try {
        const steps = t.steps.map((x, i) => `${i + 1}. id=${x.step} · ${x.label} · ${lbl(x.responsible, "utan ansvarig")}`).join("\n");
        const draft = await sample.json([`Du läser en ändring för EN kund och skriver den som ett kundflöde — bara skillnaderna mot metoden.`,
          `Ändringen: """${text}"""`, `Kunden: ${lbl(t.customer)} (id ${t.customer?.id})`, `Grundmetoden: ${t.method}`, `Stegen i dag:\n${steps}`,

        // Claudes svar prövas innan det används: fel form är ett fel, inte ett förslag.

  /** Dra ett steg i tidslinjen: framåt senareläggs, bakåt flyttas det tidigare (B-174, B-180, 2026-09-25). */
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest?.("[data-quick-done]")) return;
    const bar = e.target.closest?.(".sbar[data-drag-start]"); if (!bar || e.button !== 0) return;
    drag = { bar, lane: bar.closest(".lane"), x0: e.clientX, from: bar.dataset.dragStart, key: bar.dataset.openStep, moved: false };
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.moved && Math.abs(e.clientX - drag.x0) < 5) return;
    drag.moved = true; drag.bar.classList.add("dragging");
    const r = drag.lane.getBoundingClientRect(), { from, days } = tlSpan();
    const dd = Math.round((e.clientX - r.left) / r.width * days);
    drag.to = add(from, Math.max(0, Math.min(days - 1, dd)));
    drag.bar.dataset.tip = short(drag.to); drag.bar.style.outline = "2px dashed var(--accent)";
    drag.bar.title = `Släpp: ${short(drag.to)}`;
  });
  document.addEventListener("pointerup", (e) => {
    const d0 = drag; drag = null; if (!d0) return;
    d0.bar.classList.remove("dragging"); d0.bar.style.outline = "";
    if (!d0.moved || !d0.to || d0.to === d0.from) return;
    e.preventDefault(); d0.suppressClick = true; suppressNextClick = true;
    const [task, step] = d0.key.split("|");
    return moveStep(task, step, d0.from, d0.to);
  });
  let suppressNextClick = false;
  /**
   * Flytta ett steg dit det släpptes. Bakåt går det bara till i dag eller

   * servern, och dess svar står i felrutan med vilket steg det gäller.
   */
  function moveStep(task, step, from, to) {
    const st = stepOf(taskById(task), step);
    const earlier = to < from;
    if (earlier && to < TODAY) return toast(`${short(to)} har redan varit — ett steg flyttas till i dag eller senare.`, null, true);
    state.pendingMove = { task, step, to };
    dialog(`<h2>Flytta ${esc(st?.label || "steget")} ${earlier ? "tidigare, " : ""}till ${esc(wday(to))}</h2>`
      + (earlier ? `<p class="meta">Leveransen står kvar. Går det inte — för att något före måste vara klart först — säger planen vilket och vilken dag som går.</p>` : "")

      } catch (e) {

  /**

  function sendRemoveAdded(btn) {

  }

  /**

  function placeText(t, after) {

    return `Efter «${x?.label ?? "steget"}»${next ? ` och före «${next.label}»` : ", sist"}`;
  }
  /** Snabbstegen: det som oftast läggs till för hand, utan att leta i biblioteket. */
  const quickSteps = (t) => { const c = lbl(t.customer, "kunden"); return [

    { kind: "quick", label: "Intern korrektur", who: "", reason: "Någon i huset läser igenom" },

  /** Hur kortet passar efter `after`: före ett klart steg går inget; resten säger servern. */
  function placeFit(t, it, after) {
    const i = after === null ? -1 : t.steps.findIndex((x) => x.step === after);
    if (t.steps[i + 1]?.done) return { fit: "invalid", why: "steget efter är redan klart" };
    const pl = (it.places || []).find((x) => x.after === after);

  }
  const palIO = (it) => [it.requires?.length ? `kräver ${it.requires.join(", ")}` : "", it.produces?.length ? `ger ${it.produces.join(", ")}` : ""].filter(Boolean).join(" · ");
  const palCard = (it) => `<div class="stcard" role="button" tabindex="0" data-pal-card="${esc(it.key)}" aria-describedby="pal-help">`
    + `<span class="l">${esc(it.label)}</span>${it.reason ? `<span class="meta">${esc(it.reason)}</span>` : ""}`

  function palHtml(t) {
    const p = state.pal, items = palItems(t);
    const group = (g) => items.filter((x) => x.group === g).map(palCard).join("");
    const help = p.place ? `${placeText(t, p.after)}. Tryck på ett kort.`

    return `<div class="bar-actions" style="margin:0"><b>Lägg till steg</b><span class="meta" id="pal-help">${esc(help)}</span>`
      + `<span class="right"><button class="btn quiet sm" data-pal-close="1">Stäng</button></span></div>`
      + `<div class="grp">Passar här</div>`
      + `<input id="pal-q" type="search" class="palq" placeholder="Sök ett steg i biblioteket …" aria-label="Sök ett steg i biblioteket" value="${esc(p.q || "")}">`
      + `<div id="pal-fit">${fitHtml(t)}</div>`
      + `<div class="grp">Snabbsteg</div><div class="cards">${group("quick")}</div>`
      + `<div class="grp">Eget steg</div><div class="cards">${group("own")}</div>`;
  }
  /** Urvalet ur servern — det enda som byts när någon söker, så att sökfältet behåller markören. */
  function fitHtml(t) {
    const p = state.pal, items = palItems(t).filter((x) => x.group === "fit");
    return (p.error ? `<div class="meta">Urvalet kunde inte hämtas: ${esc(p.error.message || p.error)}</div>`
        : !p.cands ? `<div class="meta">Hämtar det som passar …</div>`
        : items.length ? `<div class="cards">${items.map(palCard).join("")}</div>`
        : `<div class="meta">${p.q ? `Inget steg i biblioteket matchar «${esc(p.q)}».` : "Inget i biblioteket passar särskilt här."} Ta ett snabbsteg eller skriv ett eget.</div>`);
  }
  const refreshPal = () => { const t = taskById(state.pal?.task), el = $("#pal-fit"); if (t && el) el.innerHTML = fitHtml(t); };
  /** Hämta urvalet för platsen, med sökordet när det finns. */
  async function loadCandidates(p) {
    p.cands = null; p.error = null; refreshPal();
    try { const d = await call("task_lock", { task: p.task, add_step: { after: p.after, candidates: true, ...(p.q ? { q: p.q } : {}) } });
      if (state.pal === p) p.cands = d?.candidates || []; }
    catch (e) { if (state.pal === p) p.error = e; }
    if (state.pal === p) { refreshPal(); live(p.cands ? `${p.cands.length} förslag.` : "Urvalet kunde inte hämtas."); }
  }
  let palTimer = null;
  document.addEventListener("input", (e) => {
    if (e.target.id !== "pal-q" || !state.pal) return;
    const p = state.pal; clearTimeout(palTimer);
    palTimer = setTimeout(() => { if (state.pal !== p) return; p.q = e.target.value.trim(); loadCandidates(p); }, 300);
  });
  /** Öppna paletten. `place`: bara för platsen efter `after` (ett tryck på «+»). */
  function openStepPalette(task, after, place) {
    const p = state.pal = { task, after, place, q: "", cands: null, error: null, byKey: {} };
    endPick(); render();
    $("#stpal")?.scrollIntoView?.({ block: "nearest" });
    live(place ? `Lägg till steg: ${placeText(taskById(task), after)}.` : "Paletten är öppen. Välj ett kort med Enter, eller dra det till ett plus i kedjan.");
    loadCandidates(p);
  }
  function markTargets(it) {
    const t = taskById(state.pal?.task); if (!t) return;
    for (const el of addTargets()) {
      const f = placeFit(t, it, afterOf(el));
      el.classList.remove("drop-ok", "drop-warn", "drop-no");
      el.classList.add(f.fit === "ok" ? "drop-ok" : f.fit === "warn" ? "drop-warn" : "drop-no");
      el.title = f.why ? `${f.fit === "invalid" ? "Går inte: " : ""}${f.why}` : "Släpp här";
    }
  }
  function clearTargets() {
    for (const el of addTargets()) { el.classList.remove("drop-ok", "drop-warn", "drop-no", "drop-hover", "drop-kbd"); el.title = "Lägg till steg här"; }
  }
  /** Tangentbordet (och telefonen): kortet är valt, platsen väljs bland «+». */
  function startPick(key) {
    const it = state.pal?.byKey[key], ts = addTargets(); if (!it || !ts.length) return;
    const here = ts.findIndex((x) => afterOf(x) === state.pal.after);
    state.pick = { it, i: here < 0 ? 0 : here };
    showPick();
  }
  function showPick() {
    const k = state.pick, ts = addTargets(), t = taskById(state.pal?.task); if (!k || !t || !ts.length) return;
    // Ritades kedjan om under tiden har färgerna försvunnit; de sätts igen.
    markTargets(k.it);
    ts.forEach((x, j) => x.classList.toggle("drop-kbd", j === k.i));
    const after = afterOf(ts[k.i]), f = placeFit(t, k.it, after);
    ts[k.i].scrollIntoView?.({ block: "nearest", inline: "nearest" });
    live(`«${k.it.label}»: ${placeText(t, after)}${f.fit === "invalid" ? ` — går inte: ${f.why}` : f.why ? ` — ${f.why}` : ""}. Pilarna flyttar, Enter lägger dit, Esc avbryter.`);
  }
  function endPick() { if (state.pick) { state.pick = null; clearTargets(); } }
  function cardChosen(key) {

    if (p.place) return dropOn(it, p.after);
    return startPick(key);
  }
  function dropOn(it, after) {
    const t = taskById(state.pal?.task); if (!t) return;

  }
  /** Provet: hela kedjan som läggs in, med nytt slutdatum mot leveransen. Skriver ingenting. */
  async function insertPreview(t, it, after) {
    const payload = { after, ...(it.use ? { use: it.use } : { label: it.label }), ...(it.who ? { who: it.who } : {}) };

    catch (e) {

      return;
    }
    if (state.insert !== x) return;
    const pre = c.prerequisites || [], ins = c.inserts || [], late = !!c.end && c.end > c.due;
    live(c.fit?.cycle ? "Platsen går inte: den sluter en cirkel." : `Provat. ${ins.length} steg läggs in; uppgiften blir klar ${short(c.end)}.`);

      + (c.fit?.cycle ? `<p><b>Platsen sluter en cirkel i kedjan:</b> något som står före behöver det steget ger. Välj en annan plats.</p>` : "")
      + (pre.length ? `<p><b>Det här behöver ${pre.map((p) => `«${esc(p.label)}»`).join(", ")} först — läggs in före.</b></p>` : "")
      + `<ol class="how">${ins.map((s, k) => `<li>${esc(s.label)}${k < pre.length ? ` <span class="meta">· ger ${esc(pre[k].for_label)}${(pre[k].alternatives || []).length ? ` · eller ${pre[k].alternatives.map((a) => `«${esc(a.label)}»`).join(", ")}` : ""}</span>` : ""}</li>`).join("")}</ol>`
      + ((c.fit?.feeds || []).length ? `<p class="meta">${c.fit.feeds.map((f) => `«${esc(f)}»`).join(", ")} väntar på det.</p>` : "")
      + ((c.unresolved || []).length ? `<p class="meta">Inget i biblioteket ger ${esc(c.unresolved.join(", "))} — det behöver finnas på annat sätt innan steget kan göras.</p>` : "")
      + (c.end ? `<p>Uppgiften blir klar <b>${short(c.end)}</b>${c.end !== c.end_before ? ` (nu ${short(c.end_before)})` : ", samma dag som nu"} · leverans ${short(c.due)}`
        + `${late ? ` <span class="chip red">efter leveransen</span>` : ""}${c.critical ? ` <span class="chip amber">steget blir utan marginal</span>` : ""}</p>` : "")
      + `<p class="meta">Det här skrivs: ${ins.length > 1 ? `${ins.length} nya steg` : "ett nytt steg"} i uppgiften, som går att markera klart och ta bort igen.</p>`
      + `<div class="bar-actions"><button class="btn quiet" data-close="1">Avbryt</button>${c.fit?.cycle ? "" : `<button class="btn primary" data-insert-send="1">Lägg in</button>`}</div>`);
  }
  function sendInsert(btn) {
    const x = state.insert; if (!x) return;
    return busy(btn, async () => {
      try { const r = await call("task_lock", { task: x.task, add_step: { ...x.payload, with_prerequisites: true } });
        const n = (r?.inserted || []).length;
        state.insert = null; state.pal = null; closeDialog();
        await afterWrite(n > 1 ? `«${x.label}» och ${n - 1} steg före det står nu i uppgiften. Metoden är orörd.` : `«${x.label}» står nu i uppgiften. Metoden är orörd.`); }
      catch (e) { fail("Steget lades inte in", e); }
    });

  /** Dra med pekaren. Inte på telefon, och inte när paletten gäller en enda plats. */
  let palDrag = null;
  document.addEventListener("pointerdown", (e) => {
    const c = e.target.closest?.(".stcard[data-pal-card]");
    if (!c || e.button !== 0 || PHONE() || state.pal?.place) return;
    palDrag = { card: c, it: state.pal?.byKey[c.dataset.palCard], x0: e.clientX, y0: e.clientY, moved: false, ghost: null, over: null };
  });
  document.addEventListener("pointermove", (e) => {
    const d = palDrag; if (!d?.it) return;
    if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    if (!d.moved) {
      d.moved = true; endPick();
      d.ghost = d.card.cloneNode(true); d.ghost.classList.add("stghost"); d.ghost.removeAttribute("data-pal-card"); d.ghost.removeAttribute("tabindex");
      document.body.appendChild(d.ghost); markTargets(d.it);

    }

    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".chain .addstep[data-add-step]") || null;

  document.addEventListener("keydown", (e) => {
    if (state.pick) {

  /**

  /**
   * Rapportera fel (bug_report, B-221). Beskrivningen skriver man själv; var

  /** Samtalet på stället, i sin helhet, som text för en felrapport (B-250). */

      + `<label class="field"><span>Vad hände, och vad väntade du dig?</span><textarea id="bug-text" rows="5" maxlength="4000" placeholder="Jag tryckte på … och då …">${esc(error ? `Felet: ${error}\n\n` : "")}</textarea></label>`

      + `<p class="meta">Skickas med: var du står (${esc(bugPlace() || "startsidan")}), ${RECENT.errors.length === 1 ? "det senaste felet" : RECENT.errors.length ? `de senaste ${RECENT.errors.length} felen` : "inga fel"} och de senaste anropen vyn gjort — vilka verktyg och felkoder, inte innehållet.</p>`
      + `<div class="bar-actions"><button class="btn quiet" data-close="1">Avbryt</button><button class="btn primary" data-bug-send="1">Skicka rapporten</button></div><p class="warnnote" id="bug-state" role="alert"></p>`);

  function sendBug(btn) {

  function dialog(html) {
    $("#layer").innerHTML = `<div class="overlay" data-close-overlay="1"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;

  }
  const closeDialogOnly = () => { $("#layer").innerHTML = ""; };
  // En ruta som stängs utan svar är ett nej: Claude får veta att inget ändrades.
  const closeDialog = () => { state.write?.resolve(WRITE_NO); closeDialogOnly(); };
