        act: `<button class="btn sm" data-take-task="${esc(x.task)}" title="Alla ogjorda steg i uppgiften blir dina">Ta över uppgift</button>`,
        attrs: `data-open-step="${esc(x.task)}|${esc(x.step)}"` });
    // Lämnat till en kollega som inte tagit emot det än: en rad per uppgift, med antalet steg.
    if (x.kind === "handover_out")
      return row({ kind: `<span class="kind" title="Väntar på att ${esc(lbl(x.holder, "en kollega"))} tar emot">${ic("user")}</span>`, dot: custDot(x.customer?.color),
        title: `${esc(workTitle(t, x))}${addonChip(t)}${lvlChip}`, cust: lbl(x.customer),
        why: workWhy(x, t), when: short(x.due),
        attrs: `data-open-step="${esc(x.task)}|${esc(x.step)}"` });
    const handover = x.kind === "handover";
    return row({ kind: `<span class="kind q" title="${handover ? "Överlämning" : "Fråga"}">${ic(handover ? "user" : "help")}</span>`,
      dot: custDot(x.customer?.color), title: `${esc(x.headline)}${t ? ` <span class="ctx">— ${esc(taskName(t))}</span>${addonChip(t)}` : ""}${lvlChip}`, cust: lbl(x.customer), why: esc(x.reason),
      when: short(x.due), late: x.due < TODAY,
      act: `<button class="btn sm" data-open-q="${esc(x.open)}">${handover ? "Ta emot" : "Svara"}</button>`,
      attrs: `data-open-q="${esc(x.open)}"` });
  }
  const LEVEL_NAME = { hot: "brinner", today: "i dag", soon: "snart" };
  const LEVEL_RANK = { hot: 0, today: 1, soon: 2 };
  /**
   * Raderna per projekt (Daniel P 2026-09-25: *"På idagsidan behöver vi
   * gruppera uppgifter i samma projekt/åtagande"*). Grupperna räknas på
   * servern (agenda.groups); vyn tar bara bort det som filtret döljer, och en
   * grupp står under den mest brådskande av raderna som syns. En äldre server
   * utan grupper ger en rad per grupp, som förut.
   */
  function projectGroups(items, groups) {
    const byKey = new Map(items.map((x) => [x.key, x]));
    const gs = groups ?? items.map((x) => ({ key: x.key, items: [x.key], project: null, customer: x.customer }));
    return gs.map((g) => { const rows = g.items.map((k) => byKey.get(k)).filter(Boolean);
      return rows.length ? { ...g, rows, level: rows.reduce((l, x) => LEVEL_RANK[x.level] < LEVEL_RANK[l] ? x.level : l, rows[0].level) } : null; })
      .filter(Boolean);
  }
  /** Rader grupperade per projekt, som servern gör (groupItems) — för Alla, som vyn sätter ihop. */
  function clientGroups(items) {
    const out = new Map();
    for (const x of items) {
      const key = x.project?.id ?? `task|${x.task}`, g = out.get(key);
      if (!g) out.set(key, { key, project: x.project, customer: x.customer, items: [x.key] });
      else g.items.push(x.key);
    }
    return [...out.values()];
  }
  /**
   * Fälla ihop och ut (Daniel P 2026-09-25: "grupperade saker måste gå att
   * fälla ihop/ut också"). Läget sparas per grupp i webbläsaren.
   */
  const isFolded = (key) => !!(store.folded || {})[key];
  const foldBtn = (key, what) => `<button class="foldbtn" data-fold="${esc(key)}" aria-expanded="${!isFolded(key)}" title="${isFolded(key) ? `Fäll ut ${esc(what)}` : `Fäll ihop ${esc(what)}`}">${ic("chev")}</button>`;
  /** En grupp: med flera rader en rubrik med kund och projekt, och raderna under den. */
  function groupHtml(g, rowHtml) {
    if (g.rows.length < 2) return g.rows.map((x) => rowHtml(x, g.level)).join("");
    const name = g.project?.label || lbl(taskById(g.rows[0].task)?.deliverable, "Uppgifter");
    const key = `proj:${g.key}`;
    return `<div class="proj${isFolded(key) ? " folded" : ""}" ${g.project ? `data-open-project="${esc(g.project.id)}" title="Öppna projektet"` : ""}>${foldBtn(key, "projektet")}${custDot(g.customer?.color)}`
      + `<span>${g.customer ? `${esc(lbl(g.customer))} · ` : ""}${esc(name)}</span><span class="n">${g.rows.length} saker</span></div>`
      + (isFolded(key) ? "" : g.rows.map((x) => rowHtml(x, g.level).replace('<div class="row', '<div class="row inproj')).join(""));
  }
  function agendaRows(items, groups = S.agenda?.groups) {
    const levels = [["hot", "Brinner", "görs i dag, annars spricker något"], ["today", "I dag", "planerat nu"], ["soon", "Snart", "det som förfaller först"]];
    const all = projectGroups(items, groups);
    return levels.map(([lvl, name, hint]) => {
      const gs = all.filter((g) => g.level === lvl);
      if (!gs.length) return "";
      const shown = lvl === "soon" && !store.showSoon ? gs.slice(0, 3) : gs;
      const key = `lvl:${lvl}`;
      return `<div class="group ${lvl === "hot" ? "hot" : ""}${isFolded(key) ? " folded" : ""}">${foldBtn(key, name)}<b>${name}</b><span>${hint}</span></div>`
        + (isFolded(key) ? "" : shown.map((g) => groupHtml(g, agendaRow)).join(""))
        + (lvl === "soon" && gs.length > 3 ? `<div class="foot"><button class="btn quiet sm" data-toggle-soon="1">${store.showSoon ? "Visa färre" : `Visa alla ${gs.length}`}</button></div>` : "");
    }).join("") || `<div class="empty"><b>Inget väntar på dig.</b>Allt som kommit in är bedömt, och inget steg ligger på i dag.</div>`;
  }

  const MODULES = {
    min: { name: "Min lista", size: "full", html: () => {
      // Mina · Andras · Alla (Daniel P 2026-09-25: "på idagsidan borde man
      // kunna filtrera sina egna och andras uppgifter"). Valet sparas.
      const who = store.who || "mine";
      const mina = agenda().filter((x) => x.kind !== "handover"), andras = S.agenda?.others ?? [];
      const all = who === "others" ? andras
        : who === "all" ? [...mina, ...andras.filter((x) => !mina.some((m) => m.key === x.key))] : mina;
      const groups = who === "others" ? S.agenda?.others_groups : who === "all" ? clientGroups(all) : S.agenda?.groups;
      const f = state.filter;
      const isWork = (x) => x.kind === "step" || x.kind === "colleague" || x.kind === "handover_out";
      const vis = all.filter((x) => f === "all" || (f === "work" && isWork(x)) || (f === "q" && !isWork(x)));
      const n = (k) => k === "all" ? all.length : all.filter((x) => (k === "work" ? isWork(x) : !isWork(x))).length;
      return `<div class="card"><div class="head"><h2>${who === "others" ? "Andras" : who === "all" ? "Allas" : "Min lista"}</h2><span class="meta">${all.length} saker</span><div class="right"><div class="seg">`
        + [["mine", "Mina"], ["others", "Andras"], ["all", "Alla"]].map(([k, l]) => `<button data-who="${k}" aria-pressed="${who === k}">${l}</button>`).join("")
        + `</div><div class="seg" title="Hur långt fram listan visar">`
        + [[1, "Veckan"], [2, "2 v"], [3, "3 v"], [4, "4 v"], [0, "Allt"]].map(([k, l]) => `<button data-ahead="${k}" aria-pressed="${aheadWeeks() === k}">${l}</button>`).join("")
        + `</div><div class="seg">`
        + [["all", "Allt"], ["work", "Arbete"], ["q", "Frågor"]].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${f === k}">${l}<span class="n">${n(k)}</span></button>`).join("")
        + `</div></div></div>${agendaRows(vis, groups)}</div>`;
    } },
    /* Till dig: meddelanden från kollegor som du inte markerat läst (B-220) och
       överlämningar som väntar på att du tar emot dem. Båda ur agendan. */
    tilldig: { name: "Till dig", size: "half", html: () => {
      const h = agenda().filter((x) => x.kind === "handover");
      // Meddelanden som står på en rad i Min lista visas där, inte här också (B-261).
      const ms = (S.agenda?.messages ?? []).filter((m) => !m.row);
      const openAttr = (a) => !a ? "" : a.thread ? `data-open-case="${esc(a.thread)}"` : a.open ? `data-open-q="${esc(a.open)}"` : a.task && a.step ? `data-open-step="${esc(a.task)}|${esc(a.step)}"` : "";
      const msg = (m) => `<div class="inmsg"><div class="meta"><b>${esc(lbl(m.from, "En kollega"))}</b> · ${short(m.at)}${m.about_label ? ` · om ${esc(m.about_label)}` : ""}${(m.also_to || []).length ? ` · även till ${m.also_to.map((x) => esc(lbl(x))).join(", ")}` : ""}</div>`
        + `<div class="msgtext">${esc(m.text)}</div><div class="bar-actions">${openAttr(m.about) ? `<button class="btn sm" ${openAttr(m.about)}>Öppna</button>` : ""}<button class="btn sm quiet" data-msg-read="${esc(m.id)}">Markera läst</button></div></div>`;
      // Åtaganden som väntar på ett ja (felrapport 2026-09-25): utan det blir inga uppgifter.
      const pc = S.agenda?.pending_confirmation ?? [];
      // Varje förslag är granskat på servern (vetting): det som måste rättas
      // står under raden och då går det inte att bekräfta; det som bara liknar
      // något som finns visas, men stoppar inte.
      const förslag = (c) => { const v = c.vetting || { ok: true, problems: [], similar: [] };
        return row({ kind: `<span class="kind warn" title="Väntar på ditt ja">${ic("help")}</span>`, dot: custDot(c.customer?.color),
        title: `${esc(c.label)} <span class="chip amber">förslag</span>${v.ok ? "" : ` <span class="chip red">behöver rättas</span>`}`, cust: lbl(c.customer),
        why: esc((c.covers || []).map((l) => `${l.quantity ?? ""} ${lbl(l.deliverable)}${l.due ? ` senast ${short(l.due)}` : ""}`.trim()).join(" · ")
          || (PROPOSAL_KIND[c.kind] || "Förslag") + (c.summary ? ` · ${c.summary}` : "")) + vettingNote(v),
        act: v.ok ? `<button class="btn sm primary" data-confirm-node="${esc(c.id)}">Bekräfta</button>`
          : `<button class="btn sm" disabled title="Rätta det som står under förslaget först">Bekräfta</button>` }); };
      const n = h.length + ms.length + pc.length;
      return `<div class="card"><div class="head"><h2>Till dig</h2><span class="meta">${n || ""}</span></div>`
        + pc.map(förslag).join("") + ms.map(msg).join("") + h.map((x) => agendaRow(x)).join("")
        + (n ? "" : `<div class="empty"><b>Inget till dig.</b>Meddelanden från kollegor och steg som lämnas över till dig står här tills du läst eller tagit emot dem.</div>`) + `</div>`;
    } },
    hosandra: { name: "Hos andra", size: "half", html: () => {
      const w = S.agenda?.waiting_on_others ?? [];
      return `<div class="card"><div class="head"><h2>Hos andra</h2><span class="meta">${w.length || ""}</span></div>`
        + (w.length ? projectGroups(w, S.agenda?.waiting_groups).slice(0, 5).map((g) => groupHtml(g, (x, lvl) => x.kind === "handover_out" ? agendaRow(x, lvl) : row({ kind: kindMark("ext"), dot: custDot(x.customer?.color), title: taskById(x.task) ? esc(workTitle(taskById(x.task))) : esc(x.headline),
            cust: lbl(x.customer), why: taskById(x.task) ? workWhy(x, taskById(x.task)) : esc(x.reason), when: short(x.due), late: x.due < TODAY,
            attrs: `data-open-step="${esc(x.task)}|${esc(x.step)}"` }))).join("")
          : `<div class="empty"><b>Inget väntar på andra.</b>Steg som görs av kunden eller en partner, och steg du lämnat till en kollega som inte tagit emot dem, hamnar här.</div>`) + `</div>`;
    } },
    veckan: { name: "Veckan", size: "full", html: () => {
      // Valfri vecka (Daniel P 2026-09-25: "kan man inte se nästa veckas
      // kalender förresten … eller valfri vecka").
      const mon = state.weekFrom || monday(TODAY);
      const days = [0, 1, 2, 3, 4].map((i) => add(mon, i));
      const me = S.agenda?.party?.id;
      const mine = (st) => (st.responsible?.id ?? st.responsible) === me;
      // Ett tidsrutnät med klockslag till vänster (Daniel P 2026-09-25: "med
      // klockslag till vänster kanske"), samma som i Lägg i kalendern. Ett steg
      // med pass hör till passens dagar, och bara dem (B-097).
      const rows = (CAL_END - CAL_START) * 2, h = rows * CAL_ROW;
      const y = (m) => Math.max(0, (m - CAL_START * 60) / 30 * CAL_ROW);
      const col = (day) => {
        const ps = tasks().flatMap((t) => t.steps.filter((st) => mine(st)).flatMap((st) =>
          (st.sessions || []).filter((x) => String(x.start).slice(0, 10) === day).map((x) => ({ t, st, x }))));
        const meets = S.meetings?.[day] || [];
        const past = day < TODAY ? h : day === TODAY ? Math.max(0, y(toMin(nowHM()))) : 0;
        return `<div class="calcol wk" data-dropday="${day}" style="height:${h}px">`
          + (past ? `<div class="calpast" style="height:${Math.min(h, past)}px"></div>` : "")
          + meets.map((m) => { const f = toMin(String(m.start).slice(11, 16));
            return `<div class="calev meet" style="top:${y(f)}px;height:${Math.max(CAL_ROW - 2, (m.minutes || 30) / 30 * CAL_ROW - 2)}px" title="${esc(toHm(f))} ${esc(m.private ? "Upptaget" : (m.title || "upptagen"))}"><b>${toHm(f)}</b> ${esc(m.private ? "Upptaget" : (m.title || "upptagen"))}</div>`; }).join("")
          + ps.map(({ t, st, x }) => { const f = toMin(String(x.start).slice(11, 16));
            return `<div class="calev pass${st.done ? " done" : ""}" data-open-step="${esc(t.id)}|${esc(st.step)}" style="top:${y(f)}px;height:${Math.max(CAL_ROW - 2, (x.minutes || 30) / 30 * CAL_ROW - 2)}px" title="${esc(toHm(f))} ${esc(st.label)} — ${esc(taskName(t))}"><b>${toHm(f)}</b> ${esc(st.label)}</div>`; }).join("")
          + `</div>`;
      };
      const grid = `<div class="calwrap wkwrap"><div class="calgrid" style="grid-template-columns:44px repeat(${days.length},minmax(0,1fr))">`
        + `<div></div>${days.map((dd) => `<div class="calhead${dd === TODAY ? " today" : ""}">${wday(dd)}</div>`).join("")}`
        + `<div class="caltimes" style="height:${h}px">${Array.from({ length: CAL_END - CAL_START }, (_, k) => `<span style="top:${k * 2 * CAL_ROW}px">${String(CAL_START + k).padStart(2, "0")}</span>`).join("")}</div>`
        + days.map(col).join("") + `</div></div>`;
      // Veckan visar det som är bokat: pass och möten. Stegen i tur står i Min
      // lista, och räknas inte fram en gång till här (B-261).
      const utanPass = agenda().filter((x) => x.kind === "step" && !(stepOf(taskById(x.task), x.step)?.sessions || []).length).length;
      const nav = `<div class="right"><div class="seg"><button data-weekshift="-1" aria-label="Förra veckan">‹</button><button data-weekshift="0" aria-pressed="${mon === monday(TODAY)}">Denna vecka</button><button data-weekshift="1" aria-label="Nästa vecka">›</button></div>`
        + ` <label class="meta">Vecka med <input type="date" data-weekpick="1" value="${esc(mon)}"></label></div>`;
      const förr = mon < monday(TODAY) ? `<div class="foot meta">Möten visas bara från i dag och framåt; pass som redan legat syns.</div>` : "";
      return `<div class="card"><div class="head"><h2>Veckan</h2><span class="meta">v${week(mon)} · ${short(mon)}–${short(add(mon, 4))} · dina pass och möten</span>${nav}</div>`
        + grid
        + förr + (utanPass ? `<div class="foot meta">${utanPass} steg i Min lista har inget pass bokat.</div>` : "") + `</div>`;
    } },
    /* Teamet: belastningen per person denna vecka, som servern räknar den
       (B-197). Inga exempelrader. */
    team: { name: "Teamet i korthet", size: "half", html: () => {
      const v = `${TODAY.slice(0, 4)}-W${String(week(TODAY)).padStart(2, "0")}`;
      const rows = (S.plan?.load || []).filter((l) => l.week === v);
      return `<div class="card"><div class="head"><h2>Teamet i korthet</h2><span class="meta">v${week(TODAY)}</span></div>`
        + (rows.length ? `<div class="section">` + rows.map((l) => `<div class="meta">${esc(personName(l.person))}: ${Math.round(l.hours)} h av ${Math.round(l.capacity_hours ?? 0)} h${l.capacity_guessed ? " (gissad kapacitet)" : ""}</div>`).join("") + `</div>`
          : `<div class="empty"><b>Ingen belastning räknad för veckan.</b></div>`) + `</div>`;
    } },
  };
  const ROLE_DEFAULT = ["min", "tilldig", "hosandra", "veckan"];
  const modules = () => store.modules || ROLE_DEFAULT;

  const SCREENS = {
    idag() {
      const hot = agenda().filter((x) => x.level === "hot" && x.kind !== "colleague").length;
      return `<div class="pagehead"><h1>Idag</h1><span class="sub">${wday(TODAY)}${hot ? ` · <span style="color:var(--red)">${hot} brinner</span>` : ""}</span>`
        + `<div class="actions"><button class="btn" data-customize="1">Anpassa</button></div></div>`
        + `<div class="grid2">${modules().map((k) => MODULES[k] ? `<div class="mod ${MODULES[k].size}">${MODULES[k].html()}</div>` : "").join("")}</div>`;
    },
    in() {
      const q = S.queue;
      if (S.queueError && !q) return `<div class="pagehead"><h1>In</h1></div><div class="empty"><b>Posten kunde inte läsas.</b>${esc(S.queueError.message)}<div style="margin-top:12px"><button class="btn" data-reload-queue="1">Hämta igen</button></div></div>`;
      if (!q) return `<div class="pagehead"><h1>In</h1></div><div class="empty"><b>Hämtar posten…</b></div>`;
      const lists = queueLists(q);
      const tab = lists[state.inTab] ? state.inTab : "bedoma";
      const tabs = [["bedoma", "Att bedöma"], ["bedomt", "Bedömt"], ["avklarat", "Avklarat"]];
      const rows = lists[tab];
      const body = (state.batch ? batchCard() : "")
        + (rows.length ? `<div class="card">${rows.map((x) => caseRow(x, tab)).join("")}</div>`
          : `<div class="empty"><b>${tab === "bedoma" ? "Inget att bedöma." : tab === "bedomt" ? "Inget bedömt ligger öppet." : "Inget avklarat de senaste 60 dagarna."}</b></div>`)
        + (tab === "bedoma" && rows.length ? `<div style="margin-top:12px"><button class="btn ai" data-func="triage_all">${SP} Gå igenom alla ${rows.length}</button> <span class="meta">förslagen visas som kort — inget skrivs förrän du godtar</span></div>` : "");
      return `<div class="pagehead"><h1>In</h1><span class="sub">Det som kommit in, och vad det ska bli</span>`
        + `<div class="actions"><button class="btn" data-fetch-mail="1">${ic("inbox")} Hämta post</button></div></div>`
        + `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-intab="${k}" aria-selected="${tab === k}">${l}<span class="n">${lists[k].length}</span></button>`).join("")}</div>` + body;
    },

    planen() {
      const modes = [["tidslinje", "Tidslinje"], ["projekt", "Projekt"], ["teamet", "Teamet"], ["kunder", "Kunder"]];
      const head = `<div class="pagehead"><h1>Planen</h1><div class="seg">${modes.map(([k, l]) => `<button data-planmode="${k}" aria-pressed="${state.planMode === k}">${l}</button>`).join("")}</div>`
        + (state.planMode === "tidslinje" ? "" : `<span class="meta">Horisont</span><div class="seg">${[4, 12, 26].map((w) => `<button data-horizon="${w}" aria-pressed="${state.horizon === w}">${w} v</button>`).join("")}</div>`)
        + `<div class="actions"><button class="btn primary" data-order-open="1">Lägg in beställning</button></div></div>`;
      return head + ({ tidslinje: timeline, projekt: projects, teamet: team, kunder: customers }[state.planMode])();
    },

    metoder() {
      const head = `<div class="pagehead"><h1>Metoder</h1><span class="sub">Hur vi gör — och vad som kan göras bättre</span><div class="actions"><button class="btn primary" data-build="1">${SP} Bygg en metod</button></div></div>`;
      if (!S.lib) return head + (S.libError ? `<div class="empty"><b>Biblioteket kunde inte läsas.</b>${esc(S.libError.message || S.libError)}<div style="margin-top:12px"><button class="btn" data-reload-lib="1">Hämta igen</button></div></div>`
        : `<div class="empty"><b>Hämtar biblioteket…</b></div>`);
      if (state.metTab === "ledtider") ensureLeadTimes();
      // Leveranstypernas namn (guide) behövs för "levererar …"; hämtas en gång.
      if (!S.types && !S.typesAsked) { S.typesAsked = true; deliverableTypes().then(() => { if (state.screen === "metoder" && !state.obj) render(); }); }
      const gaps = libEntries("atom_proposal").filter((u) => u.unbuilt).length;
      const tabs = [["bibliotek", "Bibliotek", libEntries("method").length], ["forbattra", "Förbättra", improveCards().length], ["ledtider", "Ledtider", S.lead?.rows ? S.lead.rows.filter((r) => r.origin === "guessed").length || "" : ""], ["luckor", "Luckor", gaps || ""]];
      const body = { bibliotek: library, forbattra: improve, ledtider: leadTable, luckor: gapsList }[state.metTab] || library;
      return head
        + `<details class="how"><summary>Hur funkar det?</summary><p>En <b>metod</b> är stegen för en leverans. Varje steg görs av kod ${kindMark("code")}, Claude ${kindMark("llm")} eller en människa ${kindMark("human")}. Under stegen finns <b>molekyler</b> (en sak som händer) och <b>atomer</b> (koden). En kund kan ha egna skillnader i ett <b>kundflöde</b> — metoden är gemensam, kunden anpassad.</p></details>`
        + `<div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-mettab="${k}" aria-selected="${state.metTab === k}">${l}${n !== "" ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>` + body();
    },
    filer() {
      if (!FB.customers && !FB.error && !FB.loading) queueMicrotask(loadFileCustomers);
      return `<div class="pagehead"><h1>Filer</h1><span class="sub">Kundernas filer, i samma mappar som de kom ifrån</span>`
        + `<div class="actions"><input type="search" class="fsearch" data-fq="1" value="${esc(FB.q)}" placeholder="Filtrera: filnamn eller mapp" aria-label="Filtrera filerna">`
        + `<button class="btn quiet" data-freload="1">Hämta igen</button></div></div>`
        + `<div id="flist">${filesBody()}</div>`;
    },
    installningar() {
      const head = `<div class="pagehead"><h1>Inställningar</h1><span class="sub">Dina val — gäller bara dig och sparas på dig i dirigenten</span>`
        + `<div class="actions"><button class="btn" data-setreload="1">Hämta igen</button></div></div>`;
      if (!S.settings) return head + (S.settingsError
        ? `<div class="empty"><b>Inställningarna kunde inte hämtas.</b>${esc(S.settingsError.message || S.settingsError)}. Inget är ändrat.</div>`
        : `<div class="empty"><b>Hämtar dina inställningar…</b></div>`);
      const ch = settingsChanged();
      return head + (S.settingsError ? `<div class="warnnote" style="margin-bottom:12px">Kunde inte hämta igen: ${esc(S.settingsError.message || S.settingsError)}. Det du ser är från förra hämtningen.</div>` : "")
        + `<div class="stack" data-settings="1">${[connectionsCard, calendarCard, mailCard, workdayCard, myAreaCard].map((f) => {
          // En trasig ruta tar inte med sig de andra.
          try { return f(); } catch (e) { console.error(e); return `<div class="card"><div class="empty"><b>Den här delen kunde inte visas.</b>${esc(e.message)}</div></div>`; }
        }).join("")}`
        + `<div class="setbar bar-actions"><button class="btn primary" data-setsave="1" ${ch ? "" : "disabled"}>Spara ändringarna</button><span class="meta" id="set-state">${ch ? "Osparade ändringar." : "Allt är sparat."}</span></div></div>`;
    },
  };

  /* ── Inställningar (B-218) ───────────────────────────────────────────
     Samma väg som den nuvarande vyn (B-100): läses med plan_state
     settings: true och skrivs tillbaka med registry_define — hela posten ur
     svaret med bara de fält som visas här ändrade, så att grinden prövar den.
     Kopplingarna, kalendrarna, färgerna och etiketterna kommer ur svaret:
     en sida som räknar upp dem själv blir fel dagen en till kommer.
     Prototypens tokentak och rollkort finns inte på servern och visas inte
     (design 14.2). Modulerna på Idag har inget fält på personen än. */
  const asObj = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : {});
  const asArr = (x) => (Array.isArray(x) ? x : []);
  const ZONES = ["Europe/Stockholm", "Europe/Helsinki", "Europe/London", "UTC"];
  const GROUPINGS = [["area", "Område"], ["customer", "Kund"], ["responsible", "Ansvarig"], ["urgency", "Brådska"]];
  /** Verktygen vyn anropar. Provet håller listan i takt med `call("…")` i koden. */
  const TOOLS_USED = ["search", "task_lock", "asset_get", "asset_register", "bug_report", "content_get", "content_save", "context", "library_check", "note_link", "read_call", "classify_accept", "execute_step", "guide", "intake_status", "intake_submit",
    "message", "method_build", "plan_state", "registry_define"];

  /**
   * Svaret som ytan arbetar med. Servern kan svara utan kopplingar eller val —
   * det är en koppling som inte är gjord, inte ett fel — och då visas rutan
   * tom och förklarad. `settings.view` bär bara grupperingen; auto_triage står
   * på posten (`node.view`), och läses där.
   */
  function normalizeSettings(raw) {
    const r = asObj(raw), k = asObj(r.calendar), m = asObj(r.mail), w = asObj(r.workday), node = asObj(r.node);
    return {
      node, label: typeof r.label === "string" ? r.label : "",
      connections: asArr(r.connections), options: asObj(r.options),
      calendar: {
        calendars: Array.isArray(k.calendars) ? k.calendars : null,
        skip_colors: asArr(k.skip_colors),
        skip_word: typeof k.skip_word === "string" && k.skip_word ? k.skip_word : null,
        only_accepted: k.only_accepted !== false,
        private_counts: k.private_counts === true,
      },
      mail: { labels: asArr(m.labels), never_labels: asArr(m.never_labels) },
      workday: {
        from: Number.isFinite(w.from) ? w.from : 8, to: Number.isFinite(w.to) ? w.to : 18,
        timezone: typeof w.timezone === "string" && w.timezone ? w.timezone : "Europe/Stockholm",
      },
      view: {
        grouping: asObj(r.view).grouping || asObj(node.view).grouping || "area",
        auto_triage: asObj(node.view).auto_triage === true || asObj(r.view).auto_triage === true,
      },
    };
  }
  const draftOf = (s) => structuredClone({ calendar: s.calendar, mail: s.mail, workday: s.workday, view: s.view });
  const settingsChanged = () => !!S.settings && JSON.stringify(S.setDraft) !== JSON.stringify(draftOf(S.settings));

  /** Namnet under menyn (B-209): inställningarna bär personens egen post. */
  function showWhoAmI(label) {
    const name = typeof label === "string" ? label.trim() : "";
    if (!name) return;
    $("#me-name").textContent = name;
    $("#me-initials").textContent = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    $(".rail .me")?.setAttribute("title", "Inställningar och Min yta");
  }

  // Kopplingen görs i en egen flik hos Google. När man kommer tillbaka läses
  // läget om, så att "kopplad" syns utan att man behöver hämta igen.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (state.screen === "installningar" && !state.obj) loadSettings();
    // Tillbaka i fönstret: hämta bara det som blivit gammalt.
    else refreshStale();
  });
  async function loadSettings() {
    if (!mcp) return;
    try {
      const d = await withTimeout(call("plan_state", { settings: true }), 45000, "Inställningarna");
      if (!d?.settings) throw new Error("svaret saknade inställningar — servern kan vara en äldre version");
      S.settings = normalizeSettings(d.settings); S.setDraft = draftOf(S.settings); S.settingsError = null; S.at.settings = Date.now();
      showWhoAmI(S.settings.node.label || S.settings.label);
    } catch (e) { S.settingsError = e; }
    if (state.screen === "installningar" && !state.obj) render();
  }

  /**
   * Har kopplingen i claude.ai de verktyg vyn anropar? claude.ai läser listan
   * en gång per anslutning, så ett verktyg som tillkommit sedan dess är
   * osynligt tills man kopplar om. Kan listan inte läsas här visas ingenting.
   */
  async function checkTools() {
    if (typeof mcp?.listTools !== "function") return;
    try {
      const r = await mcp.listTools(SERVER);
      const info = (r?.servers || []).find((x) => x.server === SERVER) ?? (r?.servers || [])[0];
      if (!info) throw new Error("kopplingen svarade utan att lista sig");
      const have = new Set((info.tools || []).map((t) => t.name));
      S.tools = { count: have.size, missing: TOOLS_USED.filter((n) => !have.has(n)) };
    } catch (e) { S.tools = { error: e.message || String(e) }; }
    if (state.screen === "installningar" && !state.obj) render();
  }

  const hourToClock = (h) => {
    const n = Number(h);
    if (!Number.isFinite(n)) return "08:00";
    const t = Math.max(0, Math.min(23, Math.floor(n))), m = Math.round((n - Math.floor(n)) * 60);
    return `${String(t).padStart(2, "0")}:${String(m === 60 ? 0 : m).padStart(2, "0")}`;
  };
  const clockToHour = (v) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(v).trim());
    if (!m || Number(m[1]) > 24 || Number(m[2]) > 59) return null;
    return Number(m[1]) + Number(m[2]) / 60;
  };
  const dayLength = (w) => {
    const len = Math.max(0, (w.to ?? 0) - (w.from ?? 0));
    return len > 0 ? `Det blir ${String(Math.round(len * 10) / 10).replace(".", ",")} ${len === 1 ? "timme" : "timmar"} om dagen.`
      : `<span style="color:var(--red)">Slutet ligger inte efter början.</span>`;
  };
  /** Varför en lista är tom, med serverns eget skäl. */
  const settingMissing = (what) => asArr(S.settings?.options.unavailable).find((u) => u?.what === what || u?.what === "allt");

  function connectionsCard() {
    const rows = S.settings.connections, done = new Set(rows.filter((r) => r.connected).map((r) => r.key));
    const body = rows.length ? rows.map((r) => {
      // Länken ber om det raden kräver också (src/google/scopes.ts: kalendern
      // följer alltid med), så raden spärras inte — den kopplar båda (B-228).
      const blocked = false;
      const needs = r.requires && !done.has(r.requires) ? (rows.find((x) => x.key === r.requires)?.label || r.requires) : null;
      const chip = r.connected ? `<span class="chip green">kopplad</span>` : r.unreadable ? `<span class="chip amber">går inte att läsa</span>` : `<span class="chip">inte kopplad</span>`;
      return `<div class="setrow"><div class="txt"><div class="t">${esc(r.label || r.key || "Namnlös koppling")} ${chip}</div>`
        + (r.summary ? `<div class="meta">${esc(r.summary)}</div>` : "")
        + (asArr(r.rights).length ? `<ul>${asArr(r.rights).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "")
        + (r.linked_at && r.connected ? `<div class="meta">Kopplad ${esc(short(r.linked_at))}</div>` : "")
        + (needs ? `<div class="meta">Kopplar ${esc(needs)} samtidigt.</div>` : "")
        + (r.unreadable ? `<div class="warnnote">${esc(r.unreadable)}</div>` : "")
        + `</div><div class="acts">`
        + (blocked || !r.connect_url ? "" : `<a class="btn sm" href="${esc(r.connect_url)}" target="_blank" rel="noopener">${r.connected ? "Koppla om" : "Koppla"}</a>`)
        + (r.connected && r.disconnect_url ? `<a class="btn quiet sm" href="${esc(r.disconnect_url)}" target="_blank" rel="noopener">Koppla bort</a>` : "")
        + `</div></div>`;
    }).join("") : `<div class="empty"><b>Servern har ingen kopplingsväg.</b>Kopplingar går inte att göra härifrån.</div>`;
    const t = S.tools;
    const tools = !t ? "" : `<div class="setrow"><div class="txt"><div class="t">Dirigenten i claude.ai ${t.error ? `<span class="chip amber">går inte att läsa</span>` : t.missing.length ? `<span class="chip amber">gammal verktygslista</span>` : `<span class="chip green">${t.count} verktyg</span>`}</div>`
      + (t.error ? `<div class="meta">${esc(t.error)}</div>`
        : t.missing.length ? `<div class="warnnote">Vyn använder verktyg som din koppling inte känner: ${esc(t.missing.join(", "))}. Koppla om rotor-dirigenten i claude.ais inställningar — listan läses bara när kopplingen görs.</div>`
          : `<div class="meta">Kopplingen har alla verktyg vyn använder.</div>`) + `</div></div>`;
    const web = !WEB.on ? "" : `<div class="setrow"><div class="txt"><div class="t">Dirigentens egen adress <span class="chip green">inloggad</span></div>`
      + `<div class="meta">Du är inloggad med Google här. Claude i panelen och HubSpot finns bara när vyn är öppen i claude.ai.</div></div>`
      + `<div class="acts"><a class="btn quiet sm" href="${WEB.logoutUrl}">Logga ut</a></div></div>`;
    const n = rows.length ? `${done.size} av ${rows.length} kopplade` : "";
    return `<div class="card"><div class="head"><h2>Kopplingar</h2><span class="meta">${n}</span></div>${body}${tools}${web}`
      + (rows.some((r) => !r.connected) ? `<div class="foot meta">Kopplingen görs hos Google i en ny flik. Tryck Hämta igen när du är klar.</div>` : "") + `</div>`;
  }

  function calendarCard() {
    const o = S.settings.options, c = S.setDraft.calendar, gone = settingMissing("kalendrar");
    const cals = asArr(o.calendars).map((k) => {
      // Utan eget val räknas bara den egna (primära) kalendern.
      const on = c.calendars ? c.calendars.includes(k.id) : k.primary;
      return `<label class="check"><input type="checkbox" data-setcal="${esc(k.id)}" ${on ? "checked" : ""}> <span>${esc(k.label)}${k.primary ? " <span class='meta'>din egen</span>" : ""}</span></label>`;
    }).join("");
    const colors = asArr(o.colors).map((x) => `<label class="check"><input type="checkbox" data-setcolor="${esc(x.id)}" ${c.skip_colors.includes(x.id) ? "checked" : ""}> <span><i class="swatch" style="background:${esc(x.hex)}"></i>${esc(x.label)}</span></label>`).join("");
    return `<div class="card"><div class="head"><h2>Kalender</h2><span class="meta">Vad som räknas som din tid</span></div><div class="section">`
      + `<div class="label">Kalendrar som räknas som din tid</div><div class="meta">Standard är bara din egen. Det som kommer ut är timmar per dag — aldrig vad ett möte handlar om.</div>`
      + (gone ? `<div class="warnnote">Kalendern måste kopplas innan dina kalendrar går att lista.</div>` : `<div class="setchecks">${cals || `<span class="meta">Inga kalendrar hittades.</span>`}</div>`)
      + `<div class="label" style="margin-top:8px">Färger som betyder ”räkna inte”</div><div class="meta">Sätt färgen på händelsen i Google Kalender. Färgen jämförs inne i dirigenten och sparas aldrig.</div>`
      + (gone ? "" : `<div class="setchecks">${colors || `<span class="meta">Inga färger hittades.</span>`}</div>`)
      + `<div class="fields" style="margin-top:8px"><label class="field"><span>Ord i rubriken som betyder ”räkna inte”</span><input type="text" data-setword="1" value="${esc(c.skip_word || "")}" placeholder="t.ex. ej upptagen"></label></div>`
      + `<label class="check" style="margin-top:8px"><input type="checkbox" data-setaccepted="1" ${c.only_accepted ? "checked" : ""}> <span>Räkna bara det du tackat ja till</span></label>`
      + `<label class="check"><input type="checkbox" data-setprivate="1" ${c.private_counts ? "checked" : ""}> <span>Räkna tid som är märkt privat i kalendern som arbetstid</span></label>`
      + `<div class="meta">Privatmärkta händelser syns alltid i din egen vy, med rubrik. Ingen annan ser dem, och de sparas aldrig.</div>`
      + `</div></div>`;
  }

  function mailCard() {
    const m = S.setDraft.mail, gone = settingMissing("etiketter"), labels = asArr(S.settings.options.labels);
    const pick = (key, chosen) => `<div class="setchecks">${labels.map((l) => `<label class="check"><input type="checkbox" data-setlabel="${key}" value="${esc(l.id)}" ${chosen.includes(l.id) ? "checked" : ""}> <span>${esc(l.label)}${l.kind === "system" ? " <span class='meta'>Googles egen</span>" : ""}</span></label>`).join("") || `<span class="meta">Inga etiketter hittades.</span>`}</div>`;
    return `<div class="card"><div class="head"><h2>Post</h2><span class="meta">Vilken post som blir ärenden</span></div><div class="section">`
      + `<div class="meta">Inflödet läser valet: bara posten med etiketterna under Tas in blir ärenden, och aldrig den under Tas aldrig in.</div>`
      + (gone ? `<div class="warnnote">Posten måste kopplas innan dina etiketter går att lista.</div>`
        : `<div class="label" style="margin-top:8px">Tas in</div>${pick("in", m.labels)}<div class="label">Tas aldrig in <span class="meta">— vinner när en etikett står i båda</span></div>${pick("never", m.never_labels)}`)
      + `<label class="check" style="margin-top:8px"><input type="checkbox" data-setauto="1" ${S.setDraft.view.auto_triage ? "checked" : ""}> <span>Låt Claude bedöma ny post av sig själv</span></label>`
      + `<div class="meta">Bedömningen blir ett förslag som väntar på ditt ja, aldrig en skrivning. Valet sparas på dig; den nya vyn bedömer inte av sig själv än — använd Gå igenom posten under In.</div>`
      + `</div></div>`;
  }

  function workdayCard() {
    const w = S.setDraft.workday;
    return `<div class="card"><div class="head"><h2>Arbetsdag</h2><span class="meta">Används av kalenderberäkningen</span></div><div class="section">`
      + `<div class="meta" style="margin-bottom:8px">Ett kvällsmöte stjäl ingen tid planen ändå inte har, och en heldagsmarkering blir en arbetsdag, inte ett dygn.</div>`
      + `<div class="settime"><label class="field"><span>Börjar</span><input type="time" step="900" data-setfrom="1" value="${esc(hourToClock(w.from))}"></label>`
      + `<label class="field"><span>Slutar</span><input type="time" step="900" data-setto="1" value="${esc(hourToClock(w.to))}"></label>`
      + `<label class="field"><span>Tidszon</span><select data-setzone="1">${[...new Set([w.timezone, ...ZONES])].map((z) => `<option ${z === w.timezone ? "selected" : ""}>${esc(z)}</option>`).join("")}</select></label></div>`
      + `<div class="meta" id="set-daylen" style="margin-top:8px">${dayLength(w)}</div></div></div>`;
  }

  function myAreaCard() {
    const g = S.setDraft.view.grouping;
    return `<div class="card"><div class="head"><h2>Min yta</h2></div><div class="section">`
      + `<div class="fields"><label class="field"><span>Gruppera listorna på</span><select data-setgrouping="1">${GROUPINGS.map(([k, l]) => `<option value="${k}" ${g === k ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>`
      + `<div class="meta" style="margin-top:4px">Sparas på dig och gäller listorna i den nuvarande vyn. Den nya vyns listor grupperas inte än.</div>`
      + `<div class="bar-actions" style="margin-top:12px"><button class="btn" data-customize="1">Välj moduler på Idag</button></div>`
      + `<div class="meta" style="margin-top:4px">Valet av moduler sparas bara i den här webbläsaren. Det följer inte med till en annan dator förrän dirigenten har en plats för det på dig.</div>`
      + `</div></div>`;
  }

  /** Spara-raden: knappen och läget, utan att sidan ritas om (fokus står kvar). */
  function patchSettings() {
    const b = $("[data-setsave]"), st = $("#set-state"), ch = settingsChanged();
    if (b) b.disabled = !ch;
    if (st) st.textContent = ch ? "Osparade ändringar." : "Allt är sparat.";
  }

  function saveSettings(btn) {
    const s = S.settings, dr = S.setDraft;
    if (!s || !settingsChanged()) return;
    if (!Object.keys(s.node).length) return toast("Servern skickade ingen post att skriva tillbaka, så ändringarna går inte att spara härifrån.", null, true);
    if (dr.workday.to <= dr.workday.from) return toast("Arbetsdagen måste sluta efter att den börjat.", null, true);
    const before = structuredClone(s.node), node = structuredClone(s.node), orig = draftOf(s);
    const differs = (k) => JSON.stringify(dr[k]) !== JSON.stringify(orig[k]);
    // Bara fälten som visas här ändras. Resten av posten står kvar — också
    // calendar.write och mail.send, som är egna ja (B-101).
    if (node.calendar || differs("calendar")) {
      const cal = { ...asObj(node.calendar) };
      for (const k of ["calendars", "skip_word", "skip_colors"]) delete cal[k];
      if (dr.calendar.calendars) cal.calendars = dr.calendar.calendars;
      if (dr.calendar.skip_word) cal.skip_word = dr.calendar.skip_word;
      if (dr.calendar.skip_colors.length) cal.skip_colors = dr.calendar.skip_colors;
      cal.only_accepted = dr.calendar.only_accepted;
      cal.private_counts = dr.calendar.private_counts;
      node.calendar = cal;
    }
    const mail = { ...asObj(node.mail) };
    delete mail.labels; delete mail.never_labels;
    if (dr.mail.labels.length) mail.labels = dr.mail.labels;
    if (dr.mail.never_labels.length) mail.never_labels = dr.mail.never_labels;
    if (Object.keys(mail).length) node.mail = mail; else delete node.mail;
    if (node.workday || differs("workday")) node.workday = { ...dr.workday };
    if (node.view || differs("view")) {
      const view = { ...asObj(node.view), grouping: dr.view.grouping };
      if (dr.view.auto_triage) view.auto_triage = true; else delete view.auto_triage;
      node.view = view;
    }
    return busy(btn, async () => {
      try {
        await call("registry_define", { node });
        await loadSettings();
        toast("Inställningarna är sparade.", () => call("registry_define", { node: before }).then(loadSettings));
      } catch (e) { fail("Inställningarna sparades inte, ingenting är skrivet", e); }
    });
  }

  // Ändringarna samlas i utkastet. Ingenting skrivs förrän Spara trycks.
  const onSettingsEdit = (e) => {
    const t = e.target, ds = t.dataset || {}, dr = S.setDraft;
    if (!dr || !t.closest?.("[data-settings]")) return;
    const toggle = (arr, v, on) => { const x = new Set(arr); if (on) x.add(v); else x.delete(v); return [...x]; };
    if (ds.setcal !== undefined) {
      const base = dr.calendar.calendars ?? asArr(S.settings.options.calendars).filter((k) => k.primary).map((k) => k.id);
      dr.calendar.calendars = toggle(base, ds.setcal, t.checked);
    } else if (ds.setcolor !== undefined) dr.calendar.skip_colors = toggle(dr.calendar.skip_colors, ds.setcolor, t.checked).sort((a, b) => Number(a) - Number(b));
    else if (ds.setword !== undefined) dr.calendar.skip_word = t.value.trim() || null;
    else if (ds.setaccepted !== undefined) dr.calendar.only_accepted = t.checked;
    else if (ds.setprivate !== undefined) dr.calendar.private_counts = t.checked;
    else if (ds.setlabel !== undefined) { const k = ds.setlabel === "in" ? "labels" : "never_labels"; dr.mail[k] = toggle(dr.mail[k], t.value, t.checked); }
    else if (ds.setauto !== undefined) dr.view.auto_triage = t.checked;
    else if (ds.setgrouping !== undefined) dr.view.grouping = t.value;
    else if (ds.setzone !== undefined) dr.workday.timezone = t.value;
    else if (ds.setfrom !== undefined || ds.setto !== undefined) {
      // Ett halvskrivet klockslag skriver inte över det som står.
      const h = clockToHour(t.value); if (h === null) return;
      dr.workday[ds.setfrom !== undefined ? "from" : "to"] = h;
      const el = $("#set-daylen"); if (el) el.innerHTML = dayLength(dr.workday);
    } else return;
    patchSettings();
  };
  document.addEventListener("input", onSettingsEdit);
  document.addEventListener("change", onSettingsEdit);

  /* ── Filer (B-217) ── */
  /**
   * Filer läser innehållsbanken som servern har den (src/mcp/content-tools.ts):
   * asset_get utan argument ger kunderna med antal filer (`customers[]`), med
   * customer kundens filer sida för sida (`files[]`, `next_offset`), och med
   * refs och forhandsbilder förhandsbilderna till det som syns. Mapparna är
   * filernas `folder`, delad på snedstreck. Samma vägar som Filbanken i den
   * nuvarande vyn — och uppladdning till kund och mapp, som där bara gick
   * genom chatten (asset_register med customer och folder).
   */
  const FB = { customers: null, error: null, loading: false, q: "", files: new Map(), thumbs: new Map(), asked: new Set() };
  const IMG_TYPE = /^image\/(png|jpeg|webp)$/;
  const fsize = (n) => n == null || n < 0 ? "" : n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} kB` : `${(n / 1048576).toFixed(1).replace(".", ",")} MB`;
  const fileCust = (id) => (FB.customers || []).find((c) => c.id === id) || null;
  const fileMatches = (f, q) => !q || f.name.toLowerCase().includes(q) || (f.folder || "").toLowerCase().includes(q);
  const FILE_IC = `<svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z'/><path d='M14 3v5h5'/></svg>`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  async function loadFileCustomers() {
    if (FB.loading) return;

      const d = await withTimeout(call("asset_get", {}), 45000, "Filerna");

  /** Kundens alla filer, 500 i taget tills servern inte har fler. */
  async function loadCustomerFiles(id, force = false) {
    const had = FB.files.get(id);
    if (had?.loading || (had && !force)) return;
    const entry = { list: had?.list ?? null, error: null, loading: true, external: had?.external ?? 0, removed: had?.removed ?? [] };
    FB.files.set(id, entry);
    try {
      let all = [], offset = 0;
      do {

        all = all.concat(d.files); entry.external = d.only_external || 0;

        offset = d.next_offset ?? null;

      entry.list = all;
    } catch (e) { entry.error = e; }
    entry.loading = false; paintFiles();
  }
  /** Förhandsbilderna till det som syns: 60 per anrop, och vidare där servern stannade (5 MB per svar). */
  async function loadThumbs(refs) {
    const todo = [...new Set(refs)].filter((r) => !FB.thumbs.has(r) && !FB.asked.has(r));
    if (!todo.length) return;
    for (const r of todo) FB.asked.add(r);
    try {
      for (let i = 0; i < todo.length; i += 60) {
        const batch = todo.slice(i, i + 60);
        let offset = 0;
        for (;;) {
          const d = await call("asset_get", { refs: batch, forhandsbilder: true, ...(offset ? { offset } : {}) });
          for (const x of d?.files || []) if (x.thumbnail_base64) FB.thumbs.set(x.ref, x.thumbnail_base64);
          const next = d?.thumbnails?.next_offset;
          if (next == null || next <= offset) break;
          offset = next;
        }
        placeThumbs();
      }
    } catch (e) { toast(`Förhandsbilderna kunde inte hämtas: ${e.message || e}`, null, true); }
  }
  const thumbImg = (f) => FB.thumbs.has(f.ref) ? `<img alt="" src="data:image/webp;base64,${esc(FB.thumbs.get(f.ref))}">` : FILE_IC;

  const fetchVisibleThumbs = () => loadThumbs([...document.querySelectorAll("[data-thumb]")].map((el) => el.dataset.thumb));

  function filesSearch(q) {

  function filesInCustomer() {

  function customerBody() {

      return zone(`<div class="empty"><b>Mappen finns inte längre.</b>Filerna kan ha fått nya versioner i en annan mapp.<div style="margin-top:12px"><button class="btn" data-ffolder="">Till alla mappar</button></div></div>`);

  /**
   * Ladda ned: sparas direkt när vyn får spara filer och filen kom i svaret,
   * annars en tidsbegränsad länk ur asset_get (as_link) — som i Filbanken.
   */
  let fileSaver;
  /** Utanför claude.ai: en vanlig nedladdning i webbläsaren. */
  const webSaver = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } };
  function downloadFile(btn, ref, name) {
    return busy(btn, async () => {
      try {
        if (fileSaver === undefined) {
          try { fileSaver = WEB.on ? webSaver : typeof claude !== "undefined" && claude.use ? await claude.use("downloads") : null; } catch { fileSaver = null; }
        }
        if (fileSaver) {
          const d = await call("asset_get", { ref });
          if (d?.inline && d.data_base64) {
            const bin = atob(d.data_base64), bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const filename = d.name || name;
            try {
              try { await fileSaver.save({ filename, data: new Blob([bytes], { type: d.mime || "application/octet-stream" }) }); }
              catch (e) { if (e?.code !== "bad_request") throw e; await fileSaver.save({ filename, data: bytes }); }
              return toast(`${filename} är sparad.`);
            } catch (e) {
              if (e?.code === "declined") return toast("Nedladdningen avbröts.");
              if (e?.code === "rate_limited") return toast("En nedladdning väntar redan på svar. Försök igen strax.", null, true);
              // Annars går filtypen inte att spara härifrån: en länk i stället.
            }
          } else if (d?.download_url) return linkDialog(d);
        }
        const d = await call("asset_get", { ref, as_link: true });
        if (d?.download_url) return linkDialog(d);
        toast(`${name}: ingen länk kom tillbaka — nedladdningslänkar är inte inkopplade på servern.`, null, true);
      } catch (e) { fail(`${name} kunde inte hämtas`, e); }
    });
  }
  function linkDialog(d) {
    const until = d.expires_at ? new Date(d.expires_at) : null;
    dialog(`<h2>${esc(d.name || "Filen")}</h2><p class="meta">${fsize(d.size)}${until ? ` · länken fungerar utan inloggning till kl ${String(until.getHours()).padStart(2, "0")}:${String(until.getMinutes()).padStart(2, "0")}` : ""}</p>`

  /**
   * Materialet uppgiften lämnat (kvar 32): filerna ur planen (tasks[].outputs)
   * och texterna sparade till stegen (steps[].drafts) — vad, från vilket steg
   * och när. I projektet står hela uppgiftens material.
   *
   * På ett steg står först det steget BEHÖVER från stegen före (Daniel P
   * 2026-09-25: "content som skapats får gärna finnas på alla sådana steg"):
   * stegets `needs` är tillgångstyperna det bygger på, och det material som
   * lämnats av ett steg vars `leaves` bär någon av dem — texten på «Godkänn
   * offertens text», designen på «Godkänn designen». Sedan stegets eget, och
   * sist resten. Saknas något det behöver sägs det, med vem som lämnar det.
   * Planen bär högst MATERIAL_MAX filer per uppgift, samma tal som servern.
   */
  const MATERIAL_MAX = 12;
  /** Stegen i uppgiften som lämnar det `s` behöver, per behövd typ. */
  function neededFrom(t, s) {
    const needs = asArr(s?.needs).filter((n) => n && n.id);
    return needs.map((n) => ({ need: n, from: t.steps.filter((x) => x.step !== s.step && asArr(x.leaves).some((l) => l.id === n.id)) }));
  }
  function materialCard(t, s, first = false) {
    const from = (id) => !id ? "lagd på uppgiften"
      : s && id === s.step ? "från det här steget" : `från «${esc(stepOf(t, id)?.label || "ett steg som inte finns i metoden längre")}»`;
    const needed = s ? neededFrom(t, s) : [];
    const producers = new Set(needed.flatMap((n) => n.from.map((x) => x.step)));
    const neededLabels = new Set(needed.map((n) => n.need.label));
    const files = asArr(t.outputs), link = (x) => /^https?:\/\//i.test(x);
    const rows = [
      ...files.map((o) => {
        const ext = o.external ? String(o.ref).replace(/^extern:/, "") : "";
        const name = o.file || o.type;
        const act = !o.external ? `<button class="btn sm" data-fget="${esc(o.ref)}" data-fname="${esc(name)}">Ladda ned</button>`
          : link(ext) ? `<a class="btn sm" href="${esc(ext)}" target="_blank" rel="noopener">Öppna länken</a>` : "";
        return { at: o.at, step: o.step, type: o.type, needed: producers.has(o.step) || neededLabels.has(o.type), html: `<div class="need"><span class="no">${FILE_IC}</span><span class="t">${esc(name)} <span class="meta">· `
          + `${o.file ? `${esc(o.type)} · ` : ""}${o.external ? (link(ext) ? "finns utanför filbanken · " : `finns utanför filbanken: ${esc(ext)} · `) : ""}${from(o.step)} · ${short(o.at)}</span></span>${act}</div>` };
      }),
      ...t.steps.flatMap((x) => asArr(x.drafts).map((dr) => ({ at: dr.at, step: x.step, needed: producers.has(x.step),
        html: `<div class="need"><span class="no">${ic("layers")}</span><span class="t">${esc(dr.name || "Text utan namn")} <span class="meta">· text${dr.kind ? ` (${esc(dr.kind)})` : ""} · `
          + `${from(x.step)} · sparad ${short(dr.at)}${dr.by_label ? ` av ${esc(dr.by_label)}` : ""}</span></span>`
          + `<button class="btn sm" data-cget="${esc(dr.id)}" data-cname="${esc(dr.name || "Texten")}">Läs</button></div>` }))),
    ].sort((a, b) => (s ? (b.step === s.step) - (a.step === s.step) : 0) || String(b.at).localeCompare(String(a.at)));
    const top = rows.filter((r) => r.needed), rest = rows.filter((r) => !r.needed);
    // Det steget behöver men som ingen lämnat än: sägs, med vem som lämnar det.
    const missing = needed.filter((n) => !top.some((r) => r.type === n.need.label || (r.step && n.from.some((x) => x.step === r.step))));
    const neededHtml = !needed.length ? "" : `<div class="needed"><h3 style="margin:0 0 6px;font-size:13px;font-weight:500">Det här steget bygger på</h3>`
      + top.map((r) => r.html).join("")
      + missing.map((n) => `<div class="meta">${esc(n.need.label)}: inte lämnat än${n.from.length ? ` — kommer från «${n.from.map((x) => esc(x.label)).join("», «")}»` : ""}.</div>`).join("")
      + `</div>`;
    // Högst upp i uppgiften och steget (Daniel P 2026-09-25: *"Texter/material i projektet borde synas högst upp"*).
    return `<div class="card section" style="${first ? "margin-bottom:16px" : "margin-top:16px"}"><h2>Material i uppgiften${!s ? ` <span class="meta">· ${esc(taskName(t))}</span>` : ""}</h2>` + neededHtml
      + (rest.length ? (neededHtml ? `<h3 style="margin:0 0 6px;font-size:13px;font-weight:500">Övrigt material</h3>` : "") + rest.map((r) => r.html).join("")
        + (files.length >= MATERIAL_MAX ? `<p class="meta">Här står de ${MATERIAL_MAX} senaste filerna. Alla finns under Filer, hos ${esc(lbl(t.customer, "kunden"))}.</p>` : "")
        : !top.length ? `<div class="meta">Inget material än. Det stegen lämnar hamnar här: filer som läggs in på uppgiften och texter som sparas till ett steg.</div>` : "")
      + `</div>`;
  }
  /** En text sparad till ett steg, läst ur innehållsbanken. */
  function readText(btn, id, name) {
    return busy(btn, async () => {
      try {
        const d = await call("content_get", { id });
        dialog(`<h2>${esc(d?.title || name)}</h2><p class="meta">${d?.kontroll === "inte_kontrollerad" ? "Kanalen svarade inte — det här är den sparade kopian." : "Den senast sparade versionen."}</p>`
          + `<div class="preview" style="white-space:pre-wrap">${esc(d?.markdown || "(tom)")}</div>`
          + `<div class="bar-actions"><button class="btn quiet" data-close="1">Stäng</button></div>`);
      } catch (e) { fail(`${name} kunde inte hämtas`, e); }
    });
  }

  /** Förhandsbilden: webp, längsta sidan högst 400 px och högst 200 kB, annars ingen (servern kräver det). */
  async function makeThumb(file) {
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
      URL.revokeObjectURL(url);
      const k = Math.min(1, 400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((ok) => c.toBlob(ok, "image/webp", 0.75));
      if (!blob || blob.type !== "image/webp" || blob.size > 200 * 1024) return null;
      return await toBase64(blob);
    } catch { return null; }
  }
  /**
   * Lägg filer hos en kund, i mappen man står i. Utan mapp väljer servern
   * (Uppladdat/…), och kvittot säger var filen hamnade. Det finns ingen väg
   * att ta bort en fil ur banken, så kvittot har inget Ångra.
   */
  async function uploadFiles(files, custId, folder) {
    const label = fileCust(custId)?.label || "kunden";
    let ok = 0;
    for (const f of files) {
      if (f.size > MAX_FILE) { toast(`${f.name} är ${fsize(f.size)}. Dirigenten tar emot högst 4 MB än.`, null, true); continue; }
      try {
        const d = await sendFile(f, { asset_type: "core.asset.incoming_attachment", acquisition: "provided",
          customer: custId, ...(folder ? { folder } : {}) });
        const where = String(d?.found_in || "").replace(/^[^:]*:/, "").split("/").slice(0, -1).join("/");
        toast(d?.duplicate ? `${f.name} fanns redan hos ${label}. Inget skrevs igen.` : `${f.name} ligger hos ${label}${where ? ` i ${where}` : ""}.`);
        ok++;
      } catch (e) { fail(`${f.name} laddades inte upp`, e); }
    }
    if (ok) await Promise.all([loadCustomerFiles(custId, true), loadFileCustomers()]);
  }
  /** Panelens Sammanfatta: listan som syns, som text — Claude läser samma sak som man ser. */
  function summarizeFiles() {
    if (state.screen !== "filer") return toast("Öppna Filer först.", null, true);
    let text;
    if (state.obj?.type === "files") {
      const e = FB.files.get(state.obj.id), cur = state.obj.folder || "";

      text = `Kund: ${state.obj.title}. Mapp: ${cur || "alla"}. ${fs.length} filer${fs.length > 200 ? ", de 200 första" : ""}:\n`
        + fs.slice(0, 200).map((f) => `- ${f.folder ? `${f.folder}/` : ""}${f.name} · ${fsize(f.size)} · inlagd ${String(f.registered_at).slice(0, 10)}${f.ersatt_av ? ` · äldre version av ${f.ersatt_av.name}` : ""}`).join("\n");
    } else {
      if (!FB.customers) return toast("Kunderna är inte hämtade än.", null, true);
      text = "Kunderna och antalet filer i banken:\n" + FB.customers.map((c) => `- ${c.label}: ${c.files}`).join("\n");

    return ask(`Sammanfatta kort vad som finns här: vilka sorters filer, vad som är nyast, och vad som ser ut att vara dubbletter eller gamla versioner. Påstå inget som inte står i listan.\n\n${text}`, "Sammanfatta filerna här");
  }
  // Släpp en fil på en kund eller en mapp (design 8.5). Utanför en släppyta
  // på Filer skulle webbläsaren annars öppna filen och lämna vyn.
  const dragsFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
  document.addEventListener("dragover", (e) => {
    if (state.screen !== "filer" || !dragsFiles(e)) return;

    for (const x of document.querySelectorAll(".fdrop-on")) if (x !== z) x.classList.remove("fdrop-on");
    z?.classList.add("fdrop-on");
  });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) for (const x of document.querySelectorAll(".fdrop-on")) x.classList.remove("fdrop-on"); });
  document.addEventListener("drop", (e) => {
    if (state.screen !== "filer" || !dragsFiles(e)) return;
    e.preventDefault();
    for (const x of document.querySelectorAll(".fdrop-on")) x.classList.remove("fdrop-on");
    const z = e.target.closest?.("[data-fdrop]");
    if (!z) return toast("Släpp filen på en kund eller en mapp.", null, true);

  // Släpp en fil på det ett steg lämnar: samma som att välja den med knappen.

  document.addEventListener("dragover", (e) => {
    const z = e.target.closest?.("[data-lvdrop]");

    e.preventDefault();
    for (const x of document.querySelectorAll(".fdrop-on")) if (x !== z) x.classList.remove("fdrop-on");
    z.classList.add("fdrop-on");
  });
  document.addEventListener("drop", (e) => {
    const z = e.target.closest?.("[data-lvdrop]");
    if (!z || !dragsFiles(e)) return;
    e.preventDefault();
    z.classList.remove("fdrop-on");
    const f = e.dataTransfer.files?.[0], key = z.dataset.lvdrop;
    if (!f || !state.obj) return;
    const st = document.querySelector(`[data-lvstatus="${CSS.escape(key)}"]`);
    if (f.size > MAX_FILE) { if (st) st.textContent = `${f.name} är större än 4 MB — ange var den finns i stället.`; return; }
    (state.obj.inputs ||= { parts: {}, files: {}, note: "" }).files[key] = f;
    if (st) st.textContent = `Vald: ${f.name}${e.dataTransfer.files.length > 1 ? " (bara den första filen tas med)" : ""}`;

  document.addEventListener("input", (e) => { if (e.target.dataset?.fq !== undefined) { FB.q = e.target.value; paintFiles(); } });
  document.addEventListener("change", (e) => {
    if (e.target.dataset?.fupload === undefined) return;
    const files = [...(e.target.files || [])]; e.target.value = "";
    if (files.length && state.obj?.type === "files") uploadFiles(files, state.obj.id, state.obj.folder || "");
  });

  /* ── Planen ── */
  /**
   * Spannet tidslinjen visar (Daniel P 2026-09-25: "man måste kunna ändra
   * datumspann i planen"). Det börjar en måndag och är hela veckor; det kan
   * flyttas bakåt och framåt, zoomas och sättas från–till. Planen hämtas så
   * långt fram som spannet når, så att det som syns är det servern räknat.
   */
  const TL_ZOOM = [2, 4, 8, 12, 26];
  const TL_MAX_WEEKS = 52;
  const tlSpan = () => { const from = state.tlFrom || monday(TODAY), weeks = state.tlWeeks || 4; return { from, weeks, days: weeks * 7, end: add(from, weeks * 7) }; };
  /** Veckan på Idag: en valfri vecka. Planen hämtas så långt fram som veckan ligger. */
  function setWeek(day) {
    state.weekFrom = monday(day);
    const need = Math.ceil(diff(add(state.weekFrom, 7), monday(TODAY)) / 7);
    if (need > state.horizon) { state.horizon = Math.min(TL_MAX_WEEKS, need); render(); return load(); }
    return render();
  }
  function setSpan(from, weeks) {
    state.tlFrom = monday(from); state.tlWeeks = Math.max(1, Math.min(TL_MAX_WEEKS, Math.round(weeks)));
    // Planen räknas från i dag och så många veckor fram som spannet når.
    const need = Math.ceil(diff(tlSpan().end, monday(TODAY)) / 7);
    if (need > state.horizon) { state.horizon = Math.min(TL_MAX_WEEKS, need); render(); return load(); }
    return render();
  }
  const tlStep = () => Math.max(1, Math.round((state.tlWeeks || 4) / 2));
  function spanControls() {
    const { from, weeks, end } = tlSpan();
    return `<div class="tlspan"><div class="seg"><button data-tlshift="-1" title="${tlStep()} veckor tidigare">‹ ${tlStep()} v</button><button data-tlshift="0" aria-pressed="${from === monday(TODAY)}">I dag</button><button data-tlshift="1" title="${tlStep()} veckor senare">${tlStep()} v ›</button></div>`
      + `<span class="meta">Visa</span><div class="seg">${TL_ZOOM.map((w) => `<button data-tlzoom="${w}" aria-pressed="${weeks === w}">${w} v</button>`).join("")}</div>`
      + `<label class="meta">Från <input type="date" data-tlfrom="1" value="${esc(from)}"></label><label class="meta">Till <input type="date" data-tlto="1" value="${esc(add(end, -1))}"></label></div>`;
  }
  /**
   * Tidslinjen (B-215): en rad per uppgift, och stegen som delar av den.
   * Prototypen ritade en stapel per uppgift; stegen behövs för att dragandet
   * ska finnas kvar (B-174): i sidled framåt senareläggs steget, bakåt flyttas
   * det tidigare — aldrig före i dag och aldrig före ett steg som måste vara
   * klart innan, och servern säger varför. Ett klick öppnar steget.
   */
  function timeline() {
    const { from: start, weeks: nWeeks, days, end } = tlSpan();
    const shown = (st) => st.start.slice(0, 10) < end && add(st.end.slice(0, 10), 1) > start;
    const rows = tasks().filter((t) => t.steps.some((st) => shown(st) && (!st.done || start < monday(TODAY)))).sort((a, b) => String(a.due).localeCompare(String(b.due))).slice(0, 40);
    const pos = (x) => Math.max(0, Math.min(100, diff(String(x).slice(0, 10), start) / days * 100));
    const weeks = Array.from({ length: nWeeks }, (_, i) => add(start, i * 7));
    if (!rows.length) return spanControls() + `<div class="empty"><b>Inget planerat ${short(start)}–${short(add(end, -1))}.</b>Flytta spannet eller visa fler veckor.</div>`;
    return spanControls() + `<div class="tl"><table><thead><tr><th>Uppgift</th><th><div style="display:flex">${weeks.map((w) => `<span style="flex:1">v${week(w)}</span>`).join("")}</div></th></tr></thead><tbody>`
      + rows.map((t) => {
        const late = t.earliest_finish_worst && t.due && t.earliest_finish_worst > t.due;
        return `<tr><td class="who">${custDot(t.customer?.color)} <button class="linkbtn" data-open-project="${esc(t.commitment)}" style="font-weight:500">${esc(taskName(t))}</button>${addonChip(t)}<div class="meta">${esc(lbl(t.customer))} · leverans ${short(t.due)}${late ? ` · <span style="color:var(--red)">spricker</span>` : ""} · <button class="linkbtn" data-move-due="${esc(t.id)}">flytta leveransen</button></div></td>`
          + `<td><div class="lane" data-lane="${esc(t.id)}">${TODAY >= start && TODAY < end ? `<div class="todayline" style="left:${pos(TODAY)}%"></div>` : ""}`
          + (t.due >= start && t.due < end ? `<div class="dueline" style="left:${pos(t.due)}%" title="leverans ${short(t.due)}"></div>` : "")
          + t.steps.filter(shown).map((st) => {
            const a = pos(st.start), b = pos(add(st.end.slice(0, 10), 1));
            // Ett klart steg syns när spannet går bakåt, men flyttas inte.
            return `<div class="bar sbar ${st.done ? "done" : st.critical ? "crit" : ""}" draggable="false" data-open-step="${esc(t.id)}|${esc(st.step)}"${st.done ? "" : ` data-drag-start="${esc(st.start.slice(0, 10))}"`}`
              + ` style="left:${a}%;width:${Math.max(1.2, b - a)}%" title="${esc(st.label)}${st.done || !whoOf(st) ? "" : ` · ${esc(whoOf(st))}`} · ${short(st.start)}–${short(st.end)}${st.done ? ` · ${doneText(st)}` : st.critical ? " · utan marginal" : ` · kan flyttas ${st.float_days} dagar utan att leveransen spricker`}">`
              + (st.done ? `<span class="ok">${ic("check")}</span>` : st.external ? "" : tickBtn(t.id, st.step)) + `${esc(st.label)}</div>`;
          }).join("") + `</div></td></tr>`;
      }).join("") + `</tbody></table></div><p class="meta">Ljus = har marginal · bärnsten = utan marginal · grön med bock = klart. Bocken i början av ett steg markerar det klart. Dra ett steg framåt för att senarelägga det, bakåt för att flytta det tidigare — aldrig före i dag, och aldrig före ett steg som måste vara klart innan. Klicka för att öppna.</p>`;
  }
  /** Projekten är åtagandena: uppgifterna grupperade på det de hör till. */
  const projectsOf = () => { const m = new Map();
    for (const t of tasks()) { const k = t.commitment || "utan"; if (!m.has(k)) m.set(k, { id: k, label: lbl(t.commitment_named, "Utan projekt"), tasks: [] }); m.get(k).tasks.push(t); }
    return m; };
  function projects() {
    return `<div class="card">${[...projectsOf().values()].map((p) => {
      const ts = p.tasks, steps = ts.flatMap((t) => t.steps), done = steps.filter((st) => st.done).length;
      const next = ts.map((t) => t.due).filter(Boolean).sort()[0];
      return row({ kind: custDot(ts[0].customer?.color), title: esc(p.label), cust: lbl(ts[0].customer), why: `${ts.length} leveranser · ${done} av ${steps.length} steg klara`,
        when: `nästa ${short(next)}`, attrs: `data-open-project="${esc(p.id)}"`,
        act: `<span class="progress">${Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.round(done / Math.max(1, steps.length) * 10) ? "on" : ""}"></i>`).join("")}</span>` });
    }).join("")}</div>`;
  }
  /** Teamet: belastningen per person och vecka, som servern räknar den (B-197). */
  function team() {
    const wk = Array.from({ length: Math.min(state.horizon, 8) }, (_, i) => add(monday(TODAY), i * 7));
    const h = (x) => `${Math.round(x * 10) / 10}`.replace(".", ",");
    const load = S.plan?.load || [];
    const ids = [...new Set(load.map((l) => l.person))];
    const cell = (l) => { if (!l) return `<div class="meta">–</div>`;
      const cap = l.capacity_hours ?? 0, tot = cap + (l.busy_hours || 0) || 1, over = l.hours > cap;
      return `<div class="load">${l.busy_hours ? `<i class="meet" style="width:${Math.min(100, l.busy_hours / tot * 100)}%"></i>` : ""}<i class="${over ? "over" : ""}" style="width:${Math.min(100 - (l.busy_hours || 0) / tot * 100, l.hours / tot * 100)}%"></i></div>`
        + `<div class="meta"${over ? ' style="color:var(--red)"' : ""}>${h(l.hours)} h av ${h(cap)} h${l.busy_hours ? ` · möten ${h(l.busy_hours)} h` : ""}${l.guessed_hours ? ` · ${h(l.guessed_hours)} h gissade` : ""}</div>`; };
    const lw = (id, w) => load.find((l) => l.person === id && l.week === `${d(w).getUTCFullYear()}-W${String(week(w)).padStart(2, "0")}`);
    return `<div class="teamgrid" style="grid-template-columns:160px repeat(${wk.length},minmax(0,1fr))"><div class="h"></div>${wk.map((w) => `<div class="h">v${week(w)}</div>`).join("")}`
      + ids.map((id) => `<div><b style="font-weight:500">${esc(personName(id))}</b>${load.some((l) => l.person === id && l.capacity_guessed) ? `<div class="meta">kapaciteten är gissad</div>` : ""}</div>${wk.map((w) => `<div>${cell(lw(id, w))}</div>`).join("")}`).join("")
      + `</div><p class="meta">Timmar i veckan mot personens tid. Möten du tackat ja till dras av och är den mörka delen. Gissade timmar är standardtid för steg utan uppskattning.</p>`;
  }
  function customers() {
    const cs = customerList();
    if (!cs.length) return `<div class="empty"><b>Inga kunder med arbete i planen.</b></div>`;
    return `<div class="card">${cs.map((c) => { const ts = tasks().filter((t) => t.customer?.id === c.id);
      return row({ kind: custDot(c.color), title: esc(c.label), why: `${ts.length} uppgifter · ${opens().filter((o) => ts.some((t) => t.id === o.task)).length} frågor väntar`,
        when: `nästa ${short(ts.map((t) => t.due).filter(Boolean).sort()[0])}`, attrs: `data-open-project="${esc(ts[0]?.commitment || "")}"` }); }).join("")}</div>`;
  }

  /* ── Metoder ── */
  function chainDots(m) { return `<span class="chain" style="gap:2px">${stepIds(m).map((id) => kindMark(stepKind(id))).join("")}</span>`; }
  /** Biblioteket: metoderna ur library_search, med det planen vet om dem. */
  function library() {
    const ms = libEntries("method");
    if (!ms.length) return `<div class="empty"><b>Inga metoder i biblioteket.</b>Bygg den första med knappen uppe till höger.</div>`;
    return `<div class="card">${ms.map((m) => {
      const noun = (m.parts || []).filter((p) => !hasVerb(p.label)).length;
      const stops = stepIds(m).filter((id) => stepBlockers(id).length).length;
      const n = methodTasks(m).length, v = methodVariants(m).length;
      return row({ kind: `<span class="kind human" title="Metod">${ic("layers")}</span>`, title: esc(m.label),
        why: `${(m.parts || []).length} steg${typeLabel(m.output?.[0]) ? ` · levererar ${esc(typeLabel(m.output[0]))}` : ""} · ${n ? `${n} uppgift${n === 1 ? "" : "er"} i planen` : "inte i planen nu"}${v ? ` · ${v} kundflöde${v === 1 ? "" : "n"}` : ""}`
          + (stops ? ` · <span style="color:var(--amber)">stannar vid ${stops} steg utan kod</span>` : "") + (noun ? ` · <span style="color:var(--amber)">${noun} stegnamn utan verb</span>` : ""),
        when: chainDots(m), attrs: `data-open-method="${esc(m.id)}"` });
    }).join("")}</div>`;
  }
  /**
   * Förbättra: det som görs för hand och av Claude oftast i planen, räknat på
   * planens steg. Kortet "gissad ledtid flyttar datumet" var ett exempel och
   * byggs inte här (docs/kvar.md).
   */
  function improveCards() {
    const count = (k) => { const m = new Map();
      for (const t of tasks()) for (const s of t.steps) if (kindOf(s) === k) { const x = m.get(s.step) || { label: s.label, n: 0 }; x.n++; m.set(s.step, x); }
      return [...m.values()].sort((a, b) => b.n - a.n); };
    return [
      ...count("human").slice(0, 3).map((x) => ({ kind: "Handarbete → AI-arbetssätt", title: x.label, gain: `${x.n} gång${x.n === 1 ? "" : "er"} i planen`,
        text: "Görs för hand varje gång. Ett AI-arbetssätt med husets instruktion kan göra utkastet; en människa godkänner.",
        ask: `Steget «${x.label}» görs för hand ${x.n} gånger i planen. Föreslå ett AI-arbetssätt för det: syfte, vad som läses först, så gör du (moment), svarets form, vad Claude inte får göra och när den ska stanna och fråga. Säg vad du är osäker på.` })),
      ...count("llm").slice(0, 2).map((x) => ({ kind: "AI-arbetssätt → kod", title: x.label, gain: `${x.n} gång${x.n === 1 ? "" : "er"} i planen`,
        text: "Claude gör steget varje gång. Är det samma sak varje gång kan det bli kod, som är snabbare och säkrare.",
        ask: `Steget «${x.label}» görs av Claude ${x.n} gånger i planen. Kan det bli kod? Säg vad som i så fall är samma varje gång, vad som kräver omdöme, och vilken atom som skulle behövas.` })),

  function improve() {

    return `<div class="improve">${cs.map((c, k) => `<div class="card"><span class="label">${esc(c.kind)}</span><b>${esc(c.title)}</b><span class="gain">${esc(c.gain)}</span><span class="meta">${esc(c.text)}</span><div><button class="btn sm ai" data-improve="${k}">${SP} Kopiera till chatten</button></div></div>`).join("")}</div>`;
  }
  /** Ledtiderna (B-178, B-185): alla steg, gissade först, grupperade på metod. Claude föreslår, en människa sätter. */
  function leadTable() {
    const L = S.lead;
